<!--
  ═══ SALAS EN FIRESTORE ═════════════════════════════════
  Cada sala es UN documento de la coleccion salas_penal, en el mismo
  proyecto de Firebase que usan los otros juegos del sitio.
  La regla de seguridad esta en PENALES.md, en la raiz del sitio.
  Sin esa regla publicada el juego no arranca: es multijugador y no
  tiene modo local al que caer.

  Nadie arbitra la tanda desde un servidor, igual que en Chao Pescao.
  Cuando los dos revelaron su eleccion, el primer navegador que se da
  cuenta escribe el resultado. El azar del penal sale de una semilla
  armada con los datos de la jugada (codigo, numero de penal, celda
  del tiro, celda del arquero), asi que los dos telefonos calculan
  exactamente el mismo resultado sin hablar entre ellos.

  Y como en un uno contra uno el que espia gana siempre, la eleccion
  va en dos pasos: primero cada uno publica el hash de lo que eligio
  y recien cuando estan los dos hashes se revela el contenido.
  ════════════════════════════════════════════════════════
-->
<style>
  /* Noche de estadio: pasto oscuro, lineas de cal, focos desde arriba. */

  .et{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.16em;

  /* ── la escena ───────────────────────────────────────

    font-family:Inter,sans-serif;font-size:8.5px;font-weight:800;letter-spacing:.06em;
    color:rgba(242,247,243,.0);text-transform:uppercase;cursor:pointer;

  .celda:active{transform:none;box-shadow:none}
  .celda:hover:not(:disabled){background:rgba(57,255,136,.18);color:rgba(242,247,243,.9)}

  .veredicto{position:absolute;left:0;right:0;top:58%;display:flex;align-items:center;

  .veredicto.afuera{color:var(--rojo);text-shadow:0 0 30px rgba(255,51,85,.7),4px 5px 0 var(--tinta)}

  /* ── marcador ────────────────────────────────────────── */
  .marcador{display:flex;flex-direction:column;gap:10px}
  .linea{display:flex;align-items:center;gap:9px}
  .linea .nom{font-weight:800;font-size:14.5px;min-width:76px;max-width:76px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .linea.turno .nom{color:var(--neon)}

  .total{font-family:Anton,sans-serif;font-size:29px;min-width:28px;text-align:right;line-height:1}

  .reloj{font-family:Anton,sans-serif;font-size:38px;text-align:center;

  .reloj.poco{color:var(--rojo)}

  footer{font-size:12.5px;color:rgba(242,247,243,.42);line-height:1.55;

  #aviso{display:none;position:fixed;left:12px;right:12px;bottom:14px;z-index:99;
    background:var(--rojo);color:#fff;font-size:14px;font-weight:600;

    max-width:496px;margin:0 auto}
  @media (prefers-reduced-motion:reduce){

<body>

<div id="app">
  <div id="arriba"></div>
  <div id="abajo"></div>
</div>

<div id="aviso" role="status"></div>

<script defer src="../volver.js" data-pos="top-right"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

/* ══════════════════════════════════════════════════════════
   PENALES · uno patea, el otro ataja. Cinco cada uno y despues
   de a uno hasta que alguien falle y el otro no.
   ══════════════════════════════════════════════════════════ */

const COL = "salas_penal";
/* Base de datos con nombre, la misma de los otros juegos. No es la "(default)". */
const BD  = "ai-studio-simuladordeagent-0792efbc-5156-4ebe-b931-3945e1f65db4";

const SEGUNDOS_ELEGIR = 10;    // lo que dura la eleccion antes de mandar el default
const GRACIA_RIVAL    = 12;    // despues de esto aparece el boton de abandono
const MOSTRAR_PENAL   = 5200;  // cuanto queda en pantalla la repeticion, en ms
const TANDA_BASE      = 5;     // cinco cada uno antes de la muerte subita
const MAX_JUGADORES   = 2;
const ESPERA_RED      = 25000;
const LETRAS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // sin I, O, 0, 1: se dictan por WhatsApp

/* ── la grilla ───────────────────────────────────────────
   Nueve celdas, numeradas 0..8. La fila es Math.floor(i/3):
   0 = abajo, 1 = media, 2 = arriba. La columna es i%3:
   0 = izquierda, 1 = centro, 2 = derecha.

   Izquierda y derecha son SIEMPRE las del que patea, que es como
   los dos ven el arco en la pantalla. "La izquierda del arquero"
   es un lio garantizado y no se usa en ningun lado. */
const FILA = i => Math.floor(i / 3);
const COLU = i => i % 3;

const NOMBRE_CELDA = [
  "abajo a la izquierda", "abajo al medio", "abajo a la derecha",
  "a media altura, izquierda", "a media altura, al medio", "a media altura, derecha",
  "al ángulo izquierdo", "arriba al medio", "al ángulo derecho"
];
const ROTULO = ["Abajo izq", "Abajo", "Abajo der",
                "Media izq", "Medio",  "Media der",
                "Ángulo izq", "Arriba", "Ángulo der"];

/* Que tan seguido el tiro termina donde el pateador queria. El angulo es el
   lugar mas dificil de atajar y por eso mismo el que mas se va afuera: es el
   riesgo que hace que valga la pena elegir, en vez de tirar siempre al mismo
   lado. Al ras del piso casi nunca se erra, pero el arquero llega comodo. */
const PRECISION = [0.92, 0.97, 0.92,
                   0.90, 0.96, 0.90,
                   0.74, 0.86, 0.74];

/* Que tan atajable es cada celda UNA VEZ QUE EL ARQUERO LLEGO. Adivinar no es
   atajar: al angulo, aun yendo para el lado correcto, la saca menos de la
   mitad de las veces. Abajo y al medio la agarra casi siempre. */
const ATAJABLE  = [0.75, 0.80, 0.75,
                   0.72, 0.77, 0.72,
                   0.42, 0.47, 0.42];

/* El arquero elige una celda pero cubre con el cuerpo un area alrededor. El
   alcance decae segun cuanto se aleje el tiro de donde se tiro el. El salto
   estira mas en vertical que en horizontal, y la diagonal es casi imposible. */
function alcance(celdaArquero, celdaTiro){
  const fa = FILA(celdaArquero);
  const df = Math.abs(fa - FILA(celdaTiro));
  const dc = Math.abs(COLU(celdaArquero) - COLU(celdaTiro));
  if (df === 0 && dc === 0) return 1.00;
  if (df === 1 && dc === 0) return 0.45;
  /* Al lado, en la misma fila: abajo llega con los pies (se tira a un palo y
     la que va al medio se la lleva puesta la pierna que arrastra); a media
     altura estira la mano; arriba casi no hay forma. */
  if (df === 0 && dc === 1) return [0.50, 0.30, 0.20][fa];
  if (df === 1 && dc === 1) return 0.12;
  return 0;
}
/* Atajada con la pierna: se tiro a una celda de abajo y la pelota fue a la de
   al lado, tambien abajo. Se usa para la animacion y para el relato. */
function atajadaConElPie(h){
  return h.fin === "atajada" && h.tiro !== h.palo && FILA(h.palo) === 0 && FILA(h.tiro) === 0;
}

/* ── el azar, pero igual en los dos telefonos ────────────
   Un dado comun daria gol en una pantalla y atajada en la otra, y la sala se
   partiria al medio. Es el mismo motivo por el que Chao Pescao no sortea los
   empates. Aca la semilla sale de los datos de la jugada, que los dos
   navegadores tienen identicos, asi que el resultado tambien lo es. */
function semilla(txt){
  let h = 2166136261 >>> 0;
  for (let i = 0; i < txt.length; i++) {
    h ^= txt.charCodeAt(i);
    h = Math.imul(h, 16777619) >>> 0;
  }
  return h >>> 0;
}
function dado(h){
  h ^= h << 13; h >>>= 0;
  h ^= h >>> 17;
  h ^= h << 5;  h >>>= 0;
  return h >>> 0;
}

/* El corazon del juego: dado un tiro y una eleccion de arquero, que paso. */
function resolver(codigo, penal, tiro, palo){
  let s = semilla(codigo + "|" + penal + "|" + tiro + "|" + palo);
  s = dado(s); const r1 = s / 4294967296;
  s = dado(s); const r2 = s / 4294967296;

  if (r1 > PRECISION[tiro]) return "afuera";
  return r2 < alcance(palo, tiro) * ATAJABLE[tiro] ? "atajada" : "gol";
}

/* ── compromiso y revelacion ─────────────────────────────
   En un uno contra uno el que espia gana siempre: la regla de Firestore deja
   leer la sala a cualquiera, asi que el arquero con la consola abierta podria
   mirar la celda del tiro antes de elegir y atajar el cien por ciento.

   Por eso la eleccion va en dos pasos. Primero cada uno publica solamente el
   hash de "penal|celda|sal", con una sal aleatoria que se guarda en su propio
   navegador: del hash no se saca nada. Recien cuando los DOS hashes estan
   publicados, cada uno revela la celda y la sal, y el otro comprueba que el
   hash cuadre. El que espia ya no puede cambiar su eleccion, y el que quiera
   mentir en la revelacion no sabe con que sal producir el hash que ya publico. */
async function hashear(txt){
  const bytes = new TextEncoder().encode(txt);
  const buf = await crypto.subtle.digest("SHA-256", bytes);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}
function salNueva(){
  const a = new Uint8Array(12);
  crypto.getRandomValues(a);
  return Array.from(a).map(b => b.toString(16).padStart(2, "0")).join("");
}

/* ── sonidos ─────────────────────────────────────────────
   Todo sintetizado con WebAudio: ruido filtrado para la tribuna y un par de
   osciladores para la voz. No hay archivos que descargar. El contexto se crea
   en un toque del usuario (los navegadores no dejan sonar antes), y despues
   la repeticion puede sonar sola. */
let audio = null;
let sonidoOn = leer("penal-sonido") !== "no";
function prepararAudio(){
  if (!sonidoOn) return;
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
  } catch (e) { audio = null; }
}
function ruido(dur){
  const n = Math.floor(audio.sampleRate * dur);
  const b = audio.createBuffer(1, n, audio.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const f = audio.createBufferSource(); f.buffer = b; return f;
}
/* Un pedazo de tribuna: ruido por un pasabanda, con su envolvente. */
function tribuna(t0, dur, frec, pico, subida){
  const f = ruido(dur), filtro = audio.createBiquadFilter(), g = audio.createGain();
  filtro.type = "bandpass"; filtro.frequency.value = frec; filtro.Q.value = 0.8;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(pico, t0 + subida);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  f.connect(filtro); filtro.connect(g); g.connect(audio.destination);
  f.start(t0); f.stop(t0 + dur);
}
/* Una voz: oscilador con formante, para el "oooo" y el "uuuu". */
function voz(t0, dur, f0, f1, formante, pico, tipo){
  const o = audio.createOscillator(), filtro = audio.createBiquadFilter(), g = audio.createGain();
  o.type = tipo || "sawtooth";
  o.frequency.setValueAtTime(f0, t0); o.frequency.linearRampToValueAtTime(f1, t0 + dur * 0.8);
  filtro.type = "bandpass"; filtro.frequency.value = formante; filtro.Q.value = 2.5;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(pico, t0 + 0.12);
  g.gain.setValueAtTime(pico, t0 + dur * 0.55);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(filtro); filtro.connect(g); g.connect(audio.destination);
  o.start(t0); o.stop(t0 + dur);
}
function sonar(tipo){
  if (!audio || !sonidoOn) return;
  try {
    const t0 = audio.currentTime + 0.01;
    if (tipo === "patada") {
      const f = ruido(0.09), filtro = audio.createBiquadFilter(), g = audio.createGain();
      filtro.type = "lowpass"; filtro.frequency.value = 420;
      g.gain.setValueAtTime(0.7, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.09);
      f.connect(filtro); filtro.connect(g); g.connect(audio.destination); f.start(t0);
      const o = audio.createOscillator(), g2 = audio.createGain();
      o.frequency.setValueAtTime(120, t0); o.frequency.exponentialRampToValueAtTime(45, t0 + 0.13);
      g2.gain.setValueAtTime(0.5, t0); g2.gain.exponentialRampToValueAtTime(0.001, t0 + 0.14);
      o.connect(g2); g2.connect(audio.destination); o.start(t0); o.stop(t0 + 0.15);
    } else if (tipo === "gol") {
      tribuna(t0, 3.2, 900, 0.55, 0.28);
      tribuna(t0 + 0.05, 2.6, 2400, 0.18, 0.2);
      [[196, 212], [247, 262], [294, 318], [147, 156]].forEach(function(par, i){
        voz(t0 + 0.04 * i, 1.9, par[0], par[1], 620, 0.09);
      });
    } else if (tipo === "uuu" || tipo === "atajada") {
      if (tipo === "atajada") {
        const f = ruido(0.06), filtro = audio.createBiquadFilter(), g = audio.createGain();
        filtro.type = "highpass"; filtro.frequency.value = 1400;
        g.gain.setValueAtTime(0.45, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.06);
        f.connect(filtro); filtro.connect(g); g.connect(audio.destination); f.start(t0);
      }
      tribuna(t0 + 0.05, 1.4, 520, 0.32, 0.12);
      [[262, 205], [330, 262], [196, 155]].forEach(function(par, i){
        voz(t0 + 0.05 + 0.03 * i, 1.1, par[0], par[1], 380, 0.07, "triangle");
      });
    }
  } catch (e) { console.warn("sonido:", e); }
}

/* ── memoria del navegador ───────────────────────────────── */
function leer(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }
function anotar(k, v){ try { localStorage.setItem(k, v); } catch (e) {} }

let yo = leer("penal-yo");
if (!yo) {

/* La eleccion y su sal viven en localStorage y no solo en memoria: si a alguien
   se le recarga la pestaña entre el compromiso y la revelacion, sin la sal no
   podria revelar nunca y el penal quedaria trabado para los dos.

   La clave lleva la vuelta ademas del numero de penal. Sin eso, en la revancha
   el penal 1 encontraria guardada la eleccion del penal 1 de la tanda anterior
   y la mandaria sola, sin dejar elegir. */
/* Cada revancha es una vuelta nueva y empieza otra vez por el penal 1. */
function vuelta(){ return (sala && sala.vuelta) || 1; }
function clave(penal){
  return "penal-e-" + (sala ? sala.codigo : "") + "-" + vuelta() + "-" + penal;
}
function guardarEleccion(penal, celda, sal){
  anotar(clave(penal), celda + "|" + sal);
}
function miEleccion(penal){
  const v = leer(clave(penal));
  if (!v) return null;
  const p = v.split("|");
  return { celda: Number(p[0]), sal: p[1] };
}

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g,
  c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

/* Firestore no resuelve sus promesas sin conexion: se quedan colgadas para
   siempre. Todo lo que bloquea un boton corre contra un reloj. */
function conReloj(p, ms){
  return Promise.race([
    p, new Promise((_, no) => setTimeout(() => no(new Error("sin respuesta")), ms))
  ]);
}

   localhost). Abierto como archivo suelto no hay juego honesto posible. */

const jugadores = () => (sala && sala.jugadores) || {};
/* Orden fijo para toda la tanda y el mismo en los dos telefonos: por turno de
   llegada, y si empatan desempata el id, que no cambia nunca. De este orden
   sale quien patea cada penal, asi que no puede darse vuelta a mitad de camino. */
const listaJug = () => Object.keys(jugadores()).sort(function(a, b){
  return ((jugadores()[a].orden || 0) - (jugadores()[b].orden || 0)) ||
         (a < b ? -1 : a > b ? 1 : 0);
});
const nombreDe = id => (jugadores()[id] && jugadores()[id].nombre) || "el rival";
const rival    = () => listaJug().filter(id => id !== yo)[0] || "";
const soyMando = () => !!sala && sala.anfitrion === yo;

/* Impar patea el primero de la lista, par el segundo. */
const pateadorDe = n => listaJug()[(n - 1) % 2] || "";
const arqueroDe  = n => listaJug()[n % 2] || "";
const golesDe    = id => ((sala && sala.goles) || {})[id] || 0;

/* Los compromisos y las revelaciones se guardan por penal, en mapas anidados.
   La clave lleva una "p" adelante porque un campo que empieza con numero es
   una ruta invalida para Firestore, y aca se escribe siempre por ruta. */
const casillero    = n => "p" + n;
const compromisosDe = n => (((sala && sala.compromiso) || {})[casillero(n)]) || {};
const reveladosDe   = n => (((sala && sala.revelado)   || {})[casillero(n)]) || {};

  throw new Error("no hay codigos libres");
}

function escuchar(codigo){
  if (cortar) cortar();
  ref = doc(db, COL, codigo);
  salaGuardada = codigo;
  anotar("penal-sala", codigo);
  cortar = onSnapshot(ref, function(s){

    console.warn(err);
    avisar(err.code === "permission-denied"
      ? "Firestore no deja leer la sala. Falta publicar la regla (PENALES.md)."
      : "Se corto la conexion con la sala.");

}

/* Llega una version nueva de la sala, de Firestore o de la memoria local. */

/* ── contra la maquina ───────────────────────────────────
   La misma partida, pero la sala es un objeto en memoria y el rival lo juega
   este mismo navegador. Se usa el mismo protocolo de compromiso y revelacion,
   asi que el resto del codigo no sabe que es local: escribir() aplica los
   cambios por ruta, igual que lo haria Firestore, y avisa por recibirSala(). */
function escribirLocal(cambios){
  const nuevo = JSON.parse(JSON.stringify(sala));
  Object.keys(cambios).forEach(function(ruta){
    const partes = ruta.split(".");
    let n = nuevo;
    for (let i = 0; i < partes.length - 1; i++) {
      if (typeof n[partes[i]] !== "object" || n[partes[i]] === null) n[partes[i]] = {};
      n = n[partes[i]];
    }
    n[partes[partes.length - 1]] = JSON.parse(JSON.stringify(cambios[ruta]));
  });
  setTimeout(function(){ if (local) recibirSala(nuevo); }, 0);
}

function jugarContraLaMaquina(){

  if (!hayCripto) { avisar("Este navegador no puede jugar sin https."); return; }
  if (cortar) cortar();
  cortar = null; ref = null; local = true;
  /* Codigo al azar aunque no vaya a Firestore: la eleccion guardada en el
     navegador se indexa por codigo, y dos partidas locales seguidas no tienen
     que pisarse. */
  let codigo = "";
  for (let i = 0; i < 4; i++) codigo += LETRAS[Math.floor(Math.random() * LETRAS.length)];
  recibirSala({
    codigo: codigo, estado: "tanda", penal: 1, vuelta: 1, anfitrion: yo,
    jugadores: { [yo]: { nombre: miNombre, orden: 0 }, [MAQUINA]: { nombre: "La máquina", orden: 1 } },
    goles: { [yo]: 0, [MAQUINA]: 0 },
    compromiso: {}, revelado: {}, historial: [], ganador: ""
  });
}

/* La maquina elige con cierta idea: patea mas a los palos que al medio, y al
   atajar, una de cada tres veces se tira a donde vos mas pateaste. */
const memoriaMaquina = {};
function eleccionDeLaMaquina(rol){
  const peso = [3, 1, 3, 1.5, 0.6, 1.5, 2, 1, 2];
  if (rol === "atajar" && Math.random() < 0.34) {
    const cuenta = {};
    (sala.historial || []).forEach(function(e){ if (e.pateador === yo && e.tiro >= 0) cuenta[e.tiro] = (cuenta[e.tiro] || 0) + 1; });
    const favorita = Object.keys(cuenta).sort((a, b) => cuenta[b] - cuenta[a])[0];
    if (favorita !== undefined) return Number(favorita);
  }
  let r = Math.random() * peso.reduce((a, b) => a + b, 0);
  for (let i = 0; i < 9; i++) { r -= peso[i]; if (r <= 0) return i; }
  return 4;
}

let maquinaOcupada = false;
async function jugarMaquina(){
  if (!local || !sala || sala.estado !== "tanda" || maquinaOcupada) return;
  const n = sala.penal, k = casillero(n);
  const comp = compromisosDe(n), rev = reveladosDe(n);
  maquinaOcupada = true;
  try {
    if (!comp[MAQUINA]) {
      /* Se toma un momento, como si pensara. */
      await new Promise(r => setTimeout(r, 500 + Math.random() * 900));
      if (!local || !sala || sala.penal !== n) return;
      const celda = eleccionDeLaMaquina(pateadorDe(n) === MAQUINA ? "patear" : "atajar");
      const sal = salNueva();
      memoriaMaquina[n] = { celda: celda, sal: sal };
      escribir({ ["compromiso." + k + "." + MAQUINA]: await hashear(n + "|" + celda + "|" + sal) });
    } else if (comp[yo] && !rev[MAQUINA] && memoriaMaquina[n]) {
      escribir({ ["revelado." + k + "." + MAQUINA]: memoriaMaquina[n] });
    }
  } finally {
    maquinaOcupada = false;
  }
}

/* ── el reloj del penal ──────────────────────────────────
   Cada navegador cuenta sus diez segundos desde que ve el penal en pantalla,
   asi no importa que los relojes de los telefonos esten desfasados. Al llegar
   a cero manda su eleccion; si no eligio nada, manda la de siempre: el
   pateador la pone abajo al medio y el arquero se queda parado. Son defaults
   fijos, sin azar, para que no dependan de quien los calcule. */
let penalDelReloj = null;
let finDelReloj   = 0;

function ajustarReloj(){
  if (!enJuego()) { penalDelReloj = null; return; }
  if (penalDelReloj !== sala.penal) {
    penalDelReloj = sala.penal;
    finDelReloj = Date.now() + SEGUNDOS_ELEGIR * 1000;
  }
}
function quedanSegundos(){
  return Math.max(0, Math.ceil((finDelReloj - Date.now()) / 1000));
}
/* En juego = hay penal para elegir y no estamos mirando la repeticion del anterior. */
function enJuego(){
  return !!sala && sala.estado === "tanda" && !mostrando;
}

setInterval(function(){
  if (mostrando && Date.now() >= mostrando.hasta) {
    mostrando = null;
    ajustarReloj();
    pintar();
    seguirLaJugada();
    return;
  }
  if (!enJuego() || penalDelReloj !== sala.penal) return;

  const s = quedanSegundos();
  const e = document.getElementById("reloj");
  if (e) { e.textContent = s; e.classList.toggle("poco", s <= 3); }

  /* Se acabo el tiempo y no elegiste: va la de siempre, abajo al medio. Vale
     para los dos roles, asi que no hace falta preguntar cual te toca. */
  if (s === 0 && !miEleccion(sala.penal) && meTocaElegir()) elegir(1);

  /* Si el rival no aparece nunca, pasada la gracia se puede cobrar el penal por
     abandono. Es un boton, no algo automatico: que lo decida una persona. Se
     repinta el pie solo cuando la situacion cambia, no cuatro veces por segundo:
     si no, el boton se destruye justo cuando lo estan tocando. */
  const ahoraTrabado = hayQueDesatascar();
  if (ahoraTrabado !== trabadoPintado) { trabadoPintado = ahoraTrabado; pintarPie(); }
}, 250);

/* El rival no mando su revelacion y ya pasaron los diez segundos mas la gracia. */
let trabadoPintado = false;
function hayQueDesatascar(){
  if (!sala || sala.estado !== "tanda" || mostrando) return false;
  if (quedanSegundos() > 0) return false;
  if (Date.now() <= finDelReloj + GRACIA_RIVAL * 1000) return false;
  return !!miEleccion(sala.penal) && !reveladosDe(sala.penal)[rival()];
}

/* ── la jugada, paso a paso ──────────────────────────────
   1. los dos publican el hash de su eleccion  (compromiso)
   2. con los dos hashes puestos, los dos publican celda y sal  (revelacion)
   3. con las dos revelaciones, se comprueba y se escribe el resultado
   Cada navegador hace su parte y mira si le toca la siguiente. */
async function seguirLaJugada(){
  if (!sala || sala.estado !== "tanda" || mostrando || trabajando) return;
  if (!hayCripto) return;
  const n = sala.penal;
  if (!meTocaElegir()) return;

  const mia = miEleccion(n);
  if (!mia) return;                                   // todavia no elegi

  const comp = compromisosDe(n), rev = reveladosDe(n);
  const otro = rival();

  trabajando = true;
  try {
    if (!comp[yo]) {
      escribir({ ["compromiso." + casillero(n) + "." + yo]:
                 await hashear(n + "|" + mia.celda + "|" + mia.sal) });
      return;
    }
    if (comp[otro] && !rev[yo]) {
      escribir({ ["revelado." + casillero(n) + "." + yo]: { celda: mia.celda, sal: mia.sal } });
      return;
    }
    if (rev[yo] && rev[otro]) await cerrarPenal(n);
  } finally {
    trabajando = false;
  }
}

/* Los dos jugadores tienen que elegir siempre: uno donde patea y el otro donde
   se tira. No hay penal en el que alguien mire sin hacer nada. */
function meTocaElegir(){ return !!sala && (pateadorDe(sala.penal) === yo || arqueroDe(sala.penal) === yo); }
function meToca(){ return pateadorDe(sala.penal) === yo ? "patear" : "atajar"; }

async function elegir(celda){
  if (!enJuego() || !meTocaElegir()) return;
  if (miEleccion(sala.penal)) return;     // ya elegi este penal
  if (!hayCripto) { avisar("Este navegador no puede jugar sin https."); return; }
  guardarEleccion(sala.penal, celda, salNueva());
  pintar();
  seguirLaJugada();
}

/* El resultado lo escribe el primero de los dos que llega, sin arbitro. Como el
   calculo es determinista, si escriben los dos a la vez escriben lo mismo. Los
   goles se guardan como total absoluto y no como suma, para que escribirlo dos
   veces de resultado igual. */
async function cerrarPenal(n){
  if ((sala.historial || []).some(h => h.penal === n)) return;  // ya esta escrito
  const pat = pateadorDe(n), arq = arqueroDe(n);
  const rev = reveladosDe(n), comp = compromisosDe(n);
  if (!rev[pat] || !rev[arq]) return;

  /* Comprobar que cada uno revelo lo mismo que se habia comprometido a revelar.
     Si no cuadra, el penal se cobra en contra del que hizo trampa. */
  const okPat = comp[pat] === await hashear(n + "|" + rev[pat].celda + "|" + rev[pat].sal);
  const okArq = comp[arq] === await hashear(n + "|" + rev[arq].celda + "|" + rev[arq].sal);

  let fin;
  if (!okPat)      fin = "atajada";
  else if (!okArq) fin = "gol";
  else             fin = resolver(sala.codigo, n, rev[pat].celda, rev[arq].celda);

  const entrada = {
    penal: n, pateador: pat, arquero: arq,
    tiro: rev[pat].celda, palo: rev[arq].celda,
    fin: fin, trampa: (!okPat || !okArq)
  };

  const goles = Object.assign({}, sala.goles || {});
  goles[pat] = (goles[pat] || 0) + (fin === "gol" ? 1 : 0);

  const veredicto = evaluar(goles, n);
  escribir({
    penal: n + 1,
    ["goles." + pat]: goles[pat],
    historial: (sala.historial || []).concat([entrada]),
    estado: veredicto.termino ? "fin" : "tanda",
    ganador: veredicto.termino ? veredicto.ganador : ""
  });
}

/* Cuando ya no hace falta seguir pateando. Durante los primeros cinco de cada
   uno se corta apenas la diferencia es mas grande que los tiros que le quedan
   al que va perdiendo: son los penales que en la cancha no se patean. Despues,
   muerte subita: se comparan de a pares completos. */
function evaluar(goles, n){
  const l = listaJug(); if (l.length < 2) return { termino: false };
  const a = l[0], b = l[1];
  const ga = goles[a] || 0, gb = goles[b] || 0;

  if (n < TANDA_BASE * 2) {
    const restanA = TANDA_BASE - Math.ceil(n / 2);
    const restanB = TANDA_BASE - Math.floor(n / 2);
    if (ga > gb + restanB) return { termino: true, ganador: a };
    if (gb > ga + restanA) return { termino: true, ganador: b };
    return { termino: false };
  }
  /* Con la tanda pareja (par de penales cerrado), el que va arriba gano. */
  if (n % 2 === 0 && ga !== gb) return { termino: true, ganador: ga > gb ? a : b };
  return { termino: false };
}

/* El rival no aparece: se le da el penal al que si esta. */
function cobrarAbandono(){
  if (!sala || sala.estado !== "tanda") return;
  const n = sala.penal, pat = pateadorDe(n), arq = arqueroDe(n);
  if (reveladosDe(n)[rival()]) return;                 // apareció justo
  const fin = (pat === yo) ? "gol" : "atajada";        // gana el que esta presente
  const goles = Object.assign({}, sala.goles || {});
  goles[pat] = (goles[pat] || 0) + (fin === "gol" ? 1 : 0);
  const veredicto = evaluar(goles, n);
  escribir({
    penal: n + 1,
    ["goles." + pat]: goles[pat],
    historial: (sala.historial || []).concat([{
      penal: n, pateador: pat, arquero: arq, tiro: -1, palo: -1,
      fin: fin, abandono: true
    }]),
    estado: veredicto.termino ? "fin" : "tanda",
    ganador: veredicto.termino ? veredicto.ganador : ""
  });
}

/* ── la animacion ────────────────────────────────────────
   Es puramente local: cuando aparece una entrada nueva en el historial, cada
   navegador se toma sus tres segundos y medio para mostrarla. Que uno arranque
   medio segundo antes que el otro no importa, porque el reloj del penal
   siguiente empieza cuando termina la animacion de cada uno. */
function arrancarAnimacion(antes){
  /* Sin "antes" es la primera lectura de la sala: alguien entro o recargo con la
     tanda ya empezada. No hay nada que repetir, lo de antes ya lo vio o no le toca. */
  if (!antes) return;
  const largoAntes = (antes.historial || []).length;
  const h = sala.historial || [];
  if (h.length > largoAntes && h.length > 0) {
    mostrando = { penal: h[h.length - 1].penal, desde: Date.now(), hasta: Date.now() + MOSTRAR_PENAL };
    penalDelReloj = null;
  }
}

/* ── botones ─────────────────────────────────────────────── */
function sincronizar(){
  const n = document.getElementById("nombre");
  const c = document.getElementById("codigo");
  if (n) miNombre = n.value;
  if (c) codigoTecleado = c.value;
}

const acciones = {
  sonido:  function(){
    sonidoOn = !sonidoOn; anotar("penal-sonido", sonidoOn ? "si" : "no");
    if (sonidoOn) prepararAudio();
    pintarPie();
  },
  crear:   crearSala,
  maquina: jugarContraLaMaquina,
  entrar:  entrarSala,
  volver:  function(cod){ if (!validarNombre()) return; codigoTecleado = cod; entrarSala(); },
  salir:   salirDeLaSala,
  empezar: function(){
    if (listaJug().length < 2) { avisar("Faltan jugadores: son dos."); return; }
    escribir({ estado: "tanda", penal: 1 });
  },
  celda:    function(v){ elegir(Number(v)); },
  abandono: cobrarAbandono,
  mando:    function(){ escribir({ anfitrion: yo }); },
  revancha: function(){
    const ceros = {};
    listaJug().forEach(id => { ceros["goles." + id] = 0; });
    escribir(Object.assign({
      estado: "tanda", penal: 1, vuelta: vuelta() + 1,
      historial: [], ganador: "", compromiso: {}, revelado: {}
    }, ceros));
  },
  copiar: function(){
    navigator.clipboard.writeText(enlace())
      .then(() => avisar("Link copiado."))
      .catch(() => avisar("No se pudo copiar. Copialo de la barra."));
  }
};

app.addEventListener("click", function(e){
  const b = e.target.closest("[data-accion]");
  if (!b || b.disabled) return;
  prepararAudio();
  sincronizar();
  const f = acciones[b.dataset.accion];
  if (f) f(b.dataset.valor, b);
});
app.addEventListener("input", sincronizar);
app.addEventListener("keydown", function(e){
  if (e.key !== "Enter") return;
  const campo = e.target.closest("input");
  if (!campo) return;
  sincronizar();
  if (campo.id === "codigo") entrarSala();
});

function enlace(){
  return location.origin + location.pathname + "?sala=" + (sala ? sala.codigo : codigoTecleado);
}
function enlaceWhatsapp(){
  return "https://wa.me/?text=" +
    encodeURIComponent("Tanda de penales. Sala " + sala.codigo + ": " + enlace());
}

/* ── pantallas ───────────────────────────────────────────
   El area de arriba se repinta solo cuando cambia de verdad: si se repintara
   con cada snapshot, la pelota volveria a salir disparada desde el principio
   en medio de la animacion. */
function firma(){
  if (vista !== "sala" || !sala) return "portada|" + ocupado + "|" + (desdeUrl || "") + "|" + salaGuardada;
  if (mostrando) return "anim|" + mostrando.penal;
  const n = sala.penal, mia = miEleccion(n);
  /* Mientras no elegiste, lo que haga el rival NO entra en la firma. Si entrara,
     su compromiso repintaria el arco justo cuando estas por tocarlo y el toque se
     perderia; ademas de que su estado no cambia nada de lo que estas viendo. Una
     vez que elegiste el arco ya esta bloqueado y repintar no molesta. */
  const suyo = mia ? (compromisosDe(n)[rival()] ? "c" : "-") + (reveladosDe(n)[rival()] ? "r" : "-") : "";
  return [sala.estado, n, sala.codigo, listaJug().join(","), listaJug().map(nombreDe).join(","),
          mia ? mia.celda : "-", suyo, sala.ganador || "", soyMando()].join("|");
}

function pintar(){
  const f = firma();
  if (f !== firmaPintado) {
    firmaPintado = f;
    arriba.innerHTML = (vista === "sala" && sala) ? pantallaDeSala() : vistaPortada();
  }
  pintarPie();
  arrancarEscena();
}
function pintarPie(){
  abajo.innerHTML = (vista === "sala" && sala) ? pie() : "";
}

function pantallaDeSala(){
  if (sala.estado === "sala") return cabecera() + pantallaLobby();
  /* La repeticion va antes que el final: el ultimo penal llega junto con
     estado "fin", y si se mirara primero el estado, el penal que define la
     tanda no se veria nunca. */
  if (mostrando)              return pantallaRepeticion();
  if (sala.estado === "fin")  return pantallaFin();
  return pantallaPenal();
}

function cabecera(){
  return `
    <div class="caja viva" style="text-align:center">
      <span class="et">Sala</span>
      <div class="codigazo">${esc(sala.codigo)}</div>
      <p class="chico" style="margin:0">${listaJug().length} de 2 jugadores</p>
    </div>`;
}

/* Posiciones dentro del arco, para la pelota y el guante. */
function escena(opciones){
  const o = opciones || {};
  const mia   = o.elegida;
  const clase = o.rol === "atajar" ? "celda arquero" : "celda";
  const celdas = [];
  /* Se dibuja de arriba hacia abajo, que es como se ve un arco. */
  for (let f = 2; f >= 0; f--) {
    for (let c = 0; c <= 2; c++) {
      const i = f * 3 + c;
      celdas.push(`<button class="${clase}${mia === i ? " elegida" : ""}"
        data-accion="celda" data-valor="${i}" ${o.bloqueado ? "disabled" : ""}
        aria-label="${esc(NOMBRE_CELDA[i])}">${mia === i ? "&#9679;" : esc(ROTULO[i])}</button>`);
    }
  }
  return `<div class="escena">
    <canvas id="escena" aria-hidden="true"></canvas>
    ${o.sinGrilla ? "" : `<div class="rejilla">${celdas.join("")}</div>`}
    ${o.extra || ""}
  </div>`;
}

function pantallaPenal(){
  const n = sala.penal, rol = meToca(), mia = miEleccion(n);
  const otro = rival(), yaMando = !!compromisosDe(n)[otro];
  const suave = n > TANDA_BASE * 2;

  const encabezado = `
    <div class="caja viva">
      <span class="et">${suave ? "Muerte súbita &middot; penal " + n : "Penal " + n + " de 10"}</span>
      <div class="rol ${rol === "patear" ? "pateas" : "atajas"}">
        ${rol === "patear" ? "Pateás vos" : "Atajás vos"}</div>
      <p class="chico" style="text-align:center;margin:2px 0 10px">
        ${rol === "patear"
          ? "Elegí dónde la ponés. " + esc(nombreDe(otro)) + " está eligiendo para dónde tirarse."
          : "Elegí para dónde te tirás. " + esc(nombreDe(otro)) + " está eligiendo dónde ponerla."}</p>
      <div class="reloj" id="reloj">${quedanSegundos()}</div>
      <p class="chico" style="text-align:center;margin:0">
        ${mia
          ? (yaMando ? "Los dos mandaron. Va..." : "Listo. Esperando a " + esc(nombreDe(otro)) + ".")
          : "Si se acaba el tiempo va abajo al medio."}</p>
    </div>`;

  return encabezado + escena({ rol: rol, elegida: mia ? mia.celda : -1, bloqueado: !!mia });
}

function pantallaRepeticion(){
  const h = (sala.historial || []).filter(e => e.penal === mostrando.penal)[0];
  if (!h) return "";
  const yoPateaba = h.pateador === yo;
  const palabra = h.fin === "gol" ? "Gol" : h.fin === "atajada" ? "Atajó" : "Afuera";
  /* Verde si el resultado te conviene: el gol al que pateaba, el resto al otro. */
  const aFavor = yoPateaba === (h.fin === "gol");

  let cuento;
  if (h.abandono)          cuento = "El rival no apareció. Penal cobrado.";
  else if (h.trampa)       cuento = "Alguien cambió su elección después de mandarla. Penal en contra.";
  else if (h.fin === "afuera") cuento = "Le pegó demasiado fuerte y se fue afuera.";
  else if (h.fin === "gol")    cuento = "La puso " + NOMBRE_CELDA[h.tiro] + ". Adentro.";
  else if (atajadaConElPie(h)) cuento = "Se tiró al otro lado, pero la sacó con la pierna que dejó atrás.";
  else                     cuento = "Se tiró bien y la sacó: " + NOMBRE_CELDA[h.tiro] + ".";

  const extra = (h.tiro < 0) ? "" : `<div class="veredicto ${h.fin}">${palabra}</div>`;

  return `
    <div class="caja">
      <span class="et gris">Penal ${h.penal} &middot; pateo ${esc(nombreDe(h.pateador))}</span>
      <div class="rol ${aFavor ? "pateas" : "atajas"}"
           style="margin-bottom:6px">${palabra}</div>
      ${escena({ sinGrilla: true, extra: extra })}
      <p class="chico" style="text-align:center;margin:0">${esc(cuento)}</p>
    </div>`;
}

function pantallaFin(){
  const gano = sala.ganador === yo;
  const l = listaJug();
  return `
    <div class="caja ${gano ? "viva" : "roja"}" style="text-align:center">
      <span class="et${gano ? "" : " gris"}">Final</span>
      <h2 style="font-size:clamp(38px,12vw,58px);margin-bottom:6px">
        ${gano ? "Ganaste" : (sala.ganador ? esc(nombreDe(sala.ganador)) + " ganó" : "Terminó")}</h2>
      <div class="codigazo" style="font-size:clamp(40px,13vw,60px);letter-spacing:.04em">
        ${l.map(id => golesDe(id)).join(" - ")}</div>
      <p class="chico" style="margin:0 0 12px">
        ${l.map(id => esc(nombreDe(id))).join(" contra ")}</p>
      ${soyMando()
        ? `<button data-accion="revancha">Revancha</button>`
        : `<p class="chico" style="margin:0">Si ${esc(nombreDe(sala.anfitrion))} pide
             revancha, arrancan de nuevo.</p>`}
    </div>
    ${historialLargo()}`;
}

function historialLargo(){
  const h = sala.historial || [];
  if (!h.length) return "";
  return `<div class="caja">
    <span class="et gris">Uno por uno</span>
    ${h.map(e => `<div class="linea" style="padding:5px 0;border-bottom:1px solid rgba(242,247,243,.1)">
        <div class="nom">${esc(nombreDe(e.pateador))}</div>
        <span class="chico" style="flex:1">${e.tiro < 0 ? "no se presentó" : esc(NOMBRE_CELDA[e.tiro])}</span>
        <span class="tirito ${e.fin === "gol" ? "gol" : "fallo"}">${e.fin === "gol" ? "&#9679;" : "&times;"}</span>
      </div>`).join("")}
  </div>`;
}

/* ── el pie: marcador y salidas ──────────────────────────── */
function pie(){
  if (sala.estado === "sala") {
    return `<button class="fantasma" data-accion="salir">Salir de la sala</button>`;
  }
  const l = listaJug();
  const n = sala.penal;
  const enTanda = sala.estado === "tanda";
  const trabado = hayQueDesatascar();

  return `
    <div class="caja">
      <span class="et gris">Marcador</span>
      <div class="marcador">
        ${l.map((id, i) => lineaMarcador(id, i)).join("")}
      </div>
      ${n > TANDA_BASE * 2 && enTanda
        ? `<p class="chico" style="margin:10px 0 0;text-align:center">Muerte súbita:
             si uno hace y el otro no, se acabó.</p>` : ""}
    </div>
    ${trabado ? `<button class="ambar" data-accion="abandono">${esc(nombreDe(rival()))} no responde &middot; cobrar el penal</button>` : ""}
    <div class="fila" style="margin-top:9px">
      <button class="fantasma" data-accion="salir">Salir de la sala</button>
      <button class="fantasma" data-accion="sonido" style="flex:0 0 auto">${sonidoOn ? "&#128266; Sonido" : "&#128263; Mudo"}</button>
    </div>
    ${!soyMando() && sala.estado === "fin"
      ? `<button class="fantasma" data-accion="mando" style="margin-top:9px">Tomar el mando</button>` : ""}`;
}

function lineaMarcador(id, i){
  const h = sala.historial || [];
  const mios = h.filter(e => e.pateador === id);
  const enCurso = sala.estado === "tanda" && pateadorDe(sala.penal) === id && !mostrando;
  const cuantos = Math.max(TANDA_BASE, mios.length + (enCurso ? 1 : 0));

  const tiros = [];
  for (let k = 0; k < cuantos; k++) {
    if (k < mios.length) {
      const g = mios[k].fin === "gol";
      tiros.push(`<span class="tirito ${g ? "gol" : "fallo"}">${g ? "&#9679;" : "&times;"}</span>`);
    } else if (k === mios.length && enCurso) {
      tiros.push(`<span class="tirito ahora"></span>`);
    } else {
      tiros.push(`<span class="tirito"></span>`);
    }
  }
  return `<div class="linea ${enCurso ? "turno" : ""}">
    <div class="nom">${esc(nombreDe(id))}${id === yo ? " &middot; vos" : ""}</div>
    <div class="tiros">${tiros.join("")}</div>
    <div class="total">${golesDe(id)}</div>
  </div>`;
}


/* ── la escena ───────────────────────────────────────────
   Todo dibujado por codigo en un canvas: no hay imagenes que descargar. Las
   coordenadas van en "anchos" (x de 0 a 1, y de 0 a ALTO_ESCENA) y el canvas
   se escala solo. La camara esta detras del pateador, un poco elevada, que es
   como se ve un penal en la tele. */
const ALTO_ESCENA = 1.12;
const ARCO  = { x0: 0.20, x1: 0.80, y0: 0.382, y1: 0.56 };   // la boca del arco
const RED   = { x0: 0.245, x1: 0.755, y0: 0.368, y1: 0.532 }; // el fondo de la red
const PUNTO = { x: 0.5, y: 0.86 };                              // el punto del penal
const CELDA_X = [0.275, 0.5, 0.725];
const CELDA_Y = [0.535, 0.475, 0.428];
const T_CARRERA = 0.95, T_VUELO = 0.55, T_IMPACTO = T_CARRERA + T_VUELO;

const PIEL = "#F3C6A3";   // durazno, para los dos
const KIT_PATEADOR = { camiseta: "#E8232A", short: "#F4F4F4", medias: "#E8232A", botin: "#111111",
                       piel: PIEL, pelo: "#3B2415", guante: null, numero: "#FFFFFF", dorsal: "9" };
const KIT_ARQUERO  = { camiseta: "#FFC02E", short: "#1B1B1B", medias: "#FFC02E", botin: "#111111",
                       piel: PIEL, pelo: "#111111", guante: "#39FF88", numero: "#111111", dorsal: "1" };

const lerp  = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const suave = t => { t = clamp(t, 0, 1); return 1 - (1 - t) * (1 - t); };   // frena al final
const pt    = (a, b, t) => ({ x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t) });

function celdaXY(i){ return { x: CELDA_X[COLU(i)], y: CELDA_Y[FILA(i)] }; }
/* A donde se va la pelota cuando no entra: por arriba desde el medio o la
   fila de arriba, al lado del palo desde las esquinas bajas. */
function afueraXY(i){
  const f = FILA(i), c = COLU(i);
  if (f === 2 || c === 1) return { x: CELDA_X[c] + (c - 1) * 0.03, y: 0.30 };
  return { x: c === 0 ? 0.12 : 0.88, y: CELDA_Y[f] };
}

/* ── la pelota ─────────────────────────────────────────── */
function pelotaEn(t, repe){
  if (!repe || t < T_CARRERA) return { x: PUNTO.x, y: PUNTO.y, suelo: PUNTO.y, r: 0.018, giro: 0, alfa: 1 };
  const dest = repe.fin === "afuera" ? afueraXY(repe.tiro) : celdaXY(repe.tiro);
  const f = FILA(repe.tiro);
  const u = clamp((t - T_CARRERA) / T_VUELO, 0, 1);
  const comba = (repe.fin === "afuera" && dest.y < 0.35) ? 0.075 : [0.02, 0.045, 0.06][f];
  const base = {
    x: lerp(PUNTO.x, dest.x, u),
    y: lerp(PUNTO.y, dest.y, u) - comba * Math.sin(Math.PI * u),
    suelo: lerp(PUNTO.y, ARCO.y1, u),
    r: lerp(0.018, 0.0105, u), giro: u * 9, alfa: 1
  };
  if (t <= T_IMPACTO) return base;

  const v = t - T_IMPACTO;
  if (repe.fin === "gol") {
    const w = clamp(v / 0.22, 0, 1);
    base.x = lerp(dest.x, lerp(dest.x, 0.5, 0.12), w);
    base.y = dest.y - 0.004 * w;
    base.r = 0.0102; base.suelo = ARCO.y1 - 0.01;
  } else if (repe.fin === "atajada") {
    /* Rebota hacia el pateador y cae. */
    const lado = dest.x < 0.5 ? -1 : 1;
    base.x = dest.x + lado * 0.07 * clamp(v / 0.5, 0, 1);
    base.y = Math.min(ARCO.y1 + 0.03, dest.y + 0.32 * v * v);
    base.suelo = ARCO.y1 + 0.03; base.r = 0.012;
  } else {
    /* Sigue de largo y se pierde. */
    base.x = dest.x + (dest.x - PUNTO.x) * 0.35 * v;
    base.y = dest.y - 0.12 * v;
    base.r = 0.0098; base.alfa = clamp(1 - v / 1.2, 0.15, 1);
  }
  return base;
}

/* ── el arquero ────────────────────────────────────────── */
/* Devuelve las articulaciones. Quieto: parado en el medio, balanceandose. Al
   patear se tira hacia su celda; si la ataja, estira hasta donde fue la pelota. */
function poseArquero(t, repe, reloj){
  const base = { x: 0.5, y: ARCO.y1 - 0.004 };
  const bal = 0.003 * Math.sin(reloj * 5);
  const quieto = {
    cadera: { x: base.x, y: base.y - 0.064 + bal },
    cuello: { x: base.x, y: base.y - 0.118 + bal },
    cabeza: { x: base.x, y: base.y - 0.14 + bal },
    manoI:  { x: base.x - 0.042, y: base.y - 0.056 + bal },
    manoD:  { x: base.x + 0.042, y: base.y - 0.056 + bal },
    pieI:   { x: base.x - 0.023, y: base.y },
    pieD:   { x: base.x + 0.023, y: base.y }
  };
  if (!repe || repe.tiro < 0) return quieto;

  const p = suave((t - (T_CARRERA + 0.06)) / 0.44);
  if (p <= 0) return quieto;

  const conElPie = atajadaConElPie(repe);
  const celda = (repe.fin === "atajada" && !conElPie) ? repe.tiro : repe.palo;
  const obj = celdaXY(celda);
  const f = FILA(celda), dx = obj.x - base.x, lado = dx < 0 ? -1 : 1;
  let fin;
  if (Math.abs(dx) > 0.05) {
    /* Vuela de costado: cuanto mas bajo el tiro, mas horizontal el cuerpo. */
    const ang = [1.36, 0.95, 0.5][f];
    const cad = { x: base.x + dx * 0.45, y: base.y - 0.03 - 0.028 * f };
    const dir = { x: Math.sin(ang) * lado, y: -Math.cos(ang) };
    const cue = { x: cad.x + dir.x * 0.05, y: cad.y + dir.y * 0.05 };
    fin = {
      cadera: cad, cuello: cue,
      cabeza: { x: cue.x + dir.x * 0.02, y: cue.y + dir.y * 0.02 },
      manoI: { x: obj.x - lado * 0.006, y: obj.y + 0.012 },
      manoD: { x: obj.x + lado * 0.006, y: obj.y - 0.012 },
      pieI: { x: cad.x - lado * 0.045, y: cad.y + 0.03 - 0.01 * f },
      pieD: { x: cad.x - lado * 0.025, y: cad.y + 0.045 - 0.012 * f }
    };
  } else if (f === 0) {
    /* Se agacha y la agarra abajo. */
    fin = {
      cadera: { x: base.x, y: base.y - 0.036 }, cuello: { x: base.x, y: base.y - 0.08 },
      cabeza: { x: base.x, y: base.y - 0.1 },
      manoI: { x: obj.x - 0.014, y: obj.y + 0.008 }, manoD: { x: obj.x + 0.014, y: obj.y + 0.008 },
      pieI: { x: base.x - 0.034, y: base.y }, pieD: { x: base.x + 0.034, y: base.y }
    };
  } else if (f === 1) {
    /* Se queda parado y la saca con el pecho y las manos. */
    fin = {
      cadera: quieto.cadera, cuello: quieto.cuello, cabeza: quieto.cabeza,
      manoI: { x: obj.x - 0.02, y: obj.y }, manoD: { x: obj.x + 0.02, y: obj.y },
      pieI: quieto.pieI, pieD: quieto.pieD
    };
  } else {
    /* Salta con los brazos arriba. */
    fin = {
      cadera: { x: base.x, y: base.y - 0.1 }, cuello: { x: base.x, y: base.y - 0.152 },
      cabeza: { x: base.x, y: base.y - 0.174 },
      manoI: { x: obj.x - 0.016, y: obj.y }, manoD: { x: obj.x + 0.016, y: obj.y },
      pieI: { x: base.x - 0.018, y: base.y - 0.05 }, pieD: { x: base.x + 0.018, y: base.y - 0.04 }
    };
  }
  if (conElPie) {
    /* La pierna que queda del lado de la pelota se estira hasta ella, y el
       cuerpo se corre un poco para ese lado. */
    const b = celdaXY(repe.tiro), pie = { x: b.x, y: b.y + 0.004 };
    const corr = (b.x - fin.cadera.x) * 0.3;
    ["cadera", "cuello", "cabeza"].forEach(k => { fin[k] = { x: fin[k].x + corr, y: fin[k].y }; });
    if (b.x < fin.cadera.x) fin.pieI = pie; else fin.pieD = pie;
  }
  const j = {};
  for (const k of Object.keys(quieto)) j[k] = pt(quieto[k], fin[k], p);
  return j;
}

/* ── el pateador ───────────────────────────────────────── */
/* De espaldas. Toma carrera desde abajo a la derecha, llega al lado de la
   pelota y le pega con la derecha. */
function posePateador(t, repe, reloj){
  const inicio  = { x: 0.66, y: 0.985 };
  const llegada = { x: PUNTO.x - 0.03, y: PUNTO.y + 0.05 };
  const H = 0.17;
  function cuerpo(pos, fase, amp){
    const s = Math.sin(fase) * amp, c = Math.cos(fase) * amp;
    return {
      cadera: { x: pos.x, y: pos.y - H * 0.44 },
      cuello: { x: pos.x, y: pos.y - H * 0.82 },
      cabeza: { x: pos.x, y: pos.y - H * 0.94 },
      manoI:  { x: pos.x - 0.03 - s * 0.5, y: pos.y - H * 0.45 - Math.abs(s) * 0.4 },
      manoD:  { x: pos.x + 0.03 + s * 0.5, y: pos.y - H * 0.45 - Math.abs(c) * 0.4 },
      pieI:   { x: pos.x - 0.014 + s * 0.6, y: pos.y - Math.max(0, s) * 0.5 },
      pieD:   { x: pos.x + 0.014 - s * 0.6, y: pos.y - Math.max(0, -s) * 0.5 }
    };
  }
  if (!repe || repe.tiro < 0) return cuerpo(inicio, reloj * 1.3, 0.006);

  if (t < T_CARRERA) {
    const u = t / T_CARRERA;
    const pos = pt(inicio, llegada, u * u * (3 - 2 * u));
    return cuerpo(pos, u * 15, 0.03);
  }
  /* La patada: la derecha va de atras a la pelota y sigue de largo. */
  const k = clamp((t - T_CARRERA) / 0.28, 0, 1);
  const j = cuerpo(llegada, 0, 0);
  const atras   = { x: llegada.x + 0.03, y: llegada.y + 0.012 };
  const pelota  = { x: PUNTO.x + 0.004, y: PUNTO.y + 0.004 };
  const arriba  = { x: PUNTO.x - 0.01, y: PUNTO.y - 0.075 };
  j.pieD = k < 0.4 ? pt(atras, pelota, suave(k / 0.4)) : pt(pelota, arriba, suave((k - 0.4) / 0.6));
  j.pieI = { x: llegada.x - 0.02, y: llegada.y };
  j.cadera.y += 0.006 * k; j.cuello.x -= 0.012 * k; j.cabeza.x -= 0.016 * k;
  j.manoI = { x: llegada.x - 0.06 - 0.01 * k, y: llegada.y - H * 0.6 };
  j.manoD = { x: llegada.x + 0.05, y: llegada.y - H * 0.5 + 0.02 * k };
  return j;
}

/* ── dibujar un muñeco ─────────────────────────────────── */
/* Trazos gruesos con puntas redondas, y cada uno con su borde oscuro atras:
   asi se leen bien aunque midan cuarenta pixeles. */
function trazo(ctx, a, b, color, grosor){
  ctx.lineCap = "round";
  ctx.strokeStyle = "#0B0F0C"; ctx.lineWidth = grosor + 0.005;
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  ctx.strokeStyle = color; ctx.lineWidth = grosor;
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
}
function bolita(ctx, p, r, color){
  ctx.fillStyle = "#0B0F0C"; ctx.beginPath(); ctx.arc(p.x, p.y, r + 0.0025, 0, 7); ctx.fill();
  ctx.fillStyle = color;     ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 7); ctx.fill();
}
function muneco(ctx, j, kit, escala){
  const g = 0.013 * escala;
  /* El eje del cuerpo, de la cadera al cuello, y su perpendicular: con eso el
     torso, los shorts y el pelo giran con el muñeco cuando se tira.
     "n" apunta hacia la DERECHA de la pantalla cuando el muñeco esta parado;
     el lado izquierdo del cuerpo es -n. */
  const ejeX = j.cuello.x - j.cadera.x, ejeY = j.cuello.y - j.cadera.y;
  const L = Math.hypot(ejeX, ejeY) || 0.001;
  const u = { x: ejeX / L, y: ejeY / L }, n = { x: -u.y, y: u.x };
  const lado = (p, k) => ({ x: p.x + n.x * k, y: p.y + n.y * k });
  /* Codos y rodillas: el punto medio, corrido hacia afuera del cuerpo (el
     lado se decide mirando de que lado del eje esta la mano o el pie). */
  function doblar(a, b, cuanto){
    const m = pt(a, b, 0.5), dx = b.x - a.x, dy = b.y - a.y;
    const afuera = ((b.x - j.cadera.x) * n.x + (b.y - j.cadera.y) * n.y) < 0 ? -1 : 1;
    return { x: m.x + n.x * afuera * cuanto * Math.hypot(dx, dy), y: m.y + n.y * afuera * cuanto * Math.hypot(dx, dy) };
  }
  /* piernas: muslo con la piel, canilla con la media, botin */
  const rodI = doblar(j.cadera, j.pieI, 0.12), rodD = doblar(j.cadera, j.pieD, 0.12);
  const cadI = lado(j.cadera, -g * 0.45), cadD = lado(j.cadera, g * 0.45);
  trazo(ctx, cadI, rodI, kit.piel, g * 0.95); trazo(ctx, rodI, j.pieI, kit.medias, g * 0.8);
  trazo(ctx, cadD, rodD, kit.piel, g * 0.95); trazo(ctx, rodD, j.pieD, kit.medias, g * 0.8);
  bolita(ctx, j.pieI, g * 0.52, kit.botin); bolita(ctx, j.pieD, g * 0.52, kit.botin);
  /* shorts: un bloque debajo de la cadera, que sigue el eje del cuerpo */
  const wh = g * 1.0, ws = g * 1.5, largoShort = g * 1.5;
  ctx.lineJoin = "round"; ctx.lineWidth = 0.0045; ctx.strokeStyle = "#0B0F0C";
  ctx.fillStyle = kit.short;
  ctx.beginPath();
  const s0 = lado({ x: j.cadera.x + u.x * g * 0.4, y: j.cadera.y + u.y * g * 0.4 }, -wh);
  const s1 = lado({ x: j.cadera.x + u.x * g * 0.4, y: j.cadera.y + u.y * g * 0.4 }, wh);
  const s2 = lado({ x: j.cadera.x - u.x * largoShort, y: j.cadera.y - u.y * largoShort }, wh * 1.15);
  const s3 = lado({ x: j.cadera.x - u.x * largoShort, y: j.cadera.y - u.y * largoShort }, -wh * 1.15);
  ctx.moveTo(s0.x, s0.y); ctx.lineTo(s1.x, s1.y); ctx.lineTo(s2.x, s2.y); ctx.lineTo(s3.x, s3.y);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  /* torso: mas ancho en los hombros que en la cadera */
  const hombroI = lado(j.cuello, -ws), hombroD = lado(j.cuello, ws);
  const cinturaI = lado(j.cadera, -wh), cinturaD = lado(j.cadera, wh);
  ctx.fillStyle = kit.camiseta;
  ctx.beginPath();
  ctx.moveTo(cinturaI.x, cinturaI.y); ctx.lineTo(hombroI.x, hombroI.y);
  ctx.lineTo(hombroD.x, hombroD.y); ctx.lineTo(cinturaD.x, cinturaD.y);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  /* sombra de la camiseta del lado derecho, para que no sea un bloque plano */
  ctx.fillStyle = "rgba(0,0,0,.16)";
  const c1 = lado(j.cuello, ws * 0.35), c2 = lado(j.cadera, wh * 0.25);
  ctx.beginPath();
  ctx.moveTo(c2.x, c2.y); ctx.lineTo(c1.x, c1.y); ctx.lineTo(hombroD.x, hombroD.y); ctx.lineTo(cinturaD.x, cinturaD.y);
  ctx.closePath(); ctx.fill();
  /* cuello de la camiseta */
  ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.lineWidth = 0.0035;
  const k1 = lado(j.cuello, -g * 0.55), k2 = lado(j.cuello, g * 0.55);
  ctx.beginPath(); ctx.moveTo(k1.x, k1.y); ctx.lineTo(k2.x, k2.y); ctx.stroke();
  /* el numero en la espalda, girado con el cuerpo. La fuente se pide en
     pixeles de verdad, deshaciendo la escala, porque algunos navegadores
     redondean los tamaños chicos a cero. */
  if (kit.dorsal) {
    const k = ctx.getTransform().a, c = pt(j.cadera, j.cuello, 0.5);
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(Math.atan2(u.y, u.x) + Math.PI / 2);
    ctx.scale(1 / k, 1 / k);
    ctx.fillStyle = kit.numero; ctx.font = "800 " + Math.round(g * 2.2 * k) + "px Inter, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(kit.dorsal, 0, 0); ctx.restore();
  }
  /* brazos: cada uno sale de SU hombro. Manga con la camiseta, antebrazo
     con la piel, mano o guante. */
  const codI = doblar(hombroI, j.manoI, 0.13), codD = doblar(hombroD, j.manoD, 0.13);
  trazo(ctx, hombroI, codI, kit.camiseta, g * 0.95); trazo(ctx, codI, j.manoI, kit.piel, g * 0.72);
  trazo(ctx, hombroD, codD, kit.camiseta, g * 0.95); trazo(ctx, codD, j.manoD, kit.piel, g * 0.72);
  if (kit.guante) {
    bolita(ctx, j.manoI, g * 0.88, kit.guante); bolita(ctx, j.manoD, g * 0.88, kit.guante);
    ctx.fillStyle = "rgba(255,255,255,.35)";
    ctx.beginPath(); ctx.arc(j.manoI.x, j.manoI.y - g * 0.2, g * 0.4, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(j.manoD.x, j.manoD.y - g * 0.2, g * 0.4, 0, 7); ctx.fill();
  } else {
    bolita(ctx, j.manoI, g * 0.42, kit.piel); bolita(ctx, j.manoD, g * 0.42, kit.piel);
  }
  /* cuello y cabeza, con el pelo como casquete girado con el cuerpo */
  trazo(ctx, j.cuello, pt(j.cuello, j.cabeza, 0.6), kit.piel, g * 0.62);
  bolita(ctx, j.cabeza, g * 1.02, kit.piel);
  const arriba = Math.atan2(u.y, u.x);
  ctx.fillStyle = kit.pelo; ctx.beginPath();
  ctx.arc(j.cabeza.x + u.x * g * 0.1, j.cabeza.y + u.y * g * 0.1, g * 1.02, arriba - 1.45, arriba + 1.45);
  ctx.fill();
  /* orejas, chiquitas, a los costados */
  bolita(ctx, lado(j.cabeza, -g * 0.95), g * 0.22, kit.piel);
  bolita(ctx, lado(j.cabeza, g * 0.95), g * 0.22, kit.piel);
}
function sombra(ctx, x, y, rx, ry, alfa){
  ctx.fillStyle = "rgba(0,0,0," + alfa + ")";
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 7); ctx.fill();
}

/* ── el estadio ────────────────────────────────────────── */
/* Las tribunas se dibujan una sola vez por tamaño en un canvas aparte: son
   miles de puntitos y no cambian. Lo unico que se anima son los flashes. */
let gradasCache = null;
function gradas(W){
  const H = Math.round(W * 0.31);
  if (gradasCache && gradasCache.width === W) return gradasCache;
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d");
  const cielo = x.createLinearGradient(0, 0, 0, H);
  cielo.addColorStop(0, "#050A12"); cielo.addColorStop(1, "#0B1626");
  x.fillStyle = cielo; x.fillRect(0, 0, W, H);
  /* focos */
  for (const fx of [0.09, 0.91]) {
    const g = x.createRadialGradient(fx * W, 0.05 * H, 0, fx * W, 0.05 * H, 0.42 * W);
    g.addColorStop(0, "rgba(255,255,235,.55)"); g.addColorStop(0.25, "rgba(255,255,235,.12)");
    g.addColorStop(1, "rgba(255,255,235,0)");
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    x.fillStyle = "#E8EEF5";
    for (let i = -2; i <= 2; i++) x.fillRect(fx * W + i * 0.012 * W - 0.004 * W, 0.02 * H, 0.008 * W, 0.05 * H);
    x.fillStyle = "#2A3340"; x.fillRect(fx * W - 0.006 * W, 0.07 * H, 0.012 * W, 0.6 * H);
  }
  /* tres bandejas, cada una con su gente */
  const paleta = ["#C93A44", "#E8E2D6", "#3F86D9", "#F2C94C", "#7E8A96", "#D9D9D9", "#8B2A31"];
  const azar = mulberry(7);
  const bandejas = [[0.22, 0.44], [0.48, 0.70], [0.74, 0.96]];
  bandejas.forEach(function(b, n){
    const y0 = b[0] * H, y1 = b[1] * H;
    x.fillStyle = "#151A22"; x.fillRect(0, y0, W, y1 - y0);
    const paso = Math.max(2, Math.round(W / 130));
    for (let py = y0 + 2; py < y1 - 2; py += paso) {
      for (let px = (n % 2) * paso * 0.5; px < W; px += paso) {
        x.fillStyle = paleta[Math.floor(azar() * paleta.length)];
        x.globalAlpha = 0.55 + azar() * 0.45;
        x.fillRect(px, py + azar() * 1.5, paso * 0.8, paso * 0.8);
      }
    }
    x.globalAlpha = 1;
    x.fillStyle = "#0A0E14"; x.fillRect(0, y1 - 2, W, 3);
  });
  gradasCache = c;
  return c;
}
/* Un generador chiquito y fijo, para que la gente quede siempre igual. */
function mulberry(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function dibujarCancha(ctx){
  ctx.drawImage(gradas(ctx.canvas.width), 0, 0, 1, 0.31);
  /* flashes en la tribuna */
  ctx.fillStyle = "rgba(255,255,255,.9)";
  for (let i = 0; i < 4; i++) {
    if (Math.random() < 0.25) {
      ctx.beginPath(); ctx.arc(Math.random(), 0.07 + Math.random() * 0.22, 0.003, 0, 7); ctx.fill();
    }
  }
  /* carteles */
  ctx.fillStyle = "#101418"; ctx.fillRect(0, 0.30, 1, 0.036);
  const colores = ["#1E4FD8", "#D8261E", "#F2C94C", "#1EA85A"];
  for (let i = 0; i < 8; i++) {
    ctx.fillStyle = colores[i % 4]; ctx.globalAlpha = 0.85;
    ctx.fillRect(i * 0.125 + 0.004, 0.305, 0.117, 0.026);
  }
  ctx.globalAlpha = 1;
  /* pasto con franjas que se acercan */
  const franjas = [0.336, 0.40, 0.47, 0.555, 0.655, 0.775, 0.92, ALTO_ESCENA];
  for (let i = 0; i < franjas.length - 1; i++) {
    ctx.fillStyle = i % 2 ? "#1E7A44" : "#1A6B3C";
    ctx.fillRect(0, franjas[i], 1, franjas[i + 1] - franjas[i] + 0.002);
  }
  /* luz de los focos sobre el pasto */
  const luz = ctx.createRadialGradient(0.5, 0.55, 0.05, 0.5, 0.55, 0.75);
  luz.addColorStop(0, "rgba(255,255,220,.13)"); luz.addColorStop(1, "rgba(0,0,0,.22)");
  ctx.fillStyle = luz; ctx.fillRect(0, 0.336, 1, ALTO_ESCENA);
  /* lineas de cal */
  ctx.strokeStyle = "rgba(242,247,243,.88)"; ctx.lineWidth = 0.005; ctx.lineCap = "butt";
  ctx.beginPath(); ctx.moveTo(0, ARCO.y1); ctx.lineTo(1, ARCO.y1); ctx.stroke();      // linea de gol
  ctx.beginPath();                                                                   // area chica
  ctx.moveTo(0.31, ARCO.y1); ctx.lineTo(0.285, 0.625); ctx.lineTo(0.715, 0.625); ctx.lineTo(0.69, ARCO.y1); ctx.stroke();
  ctx.beginPath();                                                                   // area grande
  ctx.moveTo(0.04, ARCO.y1); ctx.lineTo(-0.06, 0.80); ctx.lineTo(1.06, 0.80); ctx.lineTo(0.96, ARCO.y1); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0.5, 0.80, 0.19, 0.075, 0, 0.2, Math.PI - 0.2); ctx.stroke(); // la media luna
  ctx.fillStyle = "rgba(242,247,243,.88)";
  ctx.beginPath(); ctx.ellipse(PUNTO.x, PUNTO.y + 0.012, 0.007, 0.004, 0, 0, 7); ctx.fill(); // el punto
}

/* La red: fondo, dos costados y techo, dibujados como grilla en perspectiva.
   Cuando es gol, los hilos cerca de la pelota se estiran hacia ella. */
function dibujarRed(ctx, impacto, fuerza){
  function d(p){
    if (!impacto || fuerza <= 0) return p;
    const dx = p.x - impacto.x, dy = p.y - impacto.y;
    const k = fuerza * 0.42 * Math.exp(-(dx * dx + dy * dy) / 0.0032);
    return { x: p.x - dx * k, y: p.y - dy * k };
  }
  ctx.strokeStyle = "rgba(242,247,243,.42)"; ctx.lineWidth = 0.0022; ctx.lineCap = "butt";
  const N = 14, M = 8;
  function linea(a, b){ ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
  /* fondo */
  for (let i = 0; i <= N; i++) {
    const x = lerp(RED.x0, RED.x1, i / N);
    let prev = d({ x: x, y: RED.y0 });
    for (let j = 1; j <= M; j++) { const q = d({ x: x, y: lerp(RED.y0, RED.y1, j / M) }); linea(prev, q); prev = q; }
  }
  for (let j = 0; j <= M; j++) {
    const y = lerp(RED.y0, RED.y1, j / M);
    let prev = d({ x: RED.x0, y: y });
    for (let i = 1; i <= N; i++) { const q = d({ x: lerp(RED.x0, RED.x1, i / N), y: y }); linea(prev, q); prev = q; }
  }
  /* costados y techo: hilos que van del marco al fondo */
  ctx.strokeStyle = "rgba(242,247,243,.28)";
  for (let j = 0; j <= M; j++) {
    const u = j / M;
    linea({ x: ARCO.x0, y: lerp(ARCO.y0, ARCO.y1, u) }, d({ x: RED.x0, y: lerp(RED.y0, RED.y1, u) }));
    linea({ x: ARCO.x1, y: lerp(ARCO.y0, ARCO.y1, u) }, d({ x: RED.x1, y: lerp(RED.y0, RED.y1, u) }));
  }
  for (let i = 0; i <= N; i++) {
    const u = i / N;
    linea({ x: lerp(ARCO.x0, ARCO.x1, u), y: ARCO.y0 }, d({ x: lerp(RED.x0, RED.x1, u), y: RED.y0 }));
  }
  for (let k = 1; k < 4; k++) {
    const u = k / 4;
    linea({ x: lerp(ARCO.x0, RED.x0, u), y: lerp(ARCO.y0, RED.y0, u) },
          { x: lerp(ARCO.x1, RED.x1, u), y: lerp(ARCO.y0, RED.y0, u) });
    linea({ x: lerp(ARCO.x0, RED.x0, u), y: lerp(ARCO.y0, RED.y0, u) },
          { x: lerp(ARCO.x0, RED.x0, u), y: lerp(ARCO.y1, RED.y1, u) });
    linea({ x: lerp(ARCO.x1, RED.x1, u), y: lerp(ARCO.y0, RED.y0, u) },
          { x: lerp(ARCO.x1, RED.x1, u), y: lerp(ARCO.y1, RED.y1, u) });
  }
}
function dibujarPalos(ctx){
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.strokeStyle = "#B9C2BB"; ctx.lineWidth = 0.02;
  ctx.beginPath(); ctx.moveTo(ARCO.x0, ARCO.y1 + 0.004); ctx.lineTo(ARCO.x0, ARCO.y0);
  ctx.lineTo(ARCO.x1, ARCO.y0); ctx.lineTo(ARCO.x1, ARCO.y1 + 0.004); ctx.stroke();
  ctx.strokeStyle = "#FAFCFA"; ctx.lineWidth = 0.013;
  ctx.beginPath(); ctx.moveTo(ARCO.x0, ARCO.y1 + 0.004); ctx.lineTo(ARCO.x0, ARCO.y0);
  ctx.lineTo(ARCO.x1, ARCO.y0); ctx.lineTo(ARCO.x1, ARCO.y1 + 0.004); ctx.stroke();
}
function dibujarPelota(ctx, b){
  ctx.globalAlpha = b.alfa;
  ctx.fillStyle = "#0B0F0C"; ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 0.0025, 0, 7); ctx.fill();
  ctx.fillStyle = "#F7F7F2"; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
  ctx.fillStyle = "#1B1F1C";
  for (let i = 0; i < 3; i++) {
    const a = b.giro + i * 2.1;
    ctx.beginPath(); ctx.arc(b.x + Math.cos(a) * b.r * 0.5, b.y + Math.sin(a) * b.r * 0.5, b.r * 0.3, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function marcarCelda(ctx, i, color){
  const c = COLU(i), f = FILA(i);
  const w = (ARCO.x1 - ARCO.x0) / 3, h = (ARCO.y1 - ARCO.y0) / 3;
  ctx.fillStyle = color;
  ctx.fillRect(ARCO.x0 + c * w, ARCO.y0 + (2 - f) * h, w, h);
}

let sonado = { id: "" };

/* ── un cuadro ─────────────────────────────────────────── */
function dibujarEscena(canvas){
  const W = canvas.clientWidth; if (!W) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const pw = Math.round(W * dpr), ph = Math.round(W * ALTO_ESCENA * dpr);
  if (canvas.width !== pw || canvas.height !== ph) { canvas.width = pw; canvas.height = ph; }
  const ctx = canvas.getContext("2d");
  ctx.setTransform(pw, 0, 0, pw, 0, 0);   // desde aca todo va en "anchos"

  const reloj = performance.now() / 1000;
  let repe = null, t = 0;
  if (mostrando) {
    repe = (sala.historial || []).filter(e => e.penal === mostrando.penal)[0] || null;
    t = (Date.now() - mostrando.desde) / 1000;
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) t = 9;
  }

  dibujarCancha(ctx);

  /* Los sonidos van atados al tiempo de la repeticion, no al DOM. */
  if (repe && mostrando && t < 8) {
    const id = mostrando.penal + "/" + vuelta();
    if (sonado.id !== id) sonado = { id: id, patada: false, fin: false };
    if (!sonado.patada && t >= T_CARRERA) { sonado.patada = true; sonar("patada"); }
    if (!sonado.fin && t >= T_IMPACTO) {
      sonado.fin = true;
      sonar(repe.fin === "gol" ? "gol" : repe.fin === "atajada" ? "atajada" : "uuu");
    }
  }

  const pelota = pelotaEn(t, repe);
  const esGol = !!repe && repe.fin === "gol" && t > T_IMPACTO;
  dibujarRed(ctx, esGol ? { x: pelota.x, y: pelota.y } : null,
             esGol ? Math.exp(-(t - T_IMPACTO) * 1.6) * (0.6 + 0.4 * Math.cos((t - T_IMPACTO) * 14)) : 0);
  if (repe && t > T_IMPACTO + 0.3 && repe.tiro >= 0) {
    marcarCelda(ctx, repe.palo, "rgba(127,212,255,.16)");
    marcarCelda(ctx, repe.tiro, repe.fin === "gol" ? "rgba(57,255,136,.2)" : "rgba(255,51,85,.18)");
  }
  const arq = poseArquero(t, repe, reloj);
  sombra(ctx, (arq.pieI.x + arq.pieD.x) / 2, ARCO.y1 + 0.004, 0.04, 0.008, 0.35);
  if (esGol) dibujarPelota(ctx, pelota);
  muneco(ctx, arq, KIT_ARQUERO, 0.92);
  dibujarPalos(ctx);
  const pat = posePateador(t, repe, reloj);
  sombra(ctx, (pat.pieI.x + pat.pieD.x) / 2, pat.pieI.y + 0.004, 0.05, 0.011, 0.35);
  if (!esGol) {
    const alto = clamp((pelota.suelo - pelota.y) * 3, 0, 1);
    sombra(ctx, pelota.x, pelota.suelo + 0.006, pelota.r * (1 - alto * 0.5),
           pelota.r * 0.45 * (1 - alto * 0.5), 0.4 * (1 - alto * 0.6));
    dibujarPelota(ctx, pelota);
  }
  muneco(ctx, pat, KIT_PATEADOR, 1);
}

/* El bucle corre solo mientras hay una escena en pantalla; cuando pintar()
   la saca del DOM, el bucle se apaga solo en el cuadro siguiente. */
let animando = false;
function animar(){
  const c = document.getElementById("escena");
  if (!c) { animando = false; return; }
  try { dibujarEscena(c); } catch (e) { console.warn(e); }
  requestAnimationFrame(animar);
}
function arrancarEscena(){
  if (!animando && document.getElementById("escena")) { animando = true; requestAnimationFrame(animar); }
}

/* ── arranque ────────────────────────────────────────────── */
pintar();
if (desdeUrl && miNombre) entrarSala();
