<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>El Desafío</title>
<style>
:root{--bg:#0b1220;--panel:#151f33;--panel2:#1e2a44;--line:#2a3a5c;--text:#e6edf7;--muted:#8fa2c2;--ok:#22c55e;--warn:#facc15;--bad:#ef4444;--blue:#38bdf8}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden;font-size:14px}
header{display:flex;align-items:center;gap:14px;padding:6px 14px;background:#0a0f1c;border-bottom:1px solid var(--line);flex-wrap:wrap}
header .logo{font-weight:800;font-size:18px;letter-spacing:.5px;color:#fff}
header .logo span{color:var(--ok)}
.stat{display:flex;flex-direction:column;line-height:1.1;padding:0 8px;border-left:1px solid var(--line)}
.stat b{font-size:15px}
.stat small{color:var(--muted);font-size:11px}
.spacer{flex:1}
.speed button{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:5px 10px;border-radius:6px;cursor:pointer;font-weight:700}
.speed button.on{background:var(--ok);color:#06210f;border-color:var(--ok)}
#main{flex:1;display:flex;min-height:0}
#sceneWrap{flex:1 1 0;min-height:0;min-width:0;position:relative;background:#0a0f1c;display:flex;flex-direction:column;overflow:hidden}
#lienzo{flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center}
#cal{display:flex;align-items:center;gap:12px;padding:6px 12px;background:#0a0f1c;border-bottom:1px solid var(--line);flex:0 0 auto;min-height:56px}
#cal .club{flex:1 1 0;min-width:0}#cal .club b{font-size:15px;color:#fff;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#cal .club small{font-size:11px;color:var(--muted);white-space:nowrap}
#cal .dias{display:flex;gap:4px;flex:0 0 auto}
#cal .dia{width:36px;height:44px;border-radius:7px;background:#1e2a44;border:1px solid #2a3a5c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;font-size:13px;font-weight:700;color:var(--muted)}
#cal .dia span{font-size:12px;font-weight:400}
#cal .dia.on{color:#0b1220;border-color:#fff}#cal .dia.on span{color:#fff}
#cal .dia i{position:absolute;left:4px;right:4px;bottom:3px;height:2px;background:rgba(255,255,255,.8);transform-origin:left;display:block}
#cal .info{flex:1 1 0;min-width:0;text-align:right}#cal .info b{font-size:13px;color:#fff;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#cal .info small{font-size:11px;color:var(--muted);white-space:nowrap}
#cal .info b.gol{color:var(--warn)}
@media (max-width:700px){#cal{flex-wrap:wrap;gap:4px 8px;padding:6px 8px}#cal .club{flex:1 1 100%}#cal .club b{font-size:14px;white-space:normal}#cal .club small{display:none}#cal .dias{flex:0 0 auto}#cal .dia{width:32px;height:38px;font-size:12px}#cal .dia span{font-size:11px}#cal .info{flex:1 1 0;text-align:right}#cal .info b{font-size:12px;white-space:normal}#cal .info small{display:none}}
canvas#scene{max-width:100%;max-height:100%;aspect-ratio:16/10;cursor:pointer;display:block}
#toasts{position:absolute;left:12px;top:70px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{background:rgba(10,15,28,.9);border:1px solid var(--line);border-left:4px solid var(--blue);padding:6px 10px;border-radius:6px;font-size:13px;animation:fade 6s forwards;max-width:380px}
.toast.ok{border-left-color:var(--ok)}.toast.bad{border-left-color:var(--bad)}.toast.warn{border-left-color:var(--warn)}
@keyframes fade{0%{opacity:0;transform:translateY(-6px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
#side{width:390px;flex:0 0 390px;background:var(--panel);display:flex;flex-direction:column;border-left:1px solid var(--line);min-width:0;min-height:0}
#tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line)}
#tabs button{flex:1 0 auto;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:8px 6px;cursor:pointer;font-size:12px;font-weight:600}
#tabs button.on{color:#fff;border-bottom-color:var(--ok)}
#tabContent{flex:1;overflow:auto;padding:12px}
#log{height:120px;overflow:auto;border-top:1px solid var(--line);padding:6px 10px;font-size:12px;color:var(--muted);background:#0f172a}
#log div{padding:1px 0}
#log .ok{color:#86efac}#log .bad{color:#fca5a5}#log .warn{color:#fde68a}
h2{margin:0 0 8px;font-size:16px}
h3{margin:14px 0 6px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card p{margin:4px 0;color:var(--muted);font-size:12px}
button.b{background:var(--ok);color:#06210f;border:0;border-radius:6px;padding:6px 10px;font-weight:700;cursor:pointer;font-size:12px;white-space:nowrap}
button.b.sec{background:var(--panel);color:var(--text);border:1px solid var(--line)}
button.b.bad{background:var(--bad);color:#fff}
button.b:disabled{opacity:.4;cursor:not-allowed}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:4px 5px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:11px}
tr.me td{background:rgba(34,197,94,.12);font-weight:700}
tr.xi td:first-child::before{content:"★ ";color:var(--warn)}
.bar{height:6px;background:#0b1220;border-radius:3px;overflow:hidden;width:60px;display:inline-block;vertical-align:middle}
.bar i{display:block;height:100%;background:var(--ok)}
.pill{display:inline-block;padding:1px 6px;border-radius:10px;font-size:11px;background:#0b1220;color:var(--muted)}
.pill.POR{color:#fbbf24}.pill.DEF{color:#60a5fa}.pill.MED{color:#4ade80}.pill.DEL{color:#f87171}
input[type=range]{width:100%}
label.chk{display:flex;gap:6px;align-items:center;cursor:pointer;font-size:12px;margin:3px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.kv{display:flex;justify-content:space-between;font-size:12px;padding:2px 0}
.kv b{color:#fff}
.good{color:var(--ok)}.badc{color:var(--bad)}.warnc{color:var(--warn)}
select,input[type=number],input[type=text]{background:#0b1220;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 7px;font-size:13px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:10}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;max-width:520px;width:90%}
#modal h2{font-size:20px}
#modal label{display:block;margin:8px 0 4px;font-size:12px;color:var(--muted)}
.hint{font-size:11px;color:var(--muted)}
.sw{display:inline-block;width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;margin:2px}
.sw.on{border-color:#fff}
canvas#scene{touch-action:none}
@media (max-width:1000px){#main{flex-direction:column}#sceneWrap{flex:0 0 40%}#side{width:100%;flex:1 1 0;border-left:0;border-top:1px solid var(--line)}#log{height:70px}}
#hoy{padding:10px 12px;border-bottom:1px solid var(--line);background:#111a2e}
#hoy .linea{font-size:13px;margin-bottom:8px}#hoy .linea b{color:#fff}
#hoy .ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#hoy .principal{background:var(--ok);color:#06210f;border:0;border-radius:8px;padding:9px 14px;font-weight:800;font-size:14px;cursor:pointer;flex:1 1 auto}
#hoy .principal:disabled{opacity:.5;cursor:not-allowed}
#hoy .sec{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;cursor:pointer;font-weight:700}
#hoy .speed{display:flex;gap:3px;margin-left:auto}#hoy .speed button{padding:4px 7px;font-size:11px;border-radius:5px}
#hoy .speed span{font-size:10px;color:var(--muted);align-self:center;margin-right:2px}
#sub{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 10px}#sub button{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:14px;padding:4px 10px;font-size:12px;cursor:pointer}#sub button.on{background:#fff;color:#0b1220;border-color:#fff;font-weight:700}
.pill.POR,.pill.DEF,.pill.MED,.pill.DEL{color:var(--text)}
abbr.q{text-decoration:none;border-bottom:1px dotted var(--muted);cursor:help}
#logbar .punto{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--bad);margin-left:4px;vertical-align:middle}
#tuto{position:absolute;left:12px;bottom:12px;max-width:340px;background:rgba(10,15,28,.96);border:1px solid var(--ok);border-radius:10px;padding:12px 14px;font-size:13px;z-index:5;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#tuto b{color:#fff}#tuto .paso{font-size:10px;color:var(--ok);letter-spacing:.1em;text-transform:uppercase}#tuto .btns{margin-top:8px;display:flex;gap:6px}
.tuto-target{outline:2px solid var(--ok)!important;outline-offset:2px;animation:pulso 1.2s infinite}
@keyframes pulso{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}50%{box-shadow:0 0 0 8px rgba(34,197,94,0)}}
details.inf{margin:4px 0;font-size:12px}details.inf summary{cursor:pointer;color:var(--text)}details.inf p{margin:4px 0 0 12px;color:var(--muted)}
.tend{font-size:10px;color:var(--muted)}.tend.up{color:var(--ok)}.tend.down{color:var(--bad)}
@media (max-width:700px){#slot,#btnExportar,#btnImportar{display:none}header{gap:8px;padding:6px 8px}header .logo{font-size:15px}.stat{padding:0 5px}.stat b{font-size:13px}.stat small{font-size:10px}.speed button,button.b{padding:8px 11px;font-size:13px}#tabs button{padding:10px 5px;font-size:12px}#tabContent{padding:8px}td,th{padding:6px 4px}button.b{min-height:34px}}
#logbar{display:flex;gap:4px;padding:3px 8px 0;background:#0f172a;border-top:1px solid var(--line)}
#logbar button{background:none;border:0;color:var(--muted);font-size:11px;cursor:pointer;padding:3px 8px;border-radius:6px}
#logbar button.on{background:var(--panel2);color:#fff}
#log{border-top:0}
#ficha{display:flex;gap:14px;align-items:flex-start}#ficha canvas{border-radius:10px;background:#0b1220;flex:0 0 auto}
.attr{display:grid;grid-template-columns:70px 1fr 30px;gap:6px;align-items:center;font-size:12px;margin:3px 0}.attr .bar{width:100%}
</style>
</head>

function genJugador(oMin,oMax,eMin,eMax){
  const ovr=clamp(rnd(oMin,oMax),20,94),edad=ri(eMin,eMax);
  const margen=Math.max(0,(29-edad)*2.2);
  const pot=clamp(ovr+rnd(0,margen),ovr,99);
  const nac=Math.random()<0.75?G.pais:pick(PAISES);
  const j={id:Math.random().toString(36).slice(2,9),nombre:pick(NOM)+' '+pick(APE),pos:pick(POS),edad,ovr,pot,energia:100,goles:0,pj:0,nac};
  recalc(j);return j;
}
function salarioDe(ovr){return Math.round(20*Math.pow(1.1,ovr)*[1,1,0.8,0.6,0.45][G.division]/10)*10}
function ingresoSemanal(){return merchSemana()+patroSemana()+TV[G.division]+asistencia(G.precio)*G.precio/2}
function recalc(j){
  j.salarioRef=salarioDe(j.ovr);if(j.salario===undefined)j.salario=j.salarioRef;if(j.contrato===undefined)j.contrato=ri(30,120);
  let v=3000*Math.pow(1.09,j.ovr);
  if(j.edad<24)v*=1+(j.pot-j.ovr)/40;if(j.edad>30)v*=Math.max(.3,1-(j.edad-30)*.12);
  j.valor=Math.round(v/1000)*1000;
}
function genPlantilla(){const arr=[];const wants={POR:2,DEF:6,MED:6,DEL:4};
  for(const p of POS)for(let i=0;i<wants[p];i++){const j=genJugador(38,54,18,32);j.pos=p;arr.push(j)}return arr}
function clubesDivision(d){const c=CLUBES_PAIS[G.pais];
  if(d===1)return c.p.slice(0,11);if(d===2)return c.p.slice(11,18).concat(c.s.slice(0,4));if(d===3)return c.s.slice(4,15);
  return c.s.slice(15,18).concat(REGIONALES.slice().sort(()=>Math.random()-.5).slice(0,8))}
function genLiga(){
  const [lo,hi]=RANGO_DIV[G.division];
  const nombres=clubesDivision(G.division).filter(n=>n!==G.nombreClub).slice(0,numEq()-1);
  const eq=[{nombre:G.nombreClub,yo:true,pts:0,pj:0,gf:0,gc:0,fuerza:0,color:G.color}];
  const mia=G.jugadores.length?fuerzaEquipo():0;
  nombres.forEach((n,i)=>{let f=clamp(hi-(hi-lo)*i/(numEq()-2)+rnd(-1.5,1.5),lo-2,hi+2);
    // los grandes también fichan: en Primera los 4 primeros se acercan a tu nivel; en Primera B los 2 primeros
    if(G.division===1&&i<4)f=Math.max(f,Math.min(97,(mia*rnd(0.93,1.03)+Math.min(6,G.rachaTitulos*1.2))*dif().riv));else if(G.division===2&&i<2)f=Math.max(f,Math.min(80,mia*0.9));
    eq.push({nombre:n,yo:false,pts:0,pj:0,gf:0,gc:0,fuerza:f,color:PALETA[1+(i%8)]})});
  G.liga=eq;
  const otros=eq.slice(1).map((e,i)=>i+1);const cal=[];
  for(let r=0;r<2;r++)for(const i of otros.sort(()=>Math.random()-.5))cal.push({rival:i,local:(cal.length+r)%2===0});
  G.calendario=cal;
}

function newGame(nombre,pais,color,dificultad,herencia){
  G=estadoBase();G.nombreClub=nombre||'Mi Club FC';G.pais=PAISES.includes(pais)?pais:'Chile';G.color=color||PALETA[0];

function save(){if(!G)return;const p=G.partido;try{G.partido=null;G.slot=SLOT;localStorage.setItem(SAVE_KEY(),JSON.stringify(G));localStorage.setItem('clubtycoon_slot',SLOT)}catch(e){}finally{G.partido=p}}
function migrar(g){G=g;const b=estadoBase();let n=0;if(g.tutorial===undefined)g.tutorial=99;const mapa={sede:'club',personal:'club',plantilla:'equipo',cantera:'equipo',entreno:'equipo',partidos:'competicion',ventas:'dinero',publi:'dinero'};if(mapa[g.tab]){const sub={...b.sub};sub[mapa[g.tab]]=g.tab;g.sub=sub;g.tab=mapa[g.tab]}if(!g.sub||typeof g.sub!=='object')g.sub={...b.sub};
  for(const k in b)if(g[k]===undefined||g[k]===null&&b[k]!==null&&typeof b[k]==='object'){g[k]=b[k];n++}
  for(const k of ['stats','inst','personal','auto'])for(const j in b[k])if(g[k][j]===undefined)g[k][j]=b[k][j];
  if(!g.records||typeof g.records!=='object')g.records=b.records;for(const j in b.records)if(g.records[j]===undefined)g.records[j]=b.records[j];
  if(!Array.isArray(g.jugadores))g.jugadores=[];for(const j of g.jugadores){if(j.energia===undefined)j.energia=100;if(j.goles===undefined)j.goles=0;if(j.pj===undefined)j.pj=0;if(!j.nac)j.nac=g.pais;recalc(j)}
  if(!g.liga||!g.calendario||!g.liga.length){G=g;genLiga()}
  if(!g.objetivo){G=g;try{fijarObjetivo()}catch(e){}}
  if(!g.fin)g.fin=nuevoFin();
  if(n)console.info('Partida migrada: '+n+' campos añadidos');return g}

function once(){return G.jugadores.slice().sort((a,b)=>b.ovr-a.ovr)}
function mejorXI(){
  const form={POR:1,DEF:4,MED:4,DEL:2};const xi=[];const rest=[];
  const disp=once().filter(j=>j.energia>15&&!(j.lesion>0));
  for(const p of POS){const c=disp.filter(j=>j.pos===p);xi.push(...c.slice(0,form[p]));rest.push(...c.slice(form[p]))}
  rest.sort((a,b)=>b.ovr-a.ovr);
  while(xi.length<11&&rest.length)xi.push(rest.shift());
  if(xi.length<11){const faltan=once().filter(j=>!xi.includes(j)&&!(j.lesion>0));while(xi.length<11&&faltan.length)xi.push(faltan.shift())}
  return xi;
}
function fuerzaEquipo(){const xi=mejorXI();if(!xi.length)return 20;let s=0;for(const j of xi)s+=j.ovr*(0.75+0.25*j.energia/100);
  if(!xi.some(j=>j.pos==='POR'))s*=0.85;const vet=Math.min(3,xi.filter(j=>j.edad>=30).length);return Math.max(15,s/11*(0.85+G.moral/400)+vet*0.5-Math.max(0,11-xi.length)*8)}

    else if(G.foco==='jovenes')f=j.edad<=22?1.9:0.35;

function hashStr(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h}
const PIEL=['#D7CBB0','#C9B79C','#B79E7B','#8C6A4E','#DCC9A6','#E4D4C8','#A3B18A','#588157'];const PELO=['#1f1a17','#3b2a1a','#6b4a2b','#c9a227','#b0b0b0','#8b1a1a'];
function atributos(j){const h=hashStr(j.id);const v=(k)=>((h>>(k*5))%11)-5;const b={fis:j.ovr,tec:j.ovr,men:j.ovr,tac:j.ovr};
  if(j.pos==='POR'){b.fis-=4;b.tec-=6;b.men+=5;b.tac+=2}else if(j.pos==='DEF'){b.fis+=4;b.tec-=5;b.tac+=4}else if(j.pos==='MED'){b.tec+=4;b.tac+=3;b.fis-=3}else{b.tec+=5;b.fis+=2;b.men-=2;b.tac-=4}
  if(j.edad<=21)b.fis+=3;if(j.edad>=31){b.fis-=6;b.men+=5}return {fis:clamp(Math.round(b.fis+v(0)),20,99),tec:clamp(Math.round(b.tec+v(1)),20,99),men:clamp(Math.round(b.men+v(2)),20,99),tac:clamp(Math.round(b.tac+v(3)),20,99)}}
function dibujarAvatar(c,j){const g=c.getContext('2d');const h=hashStr(j.id);const piel=PIEL[h%PIEL.length],pelo=PELO[(h>>3)%PELO.length];g.clearRect(0,0,96,96);
  g.fillStyle=G.color;g.beginPath();g.moveTo(14,96);g.quadraticCurveTo(48,54,82,96);g.fill();g.fillStyle='rgba(255,255,255,.85)';g.font='700 13px system-ui';g.textAlign='center';g.fillText(String((h%29)+1),48,90);

    txt(gol?(P.ultimoGol.mio?'¡GOOOL de '+(P.ultimoGol.autor||G.nombreClub)+'!':'Gol del rival...'):'Partido fuera de casa: sin taquilla',24,H-22,gol?'#fde047':'#8fa2c2',13,'left',gol)}
  if(G.vel===0){rr(W/2-150,H-34,300,28,8,'rgba(0,0,0,.65)');txt('⏸ EN PAUSA · espacio reanuda · → un día',W/2,H-14,'#facc15',14,'center',true)}
  else if(G.vel>1&&!G.autoPausa){rr(W/2-50,H-32,100,24,7,'rgba(0,0,0,.55)');txt('▶ '+G.vel+'×',W/2,H-14,'#fff',14,'center',true)}
  else if(G.autoPausa){rr(W/2-90,H-32,180,24,7,'rgba(0,0,0,.55)');txt('▶ Jugando la semana…',W/2,H-14,'#bbf7d0',13,'center',true)}
  if($('#modal').style.display==='flex'&&G.vel>0){rr(W/2-90,H-34,180,28,8,'rgba(0,0,0,.65)');txt('⏸ en pausa (diálogo)',W/2,H-14,'#facc15',14,'center',true)}
}
let last=performance.now(),erroresFrame=0;
function frame(now){try{frameInterno(now)}catch(e){erroresFrame++;if(erroresFrame<=3)console.error('Error al dibujar',e);ctx.setTransform(1,0,0,1,0,0)}requestAnimationFrame(frame)}
function frameInterno(now){
  const dtReal=Math.min(0.05,(now-last)/1000);last=now;const dt=corriendo?dtReal:0;const t=now/1000;
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#0a0f1c';ctx.fillRect(0,0,W,H);
  ctx.setTransform(VIEW.s,0,0,VIEW.s,VIEW.x,VIEW.y);luces=[];
  drawTerreno();
  if(!G){ctx.setTransform(1,0,0,1,0,0);return}
  camino(40,30,-20,50,7);camino(40,30,100,-80,7);camino(40,30,-60,-110,7);camino(40,30,150,60,7);camino(40,30,110,130,7);camino(40,30,60,200,7);camino(-120,155,-120,200,6);
  poly([ISO(150,-70),ISO(215,-70),ISO(215,-20),ISO(150,-20)],'#8d8d8d');for(let i=0;i<5;i++){poly([ISO(156+i*12,-66),ISO(157+i*12,-66),ISO(157+i*12,-24),ISO(156+i*12,-24)],'#e5e7eb');if((i+G.semTotal)%3!==0){const cx=162+i*12;box(ISO,cx-3,cx+3,-60,-48,1,5,{top:PALETA[(i+G.semTotal)%PALETA.length],right:'#333',front:'#444'})}}
  const objs=[{d:-380,f:()=>{if(G.legado.includes('ciudad')||G.proyectos.ciudad){if(G.proyectos.ciudad){valla(160,220,-220,-160);grua(190,-190,G.proyectos.ciudad.restan)}else{cesped(162,206,-218,-190);edificio(165,205,-186,-166,12,{wall:'#dfe7ea',roof:'flat',roofColor:'#8fa3ad',glass:'#5b8fb0'});etiqueta(185,-186,30,'CIUDAD DEPORTIVA')}}}},
    {d:-90,f:()=>{if(G.legado.includes('filial')||G.proyectos.filial){if(G.proyectos.filial){valla(-230,-170,110,150);grua(-200,120,G.proyectos.filial.restan)}else{cesped(-226,-176,112,146);etiqueta(-201,112,16,'FILIAL')}}}},
    {d:165,f:()=>{if(G.legado.includes('fundacion')||G.proyectos.fundacion){if(G.proyectos.fundacion){valla(70,104,66,96);grua(100,70,G.proyectos.fundacion.restan)}else{edificio(74,100,70,92,9,{wall:'#f3e7c9',roofColor:'#4C8C6B',rh:5});etiqueta(87,70,22,'FUNDACIÓN')}}}},
    {d:-320,f:()=>{if(G.legado.includes('internacional')||G.proyectos.internacional){if(G.proyectos.internacional){valla(-230,-170,-215,-175);grua(-200,-200,G.proyectos.internacional.restan)}else{edificio(-226,-176,-212,-180,14,{wall:'#efe4cc',roofColor:'#8A5FB0',rh:6});etiqueta(-201,-212,32,'ACADEMIA INTERNACIONAL')}}}},
    {d:Z.estadio.x+Z.estadio.y,f:()=>drawEstadio(t)},{d:Z.entreno.x+Z.entreno.y,f:()=>drawEntreno(t)},{d:Z.academia.x+Z.academia.y,f:()=>drawAcademia(t)},{d:Z.oficinas.x+Z.oficinas.y,f:()=>drawOficinas(t)},{d:Z.tienda.x+Z.tienda.y,f:()=>drawTienda(t)},{d:70,f:()=>drawPlaza(t)}];
  const ocupado=(ax,ay)=>((G.legado.includes('ciudad')||G.proyectos.ciudad)&&ax>155&&ax<225&&ay<-155&&ay>-225)||((G.legado.includes('filial')||G.proyectos.filial)&&ax<-165&&ay>105&&ay<155)||((G.legado.includes('fundacion')||G.proyectos.fundacion)&&ax>60&&ax<110&&ay>60&&ay<100)||((G.legado.includes('internacional')||G.proyectos.internacional)&&ax<-165&&ay<-170);
  for(const [ax,ay] of ARBOLES)if(!ocupado(ax,ay))objs.push({d:ax+ay,f:()=>arbol(ax,ay,1)});for(const [ax,ay] of ARBOLES_FUERA)if(ay<200&&ax<250)objs.push({d:ax+ay,f:()=>arbol(ax,ay,1.2)});
  objs.sort((a,b)=>a.d-b.d);for(const o of objs)o.f();
  drawCalle(t,dt);drawBarrio(t);
  for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.vz-=140*dt;const s=ISO(p.x,p.y,Math.max(0,p.z));ctx.globalAlpha=clamp(p.life,0,1);ctx.fillStyle=p.c;ctx.fillRect(s[0]-1.5,s[1]-1.5,3,3)}
  ctx.globalAlpha=1;particles=particles.filter(p=>p.life>0&&particles.length<600);
  for(const n of nubes){n.x+=n.v*dt;if(n.x>W+160)n.x=-160;ctx.fillStyle='rgba(20,40,20,.10)';ctx.beginPath();ctx.ellipse(n.x,n.y*6+120,70*n.s,34*n.s,0,0,7);ctx.fill()}
  drawAmbiente(t);
  ctx.setTransform(1,0,0,1,0,0);
  const vg=ctx.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*0.85);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.28)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  drawCalendario();
}

const TICK=3000;let acum=0,lastT=performance.now();
let corriendo=false;
function loop(){try{loopInterno()}catch(e){console.error('Error en el bucle',e);if(G&&G.partido){G.partido=null}}setTimeout(loop,50)}
function loopInterno(){const now=performance.now();const dt=Math.min(1000,now-lastT);lastT=now;
  corriendo=!!G&&G.vel>0&&!G.gameOver&&$('#modal').style.display!=='flex';
  if(corriendo&&!G.partido){acum+=dt;if(acum>=TICK/G.vel){acum=0;tick();save()}}
  if(G&&G.partido){acum=0;if(corriendo)G.partido.el+=dt*Math.sqrt(G.vel);actualizarPartido()}
  publico(!!(G&&G.partido&&G.partido.local&&corriendo));}

requestAnimationFrame(frame);loop();renderSlots();
