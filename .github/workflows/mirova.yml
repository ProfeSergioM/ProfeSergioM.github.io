name: Seguimiento MIROVA

# Lee las últimas detecciones de MIROVA, acumula la serie temporal por volcán,
# regenera los gráficos y guarda todo en el repositorio (y por lo tanto en
# GitHub Pages: https://profesergiom.github.io/mirova/).
#
# MIROVA publica cada pasada entre 1 y 4 horas después de la adquisición y
# latest.php muestra sólo la última pasada procesada de cada sensor. Como
# puede haber varias pasadas por hora (MODIS Terra y Aqua, VIIRS en SNPP,
# NOAA-20 y NOAA-21), se consulta cada 30 minutos para perder las menos
# posibles. Cada corrida dura cerca de un minuto y en un repositorio público
# no consume cuota.

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      volcanes:
        description: "Volcanes a seguir, separados por comas (vacío = lista de volcanes.json; 'todos' = los 11)"
        required: false
        default: ""
      firms_desde:
        description: "Carga histórica FIRMS: fecha inicial YYYY-MM-DD (requiere el secreto FIRMS_MAP_KEY; vacío = no cargar)"
        required: false
        default: ""
      firms_hasta:
        description: "Carga histórica FIRMS: fecha final YYYY-MM-DD (vacío = hoy)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: mirova
  cancel-in-progress: false

jobs:
  seguimiento:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mirova/requirements.txt

      - run: pip install -r mirova/requirements.txt

      - name: Pruebas sin red
        run: python -m unittest mirova/pruebas.py

      - name: Carga histórica FIRMS (sólo si se indicó firms_desde)
        if: ${{ github.event.inputs.firms_desde != '' }}
        env:
          MIROVA_VOLCANES: ${{ github.event.inputs.volcanes }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          if [ -z "$FIRMS_MAP_KEY" ]; then echo "Falta el secreto FIRMS_MAP_KEY"; exit 1; fi
          python mirova/mirova_monitor.py firms --historico \
            --desde "${{ github.event.inputs.firms_desde }}" \
            ${{ github.event.inputs.firms_hasta != '' && format('--hasta {0}', github.event.inputs.firms_hasta) || '' }}

      - name: Actualizar datos, gráficos y resumen
        env:
          MIROVA_VOLCANES: ${{ github.event.inputs.volcanes }}
          # Opcional: con este secreto definido, cada corrida también trae de
          # NASA FIRMS los píxeles activos de los últimos 7 días (origen "firms").
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python mirova/mirova_monitor.py todo

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mirova/datos mirova/imagenes mirova/graficos
          if git diff --cached --quiet; then
            echo "Sin cambios nuevos."
            exit 0
          fi
          git commit -m "MIROVA: actualización automática $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
