<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TRUE o POSER</title>
<style>
  :root{--noche:#000000;--humo:#141018;--hueso:#F3ECE6;--sangre:#FF2350;--ambar:#FFC400;--violeta:#8A63FF;--cian:#00E5FF;--magenta:#FF2BD1;--verde:#3DDC5B;--azul:#2E9BFF;--naranja:#FF7A18;--ceniza:#8A7E92;--corte:18px;--radio:0px;--rot:-.5deg;--grano:.05;--foco:.2}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--noche)}
  body{color:var(--hueso);font-family:Helvetica,Arial,sans-serif;font-size:15px;line-height:1.35;
    padding:10px 12px 16px;max-width:480px;margin:0 auto;
    background:radial-gradient(120% 55% at 8% -12%,rgba(255,43,209,calc(var(--foco)*1.4)),transparent 58%),
      radial-gradient(110% 50% at 94% -8%,rgba(0,229,255,calc(var(--foco)*1.1)),transparent 60%),
      radial-gradient(95% 60% at 50% 114%,rgba(255,35,80,calc(var(--foco)*.9)),transparent 62%),var(--noche);
    transition:background .8s ease}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9;
    background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.05) 1px,transparent 1px);
    background-size:4px 4px;mix-blend-mode:screen;opacity:calc(var(--grano)*20);transition:opacity .8s ease}
  .impact{font-family:Impact,Haettenschweiler,"Arial Black","Arial Narrow",sans-serif;font-weight:400;
    text-transform:uppercase;line-height:.8;letter-spacing:-.015em}

  /* barra superior */
  .hud{display:flex;justify-content:space-between;align-items:baseline;font-size:10px;
    letter-spacing:.16em;text-transform:uppercase;color:var(--ceniza);margin-bottom:7px}
  .hud b{color:var(--ambar);font-variant-numeric:tabular-nums;letter-spacing:.05em}

  /* medidores en cuatro columnas */
  .med{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:9px}
  .m .et{font-size:8.5px;letter-spacing:.14em;color:var(--ceniza);text-transform:uppercase}
  .m .nu{font-family:Impact,Haettenschweiler,"Arial Black",sans-serif;font-size:26px;
    font-variant-numeric:tabular-nums;line-height:.95;margin:2px 0 4px;letter-spacing:-.02em}
  .m .ba{height:5px;background:rgba(243,236,230,.12);transform:skewX(-22deg);overflow:hidden}
  .m .ba i{display:block;height:100%;transition:width .35s cubic-bezier(.2,.8,.2,1)}
  .c1 i{background:var(--ambar)}.c1 .nu{color:var(--ambar)}
  .c2 i{background:var(--hueso)}
  .c3 i{background:var(--violeta)}.c3 .nu{color:var(--violeta)}
  .c4 i{background:var(--sangre)}.c4 .nu{color:var(--sangre)}

  /* eje */
  .eje{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .eje .lb{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase}
  .eje .lb.p{color:var(--sangre)}.eje .lb.t{color:var(--violeta)}
  .eje-bar{flex:1;height:8px;position:relative;transform:skewX(-22deg);opacity:.9;
    background:linear-gradient(90deg,var(--sangre),#6B4A5E 42%,#5B4A8A 58%,var(--violeta))}
  .eje-bar b{position:absolute;top:-4px;bottom:-4px;width:4px;background:var(--hueso);
    box-shadow:0 0 12px rgba(243,236,230,.9);transition:left .35s cubic-bezier(.2,.8,.2,1)}

  details.form{margin-bottom:9px}
  details.form summary{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ceniza);cursor:pointer;list-style:none}
  details.form summary::-webkit-details-marker{display:none}
  details.form p{margin:5px 0 0;font-size:11px;color:var(--ceniza);line-height:1.35}

  /* afiche */
  .flyer{padding:14px 14px 12px;background:linear-gradient(155deg,var(--humo),#150C1D);
    border-top:3px solid var(--sangre);box-shadow:0 14px 34px rgba(0,0,0,.6),0 0 0 1px rgba(243,236,230,.08) inset;
    clip-path:polygon(0 0,100% 0,100% calc(100% - var(--corte)),calc(100% - var(--corte)) 100%,0 100%);border-radius:var(--radio);transform:rotate(var(--rot))}
  .flyer.mal{border-top-color:var(--ambar);transform:rotate(.6deg);background:linear-gradient(155deg,#2A1119,#170A12)}
  .kicker{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--ambar);margin-bottom:5px}
  .kicker.alerta{color:var(--sangre)}
  h2{margin:0 0 9px;font-size:clamp(30px,9.6vw,44px);transform:skewX(-7deg);
    text-shadow:3px 3px 0 var(--sangre)}
  .texto{font-size:13.5px;margin:0 0 11px;color:rgba(243,236,230,.82)}

  button.opt{display:block;width:100%;text-align:left;font-family:inherit;font-size:15px;font-weight:bold;line-height:1.25;
    background:rgba(243,236,230,.05);color:var(--hueso);border:0;border-left:3px solid rgba(243,236,230,.28);
    padding:8px 11px;margin-bottom:6px;cursor:pointer;
    clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%);
    transition:background .15s,border-color .15s,transform .15s}
  button.opt:hover,button.opt:focus-visible{background:rgba(255,35,80,.16);border-left-color:var(--sangre);transform:translateX(3px);outline:none}
  button.opt .costo{display:block;color:var(--ceniza);font-size:11px;font-weight:normal;
    letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
  button.opt:hover .costo{color:rgba(243,236,230,.7)}
  button.opt:last-child{margin-bottom:0}

  .resultado{border-left:3px solid var(--ambar);padding:2px 0 2px 11px;margin:0 0 10px;font-size:13.5px;color:rgba(243,236,230,.88)}
  .deltas{display:flex;flex-wrap:wrap;gap:5px;font-size:11px;margin-bottom:9px}
  .d{padding:2px 8px;transform:skewX(-14deg);font-variant-numeric:tabular-nums;background:rgba(243,236,230,.08);color:var(--ceniza)}
  .d.mas{background:rgba(138,99,255,.22);color:#C4B2FF}
  .d.menos{background:rgba(255,35,80,.2);color:#FF7A97}
  .balance{font-size:10px;color:var(--ceniza);margin:0 0 9px;letter-spacing:.03em}

  /* inicio */
  h1{margin:0;font-size:clamp(48px,17vw,82px);transform:skewX(-7deg);position:relative;
    background:linear-gradient(180deg,#FFFFFF 0%,#DCE6F0 38%,#5C6675 50%,#F2F7FF 58%,#FFFFFF 78%,#9AA6B4 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(4px 4px 0 var(--sangre)) drop-shadow(0 0 26px rgba(255,43,209,.5))}
  h1 .rojo{background:linear-gradient(180deg,#FFE8A8,#FFC400 45%,#8A5A00 52%,#FFD966 62%,#FFF3C4);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  h1 .rojo{color:var(--sangre)}
  .intro{font-size:12.5px;color:var(--ceniza);margin:8px 0 12px;line-height:1.4}
  .nombre-wrap{display:flex;gap:8px;margin-bottom:12px}
  input[type=text]{flex:1;min-width:0;font-family:Impact,Haettenschweiler,"Arial Black",sans-serif;
    text-transform:uppercase;font-size:32px;letter-spacing:-.01em;background:transparent;border:0;border-bottom:2px solid rgba(243,236,230,.35);
    padding:3px 2px;color:var(--hueso);text-shadow:0 0 14px rgba(255,35,80,.5)}
  input[type=text]:focus{outline:none;border-bottom-color:var(--sangre)}
  .dado{border:0;background:rgba(243,236,230,.08);font-size:18px;padding:0 14px;cursor:pointer;color:var(--ambar);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%)}
  .dado:hover{background:var(--sangre);color:var(--hueso)}
  .banda-opt{padding:10px 12px;margin-bottom:7px;cursor:pointer;background:rgba(243,236,230,.05);
    border-left:3px solid rgba(243,236,230,.25);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%);
    transition:background .15s,border-color .15s,transform .15s}
  .banda-opt:hover,.banda-opt:focus-visible{background:rgba(255,35,80,.14);border-left-color:var(--sangre);transform:translateX(3px);outline:none}
  .banda-opt h3{margin:0;font-size:27px;transform:skewX(-7deg)}
  .banda-opt p{margin:2px 0 0;font-size:12px;color:rgba(243,236,230,.75)}
  .banda-opt .datos{font-size:10px;letter-spacing:.06em;color:var(--ceniza);margin-top:3px}

  /* final */
  .final{padding:16px 14px;background:linear-gradient(155deg,var(--humo),#140B1C);border-top:3px solid var(--ambar);
    box-shadow:0 14px 34px rgba(0,0,0,.65),0 0 0 1px rgba(243,236,230,.08) inset;
    clip-path:polygon(0 0,100% 0,100% calc(100% - 20px),calc(100% - 20px) 100%,0 100%)}
  .final h2{font-size:clamp(32px,10vw,46px);margin-bottom:10px}
  .rank{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--sangre);margin-bottom:5px}
  .marcador{font-size:11px;color:var(--ceniza);margin:12px 0 0;padding-top:9px;border-top:1px solid rgba(243,236,230,.16);line-height:1.5}
  .marcador b{color:var(--hueso);font-variant-numeric:tabular-nums}
  .reiniciar{margin-top:12px;width:100%;font-family:Impact,Haettenschweiler,"Arial Black",sans-serif;
    text-transform:uppercase;font-size:28px;letter-spacing:-.01em;padding:9px;background:var(--sangre);color:var(--hueso);border:0;cursor:pointer;
    clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%);box-shadow:0 0 26px rgba(255,35,80,.35)}
  .reiniciar:hover{background:var(--ambar);color:var(--noche)}

  /* ---- iconos ---- */
  .ico{display:inline-block;flex:0 0 auto;color:var(--ambar)}
  .ico svg{display:block;width:100%;height:100%;stroke-linecap:round;stroke-linejoin:round}
  .cab{display:flex;align-items:center;gap:10px;margin-bottom:7px}
  .cab .ico{width:34px;height:34px;padding:5px;background:rgba(255,176,32,.12);
    transform:skewX(-12deg);animation:late .5s ease-out both}
  .cab.alerta .ico{color:var(--sangre);background:rgba(255,35,80,.15)}
  .cab .kicker{margin:0}
  .m .et{display:flex;align-items:center;gap:3px}
  .m .et .ico{width:11px;height:11px;color:inherit;opacity:.85}
  .miniband{display:inline-flex;gap:3px;vertical-align:middle;margin-left:7px}
  .miniband i{width:7px;height:7px;border-radius:50%;background:var(--sangre);display:block;opacity:.85}
  .hero{width:100%;height:96px;margin-bottom:2px;color:var(--hueso)}
  .hero svg{width:100%;height:100%}



  .m .ba{position:relative;overflow:visible}
  .m .ba u{position:absolute;left:88%;top:-4px;bottom:-4px;width:0;
    border-left:2px dotted rgba(243,236,230,.75)}
  .m .ba u.ok,.eje-bar u.ok{border-color:var(--ambar);box-shadow:0 0 8px var(--ambar)}
  .eje-bar u{position:absolute;left:72.5%;top:-5px;bottom:-5px;width:0;
    border-left:2px dotted rgba(243,236,230,.75);background:none}

  /* objetivo */
  .alborde{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--sangre);
    border-left:3px solid var(--sangre);padding:4px 8px;margin-bottom:8px;background:rgba(255,35,80,.1);
    animation:pulso 1.6s ease-in-out infinite}
  @keyframes pulso{50%{background:rgba(255,35,80,.22)}}

  /* avatares */
  .avs{display:flex;flex-direction:column;gap:5px;margin-top:6px}
  .av{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ceniza)}
  .av i{width:19px;height:19px;flex:0 0 auto;border-radius:50%;color:var(--noche);font-style:normal;
    font-weight:bold;font-size:11px;display:flex;align-items:center;justify-content:center}
  .av b{color:rgba(243,236,230,.75);font-weight:normal}

  /* parate */
  button.opt.parate{border-left-color:var(--violeta);background:rgba(138,99,255,.09)}
  button.opt.parate:hover{background:rgba(138,99,255,.22);border-left-color:var(--violeta)}

  /* corte de semestre */
  .flashsem{position:fixed;inset:0;z-index:20;pointer-events:none;display:flex;align-items:center;justify-content:center;
    animation:golpe .7s ease-out forwards}
  .flashsem span{font-family:Impact,Haettenschweiler,"Arial Black",sans-serif;font-size:44vw;color:var(--hueso);
    letter-spacing:-.04em;
    opacity:.9;text-shadow:0 0 60px rgba(255,35,80,.8)}
  @keyframes golpe{0%{opacity:0;transform:scale(1.3)}18%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.96)}}

  /* afiche final */
  .afiche{padding:15px 14px 13px;background:linear-gradient(160deg,var(--humo),#100815 70%);
    border-top:4px solid var(--sangre);box-shadow:0 18px 44px rgba(0,0,0,.7),0 0 0 1px rgba(243,236,230,.09) inset;
    clip-path:polygon(0 0,100% 0,100% calc(100% - var(--corte)),calc(100% - var(--corte)) 100%,0 100%);
    border-radius:var(--radio);animation:entra .45s cubic-bezier(.2,.8,.2,1) both}
  .afiche .an{font-size:10px;letter-spacing:.3em;color:var(--ceniza);margin-bottom:6px}
  .afiche .nb{font-size:clamp(30px,11vw,46px);color:var(--hueso);transform:skewX(-5deg);
    text-shadow:0 0 26px rgba(255,35,80,.45);margin-bottom:6px;word-break:break-word}
  .afiche h2{font-size:clamp(19px,6vw,26px);color:var(--ambar);margin-bottom:9px}
  .afiche .texto{font-size:13.5px;margin-bottom:12px}
  .form-fin{font-size:11px;color:var(--ceniza);letter-spacing:.04em;padding:8px 0;
    border-top:1px solid rgba(243,236,230,.16);border-bottom:1px solid rgba(243,236,230,.16)}
  .form-fin b{color:rgba(243,236,230,.7);font-weight:normal}
  .linea{margin-top:11px;padding-top:9px;border-top:1px solid rgba(243,236,230,.16)}
  .linea summary{font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ambar);cursor:pointer;list-style:none}
  .linea summary::-webkit-details-marker{display:none}
  .linea ol{list-style:none;margin:8px 0 0;padding:0;font-size:11.5px;color:var(--ceniza);line-height:1.5}
  .linea li{padding:3px 0;border-bottom:1px solid rgba(243,236,230,.07)}
  .linea li span{display:inline-block;width:20px;color:var(--sangre);font-variant-numeric:tabular-nums}
  .linea li b{color:rgba(243,236,230,.85);font-weight:normal}
  .noviste{font-size:10px;color:var(--ceniza);margin-top:9px;font-style:italic}
  .linea ol{max-height:230px;overflow:auto}

  .hito{display:flex;gap:9px;align-items:flex-start;margin:9px 0 0;padding:8px 10px;
    background:rgba(255,176,32,.12);border-left:3px solid var(--ambar);font-size:12px;color:rgba(243,236,230,.85);
    animation:chip .4s .25s both}
  .hito .ico{width:16px;height:16px;flex:0 0 auto;margin-top:1px}
  .hito b{color:var(--ambar);font-size:13px}
  .cabf{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
  .afiche .an{font-size:9.5px;letter-spacing:.2em;color:var(--ceniza);margin:0}
  .afiche .rank{margin:0}
  .afiche .nb{font-size:clamp(36px,13vw,56px);margin-bottom:6px;transform:skewX(-7deg);
    text-shadow:4px 4px 0 var(--sangre)}
  .afiche h2{font-size:clamp(24px,7.6vw,34px);margin-bottom:9px;text-shadow:3px 3px 0 rgba(255,35,80,.55)}
  .afiche .texto{font-size:13px;margin-bottom:10px}
  .cifras{font-size:11px;color:var(--ceniza);line-height:1.6;padding-top:8px;
    border-top:1px solid rgba(243,236,230,.16)}
  .cifras b{color:var(--hueso);font-variant-numeric:tabular-nums;font-weight:normal}
  .cifras.b{border-top:none;padding-top:2px}
  .lgs{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 4px}
  .lg{font-size:10.5px;padding:2px 7px;background:rgba(255,176,32,.14);color:var(--ambar);transform:skewX(-12deg)}
  .lg.vacio{background:none;color:var(--ceniza);font-style:italic}
  .posterbox{margin-top:12px;text-align:center;border:1px solid rgba(243,236,230,.14);padding:5px;background:rgba(0,0,0,.3)}
  .posterbox canvas{display:block;margin:0 auto;max-height:290px;width:auto;max-width:100%}
  .botones{display:flex;gap:8px;margin-top:10px}
  .botones .reiniciar{margin-top:0;font-size:22px;padding:8px}
  .reiniciar.alt{background:transparent;color:var(--hueso);box-shadow:none;
    border:2px solid rgba(243,236,230,.35);margin-top:8px}
  .reiniciar.alt:hover{background:rgba(243,236,230,.12);color:var(--hueso)}

  .escena svg{width:100%;height:100%;display:block}
  .escena .gente{opacity:.9}
  .escena .gente circle{stroke:rgba(255,43,209,.55);stroke-width:.9}
  .hud{align-items:center}
  .snd{background:none;border:0;padding:0 8px 0 0;cursor:pointer;color:var(--ceniza);width:26px;height:18px}
  .snd svg{width:16px;height:16px;stroke-linecap:round;stroke-linejoin:round}
  .snd:hover{color:var(--ambar)}
  .tostada{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:30;
    background:var(--humo);color:var(--hueso);border-left:3px solid var(--ambar);
    padding:9px 14px;font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.6);animation:chip .3s both}

  .med.tres{grid-template-columns:repeat(3,1fr)}
  button.opt.exclusiva{border-left-color:var(--ambar);background:rgba(255,176,32,.07)}
  button.opt.exclusiva:hover{background:rgba(255,176,32,.18);border-left-color:var(--ambar)}
  .prensa{display:flex;gap:8px;align-items:flex-start;margin-top:10px;padding-top:9px;
    border-top:1px dashed rgba(243,236,230,.18);font-size:11.5px;font-style:italic;color:var(--ceniza)}
  .prensa .ico{width:14px;height:14px;flex:0 0 auto;color:var(--ceniza);margin-top:1px}

  .lema{font-size:13px;color:var(--ceniza);margin:8px 0 16px;line-height:1.4}
  .expl{margin-bottom:16px}
  .ex{display:flex;gap:11px;align-items:flex-start;padding:10px 0;
    border-top:1px solid rgba(243,236,230,.13);font-size:12.5px;color:rgba(243,236,230,.8);line-height:1.4}
  .ex .ico{width:22px;height:22px;flex:0 0 auto;color:var(--ambar);margin-top:2px}
  .ex b{display:block;color:var(--hueso);font-weight:normal;font-size:19px;margin-bottom:4px;
    font-family:Impact,Haettenschweiler,"Arial Black",sans-serif;text-transform:uppercase;letter-spacing:.02em}

  .escena{width:100%;height:112px;color:var(--hueso);opacity:1;margin-bottom:3px}
  .fig{transform-box:fill-box;transform-origin:50% 100%;animation:bailar 1.7s ease-in-out infinite}
  .fig.salta{animation-name:festejar;animation-duration:.7s}
  .fig.cae{animation-name:desplomar;animation-duration:3.4s}
  .fig.discute{animation-name:discutir;animation-duration:1.1s}
  @keyframes bailar{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-2px) rotate(2deg)}}
  @keyframes festejar{0%,100%{transform:translateY(0) scale(1)}45%{transform:translateY(-9px) scale(1.04)}}
  @keyframes desplomar{0%,100%{transform:translateY(2px) rotate(6deg)}50%{transform:translateY(4px) rotate(9deg)}}
  @keyframes discutir{0%,100%{transform:translateX(-3px) rotate(-4deg)}50%{transform:translateX(3px) rotate(4deg)}}
  .trastes{display:flex;gap:3px;margin-bottom:8px}
  .trastes span{flex:1;height:3px;background:rgba(243,236,230,.12)}
  .trastes span.ido{background:rgba(243,236,230,.4)}
  .trastes span.hoy{background:var(--cian);box-shadow:0 0 9px var(--cian);height:5px;margin-top:-1px}

  .rst{background:none;border:0;padding:0 2px;cursor:pointer;color:var(--ceniza);width:22px;height:20px;flex:0 0 auto}
  .rst svg{width:17px;height:17px;stroke-linecap:round;stroke-linejoin:round}
  .rst:hover{color:var(--sangre)}
  .modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.82);display:flex;
    align-items:center;justify-content:center;padding:22px;animation:chip .2s both}
  .modal .caja{max-width:340px;width:100%;background:linear-gradient(155deg,var(--humo),#0A0710);
    border-top:3px solid var(--sangre);padding:20px 18px;
    clip-path:polygon(0 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%)}
  .modal h3{margin:0 0 9px;font-size:30px;transform:skewX(-7deg);text-shadow:3px 3px 0 var(--sangre)}
  .modal p{margin:0 0 16px;font-size:13px;color:rgba(243,236,230,.82)}
  .modal .reiniciar{font-size:22px}

  /* luces en movimiento */
  .haz{transform-box:view-box}
  .haz.a{animation:barrido1 7s ease-in-out infinite}

function chispas(btn,col){

    const d=document.createElement('div');d.className='chispa';

    d.style.left=(r.left+r.width*Math.random())+'px';d.style.top=(r.top+r.height/2)+'px';

function aplausos(bien){
  if(!sonido)return;const x=ac();if(!x)return;const t=x.currentTime;
  if(bien){
    const n=x.createBuffer(1,x.sampleRate*2.2,x.sampleRate),d=n.getChannelData(0);
    for(let i=0;i<d.length;i++){const e=Math.min(1,i/8000)*Math.pow(1-i/d.length,.6);
      d[i]=(Math.random()*2-1)*e*(Math.random()<.06?1:.35)}
    const src=x.createBufferSource();src.buffer=n;
    const bp=x.createBiquadFilter();bp.type='bandpass';bp.frequency.value=2000;bp.Q.value=.7;
    const g=x.createGain();g.gain.value=.3;src.connect(bp);bp.connect(g);g.connect(x.destination);src.start(t);
  }else{
    [92,98,104].forEach((f,i)=>{const o=x.createOscillator(),g=x.createGain();o.type='sawtooth';
      o.frequency.setValueAtTime(f,t);o.frequency.linearRampToValueAtTime(f*.75,t+1.6);
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.09,t+.15);
      g.gain.exponentialRampToValueAtTime(.0001,t+1.7);o.connect(g);g.connect(x.destination);
      o.start(t+i*.05);o.stop(t+1.8)});
  }
}

function aplicar(ef){
  const a={publico:S.publico,forma:S.forma,union:S.union,verdad:S.verdad,caja:S.caja};
  const df=(ef.forma||0)+(ef.oficio||0)-(ef.desgaste||0)*0.8;
  let dv=(ef.verdad||0);
  if(S.quemados&&dv>0)dv=dv/2;                       // punto de no retorno
  S.publico=clamp(S.publico+(ef.publico||0));S.forma=clamp(S.forma+df);
  S.union=clamp(S.union+(ef.union||0));
  S.verdad=clamp(S.verdad+dv,-100,100);S.caja+=(ef.caja||0);
  if(S.verdad<=-50)S.quemados=true;
  ST.pubMax=Math.max(ST.pubMax||0,S.publico);
  if(S.caja>a.caja)ST.ganado+=S.caja-a.caja; else ST.gastado+=a.caja-S.caja;
  if(S.publico-a.publico>(ST.mejor?ST.mejor.d:0))ST.mejor={s:sem,d:Math.round(S.publico-a.publico)};
  ultDelta={publico:S.publico-a.publico,forma:S.forma-a.forma,union:S.union-a.union,verdad:S.verdad-a.verdad,caja:S.caja-a.caja};
}

    if(v)d.push(`<span class="d ${(k==='desgaste'?v<0:v>0)?'mas':'menos'}">${n} ${v>0?'+':''}${v}</span>`)});
  const c=Math.round(ultDelta.caja||0);
  d.push(`<span class="d ${c>=0?'mas':'menos'}">${c>=0?'+':'-'}$${Math.abs(c)}</span>`);
  return d.map((x,i)=>x.replace('class="d','style="animation-delay:'+(i*60)+'ms" class="d')).join('');
}
function salir(nombre,reponer){
  const f=banda.find(m=>m.nom===nombre)||banda[0];banda=banda.filter(m=>m!==f);ST.cambios++;
  if(reponer!==false&&banda.length>=2){const n=nuevaPersona(f.rol);banda.push(n);ST.elenco.add(n.nom);
    return ` Entra ${n.nom}, que ${n.vicio.t}.`}
  return ` Nadie ocupa el lugar de ${f.nom}.`;
}

function catastrofe(){
  const c=rnd(CAT),mp=mapaN();ST.cat++;aplicar(Object.assign({},c.ef));vidrio();racha=0;animo='pelea';sacudir();flota('x1',true);
  bitacora.push({s:sem,ev:pers(c.t,mp),op:'no lo eligieron'});
  const extra=c.salida?salir(mp.m,azar()<.7):"";
  pinta(hud()+`<div class="truss"><b></b><i></i><b></b></div><div class="flyer mal"><div class="cab alerta"><span class="ico">${ICO.calavera}</span><div class="kicker alerta">Semestre ${sem} · se pudrió todo</div></div>
    <h2 class="impact">${pers(c.t,mp)}</h2><div class="resultado">${pers(c.d,mp)}${extra}</div>
    <div class="deltas">${chips()}</div>${chequearHitos()}
    <button class="opt" id="seguir" style="animation-delay:.3s"><b>Levantarse igual</b></button></div>`);
  document.getElementById('seguir').onclick=avanzar;
}

function resolver(op,mp,ev){
  let ef={},txt=op.r||"",salida=op.salida;
  if(op.riesgo!==undefined){const forzado=armado;if(armado){armado=false;document.body.classList.remove('starpower')}
    const r=(forzado||azar()<op.riesgo)?op.ok:op.mal;ef=Object.assign({},r.ef);txt=r.r;if(r.salida)salida=true}
  else ef=Object.assign({},op.ef||{});
  if((ef.verdad||0)>0)ST.tr++; else if((ef.verdad||0)<0)ST.po++;
  const gastos=form.gasto*banda.length+Math.round((100-S.forma)*1.2);
  const trabajos=Math.max(0,Math.round(285-S.publico*3.6));
  const stream=Math.round(S.publico*3.2*(S.verdad<0?1.5:1));
  const shows=Math.round(S.publico*S.publico/14*(1+(banda.length-4)*0.07));
  ef.caja=(ef.caja||0)+trabajos+stream+shows-gastos;
  ef.forma=(ef.forma||0)-2;
  if((ef.publico||0)<=0)ef.publico=(ef.publico||0)-Math.round(S.publico*0.115);   // olvido
  if(S.union>45)ef.publico=(ef.publico||0)+Math.round(S.publico*0.05);
  if((ef.publico||0)>0)ef.publico=Math.round(ef.publico*Math.max(.38,1-S.publico/168));
  const deriva=-Math.min(4,Math.round(S.publico/34)+Math.round(Math.max(0,S.caja)/1700));
  ef.verdad=(ef.verdad||0)+deriva;
  const dv=Math.round((S.forma-55)/12);if(dv)ef.publico=(ef.publico||0)+dv;
  if(S.union<28)ef.publico=(ef.publico||0)-4;

  if(S.verdad<-55&&azar()<.5)ef.publico=(ef.publico||0)-4;
  if(op.cad&&!pendientes.some(x=>x.k===op.cad))pendientes.push({k:op.cad,s:sem+2});
  if(RIVAL)RIVAL.p=clamp(RIVAL.p+3+azar()*7-(S.publico>RIVAL.p?1:0));
  aplicar(ef);
  bitacora.push({s:sem,ev:pers(ev.t,mp),op:pers(op.tx,mp)});
  let extra="";
  if(salida)extra=salir(mp.m,op.reponer);
  if(op.entra){const n=nuevaPersona(rnd(ROLES));banda.push(n);ST.elenco.add(n.nom);ST.cambios++;extra=` Se suma ${n.nom}, que ${n.vicio.t}.`}
  const hh=chequearHitos();
  if(hh){brillo();SP=Math.min(100,SP+34)}
  const d=ultDelta,val=(d.publico||0)+(d.forma||0)+(d.union||0)+Math.abs(d.verdad||0)*.4+(d.caja||0)/240;
  const bien=val>=1.5, mult=multi();
  if(bien){racha++;mejorRacha=Math.max(mejorRacha,racha)}else if(val<=-1.5){racha=0}
  const gan=Math.max(0,Math.round(val*11))*mult;
  PTS+=gan;
  animo=hh||racha>=3?'festeja':S.union<30?'pelea':S.forma<28?'agotado':'toca';
  if(bien){riff();flota('+'+gan)}else if(val<=-1.5){vidrio();sacudir();flota('x1',true)}
  else suena();
  pinta(hud()+`<div class="truss"><b></b><i></i><b></b></div><div class="flyer"><div class="cab"><span class="ico">${iconoDe(ev.t)}</span><div class="kicker">Semestre ${sem}</div></div>
    <h2 class="impact">${pers(ev.t,mp)}</h2><div class="resultado">${pers(txt,mp)}${extra}</div>
    <div class="deltas">${chips()}</div>${hh}${titular()}
    <div class="balance">Semestre: ${(trabajos+stream+shows-gastos)>=0?'+':'-'}$${Math.abs(trabajos+stream+shows-gastos)} de operación</div>
    <button class="opt" id="seguir" style="animation-delay:.32s"><b>Semestre ${sem+1}</b></button></div>`);
  document.getElementById('seguir').onclick=avanzar;
}

function avanzar(){
  if(S.union<=0)return final('separacion');
  if(S.caja<-1100)return final('quiebra');
  if(S.forma<=0)return final('colapso');
  if(banda.length<2)return final('separacion');
  sem++;turno();
}



// ---------- sonido sintetizado ----------
let AC=null,sonido=true;
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function distor(x,k){const c=new Float32Array(1024);
  for(let i=0;i<1024;i++){const v=i*2/1024-1;c[i]=(1+k)*v/(1+k*Math.abs(v))}
  const w=x.createWaveShaper();w.curve=c;return w}
function riff(){
  if(!sonido)return;const x=ac();if(!x)return;const t=x.currentTime;
  const w=distor(x,14),lp=x.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2200;
  const g=x.createGain();g.gain.value=.0001;w.connect(lp);lp.connect(g);g.connect(x.destination);
  const acorde=[82.41,123.47,164.81],golpes=[0,.13,.26,.42];
  golpes.forEach((d,i)=>{acorde.forEach(f=>{
    const o=x.createOscillator();o.type='sawtooth';
    o.frequency.setValueAtTime(f*(i===3?1.5:1),t+d);o.connect(w);o.start(t+d);o.stop(t+d+(i===3?.6:.16))})});
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.16,t+.02);
  g.gain.setValueAtTime(.16,t+.9);g.gain.exponentialRampToValueAtTime(.0001,t+1.15);
}
function vidrio(){
  if(!sonido)return;const x=ac();if(!x)return;const t=x.currentTime;
  const n=x.createBuffer(1,x.sampleRate*.5,x.sampleRate),d=n.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);
  const src=x.createBufferSource();src.buffer=n;
  const hp=x.createBiquadFilter();hp.type='highpass';hp.frequency.value=2400;
  const g=x.createGain();g.gain.value=.28;src.connect(hp);hp.connect(g);g.connect(x.destination);
  src.start(t);
  for(let i=0;i<7;i++){const o=x.createOscillator(),gg=x.createGain();o.type='sine';
    o.frequency.value=1800+Math.random()*4200;const d2=Math.random()*.22;
    gg.gain.setValueAtTime(.07,t+d2);gg.gain.exponentialRampToValueAtTime(.0001,t+d2+.18);
    o.connect(gg);gg.connect(x.destination);o.start(t+d2);o.stop(t+d2+.2)}
}
function brillo(){
  if(!sonido)return;const x=ac();if(!x)return;const t=x.currentTime;
  [523.25,659.25,783.99,1046.5].forEach((f,i)=>{const o=x.createOscillator(),g=x.createGain();
    o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+i*.075);
    g.gain.exponentialRampToValueAtTime(.11,t+i*.075+.02);
    g.gain.exponentialRampToValueAtTime(.0001,t+i*.075+.5);
    o.connect(g);g.connect(x.destination);o.start(t+i*.075);o.stop(t+i*.075+.55)})}
function suena(){
  const d=ultDelta,pts=(d.publico||0)+(d.oficio||0)+(d.union||0)+(d.verdad||0)-(d.desgaste||0)/2+(d.caja||0)/220;
  if(pts>=1.5)riff(); else if(pts<=-1.5)vidrio();
}

// ---------- afiche descargable ----------
function ajusta(x,txt,max,base){let f=base;x.font=f+'px Impact, Haettenschweiler, "Arial Black", sans-serif';
  while(x.measureText(txt).width>max&&f>18){f-=4;x.font=f+'px Impact, Haettenschweiler, "Arial Black", sans-serif'}return f}
function dibujarPoster(titulo,rango,lado){
  const cv=document.getElementById('poster');if(!cv)return;
  const W=1080,H=1350;cv.width=W;cv.height=H;const x=cv.getContext('2d');
  x.fillStyle='#120A18';x.fillRect(0,0,W,H);
  let g=x.createRadialGradient(200,-60,20,200,-60,900);
  g.addColorStop(0,'rgba(255,35,80,.55)');g.addColorStop(1,'rgba(255,35,80,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
  g=x.createRadialGradient(900,-40,20,900,-40,820);
  g.addColorStop(0,'rgba(255,176,32,.4)');g.addColorStop(1,'rgba(255,176,32,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
  g=x.createRadialGradient(540,1420,40,540,1420,780);
  g.addColorStop(0,'rgba(138,99,255,.34)');g.addColorStop(1,'rgba(138,99,255,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.globalAlpha=.05;x.fillStyle='#fff';
  for(let i=0;i<2600;i++)x.fillRect(Math.random()*W|0,Math.random()*H|0,2,2);
  x.globalAlpha=1;
  x.fillStyle='#FF2350';x.fillRect(80,120,W-160,7);
  x.fillStyle='#8A7E92';x.font='26px Helvetica, Arial, sans-serif';
  x.fillText('2026 — '+(2026+Math.ceil(sem/2)),80,190);
  x.textAlign='right';x.fillText(rango.toUpperCase(),W-80,190);x.textAlign='left';
  const f=ajusta(x,nom,W-160,190);
  x.fillStyle='#F3ECE6';x.shadowColor='rgba(255,35,80,.6)';x.shadowBlur=50;
  x.fillText(nom,80,190+f*0.92);x.shadowBlur=0;
  let y=190+f*0.92+70;
  x.fillStyle='#FFB020';const f2=ajusta(x,titulo.toUpperCase(),W-160,64);
  x.fillText(titulo.toUpperCase(),80,y);y+=f2+50;
  x.fillStyle='#8A7E92';x.font='27px Helvetica, Arial, sans-serif';
  x.fillText('EN VIVO', 80, y); y+=44;
  x.fillStyle='#F3ECE6';x.font='31px Helvetica, Arial, sans-serif';
  banda.forEach(m=>{x.fillText(m.nom+'   '+m.rol,80,y);y+=44});
  y+=26;x.fillStyle='#8A7E92';x.font='27px Helvetica, Arial, sans-serif';x.fillText('HITOS',80,y);y+=42;
  x.font='29px Helvetica, Arial, sans-serif';x.fillStyle='#F3ECE6';
  (logros.length?logros:[{t:'Ninguno'}]).slice(0,6).forEach(h=>{x.fillText('· '+h.t,80,y);y+=40});
  x.fillStyle='#8A7E92';x.font='25px Helvetica, Arial, sans-serif';
  x.fillText('Público '+Math.round(S.publico)+'   Forma '+Math.round(S.forma)+'   Unión '+Math.round(S.union)+'   Eje '+Math.round(S.verdad),80,H-110);
  x.fillText('Caja $'+S.caja+'   ·   '+ST.elenco.size+' integrantes   ·   '+PTS+' puntos   ·   racha '+mejorRacha,80,H-72);
  x.save();x.translate(W-215,H-235);x.rotate(-.22);
  x.strokeStyle=lado==='TRUE'?'#8A63FF':lado==='POSER'?'#FF2350':'#8A7E92';
  x.lineWidth=7;x.strokeRect(-135,-62,270,124);
  x.fillStyle=x.strokeStyle;x.textAlign='center';
  x.font='84px Impact, Haettenschweiler, "Arial Black", sans-serif';
  x.fillText(lado==='TRUE'?'TRUE':lado==='POSER'?'POSER':'NI AHI',0,28);x.restore();
}

let FIN={};
async function compartirPoster(){
  const cv=document.getElementById('poster');if(!cv)return;
  const txt=`${nom} — ${FIN.titulo}. Público ${Math.round(S.publico)}, lado ${FIN.lado}, ${logros.length} hitos en ${sem} semestres. #TrueOPoser`;
  cv.toBlob(async b=>{
    const f=new File([b],'afiche.png',{type:'image/png'});
    try{
      if(navigator.canShare&&navigator.canShare({files:[f]})){
        await navigator.share({files:[f],title:nom,text:txt});return}
      if(navigator.share){await navigator.share({title:nom,text:txt});return}
      throw 0;
    }catch(e){
      try{await navigator.clipboard.writeText(txt);avisar('Texto copiado. El afiche se descargó.')}
      catch(e2){avisar('El afiche se descargó.')}
      bajarPoster();
    }
  });
}
function avisar(t){const d=document.createElement('div');d.className='tostada';d.textContent=t;
  document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function bajarPoster(){
  const cv=document.getElementById('poster');if(!cv)return;
  cv.toBlob(b=>{const u=URL.createObjectURL(b),a=document.createElement('a');
    a.href=u;a.download=nom.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-afiche.png';
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)});
}
function final(motivo){
  const p=S.publico,v=S.verdad;let rango,titulo,texto;
  if(motivo==='separacion'){rango="Se cortó antes";titulo="Se separaron";
    texto=`${nom} duró ${sem} semestres. El grupo de mensajes quedó en silencio y después ya fue tarde.`}
  else if(motivo==='quiebra'){rango="Se cortó antes";titulo="Fundidos";
    texto=`Vendieron el equipo para pagar la camioneta. La última fecha fue en la casa de un amigo, a la gorra.`}
  else if(motivo==='colapso'){rango="Se cortó antes";titulo="El cuerpo dijo basta";
    texto=`Seis años de ruta terminaron en una internación y una banda en pausa indefinida.`}
  else if(p>=92&&v>=55&&S.union>=60){rango="Lo máximo que se puede";titulo="La noche que se estudia";
    texto=`${nom} cierra el sábado, y esa noche entra en la lista corta de shows que la gente cita como el mejor que vio. Ciento veinte mil personas, la formación casi intacta, y ni una sola concesión de la que arrepentirse. Casi ninguna banda llega hasta acá.`}
  else if(p>=88&&v>=45){rango="Cabeza de cartel";titulo="Rock in Rio, cierre de la noche";
    texto=`${nom} cierra el sábado. Cien mil personas cantan canciones que salieron de una sala de ensayo, y llegaron ahí sin deberle nada a nadie que no fuera su público.`}
  else if(p>=84&&v<=-30){rango="Arriba y de mentira";titulo="Cartel de un festival de marca";
    texto=`${nom} cierra un festival con nombre de bebida energética. Rock in Rio los tuvo en la lista corta y eligió a otros: la curaduría los leyó como lo que son ahora.`}
  else if(p>=76){rango="Casi arriba";titulo="Anteúltimos en el cartel";
    texto=`${nom} toca a las nueve, justo antes del número principal. Es enorme y es una espina clavada.`}
  else if(p>=60&&v>=35){rango="Banda de culto";titulo="Respetadas y sin cartel";
    texto=`${nom} llena teatros en seis ciudades y no entra en ningún festival grande. Las bandas nuevas las citan como influencia.`}
  else if(p>=60&&v<=-25){rango="Poser con hits";titulo="Banda de televisión";
    texto=`${nom} tiene tres canciones que conoce todo el mundo y ningún crítico que las defienda. En el bar donde empezaron tienen prohibida la entrada, medio en broma.`}
  else if(p>=60){rango="Circuito grande";titulo="Banda de festival del mediodía";
    texto=`${nom} está en todos los carteles, siempre en letra mediana. Viven de esto y nunca terminan de dar el salto.`}
  else if(p>=22&&p<32){rango="Del barrio";titulo="La banda del bar de siempre";
    texto=`${nom} toca cada dos meses en el mismo lugar, para las mismas ochenta personas, que son buenísimas.`}
  else if(p>=32){rango="Circuito";titulo="Banda de sala mediana";
    texto=`${nom} llena trescientas localidades dos veces al año. Todos tienen otro trabajo y ninguno lo cambiaría.`}
  else if(S.union>=80){rango="Nunca se separaron";titulo="La banda que sigue ensayando";
    texto=`${nom} nunca salió del circuito chico y nunca dejó de tocar. La misma gente en la misma sala, los martes.`}
  else if(S.forma>=85){rango="Banda de músicos";titulo="Los que admiran los otros músicos";
    texto=`${nom} toca de manera extraordinaria para muy poca gente. Los conocen todos los que están arriba de un escenario.`}
  else{rango="Final del camino";titulo="Se apagó despacio";
    texto=`${nom} nunca salió del bar de la esquina. Un día ${rnd(banda).nom} vendió el amplificador para pagar el alquiler.`}
  const lado=v>=35?"TRUE":v<=-35?"POSER":"ni una cosa ni la otra";
  const sinver=EV.length-vistos.size;
  const est=PTS>=5200?5:PTS>=3700?4:PTS>=2600?3:PTS>=1600?2:1;
  aplausos(est>=3);
  app.innerHTML=`<div class="afiche">
   <div class="puntuacion">
     <div class="estrellas">${[1,2,3,4,5].map(i=>`<span class="${i<=est?'on':''}" style="animation-delay:${i*.13}s">${ICO.estrella}</span>`).join('')}</div>
     <div class="ptotal nu" data-k="fin" data-a="0" data-b="${PTS}">0</div>
     <div class="pdet">puntos · mejor racha ${mejorRacha} · ${logros.length} hitos</div>
   </div>
   <div class="cabf"><span class="rank">${rango}</span><span class="an">2026 — ${2026+Math.ceil(sem/2)}</span></div>
   <div class="nb impact">${nom}</div>
   <h2 class="impact">${titulo}</h2>
   <p class="texto">${texto}</p>
   <div class="cifras">Público <b>${Math.round(p)}</b> · Forma <b>${Math.round(S.forma)}</b> · Unión <b>${Math.round(S.union)}</b> · Eje <b>${Math.round(v)}</b> ${lado} · Caja <b>$${S.caja}</b></div>
   <div class="cifras b">${RIVAL?`${RIVAL.nom} terminó en <b>${Math.round(RIVAL.p)}</b> · `:''}Pico <b>${Math.round(ST.pubMax)}</b> · entró <b>$${ST.ganado}</b> · true/poser <b>${ST.tr}/${ST.po}</b> · desastres <b>${ST.cat}</b> · pasaron <b>${ST.elenco.size}</b> · hitos <b>${logros.length}/${HITOS.length}</b></div>
   <details class="linea"><summary>Hitos y bitácora</summary>
     <div class="lgs">${logros.length?logros.map(h=>`<span class="lg">${h.t}</span>`).join(''):'<span class="lg vacio">Ningún hito.</span>'}</div>
     <ol>${bitacora.map(b=>`<li><span>${b.s}</span> ${b.ev}: <b>${b.op}</b></li>`).join('')}</ol>
     <div class="noviste">Quedaron ${sinver} eventos sin vivir. Formación final: ${banda.map(m=>m.nom).join(', ')}.</div></details>
   <div class="posterbox"><canvas id="poster"></canvas></div>
   <button class="reiniciar" id="compartir">Compartir el afiche</button>
   <div class="botones"><button class="reiniciar alt" id="bajar">Guardar</button><button class="reiniciar alt" id="otra">Otra banda</button></div>
   </div>`;
  FIN={titulo,rango,lado};prevN={};animarNums();dibujarPoster(titulo,rango,lado);
  document.getElementById('compartir').onclick=compartirPoster;
  document.getElementById('bajar').onclick=bajarPoster;
  document.getElementById('otra').onclick=nuevo;scrollTo(0,0);
}
nuevo();
</script>
