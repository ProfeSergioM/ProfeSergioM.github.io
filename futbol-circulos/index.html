<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Prototipo de fútbol</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
html, body {
  width:100%; height:100%; overflow:hidden; background:#0a0a0a;
  touch-action:none; font-family:Arial,Helvetica,sans-serif;
}
canvas { display:block; }

#ayuda {
  position:fixed; top:14px; left:0; right:0; text-align:center; pointer-events:none;
  color:rgba(255,255,255,.75); font-size:12px; z-index:5; padding:0 10px;
}

/* Cartel de "¡GOL!" al anotar */
#gol {
  position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
  pointer-events:none; z-index:6; opacity:0; transition:opacity .15s;
}
#gol span {
  font-size:clamp(40px,12vw,90px); font-weight:900; color:#FFD54A;
  text-shadow:0 0 14px rgba(0,0,0,.8), 0 0 30px rgba(255,213,74,.6);
  letter-spacing:.04em; transform:rotate(-6deg);
}
#gol.mostrar { opacity:1; }

/* Controles en pantalla */
.control { position:fixed; z-index:8; }
#joystick {
  left:22px; bottom:22px; width:120px; height:120px; border-radius:50%;
  background:rgba(255,255,255,.10); border:2px solid rgba(255,255,255,.35);
}
#joystick-stick {
  position:absolute; left:50%; top:50%; width:52px; height:52px; border-radius:50%;
  background:rgba(255,255,255,.55); transform:translate(-50%,-50%);
}
#btn-patear {
  right:26px; bottom:34px; width:92px; height:92px; border-radius:50%;
  background:rgba(255,213,74,.85); border:2px solid rgba(0,0,0,.3);
  color:#1a1a1a; font-weight:bold; font-size:14px;
}
#btn-pasar {
  right:118px; bottom:58px; width:76px; height:76px; border-radius:50%;
  background:rgba(79,224,192,.85); border:2px solid rgba(0,0,0,.3);
  color:#0a2a22; font-weight:bold; font-size:13px;
}
#btn-reiniciar {
  top:14px; right:14px; padding:9px 14px; border-radius:8px; border:2px solid rgba(255,255,255,.4);
  background:rgba(0,0,0,.5); color:#fff; font-weight:bold; font-size:12px;
}
#btn-parametros {
  top:14px; right:100px; padding:9px 14px; border-radius:8px; border:2px solid rgba(255,255,255,.4);
  background:rgba(0,0,0,.5); color:#fff; font-weight:bold; font-size:12px;
}
.control:active { filter:brightness(1.25); }

/* Barra de carga del tiro: se llena mientras se mantiene presionado patear.
   Dorado hasta la mitad (precisión intacta), rojo en la otra mitad (precisión cae). */
#barra-carga-tiro {
  position:fixed; right:26px; bottom:132px; width:92px; height:8px; border-radius:4px;
  overflow:hidden; z-index:8; pointer-events:none; opacity:0; transition:opacity .1s;
  background:linear-gradient(to right, #FFD54A 0%, #FFD54A 50%, #FF5C5C 100%);
  border:1px solid rgba(0,0,0,.4);
}
#barra-carga-tiro.activa { opacity:1; }
#barra-carga-tiro-cubierta { position:absolute; top:0; right:0; height:100%; width:100%; background:rgba(0,0,0,.6); }

/* Barra de carga del pase: mismo mecanismo, pero sin penalidad de precisión (un solo color). */
#barra-carga-pase {
  position:fixed; right:118px; bottom:142px; width:76px; height:8px; border-radius:4px;
  overflow:hidden; z-index:8; pointer-events:none; opacity:0; transition:opacity .1s;
  background:#4FE0C0; border:1px solid rgba(0,0,0,.4);
}
#barra-carga-pase.activa { opacity:1; }
#barra-carga-pase-cubierta { position:absolute; top:0; right:0; height:100%; width:100%; background:rgba(0,0,0,.6); }

/* Una sola caja de stats, compartida por los 3 jugadores del equipo, lo más arriba posible */
#panel-stats {
  position:fixed; top:56px; left:10px;
  width:130px; background:rgba(0,0,0,.55); color:#fff; border-radius:10px;
  padding:9px 10px; font-size:11px; z-index:5; pointer-events:none;
}
#panel-stats h3 { font-size:12px; margin-bottom:7px; opacity:.9; }
/* Atributos fijos (no se gastan): solo nombre y valor, sin barra */
.stat-fila-simple { display:flex; justify-content:space-between; opacity:.85; margin-bottom:3px; }
.stat-fila-simple .stat-valor { color:#fff; font-weight:bold; }
/* Aguante y energía de sprint: del jugador que tiene la pelota (o el activo, si está suelta).
   Comparten una sola barra: el aguante es la capa de base y la energía de sprint (que nunca
   puede superarlo) se dibuja encima, de otro color. */
.stat-fila { margin-top:8px; padding-top:7px; border-top:1px solid rgba(255,255,255,.15); }
.stat-fila .stat-nombre { display:flex; justify-content:space-between; opacity:.85; margin-bottom:3px; }
.stat-fila .stat-nombre.chica { font-size:9px; opacity:.7; margin-top:4px; margin-bottom:0; }
.stat-barra { position:relative; height:7px; border-radius:3px; background:rgba(255,255,255,.18); overflow:hidden; }
.stat-relleno { position:absolute; left:0; top:0; height:100%; }
.stat-relleno.aguante { background:#FFB454; }
.stat-relleno.sprint { background:#5AD1FF; }

/* Panel con las variables/constantes del motor que estamos afinando: arranca oculto,
   el botón "Vars" lo muestra/oculta. */
#panel-parametros {
  position:fixed; top:34px; left:50%; transform:translateX(-50%);
  max-width:min(92vw, 600px); background:rgba(0,0,0,.5); color:rgba(255,255,255,.85);
  border-radius:8px; padding:6px 10px; font-size:10px; z-index:5; pointer-events:none;
  display:flex; flex-wrap:wrap; gap:3px 12px; justify-content:center;
}
#panel-parametros[hidden] { display:none; }
#panel-parametros b { color:#fff; }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ayuda">Flechas: moverse (Shift: correr) · A (mantener): cargar tiro · S (mantener): cargar pase · Goles: <span id="goles">0</span></div>
<div id="gol"><span>¡GOL!</span></div>
<div id="panel-parametros" hidden></div>
<div id="panel-stats"><h3>Stats del equipo</h3></div>
<button id="btn-parametros" class="control" type="button">Vars</button>
<button id="btn-reiniciar" class="control" type="button">Reiniciar</button>
<div id="joystick" class="control"><div id="joystick-stick"></div></div>
<div id="barra-carga-pase"><div id="barra-carga-pase-cubierta"></div></div>
<button id="btn-pasar" class="control" type="button">Pasar</button>
<div id="barra-carga-tiro"><div id="barra-carga-tiro-cubierta"></div></div>
<button id="btn-patear" class="control" type="button">Patear</button>

<script>
(function(){
"use strict";

// ── Cámara: cuánto del mundo se ve horizontalmente ───────────
// En PC, el ancho de la ventana suele ser mucho mayor que el de una pantalla táctil, así que con
// el mismo VIEW_W el juego se veía muy de cerca (mismo ancho en unidades repartido en muchos más
// píxeles = más zoom). Por eso en PC se usa un VIEW_W más grande (se ve más cancha a la vez).
const VIEW_W = 950;             // táctil (celular/tablet)
const VIEW_W_ESCRITORIO = 1400; // PC

// ── Atributos de jugador (escala 0-100: 0 nulo, 100 el máximo de diseño) ──
const VEL_DISENO_MAX = 260;    // unidades/seg cuando velocidad=100
const ACEL_DISENO_MAX = 1400;  // unidades/seg² cuando aceleración=100
// "Agilidad" (statsComunes.agilidad) por ahora no maneja nada: manejaba qué tan rápido giraba la
// mirada del jugador, pero eso ahora es instantáneo (ver actualizarJugador) para no dejar un
// arco incómodo en cómo la pelota sigue al jugador al dominarla. Se deja el stat en el equipo por
// si más adelante se le encuentra otro uso.

// Control: qué tan pegada al jugador queda la pelota al dominarla.
const CONTROL_OFFSET_MIN = 42, CONTROL_OFFSET_MAX = 60;   // distancia pelota-jugador, en la dirección hacia la que mira
const CONTROL_FIRMEZA_MIN = 3, CONTROL_FIRMEZA_MAX = 14;  // qué tan rápido "alcanza" esa posición (más alto = más pegada)
// Radio de recepción: no hace falta que la pelota vaya directo al jugador para que la reciba,
// alcanza con que pase a menos de esta cantidad de "radios suyos" de distancia.
const RADIO_RECEPCION_FACTOR = 2;

// Atributos del equipo (0-100 cada uno): los comparten los 3 jugadores, no son individuales.
const statsComunes = {
  velocidad:100, agilidad:100, aceleracion:100, control:100, sprint:100, resistencia:100,
  potenciaTiro:100, precisionTiro:100, precisionPase:100
};

function crearJugador(color, oscuro){
  return {
    color, oscuro, x:0, y:0, vx:0, vy:0, dirX:1, dirY:0, r:26,
    // Recursos de fatiga: estos sí son individuales, cada jugador se cansa por su cuenta.
    energiaSprint:100, aguante:100
  };
}

// ── Estado ──────────────────────────────────────────────────
const players = [
  crearJugador("#4FA3FF", "#1E62B0"),
  crearJugador("#4FA3FF", "#1E62B0"),
  crearJugador("#4FA3FF", "#1E62B0")
];

// ── Caja de stats, única para todo el equipo (no se gastan: se muestran como número, sin barra) ──
const STATS_MOSTRADAS = [
  ["velocidad","Velocidad"], ["agilidad","Agilidad"], ["aceleracion","Aceleración"], ["control","Control"],
  ["sprint","Sprint"], ["resistencia","Resistencia"],
  ["potenciaTiro","Potencia tiro"], ["precisionTiro","Precisión tiro"], ["precisionPase","Precisión pase"]
];
function crearFilaSimple(contenedor, etiqueta){
  const fila = document.createElement("div"); fila.className = "stat-fila-simple";
  fila.innerHTML = `<span>${etiqueta}</span><span class="stat-valor"></span>`;
  contenedor.appendChild(fila);
  return { valor: fila.querySelector(".stat-valor") };
}
const filasPanelStats = (() => {
  const contenedor = document.getElementById("panel-stats");
  const filas = {};
  STATS_MOSTRADAS.forEach(([clave, etiqueta]) => { filas[clave] = crearFilaSimple(contenedor, etiqueta); });
  return filas;
})();
function actualizarPanelStats(){
  STATS_MOSTRADAS.forEach(([clave]) => {
    filasPanelStats[clave].valor.textContent = Math.round(statsComunes[clave]);
  });
}

// Aguante y energía de sprint: a diferencia de los atributos de arriba, estos sí son
// individuales y cambian jugando, así que van con barra y se actualizan cada cuadro. Muestran
// los del jugador que tiene la pelota (o el activo, si está suelta). Comparten una sola barra:
// el aguante es la base, y la energía de sprint (que nunca la supera) se dibuja encima.
function crearFilaFatiga(contenedor){
  const fila = document.createElement("div"); fila.className = "stat-fila";
  const nombreAguante = document.createElement("div"); nombreAguante.className = "stat-nombre";
  nombreAguante.innerHTML = `<span>Aguante</span><span class="stat-valor"></span>`;
  const barra = document.createElement("div"); barra.className = "stat-barra";
  const rellenoAguante = document.createElement("div"); rellenoAguante.className = "stat-relleno aguante";
  const rellenoSprint = document.createElement("div"); rellenoSprint.className = "stat-relleno sprint";
  barra.appendChild(rellenoAguante); barra.appendChild(rellenoSprint);
  const nombreSprint = document.createElement("div"); nombreSprint.className = "stat-nombre chica";
  nombreSprint.innerHTML = `<span>Energía sprint</span><span class="stat-valor"></span>`;
  fila.appendChild(nombreAguante); fila.appendChild(barra); fila.appendChild(nombreSprint);
  contenedor.appendChild(fila);
  return {
    valorAguante: nombreAguante.querySelector(".stat-valor"), rellenoAguante,
    valorSprint: nombreSprint.querySelector(".stat-valor"), rellenoSprint
  };
}
const filaFatiga = crearFilaFatiga(document.getElementById("panel-stats"));
function actualizarBarraFatiga(){
  const jugador = players[conPelota !== null ? conPelota : activo];
  const aguante = Math.max(0, Math.min(100, jugador.aguante));
  const sprint = Math.max(0, Math.min(100, jugador.energiaSprint));
  filaFatiga.valorAguante.textContent = Math.round(aguante);
  filaFatiga.rellenoAguante.style.width = aguante + "%";
  filaFatiga.valorSprint.textContent = Math.round(sprint);
  filaFatiga.rellenoSprint.style.width = sprint + "%";
}

let activo = 0;
let conPelota = null; // índice del jugador que domina la pelota, o null si está suelta
let conPelotaRivalIdx = null; // índice (en rivales) de quién la domina, o null (ver colisionRivalJugadores)
let ultimoPateador = null; // evita que quien la pateó/pasó la recupere antes de que realmente se aleje
// Mientras la pelota va camino a un compañero, este se acomoda un poco hacia donde se movía
// quien se la envió, para ayudar a recibirla (ver actualizarIA).
let direccionEnvio = null;    // {x,y} dirección de quien pateó/pasó, al momento de soltar la pelota
let baseReceptores = null;    // posición de cada compañero al momento del envío, para no alejarlos más de la cuenta

// Pintas de la pelota: puntos fijos sobre una esfera unitaria (marco propio de la pelota).
// z>0 mira hacia la cámara (arriba); z<=0 queda del otro lado y no se dibuja.
// Se reparten con una espiral de Fibonacci: es la forma más simple de distribuir puntos
// de manera pareja sobre una esfera, así la cobertura de pintas queda regular y sin huecos.
const PINTAS_CANTIDAD = 34, PINTAS_TAM = 0.26;
const ANGULO_DORADO = Math.PI * (3 - Math.sqrt(5));
function crearPatronPelota(){
  const puntos = [];
  for (let i = 0; i < PINTAS_CANTIDAD; i++) {
    const z = 1 - (2*i + 1) / PINTAS_CANTIDAD;
    const radio = Math.sqrt(1 - z*z);
    const az = i * ANGULO_DORADO;
    puntos.push({ x: radio*Math.cos(az), y: radio*Math.sin(az), z, tam: PINTAS_TAM });
  }
  return puntos;
}

const ball = { x:-120, y:0, vx:0, vy:0, r:15*0.75, patron: crearPatronPelota() };
const camera = { x:0, y:0 };

// Formación inicial de los 3 jugadores del equipo (en triángulo, alrededor del punto de saque).
const FORMACION_INICIAL = [
  { x:-200, y:0, dirX:1, dirY:0 },
  { x:0, y:-150, dirX:0, dirY:1 },
  { x:200, y:0, dirX:-1, dirY:0 }
];

// ── Rivales (marcan de cerca, cubren líneas de pase e interceptan pases en el aire; nada más:
// no presionan en bloque ni atacan al arco propio) ──
const rivales = [
  crearJugador("#E64A4A", "#B23030"),
  crearJugador("#E64A4A", "#B23030")
];
const RIVALES_FORMACION_INICIAL = [
  { x:180, y:70, dirX:-1, dirY:0 },
  { x:180, y:-70, dirX:-1, dirY:0 }
];
// "Control" de cada rival para disputar la pelota al chocar con el portador (ver colisionRivalJugadores):
// el equipo usa su stat compartido "control", los rivales usan este valor fijo. Con el default de
// ambos (100 y 50) el equipo se queda con la pelota 2 de cada 3 disputas.
const RIVAL_CONTROL = 50;

function posicionInicial(){
  players.forEach((p, i) => {
    const f = FORMACION_INICIAL[i];
    p.x = f.x; p.y = f.y; p.vx = 0; p.vy = 0; p.dirX = f.dirX; p.dirY = f.dirY;
    p.energiaSprint = 100; p.aguante = 100;
  });
  camera.x = players[0].x; camera.y = players[0].y;
  ball.x = -120; ball.y = 0; ball.vx = ball.vy = 0;
  ball.patron = crearPatronPelota();
  activo = 0;
  conPelota = null;
  conPelotaRivalIdx = null;
  conPelotaArquero = false;
  autopilotRestante = 0;
  ultimoPateador = null;
  direccionEnvio = null;
  baseReceptores = null;
  chocando = new Set();
  chocandoRival = new Set();
  cargandoTiro = false;
  tiempoCargaTiro = 0;
  barraCargaTiro.classList.remove("activa");
  cargandoPase = false;
  tiempoCargaPase = 0;
  barraCargaPase.classList.remove("activa");
  mallaAbultamiento = null;
  rivales.forEach((r, i) => {
    const f = RIVALES_FORMACION_INICIAL[i];
    r.x = f.x; r.y = f.y; r.vx = 0; r.vy = 0; r.dirX = f.dirX; r.dirY = f.dirY;
  });
  arquero.x = ARQUERO_INICIAL.x; arquero.y = ARQUERO_INICIAL.y; arquero.vx = 0; arquero.vy = 0;
  arquero.dirX = ARQUERO_INICIAL.dirX; arquero.dirY = ARQUERO_INICIAL.dirY;
}

// ── Entradas: teclado ───────────────────────────────────────
const teclas = Object.create(null);
window.addEventListener("keydown", e => {
  teclas[e.key.toLowerCase()] = true;
  if (e.key.toLowerCase() === "a" && !e.repeat) { e.preventDefault(); iniciarCargaTiro(); }
  if (e.key.toLowerCase() === "s" && !e.repeat) { e.preventDefault(); iniciarCargaPase(); }
});
window.addEventListener("keyup", e => {
  teclas[e.key.toLowerCase()] = false;
  if (e.key.toLowerCase() === "a") soltarTiro();
  if (e.key.toLowerCase() === "s") soltarPase();
});

function direccionTeclado(){
  let dx = 0, dy = 0;
  if (teclas["arrowleft"]) dx -= 1;
  if (teclas["arrowright"]) dx += 1;
  if (teclas["arrowup"]) dy -= 1;
  if (teclas["arrowdown"]) dy += 1;
  return { dx, dy };
}

// ── Entradas: joystick táctil ────────────────────────────────
const joyBase = document.getElementById("joystick");
const joyStick = document.getElementById("joystick-stick");
let joyVec = { dx:0, dy:0 };
let joyPointerId = null;

function joyDesdeEvento(e){
  const rect = joyBase.getBoundingClientRect();
  const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
  const max = rect.width/2;
  let dx = e.clientX - cx, dy = e.clientY - cy;
  const dist = Math.hypot(dx, dy) || 1;
  const clamp = Math.min(dist, max);
  dx = dx/dist*clamp; dy = dy/dist*clamp;
  joyStick.style.transform = `translate(${dx - 26}px, ${dy - 26}px)`;
  joyVec.dx = dx/max; joyVec.dy = dy/max;
  joyStick.style.background = marchaDesdeMagnitud(dist/max).color;
}
function joySoltar(){
  joyPointerId = null; joyVec.dx = 0; joyVec.dy = 0;
  joyStick.style.transform = "translate(-50%,-50%)";
  joyStick.style.background = "";
}
joyBase.addEventListener("pointerdown", e => { joyPointerId = e.pointerId; joyBase.setPointerCapture(e.pointerId); joyDesdeEvento(e); });
joyBase.addEventListener("pointermove", e => { if (e.pointerId === joyPointerId) joyDesdeEvento(e); });
joyBase.addEventListener("pointerup", joySoltar);
joyBase.addEventListener("pointercancel", joySoltar);

// ── Botones ───────────────────────────────────────────────
document.getElementById("btn-patear").addEventListener("pointerdown", e => { e.preventDefault(); iniciarCargaTiro(); });
document.getElementById("btn-pasar").addEventListener("pointerdown", e => { e.preventDefault(); iniciarCargaPase(); });
window.addEventListener("pointerup", () => { if (cargandoTiro) soltarTiro(); if (cargandoPase) soltarPase(); });
document.getElementById("btn-reiniciar").addEventListener("pointerdown", e => {
  e.preventDefault();
  posicionInicial();
  golesAnotados = 0;
  spanGoles.textContent = golesAnotados;
});
document.getElementById("btn-parametros").addEventListener("pointerdown", e => {
  e.preventDefault();
  const panel = document.getElementById("panel-parametros");
  panel.hidden = !panel.hidden;
});

// Potencia de tiro/pase: velocidad de la pelota cuando la carga llega al 100%.
const PASE_POTENCIA_DISENO_MAX = 600; // el pase no tiene stat de potencia: la maneja la carga
const TIRO_POTENCIA_DISENO_MAX = PASE_POTENCIA_DISENO_MAX * 3; // el tiro debe ser bastante más fuerte que el pase
// Precisión: cuánto puede desviarse (en radianes) la patada de hacia donde mira el jugador,
// cuando la precisión efectiva es 0. Con 100 no hay desvío.
const TIRO_PRECISION_ERROR_MAX = Math.PI / 6;  // 30°
const PASE_PRECISION_ERROR_MAX = Math.PI / 9;  // 20°

// Carga del tiro: mantener presionado patear llena una barra en TIRO_CARGA_DURACION segundos.
// Hasta la mitad de la carga, controla la potencia y la precisión queda intacta (100% del stat).
// Pasada la mitad, se sigue ganando potencia, pero la precisión cae del 100% al 50% del stat.
const TIRO_CARGA_DURACION = 0.5; // segundos para cargar al máximo
let cargandoTiro = false;
let tiempoCargaTiro = 0;

const barraCargaTiro = document.getElementById("barra-carga-tiro");
const barraCargaTiroCubierta = document.getElementById("barra-carga-tiro-cubierta");

function iniciarCargaTiro(){
  if (conPelota !== activo) return; // sin la pelota no hay nada que cargar
  cargandoTiro = true;
  tiempoCargaTiro = 0;
  barraCargaTiro.classList.add("activa");
  barraCargaTiroCubierta.style.width = "100%";
}

function soltarTiro(){
  if (!cargandoTiro) return;
  cargandoTiro = false;
  barraCargaTiro.classList.remove("activa");
  patear(tiempoCargaTiro / TIRO_CARGA_DURACION);
}

// Carga del pase: mismo mecanismo que el tiro, pero sin penalidad de precisión (la precisión
// siempre depende del stat "precisionPase", cargues lo que cargues). Sirve para poder dosificar
// la potencia y así habilitar pases cortos: una carga breve alcanza para un pase de cerca.
const PASE_CARGA_DURACION = 0.25; // segundos para cargar al máximo
// Aunque se suelte al instante (carga=0), el pase nunca sale con menos de este % de potencia:
// evita que un toque brevísimo deje la pelota prácticamente sin moverse.
const PASE_CARGA_MINIMA = 0.33;
let cargandoPase = false;
let tiempoCargaPase = 0;

const barraCargaPase = document.getElementById("barra-carga-pase");
const barraCargaPaseCubierta = document.getElementById("barra-carga-pase-cubierta");

function iniciarCargaPase(){
  if (conPelota !== activo) return;
  cargandoPase = true;
  tiempoCargaPase = 0;
  barraCargaPase.classList.add("activa");
  barraCargaPaseCubierta.style.width = "100%";
}

function soltarPase(){
  if (!cargandoPase) return;
  cargandoPase = false;
  barraCargaPase.classList.remove("activa");
  pasar(tiempoCargaPase / PASE_CARGA_DURACION);
}

// Registra hacia dónde se movía quien soltó la pelota, para que los compañeros se acomoden un poco (ver actualizarIA).
function registrarEnvio(p){
  direccionEnvio = { x: p.dirX, y: p.dirY };
  baseReceptores = players.map(j => ({ x: j.x, y: j.y }));
}

// Patea con la carga [0,1] alcanzada. La potencia escala con toda la carga; la precisión se
// mantiene al 100% del stat hasta la mitad de la carga, y de ahí en más baja hasta el 50% del stat.
function patear(carga){
  if (conPelota !== activo) return;
  const p = players[activo];
  const factorPrecision = carga <= 0.5 ? 1 : (1.5 - carga);
  const potencia = TIRO_POTENCIA_DISENO_MAX * (statsComunes.potenciaTiro / 100) * carga;
  const precisionEfectiva = statsComunes.precisionTiro * factorPrecision;
  const error = (1 - precisionEfectiva / 100) * TIRO_PRECISION_ERROR_MAX * (Math.random() * 2 - 1);
  const angulo = Math.atan2(p.dirY, p.dirX) + error;
  ball.vx += Math.cos(angulo) * potencia;
  ball.vy += Math.sin(angulo) * potencia;
  conPelota = null;
  ultimoPateador = activo;
  registrarEnvio(p);
}

// Pasa con la carga [0,1] alcanzada: la potencia escala con la carga, entre PASE_CARGA_MINIMA
// (aunque se suelte al instante) y el máximo; la precisión no cambia con la carga, siempre
// depende de "precisionPase".
function pasar(carga){
  if (conPelota !== activo) return;
  const p = players[activo];
  const potencia = PASE_POTENCIA_DISENO_MAX * (PASE_CARGA_MINIMA + (1 - PASE_CARGA_MINIMA) * carga);
  const error = (1 - statsComunes.precisionPase / 100) * PASE_PRECISION_ERROR_MAX * (Math.random() * 2 - 1);
  const angulo = Math.atan2(p.dirY, p.dirX) + error;
  ball.vx += Math.cos(angulo) * potencia;
  ball.vy += Math.sin(angulo) * potencia;
  conPelota = null;
  registrarEnvio(p);
  ultimoPateador = activo;
  // Si nadie recibe antes (p. ej. lo intercepta el rival), el foco vuelve a cambiar cuando la
  // pelota efectivamente llegue a otro jugador (ver actualizarPosesion).
  cambioDeJugadorAsistido(p, angulo);
}

// "Cambio de jugador asistido": si el pase apunta a un compañero que queda más lejos que el
// doble del radio de recepción (el mismo que ya usa actualizarPosesion para detectar que alguien
// la recibió: RADIO_RECEPCION_FACTOR×r), el control salta de inmediato a ese compañero, en vez de
// esperar a que la pelota le llegue físicamente. Para pases cortos (al doble de radio o menos) no
// hace nada: seguís controlando a quien pateó.
//
// Apenas ocurre el cambio, el receptor todavía no está bajo control real: el humano puede estar
// apretando cualquier cosa (lo que le servía para manejar al pasador un instante antes, que ya no
// tiene por qué apuntar hacia la pelota). Por eso, durante CAMBIO_ASISTIDO_AUTOPILOT segundos el
// motor lo mueve solo, directo hacia la pelota, ignorando el joystick/teclado; pasado ese
// tiempo, el control vuelve a responder a lo que se esté apretando (ver bucle()).
const CAMBIO_ASISTIDO_FACTOR = RADIO_RECEPCION_FACTOR * 2; // ×r
const CAMBIO_ASISTIDO_AUTOPILOT = 1; // segundos que se mueve solo hacia la pelota tras el cambio
let autopilotRestante = 0;

function cambioDeJugadorAsistido(pasador, angulo){
  const dirX = Math.cos(angulo), dirY = Math.sin(angulo);
  let receptor = null, mejorAlineacion = 0; // >0: exige que quede al menos algo adelante del pase
  players.forEach((candidato, i) => {
    if (i === activo) return;
    const dx = candidato.x - pasador.x, dy = candidato.y - pasador.y;
    const dist = Math.hypot(dx, dy) || 1;
    const alineacion = (dx / dist) * dirX + (dy / dist) * dirY;
    if (alineacion > mejorAlineacion) { mejorAlineacion = alineacion; receptor = i; }
  });
  if (receptor === null) return; // ningún compañero queda claramente en la dirección del pase

  const distancia = Math.hypot(players[receptor].x - pasador.x, players[receptor].y - pasador.y);
  if (distancia > pasador.r * CAMBIO_ASISTIDO_FACTOR) {
    activo = receptor;
    autopilotRestante = CAMBIO_ASISTIDO_AUTOPILOT;
  }
}

// ── Física ────────────────────────────────────────────────
const FRICCION_JUGADOR = 6;
// Coeficiente de roce entre la pelota y el piso (por ahora fijo; en el futuro podría
// variar según el terreno). Cuanto más alto, más rápido frena una pelota suelta.
const ROCE_PELOTA = 1.1;

// Marchas del joystick: caminar / trotar / correr, como % del tope de velocidad del jugador.
// El teclado (flechas) siempre corre, porque es una entrada de todo o nada.
const MARCHA_CAMINAR = 42, MARCHA_TROTAR = 71, MARCHA_CORRER = 100;
const UMBRAL_TROTAR = 0.4, UMBRAL_CORRER = 0.75;

function marchaDesdeMagnitud(m){
  if (m < UMBRAL_TROTAR) return { nombre:"caminar", pct:MARCHA_CAMINAR, color:"rgba(255,255,255,.55)" };
  if (m < UMBRAL_CORRER) return { nombre:"trotar", pct:MARCHA_TROTAR, color:"rgba(255,255,255,.85)" };
  return { nombre:"correr", pct:MARCHA_CORRER, color:"rgba(255,213,74,.9)" };
}

// ── Fatiga ────────────────────────────────────────────────
// Energía de sprint: de corto plazo, se agota rápido corriendo a fondo. Cuánto depende del
// atributo "sprint" del jugador (100 = se agota más lento). Se recupera en cuanto deja de esprintar.
const ENERGIA_SPRINT_TASA_MAX = 40, ENERGIA_SPRINT_TASA_MIN = 12; // %/seg, según el atributo sprint
const ENERGIA_SPRINT_RECUPERACION = 25; // %/seg, mientras no esprinta

// Aguante (resistencia general): de largo plazo. Lo que gasta o recupera cada segundo depende
// del atributo "resistencia" del jugador, calibrado con la distribución real de movimiento de
// un futbolista profesional en 90 minutos: ~35min caminando, ~44min trotando, ~1.5min
// esprintando, y el resto (~9.5min) parado en pausas del juego (eso no gasta ni recupera).
// Un jugador con resistencia=50 (el "promedio") agota sus 100 puntos de aguante haciendo
// justo esa distribución en todo el partido; con resistencia=100 le rinde el doble.
const RESISTENCIA_EFECTO_CAMINAR = 1;     // unidades de esfuerzo/seg caminando (referencia)
const RESISTENCIA_EFECTO_SPRINT = 8;      // unidades de esfuerzo/seg esprintando (relativo a caminar)
const RESISTENCIA_EFECTO_TROTAR = -1/3;   // trotando se recupera, a un tercio de la tasa de caminar

const RESISTENCIA_MIN_CAMINAR = 35 * 60, RESISTENCIA_MIN_TROTAR = 44 * 60, RESISTENCIA_MIN_SPRINT = 1.5 * 60;
const RESISTENCIA_UNIDADES_REFERENCIA =
  RESISTENCIA_MIN_CAMINAR * RESISTENCIA_EFECTO_CAMINAR +
  RESISTENCIA_MIN_TROTAR * RESISTENCIA_EFECTO_TROTAR +
  RESISTENCIA_MIN_SPRINT * RESISTENCIA_EFECTO_SPRINT; // las pausas no gastan ni recuperan
const RESISTENCIA_STAT_REFERENCIA = 50; // el stat "promedio" que agota los 100 puntos justo con lo de arriba
const RESISTENCIA_CAPACIDAD_POR_STAT = RESISTENCIA_UNIDADES_REFERENCIA / RESISTENCIA_STAT_REFERENCIA;

// %/seg de aguante que gana (efecto<0) o pierde (efecto>0) un jugador con este stat de resistencia.
function tasaAguante(stat, efecto){
  const capacidad = RESISTENCIA_CAPACIDAD_POR_STAT * Math.max(stat, 1);
  return (100 / capacidad) * efecto;
}

function actualizarFatiga(p, moviendo, sprintando, marchaResultante, dt){
  if (sprintando) {
    const tasa = ENERGIA_SPRINT_TASA_MAX + (ENERGIA_SPRINT_TASA_MIN - ENERGIA_SPRINT_TASA_MAX) * (statsComunes.sprint / 100);
    p.energiaSprint = Math.max(0, p.energiaSprint - tasa * dt);
  } else {
    p.energiaSprint = Math.min(100, p.energiaSprint + ENERGIA_SPRINT_RECUPERACION * dt);
  }

  let efecto = 0; // parado (sin moverse): no gasta ni recupera aguante
  if (moviendo) {
    if (sprintando) efecto = RESISTENCIA_EFECTO_SPRINT;
    else if (marchaResultante === MARCHA_TROTAR) efecto = RESISTENCIA_EFECTO_TROTAR;
    else efecto = RESISTENCIA_EFECTO_CAMINAR;
  }
  p.aguante = Math.max(0, Math.min(100, p.aguante - tasaAguante(statsComunes.resistencia, efecto) * dt));

  // El techo de la energía de sprint es el aguante actual: con poco aguante en el tanque,
  // quedan ráfagas de sprint más cortas (y en 0 de aguante, directamente no se puede esprintar).
  p.energiaSprint = Math.min(p.energiaSprint, p.aguante);
}

function actualizarJugador(p, dx, dy, pctMarcha, dt){
  const len = Math.hypot(dx, dy);
  const moviendo = len > 0.05;

  // Si se pide correr pero no queda energía de sprint, se cae a trote hasta recuperar un poco.
  let marchaResultante = pctMarcha;
  const sprintando = moviendo && pctMarcha === MARCHA_CORRER && p.energiaSprint > 0;
  if (moviendo && pctMarcha === MARCHA_CORRER && p.energiaSprint <= 0) marchaResultante = MARCHA_TROTAR;
  actualizarFatiga(p, moviendo, sprintando, marchaResultante, dt);

  if (moviendo) {
    dx /= len; dy /= len;
    // La mirada (dirX/dirY) apunta directo hacia donde se pide ir, igual que la aceleración: si
    // girara gradualmente (como hacía antes, según la agilidad), quedaba un arco incómodo en
    // cómo la pelota "sigue" al jugador al dominarla (su posición depende de la mirada) cada vez
    // que cambiaba de dirección de golpe, por ejemplo al salir corriendo a buscarla — aunque el
    // movimiento en sí ya fuera directo desde el arreglo anterior.
    p.dirX = dx; p.dirY = dy;
    const acel = ACEL_DISENO_MAX * (statsComunes.aceleracion / 100);
    p.vx += dx * acel * dt;
    p.vy += dy * acel * dt;
  } else {
    const f = Math.max(0, 1 - FRICCION_JUGADOR * dt);
    p.vx *= f; p.vy *= f;
  }
  // El aguante agotado también resta un poco de tope de velocidad en general.
  const factorAguante = 0.5 + 0.5 * (p.aguante / 100);
  const velTope = VEL_DISENO_MAX * (statsComunes.velocidad / 100) * (marchaResultante / 100) * factorAguante;
  const vel = Math.hypot(p.vx, p.vy);
  if (vel > velTope) { p.vx = p.vx/vel*velTope; p.vy = p.vy/vel*velTope; }
  p.x += p.vx * dt; p.y += p.vy * dt;
}

// Los jugadores sin la pelota (modo práctica) tratan de mantenerse a DISTANCIA_TRIANGULO tanto
// del portador como del otro compañero, a la vez (como un resorte hacia esa distancia con cada
// uno de los otros dos): si alguno está más cerca de lo debido, tira para alejarse de ese; si
// está más lejos, tira para acercarse. Sumando el tirón de ambos quedan repartidos en una
// especie de triángulo equilátero de forma natural, sin asignarles un lado a mano y sin que
// "perseguirlos" los acerque en vez de alejarlos: si el portador se acerca de más, ese término
// del tirón apunta directamente para el otro lado. La distancia es fija por ahora; más adelante
// podría depender de los stats del equipo.
const DISTANCIA_TRIANGULO = 360; // el doble que antes (180)
const TRIANGULO_DEADZONE = 20; // magnitud del tirón combinado por debajo de la cual ya se considera "en posición"

// Tirón hacia la distancia ideal respecto de cada uno de los "otros" jugadores (positivo =
// alejarse porque está más cerca de lo debido; negativo, en la práctica, tira para acercarse).
function tironApoyo(seguidor, otros){
  let fx = 0, fy = 0;
  for (const otro of otros) {
    const dx = seguidor.x - otro.x, dy = seguidor.y - otro.y;
    const dist = Math.hypot(dx, dy) || 1;
    const error = DISTANCIA_TRIANGULO - dist;
    fx += (dx / dist) * error;
    fy += (dy / dist) * error;
  }
  return { x: fx, y: fy };
}

// Mientras la pelota va suelta camino a él, el receptor se acomoda un poco (como máximo dos
// radios suyos) hacia donde se movía quien se la envió, para ayudar a recibirla.
const RECEPCION_AJUSTE_MAX_FACTOR = 2;

function actualizarIA(dt){
  players.forEach((seguidor, i) => {
    if (i === activo) return; // este lo maneja el jugador (ver bucle principal)

    if (conPelota === activo) {
      const otros = players.filter((_, j) => j !== i); // el portador y el otro compañero
      const tiron = tironApoyo(seguidor, otros);
      const mag = Math.hypot(tiron.x, tiron.y);
      if (mag <= TRIANGULO_DEADZONE) { actualizarJugador(seguidor, 0, 0, 0, dt); return; }
      const pct = mag > DISTANCIA_TRIANGULO ? MARCHA_CORRER : MARCHA_TROTAR;
      actualizarJugador(seguidor, tiron.x/mag, tiron.y/mag, pct, dt);
      return;
    }

    if (direccionEnvio && baseReceptores) {
      const base = baseReceptores[i];
      const movido = Math.hypot(seguidor.x - base.x, seguidor.y - base.y);
      if (movido < seguidor.r * RECEPCION_AJUSTE_MAX_FACTOR) {
        actualizarJugador(seguidor, direccionEnvio.x, direccionEnvio.y, MARCHA_CAMINAR, dt);
        return;
      }
    }
    actualizarJugador(seguidor, 0, 0, 0, dt);
  });
}

// Los rivales hacen cuatro cosas nada más: si le ganaron la pelota a alguien, el que la tiene
// avanza con ella (sigue de largo en la dirección hacia la que ya iba, sin apuntar a ningún lado
// en particular: no tienen arco propio ni juegan en equipo con la pelota, solo avanzan); si nadie
// la tiene pero un pase (o tiro) va en el aire, los dos corren a interceptarlo, apuntando un poco
// adelantado a hacia dónde va la pelota; si el equipo la tiene, el rival más cercano al portador
// lo marca de cerca (corriendo directo hacia él, sin frenar antes de tiempo: la marca solo es
// útil si realmente llega a disputarle la pelota, ver colisionRivalJugadores) mientras el OTRO no
// se amontona sobre el mismo jugador — se adelanta a cubrir la línea de pase hacia el compañero
// del portador mejor ubicado (el más cercano al arco), parándose a mitad de camino entre los dos,
// para ya estar en el camino si el pase sale en vez de arrancar a perseguirlo recién cuando se
// suelta. Sin nada de lo anterior (pelota suelta parada, o entre que se corta un pase y alguien
// la recupera) se quedan quietos: no persiguen la pelota suelta por su cuenta.
const RIVAL_ANTICIPO = 0.25; // segundos de adelanto con que apuntan al camino de la pelota

function actualizarRivales(dt){
  if (conPelotaRivalIdx !== null) {
    rivales.forEach(r => {
      if (r === rivales[conPelotaRivalIdx]) actualizarJugador(r, r.dirX, r.dirY, MARCHA_CORRER, dt);
      else actualizarJugador(r, 0, 0, 0, dt);
    });
    return;
  }

  const paseEnVuelo = conPelota === null && direccionEnvio !== null;
  if (paseEnVuelo) {
    const objX = ball.x + ball.vx * RIVAL_ANTICIPO, objY = ball.y + ball.vy * RIVAL_ANTICIPO;
    rivales.forEach(r => {
      const dx = objX - r.x, dy = objY - r.y;
      const dist = Math.hypot(dx, dy) || 1;
      actualizarJugador(r, dx/dist, dy/dist, MARCHA_CORRER, dt);
    });
    return;
  }

  if (conPelota !== null) {
    const portador = players[conPelota];
    let marcador = rivales[0], distMin = Math.hypot(portador.x-rivales[0].x, portador.y-rivales[0].y);
    for (let k = 1; k < rivales.length; k++) {
      const dk = Math.hypot(portador.x-rivales[k].x, portador.y-rivales[k].y);
      if (dk < distMin) { distMin = dk; marcador = rivales[k]; }
    }
    // El compañero del portador más cerca del arco: la opción de pase más peligrosa, y por eso la
    // que conviene cubrir en vez de simplemente amontonarse a marcar al mismo portador.
    let mejorCompanero = null, mejorDistGol = Infinity;
    players.forEach((c, i) => {
      if (i === conPelota) return;
      const dGol = Math.hypot(ARCO_X - c.x, -c.y);
      if (dGol < mejorDistGol) { mejorDistGol = dGol; mejorCompanero = c; }
    });

    rivales.forEach(r => {
      if (r === marcador) {
        const dx = portador.x-r.x, dy = portador.y-r.y, dist = Math.hypot(dx,dy) || 1;
        actualizarJugador(r, dx/dist, dy/dist, MARCHA_CORRER, dt);
      } else if (mejorCompanero) {
        const tx = (portador.x+mejorCompanero.x)/2, ty = (portador.y+mejorCompanero.y)/2;
        const dx = tx-r.x, dy = ty-r.y, dist = Math.hypot(dx,dy) || 1;
        actualizarJugador(r, dx/dist, dy/dist, MARCHA_CORRER, dt);
      } else {
        actualizarJugador(r, 0, 0, 0, dt);
      }
    });
    return;
  }

  rivales.forEach(r => actualizarJugador(r, 0, 0, 0, dt));
}

// Si algún rival llega a tocar la pelota mientras va suelta, la despeja (intercepción): la pelota
// rebota lejos de él y se cancela el aviso de pase, así los compañeros dejan de acomodarse para
// recibir algo que ya no va a llegar.
function colisionRival(){
  if (conPelota !== null || conPelotaRivalIdx !== null || conPelotaArquero) return; // ya la tiene alguien, no es una pelota suelta
  for (const r of rivales) {
    const dx = ball.x - r.x, dy = ball.y - r.y;
    const dist = Math.hypot(dx, dy) || 0.001;
    const minDist = r.r + ball.r;
    if (dist >= minDist) continue;
    const nx = dx/dist, ny = dy/dist;
    ball.x = r.x + nx*minDist; ball.y = r.y + ny*minDist;
    const vel = Math.hypot(ball.vx, ball.vy);
    ball.vx = nx * vel * 0.6; ball.vy = ny * vel * 0.6; // la despeja hacia donde venía parado
    ultimoPateador = null;
    direccionEnvio = null;
    baseReceptores = null;
    return; // ya la tocó uno; no hace falta revisar al otro en el mismo cuadro
  }
}

// Los dos rivales tampoco se atraviesan entre sí (mismo empuje de separación que entre
// compañeros, sin disputa de posesión: son del mismo equipo, no hay nada que sortear al azar).
function colisionRivales(){
  const a = rivales[0], b = rivales[1];
  const dx = b.x-a.x, dy = b.y-a.y;
  const dist = Math.hypot(dx, dy) || 0.001;
  const minDist = a.r + b.r;
  if (dist >= minDist) return;
  const nx = dx/dist, ny = dy/dist;
  const overlap = minDist - dist;
  a.x -= nx*overlap/2; a.y -= ny*overlap/2;
  b.x += nx*overlap/2; b.y += ny*overlap/2;
  const empuje = 40;
  a.vx -= nx*empuje; a.vy -= ny*empuje;
  b.vx += nx*empuje; b.vy += ny*empuje;
}

// Qué tan pegada queda la pelota al jugador que la domina, según su atributo "control".
function nivelControl(control){
  const t = control / 100;
  return {
    offset: CONTROL_OFFSET_MAX + (CONTROL_OFFSET_MIN - CONTROL_OFFSET_MAX) * t,
    firmeza: CONTROL_FIRMEZA_MIN + (CONTROL_FIRMEZA_MAX - CONTROL_FIRMEZA_MIN) * t
  };
}

// Gira el patrón de la pelota alrededor del eje (ejeX,ejeY,ejeZ) un ángulo theta (Rodrigues).
// Ese eje es horizontal y perpendicular a la velocidad: así el patrón "rueda" hacia donde se mueve
// la pelota en vez de girar plano como una moneda.
function rotarPatron(puntos, ejeX, ejeY, ejeZ, theta){
  const c = Math.cos(theta), s = Math.sin(theta);
  for (const p of puntos) {
    const dot = p.x*ejeX + p.y*ejeY + p.z*ejeZ;
    const kx = ejeY*p.z - ejeZ*p.y, ky = ejeZ*p.x - ejeX*p.z, kz = ejeX*p.y - ejeY*p.x;
    const nx = p.x*c + kx*s + ejeX*dot*(1-c);
    const ny = p.y*c + ky*s + ejeY*dot*(1-c);
    const nz = p.z*c + kz*s + ejeZ*dot*(1-c);
    p.x = nx; p.y = ny; p.z = nz;
  }
}

function actualizarPelota(dt){
  if (conPelota !== null) {
    const p = players[conPelota];
    const n = nivelControl(statsComunes.control);
    const tx = p.x + p.dirX * n.offset, ty = p.y + p.dirY * n.offset;
    const s = Math.min(1, n.firmeza * dt);
    ball.x += (tx - ball.x) * s;
    ball.y += (ty - ball.y) * s;
    ball.vx = p.vx; ball.vy = p.vy;
  } else if (conPelotaRivalIdx !== null) {
    const r = rivales[conPelotaRivalIdx];
    const n = nivelControl(RIVAL_CONTROL); // mismo "control" que usa para disputar la pelota
    const tx = r.x + r.dirX * n.offset, ty = r.y + r.dirY * n.offset;
    const s = Math.min(1, n.firmeza * dt);
    ball.x += (tx - ball.x) * s;
    ball.y += (ty - ball.y) * s;
    ball.vx = r.vx; ball.vy = r.vy;
  } else {
    const f = Math.max(0, 1 - ROCE_PELOTA * dt);
    ball.vx *= f; ball.vy *= f;
    ball.x += ball.vx * dt; ball.y += ball.vy * dt;
  }

  const vel = Math.hypot(ball.vx, ball.vy);
  if (vel > 0.5) {
    const ejeX = -ball.vy/vel, ejeY = ball.vx/vel; // horizontal, perpendicular a la velocidad
    rotarPatron(ball.patron, ejeX, ejeY, 0, (vel/ball.r) * dt);
  }
}

// Dónde va a quedar quieta la pelota si nadie la toca: con roce constante la velocidad decae
// exponencialmente (v(t) = v0 * e^(-ROCE_PELOTA*t)), así que su desplazamiento total hasta
// pararse es exactamente v0/ROCE_PELOTA (la integral de esa velocidad en el tiempo, de 0 a
// infinito). Se usa para que quien va a recibir un pase corra directo a ese punto fijo en vez
// de perseguir la posición actual (en movimiento) de la pelota cuadro a cuadro, que traza una
// curva de persecución en vez de un camino recto.
function puntoDeLlegadaPelota(){
  return { x: ball.x + ball.vx / ROCE_PELOTA, y: ball.y + ball.vy / ROCE_PELOTA };
}

// ── Arco (sin arquero, para probar los tiros) ────────────────
// Un solo arco fijo en el mundo, lejos del punto de saque. Sin equipo rival: cualquier tiro
// (o incluso llevarla adentro dominándola) que cruce la línea de gol dentro del ancho cuenta gol.
const ARCO_X = 900;          // dónde está la línea de gol, sobre el eje x
const ARCO_ANCHO = 220;      // ancho del arco, centrado en y=0
const ARCO_PROFUNDIDAD = 60; // qué tan "profundo" se dibuja el arco/red
const POSTE_RADIO = 8;       // grosor de cada poste, para el rebote

// El ancho del arco (ARCO_ANCHO) es, en la realidad, 7.32m: de ahí sale la escala del resto de
// las medidas de la cancha (límites, áreas, punto penal, círculo central), para que todo quede
// en proporciones reales relativas a los jugadores y al arco que ya existían en el juego.
const UNIDADES_POR_METRO = ARCO_ANCHO / 7.32;

function dentroDelArco(y){ return Math.abs(y) < ARCO_ANCHO / 2; }

// Los postes son sólidos: si la pelota los toca, rebota en vez de pasar de largo. La colisión es
// "continua" (contra el segmento recorrido en el cuadro, no solo la posición final): a alta
// velocidad la pelota puede avanzar más que el ancho del poste en un solo cuadro, y comprobar
// solo dónde terminó dejaba que lo saltara de largo sin nunca detectarse superpuesta.
function colisionPostes(prevX, prevY){
  const postes = [ { x: ARCO_X, y: -ARCO_ANCHO/2 }, { x: ARCO_X, y: ARCO_ANCHO/2 } ];
  const minDist = POSTE_RADIO + ball.r;
  for (const poste of postes) {
    const dx = ball.x - prevX, dy = ball.y - prevY; // recorrido de la pelota en este cuadro
    const fx = prevX - poste.x, fy = prevY - poste.y;
    const a = dx*dx + dy*dy;

    let t = null; // instante [0,1] del recorrido en que toca al poste, si lo toca
    if (a < 1e-9) {
      // casi no se movió: usar la comprobación estática simple
      if (Math.hypot(ball.x - poste.x, ball.y - poste.y) < minDist) t = 1;
    } else {
      const b = 2 * (fx*dx + fy*dy);
      const c = fx*fx + fy*fy - minDist*minDist;
      const disc = b*b - 4*a*c;
      if (disc >= 0) {
        const raiz = Math.sqrt(disc);
        const t0 = (-b - raiz) / (2*a);
        if (t0 >= 0 && t0 <= 1) t = t0; // primer cruce del círculo del poste
        else if (Math.hypot(ball.x - poste.x, ball.y - poste.y) < minDist) t = 1; // ya termina adentro
      }
    }
    if (t === null) continue;

    const cx = prevX + dx*t, cy = prevY + dy*t; // punto de contacto sobre el poste
    const dist = Math.hypot(cx - poste.x, cy - poste.y) || 0.001;
    const nx = (cx - poste.x) / dist, ny = (cy - poste.y) / dist;
    ball.x = poste.x + nx * minDist; ball.y = poste.y + ny * minDist;
    const vNormal = ball.vx * nx + ball.vy * ny;
    ball.vx -= 2 * vNormal * nx; ball.vy -= 2 * vNormal * ny; // rebote
    ball.vx *= 0.6; ball.vy *= 0.6; // pierde energía en el palo
  }
}

// Los postes también son sólidos para los jugadores (de cualquier equipo): no se puede caminar
// a través de ellos. A diferencia de la pelota, un jugador no "rebota" al tocarlos, simplemente
// no puede seguir de largo (se cancela la parte de la velocidad que apuntaba hacia el poste).
//
// La colisión es continua (contra el segmento recorrido en el cuadro, igual que colisionPostes
// para la pelota), no solo la posición final: un chequeo simple alcanza para el movimiento propio
// de un jugador (mucho más lento que la pelota), pero en el mismo cuadro un empujón de otra
// colisión (dos jugadores muy encimados, o el rival disputando la pelota) puede correr a alguien
// una buena distancia de una sola vez — lo suficiente como para saltar de un lado al otro de un
// poste (que es angosto) sin que una comprobación solo-posición-final llegue a notarlo.
function colisionPostesJugador(jugador, prevX, prevY){
  const postes = [ { x: ARCO_X, y: -ARCO_ANCHO/2 }, { x: ARCO_X, y: ARCO_ANCHO/2 } ];
  const minDist = POSTE_RADIO + jugador.r;
  for (const poste of postes) {
    const dx = jugador.x - prevX, dy = jugador.y - prevY; // recorrido en este cuadro (movimiento + empujones)
    const fx = prevX - poste.x, fy = prevY - poste.y;
    const a = dx*dx + dy*dy;

    let t = null; // instante [0,1] del recorrido en que toca al poste, si lo toca
    if (a < 1e-9) {
      if (Math.hypot(jugador.x - poste.x, jugador.y - poste.y) < minDist) t = 1;
    } else {
      const b = 2 * (fx*dx + fy*dy);
      const c = fx*fx + fy*fy - minDist*minDist;
      const disc = b*b - 4*a*c;
      if (disc >= 0) {
        const raiz = Math.sqrt(disc);
        const t0 = (-b - raiz) / (2*a);
        if (t0 >= 0 && t0 <= 1) t = t0; // primer cruce del círculo del poste
        else if (Math.hypot(jugador.x - poste.x, jugador.y - poste.y) < minDist) t = 1; // ya termina adentro
      }
    }
    if (t === null) continue;

    const cx = prevX + dx*t, cy = prevY + dy*t; // punto de contacto sobre el poste
    const dist = Math.hypot(cx - poste.x, cy - poste.y) || 0.001;
    const nx = (cx - poste.x) / dist, ny = (cy - poste.y) / dist;
    jugador.x = poste.x + nx * minDist; jugador.y = poste.y + ny * minDist;
    const vNormal = jugador.vx * nx + jugador.vy * ny;
    if (vNormal < 0) { jugador.vx -= vNormal * nx; jugador.vy -= vNormal * ny; }
  }
}

// La red (fondo y costados del arco, todo menos la boca) es sólida y "flexible": frena la
// pelota en vez de dejarla pasar de largo, y se abomba un poco en el punto de contacto (como
// una red real) para luego volver a su forma. Es un simple clamp de posición por pared (no
// colisión continua): como las paredes son medio-planos y no un círculo angosto como los
// postes, cualquier "salto" de la pelota en un cuadro igual queda del lado de adentro y se
// detecta sin problema, sin necesitar barrido.
//
// Solo se aplica una vez que ya es gol (mostrandoGol, ver revisarGol más abajo — el orden en el
// bucle principal llama a revisarGol() antes que a esta función): antes se activaba con solo
// mirar si la pelota estaba en el rango de x del fondo de la red, sin fijarse si además estaba
// dentro del ancho. Un tiro que iba claramente afuera pero con potencia suficiente para que su
// x cruzara igual ese rango (algo muy común: cualquier tiro fuerte cerca del palo, aunque no
// entre) quedaba con el costado "de la red" empujándolo hacia adentro del ancho aunque nunca
// hubiera entrado por la boca — y al cuadro siguiente, revisarGol() lo contaba como gol. Al
// depender de que ya se haya confirmado el gol, la red deja tranquilo a cualquier tiro que no
// entró, sea cual sea su x.
const MALLA_REBOTE = 0.15;     // qué tan elástica es: rebote mínimo, se siente que atrapa la pelota
const MALLA_FRICCION = 0.5;    // cuánto frena la velocidad paralela a la pared al tocarla
const MALLA_ABULTAMIENTO_INICIAL = 26; // profundidad visual del abombado al momento del golpe
const MALLA_ABULTAMIENTO_TASA = 6;     // 1/seg: qué tan rápido vuelve a su forma plana

let mallaAbultamiento = null; // {pared:'sup'|'fondo'|'inf', x, y, monto} o null si está en reposo

function golpearMalla(pared, x, y){
  mallaAbultamiento = { pared, x, y, monto: MALLA_ABULTAMIENTO_INICIAL };
}

function colisionMalla(dt){
  if (!mostrandoGol) return;
  const supY = -ARCO_ANCHO/2, infY = ARCO_ANCHO/2, fondoX = ARCO_X + ARCO_PROFUNDIDAD;

  // Fondo de la red: no deja que la pelota siga de largo más allá del arco.
  const limiteFondo = fondoX - ball.r;
  if (ball.x > limiteFondo && dentroDelArco(ball.y)) {
    ball.x = limiteFondo;
    if (ball.vx > 0) ball.vx *= -MALLA_REBOTE;
    ball.vy *= MALLA_FRICCION;
    golpearMalla('fondo', fondoX, Math.max(supY, Math.min(infY, ball.y)));
  }

  // Costados de la red: una vez que la pelota ya entró por la boca del arco, no puede salirse
  // por los lados (solo puede volver a salir por donde entró).
  const dentroProfundidad = ball.x > ARCO_X && ball.x < fondoX;
  if (dentroProfundidad) {
    const limiteSup = supY + ball.r, limiteInf = infY - ball.r;
    if (ball.y < limiteSup) {
      ball.y = limiteSup;
      if (ball.vy < 0) ball.vy *= -MALLA_REBOTE;
      ball.vx *= MALLA_FRICCION;
      golpearMalla('sup', Math.max(ARCO_X, Math.min(fondoX, ball.x)), supY);
    } else if (ball.y > limiteInf) {
      ball.y = limiteInf;
      if (ball.vy > 0) ball.vy *= -MALLA_REBOTE;
      ball.vx *= MALLA_FRICCION;
      golpearMalla('inf', Math.max(ARCO_X, Math.min(fondoX, ball.x)), infY);
    }
  }

  if (mallaAbultamiento) {
    mallaAbultamiento.monto *= Math.max(0, 1 - MALLA_ABULTAMIENTO_TASA * dt);
    if (mallaAbultamiento.monto < 0.5) mallaAbultamiento = null;
  }
}

let golesAnotados = 0;
let mostrandoGol = false;
const divGol = document.getElementById("gol");
const spanGoles = document.getElementById("goles");

function anotarGol(){
  if (mostrandoGol) return; // no contar de nuevo mientras se muestra el cartel
  mostrandoGol = true;
  golesAnotados++;
  spanGoles.textContent = golesAnotados;
  divGol.classList.add("mostrar");
  setTimeout(() => {
    divGol.classList.remove("mostrar");
    posicionInicial();
    mostrandoGol = false;
  }, 1200);
}

function revisarGol(){
  if (mostrandoGol || conPelotaArquero) return;
  if (ball.x > ARCO_X && dentroDelArco(ball.y)) anotarGol();
}

// ── Límites de la cancha ──────────────────────────────────────
// Por ahora, solo la mitad: el arco de un lado (ya construido) y la línea de mitad de cancha del
// otro, más las líneas laterales, en las proporciones reales de una cancha de 105×68m (la mitad,
// 52.5m, de línea de gol a línea de mitad de cancha; 68m de línea de banda a línea de banda). Si
// la pelota sale por cualquiera de los cuatro lados, se reinicia igual que tras un gol (sin sumar
// nada, claro). Los jugadores no están acotados todavía, solo la pelota: es lo que hace falta
// para poder terminar una jugada.
const CANCHA_X_MIN = ARCO_X - 52.5 * UNIDADES_POR_METRO; // línea de mitad de cancha
// La línea de gol ES la línea de fondo: no hay un colchón extra de cancha detrás del arco (la
// red sí se sigue dibujando por detrás, como corresponde, pero ya es zona "afuera" a efectos de
// la cancha: si la pelota cruza la línea de gol y no es gol, ya salió).
const CANCHA_X_MAX = ARCO_X;
const CANCHA_Y_LIMITE = 34 * UNIDADES_POR_METRO;         // líneas laterales (68m de ancho total)

function fueraDeLaCancha(x, y){
  return x < CANCHA_X_MIN || x > CANCHA_X_MAX || Math.abs(y) > CANCHA_Y_LIMITE;
}

function revisarLimites(){
  if (mostrandoGol || conPelotaArquero) return;
  if (fueraDeLaCancha(ball.x, ball.y)) posicionInicial();
}

// Los jugadores (de cualquier equipo, salvo el arquero, que ya tiene su propia área) pueden
// salirse un poco de la cancha corriendo — no tiene sentido una pared invisible justo en la
// línea — pero no alejarse en serio: más allá de unos metros, se los frena ahí.
const CANCHA_MARGEN_JUGADOR = 5 * UNIDADES_POR_METRO; // ~5m de margen más allá de cada línea
function limitarJugadorACancha(jugador){
  const xMin = CANCHA_X_MIN - CANCHA_MARGEN_JUGADOR, xMax = CANCHA_X_MAX + CANCHA_MARGEN_JUGADOR;
  const yLimite = CANCHA_Y_LIMITE + CANCHA_MARGEN_JUGADOR;
  if (jugador.x < xMin) { jugador.x = xMin; if (jugador.vx < 0) jugador.vx = 0; }
  else if (jugador.x > xMax) { jugador.x = xMax; if (jugador.vx > 0) jugador.vx = 0; }
  if (jugador.y < -yLimite) { jugador.y = -yLimite; if (jugador.vy < 0) jugador.vy = 0; }
  else if (jugador.y > yLimite) { jugador.y = yLimite; if (jugador.vy > 0) jugador.vy = 0; }
}

// ── Arquero rival (primera versión: se mueve dentro de su área; en cuanto el ataque entra en
// ella, se ubica bajo los tres palos siguiendo el ángulo de la pelota) ──────────────────────
const arquero = crearJugador("#FFD54A", "#B8860B"); // amarillo, como suele vestir un arquero
// El área donde se puede mover el arquero es el área grande (16.5m de profundidad, 40.32m de
// ancho), en proporciones reales.
const AREA_ANCHO = 40.32 * UNIDADES_POR_METRO;
const AREA_PROFUNDIDAD = 16.5 * UNIDADES_POR_METRO;
const AREA_X_MIN = ARCO_X - AREA_PROFUNDIDAD;
const AREA_X_MAX = ARCO_X + ARCO_PROFUNDIDAD;  // hasta el fondo de la red, por si la pelota entra ahí
const ARQUERO_INICIAL = { x: ARCO_X - 20, y: 0, dirX: -1, dirY: 0 };

// Marcas puramente visuales (no afectan al arquero ni a nada más, son solo referencia en la
// cancha): el área chica (6 yardas/5.5m), el punto penal (11m), el radio de la media
// luna/círculo central (9.15m/10 yardas, el mismo radio en las dos) y el de los cuartos de
// círculo de las esquinas junto al arco (1 yarda).
const AREA_CHICA_PROFUNDIDAD = 5.5 * UNIDADES_POR_METRO;
const AREA_CHICA_ANCHO = 18.32 * UNIDADES_POR_METRO;
const PUNTO_PENAL_DISTANCIA = 11 * UNIDADES_POR_METRO;
const RADIO_CIRCULO_CENTRAL = 9.15 * UNIDADES_POR_METRO;
const RADIO_CORNER = 0.9144 * UNIDADES_POR_METRO;
// Stats propios del arquero: no comparte los del equipo de campo (statsComunes). "Colocación"
// define qué tan de cerca sigue el ángulo de la pelota bajo los palos (100 = pegado a la pelota;
// menos, se queda más centrado y cubre peor los palos); "control" define qué tan seguido ataja
// atrapando la pelota en vez de solo darle rebote (ver colisionArquero).
// "Control" en 82 (no 100): así "atrapar limpio vs. dar rebote" (ver atajarConRebote más abajo)
// deja de ser una certeza matemática. Con control=100, `Math.random() < control/100` nunca puede
// fallar y el rebote quedaba como código prácticamente inalcanzable en una partida real.
const arqueroStats = { colocacion: 100, control: 82 };

function dentroDelArea(x, y){
  return x >= AREA_X_MIN && x <= AREA_X_MAX && Math.abs(y) <= AREA_ANCHO / 2;
}

// El arquero se mueve con la misma físical que un jugador de campo (misma actualizarJugador,
// mismos stats compartidos del equipo): acelera hacia el objetivo y frena con la física normal,
// en vez de "teletransportarse" hacia él como hacía un primer intento con suavizado exponencial.
//
// Pero actualizarJugador por sí sola solo "persigue" (seek): empuja siempre a fondo hacia el
// objetivo, sin frenar antes de llegar. Eso le sirve a un jugador manejado por una persona (que
// naturalmente suelta el joystick al acercarse) o a un rival persiguiendo algo que se mueve, pero
// para el arquero — que reapunta al objetivo todos los cuadros, incluso con la pelota parada —
// eso significa pasarse de largo, girar para volver, pasarse de nuevo, y así para siempre: nunca
// se asienta. Achicar el radio de "llegada" no alcanza si con el envión ya se pasó bien afuera de
// ese radio. La solución es "llegar" de verdad (arrive, no solo seek): bajar la marcha a medida
// que se acerca, para que el frenado (fricción, al pedir dirección 0,0) tenga tiempo de actuar
// antes de volver a acelerar a fondo.
const ARQUERO_LLEGADA_QUIETO = 15;  // por debajo de esto, frena del todo
const ARQUERO_LLEGADA_CAMINAR = 60; // por debajo de esto, al paso
const ARQUERO_LLEGADA_TROTAR = 150; // por debajo de esto, al trote; más lejos, corriendo

function actualizarArquero(dt){
  let tx, ty;
  if (dentroDelArea(ball.x, ball.y)) {
    const yObjetivo = ball.y * (arqueroStats.colocacion / 100);
    tx = ARCO_X - POSTE_RADIO - arquero.r;
    ty = Math.max(-ARCO_ANCHO/2 + arquero.r, Math.min(ARCO_ANCHO/2 - arquero.r, yObjetivo));
  } else {
    // Fuera de esa situación, espera cerca del centro del área, listo para reaccionar.
    tx = ARCO_X - AREA_PROFUNDIDAD / 2;
    ty = 0;
  }

  const dx = tx - arquero.x, dy = ty - arquero.y;
  const dist = Math.hypot(dx, dy);
  if (dist < ARQUERO_LLEGADA_QUIETO) actualizarJugador(arquero, 0, 0, 0, dt);
  else {
    const pct = dist < ARQUERO_LLEGADA_CAMINAR ? MARCHA_CAMINAR
      : dist < ARQUERO_LLEGADA_TROTAR ? MARCHA_TROTAR
      : MARCHA_CORRER;
    actualizarJugador(arquero, dx, dy, pct, dt);
  }

  // Nunca se sale de su área, pase lo que pase con el movimiento de arriba. Tampoco cruza su
  // propia línea de gol: un arquero no se para detrás del arco.
  arquero.x = Math.max(AREA_X_MIN, Math.min(ARCO_X, arquero.x));
  arquero.y = Math.max(-AREA_ANCHO/2, Math.min(AREA_ANCHO/2, arquero.y));
}

// ── Atajadas ──────────────────────────────────────────────────
// Si la pelota (suelta, sin dueño) toca al arquero, puede pasar una de tres cosas. Primero, con
// ARQUERO_INCERTIDUMBRE de probabilidad, se le escapa igual: sigue de largo como si no hubiera
// estado ahí (ni el mejor arquero ataja siempre lo que llega a tocar). Si no se le escapa, ahí
// recién entra su "control": lo mismo que ya decide si un jugador se queda con la pelota al
// disputarla, decide si el arquero la atrapa (la retiene un par de segundos y despeja, para que
// el juego siga) o solo le da rebote (la pelota sigue suelta y en juego para una eventual segunda
// jugada). Importante: "control" no tiene nada que ver con si el arquero LLEGA a la pelota (eso
// ya lo decide colocación, junto con la física de movimiento, al posicionarlo) — solo con qué
// tan bien resuelve una vez que la toca. La colisión es continua (contra el segmento recorrido en
// el cuadro, igual que colisionPostes): a la potencia de los tiros, comprobar solo la posición
// final dejaría pasar de largo tiros que el arquero nunca llegaría a tocar.
const ARQUERO_INCERTIDUMBRE = 0.2; // hasta con control perfecto (100), esta fracción de las veces se le escapa
const ARQUERO_SOSTIENE_DURACION = 2; // segundos que retiene la pelota atrapada antes de despejarla
const ARQUERO_DESPEJE_POTENCIA = 700; // velocidad con la que sale disparada al despejar

// Atrapar limpio vs. solo dar rebote no depende nada más que del "control": un remate muy fuerte
// es más difícil de sostener incluso para un arquero con control perfecto (en la realidad, los
// rebotes pasan mucho más seguido con remates fuertes que con tiros suaves). Por debajo de
// ARQUERO_ATRAPE_VEL_SUAVE la potencia no resta nada; por encima de ARQUERO_ATRAPE_VEL_FUERTE resta
// lo máximo (ARQUERO_ATRAPE_FACTOR_MIN, ni con control 100 se garantiza atraparlo limpio).
const ARQUERO_ATRAPE_VEL_SUAVE = 400;
const ARQUERO_ATRAPE_VEL_FUERTE = 1200;
const ARQUERO_ATRAPE_FACTOR_MIN = 0.35;

function factorPotenciaAtrape(velocidad){
  if (velocidad <= ARQUERO_ATRAPE_VEL_SUAVE) return 1;
  if (velocidad >= ARQUERO_ATRAPE_VEL_FUERTE) return ARQUERO_ATRAPE_FACTOR_MIN;
  const t = (velocidad - ARQUERO_ATRAPE_VEL_SUAVE) / (ARQUERO_ATRAPE_VEL_FUERTE - ARQUERO_ATRAPE_VEL_SUAVE);
  return 1 - t * (1 - ARQUERO_ATRAPE_FACTOR_MIN);
}

let conPelotaArquero = false; // true mientras retiene la pelota atrapada, antes de despejarla

// Al despejar, en vez de tirar siempre hacia adelante con dispersión al azar, el arquero elige
// entre varias direcciones candidatas (un abanico hacia el campo) la que tiene más línea de
// vista limpia: menos jugadores, de cualquier equipo, parados en el camino. Para cada candidata
// mide, de los jugadores que quedan "adelante" de esa dirección, qué tan cerca está el primero
// que el camino rozaría (su radio más un margen); la candidata con ese primer obstáculo más
// lejos (o ninguno) gana.
const ARQUERO_DESPEJE_ABANICO = Math.PI / 2; // ±45° respecto de derecho hacia el campo (-x)
const ARQUERO_DESPEJE_CANDIDATOS = 9;
const ARQUERO_DESPEJE_MARGEN_OBSTACULO = 20; // qué tan cerca del camino ya cuenta como bloqueo

function direccionDespejeLibre(){
  let mejorAngulo = Math.PI, mejorDistancia = -Infinity, mejorCercania = Infinity;
  const obstaculos = players.concat(rivales);
  for (let i = 0; i < ARQUERO_DESPEJE_CANDIDATOS; i++) {
    const t = i / (ARQUERO_DESPEJE_CANDIDATOS - 1);
    const angulo = Math.PI + (t - 0.5) * ARQUERO_DESPEJE_ABANICO;
    const dirX = Math.cos(angulo), dirY = Math.sin(angulo);
    let distanciaLibre = Infinity;
    for (const o of obstaculos) {
      const relX = o.x - arquero.x, relY = o.y - arquero.y;
      const adelante = relX * dirX + relY * dirY;
      if (adelante <= 0) continue; // queda atrás, no bloquea
      const perpendicular = Math.abs(relX * dirY - relY * dirX);
      if (perpendicular < o.r + ARQUERO_DESPEJE_MARGEN_OBSTACULO) {
        distanciaLibre = Math.min(distanciaLibre, adelante);
      }
    }
    // Ante un empate en despeje (p. ej. ningún candidato tiene nada en el camino), gana el que
    // queda más derecho hacia el campo, no el primero que se evaluó.
    const cercaniaAlCentro = Math.abs(t - 0.5);
    if (distanciaLibre > mejorDistancia || (distanciaLibre === mejorDistancia && cercaniaAlCentro < mejorCercania)) {
      mejorDistancia = distanciaLibre; mejorAngulo = angulo; mejorCercania = cercaniaAlCentro;
    }
  }
  return mejorAngulo;
}

function despejarArquero(){
  const angulo = direccionDespejeLibre();
  ball.vx = Math.cos(angulo) * ARQUERO_DESPEJE_POTENCIA;
  ball.vy = Math.sin(angulo) * ARQUERO_DESPEJE_POTENCIA;
  ultimoPateador = null;
}

function atajarAtrapando(){
  if (mostrandoGol || conPelotaArquero) return;
  conPelotaArquero = true;
  ball.vx = 0; ball.vy = 0;
  setTimeout(() => {
    despejarArquero();
    conPelotaArquero = false;
  }, ARQUERO_SOSTIENE_DURACION * 1000);
}

// Sin este tope, un rebote de un tiro a máxima potencia (hasta 1800, reflejado y luego
// amortiguado ×0.6 = hasta ~1080) salía disparado bastante más rápido que cualquier otro envío
// "a propósito" del juego (el despeje del propio arquero es 700, el pase más fuerte es 600) y,
// como la cámara solo sigue al jugador activo y nunca a la pelota, ese rebote cruzaba la pantalla
// y se perdía de vista casi de inmediato — daba la sensación de que la pelota "desaparecía".
// Se lo empareja con la potencia del despeje: ningún rebote debería salir más rápido que un
// despeje deliberado del arquero.
function atajarConRebote(nx, ny){
  const vNormal = ball.vx * nx + ball.vy * ny;
  ball.vx -= 2 * vNormal * nx; ball.vy -= 2 * vNormal * ny; // rebote
  ball.vx *= 0.6; ball.vy *= 0.6; // pierde fuerza en el rebote
  const vel = Math.hypot(ball.vx, ball.vy);
  if (vel > ARQUERO_DESPEJE_POTENCIA) {
    const f = ARQUERO_DESPEJE_POTENCIA / vel;
    ball.vx *= f; ball.vy *= f;
  }
}

function colisionArquero(prevX, prevY){
  if (mostrandoGol || conPelotaArquero) return;
  if (conPelota !== null || conPelotaRivalIdx !== null) return; // ya la tiene alguien, no hay nada que atajar

  const minDist = arquero.r + ball.r;
  const dx = ball.x - prevX, dy = ball.y - prevY; // recorrido de la pelota en este cuadro
  const fx = prevX - arquero.x, fy = prevY - arquero.y;
  const a = dx*dx + dy*dy;

  let t = null; // instante [0,1] del recorrido en que toca al arquero, si lo toca
  if (a < 1e-9) {
    if (Math.hypot(ball.x - arquero.x, ball.y - arquero.y) < minDist) t = 1;
  } else {
    const b = 2 * (fx*dx + fy*dy);
    const c = fx*fx + fy*fy - minDist*minDist;
    const disc = b*b - 4*a*c;
    if (disc >= 0) {
      const raiz = Math.sqrt(disc);
      const t0 = (-b - raiz) / (2*a);
      if (t0 >= 0 && t0 <= 1) t = t0; // primer cruce del círculo del arquero
      else if (Math.hypot(ball.x - arquero.x, ball.y - arquero.y) < minDist) t = 1; // ya termina adentro
    }
  }
  if (t === null) return; // ni siquiera llegó a tocarla: nada que ver con "control"

  // Llegó a tocarla: con ARQUERO_INCERTIDUMBRE de probabilidad (aun con control=100), se le pasa
  // igual, sin afectarla en nada — sigue de largo, y si iba directo al arco, es gol.
  const probabilidadIntervenir = (arqueroStats.control / 100) * (1 - ARQUERO_INCERTIDUMBRE);
  if (Math.random() >= probabilidadIntervenir) return;

  const cx = prevX + dx*t, cy = prevY + dy*t; // punto de contacto sobre el arquero
  const dist = Math.hypot(cx - arquero.x, cy - arquero.y) || 0.001;
  const nx = (cx - arquero.x) / dist, ny = (cy - arquero.y) / dist;
  ball.x = arquero.x + nx * minDist; ball.y = arquero.y + ny * minDist;

  const velocidadImpacto = Math.hypot(ball.vx, ball.vy);
  const probabilidadAtrapar = (arqueroStats.control / 100) * factorPotenciaAtrape(velocidadImpacto);
  if (Math.random() < probabilidadAtrapar) atajarAtrapando();
  else atajarConRebote(nx, ny);
}

// El arquero también es sólido para los jugadores (de cualquier equipo): antes se podía pasar
// "flotando" encima suyo (y, de paso, de la pelota que tuviera en brazos, que va pegada a él).
// Al arquero se lo trata como fijo en este choque (no lo empuja a él, solo aleja al jugador),
// para no desarmarle la posición mientras está reaccionando a una jugada. Mientras retiene la
// pelota atrapada (conPelotaArquero) hay que guardar un poco más de distancia — un cuerpo extra —
// para no amontonarse encima suyo en ese momento.
const ARQUERO_ESPACIO_PERSONAL = 52; // unidades extra (≈ un cuerpo) mientras retiene la pelota
function colisionArqueroJugadores(){
  const jugadores = players.concat(rivales);
  for (const j of jugadores) {
    const dx = j.x - arquero.x, dy = j.y - arquero.y;
    const dist = Math.hypot(dx, dy) || 0.001;
    const minDist = j.r + arquero.r + (conPelotaArquero ? ARQUERO_ESPACIO_PERSONAL : 0);
    if (dist >= minDist) continue;
    const nx = dx / dist, ny = dy / dist;
    j.x = arquero.x + nx * minDist; j.y = arquero.y + ny * minDist;
    const vNormal = j.vx * nx + j.vy * ny;
    if (vNormal < 0) { j.vx -= vNormal * nx; j.vy -= vNormal * ny; }
  }
}

// Los jugadores no pueden atravesarse: si se encuentran, chocan y se separan (revisa cada par).
// Como son compañeros, si dos chocan y uno de ellos domina la pelota, esta queda al azar entre esos dos.
let chocando = new Set(); // claves "i-j" de los pares actualmente superpuestos
function colisionJugadores(){
  for (let i = 0; i < players.length; i++) {
    for (let j = i + 1; j < players.length; j++) {
      const a = players[i], b = players[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const dist = Math.hypot(dx, dy) || 0.001;
      const minDist = a.r + b.r;
      const clave = i + "-" + j;
      if (dist >= minDist) { chocando.delete(clave); continue; }

      const nx = dx / dist, ny = dy / dist;
      const overlap = minDist - dist;
      a.x -= nx * overlap / 2; a.y -= ny * overlap / 2;
      b.x += nx * overlap / 2; b.y += ny * overlap / 2;
      const empuje = 40;
      a.vx -= nx * empuje; a.vy -= ny * empuje;
      b.vx += nx * empuje; b.vy += ny * empuje;

      if (!chocando.has(clave) && (conPelota === i || conPelota === j)) {
        conPelota = Math.random() < 0.5 ? i : j;
        activo = conPelota;
        ultimoPateador = null;
        direccionEnvio = null;
        baseReceptores = null;
      }
      chocando.add(clave);
    }
  }
}

// Los rivales también son sólidos: si chocan contra un jugador, ambos se separan igual que entre
// compañeros (eso sí, recién al tocarse los cuerpos, con el radio real de cada uno). Pero
// disputar la pelota es más generoso: alcanza con estar a RIVAL_ALCANCE de distancia además del
// contacto físico, no hace falta llegar a superponerse. Sin este margen, alcanzar el cuerpo
// entero de alguien que huye a la misma velocidad (sobre todo de espaldas o de costado, donde no
// se puede cortar camino) es prácticamente imposible: nunca se termina de cerrar el último tramo.
// Si alguno de los dos tiene la pelota dentro de ese alcance, se disputa: queda al azar, pero
// pesado según el "control" de cada lado (el del equipo, compartido, contra RIVAL_CONTROL). A
// quien se la quitan se queda quieto en seco (pierde toda su velocidad); a quien se la queda no
// se le toca la velocidad, sigue avanzando hacia donde iba (para el rival, ver actualizarRivales;
// para un jugador, lo que ya venía haciendo el humano o la IA).
const RIVAL_ALCANCE = 30; // unidades de más, sobre el contacto físico, para poder disputar la pelota
let chocandoRival = new Set(); // claves "k-i" (rival k, jugador i) actualmente dentro del alcance de disputa
function colisionRivalJugadores(){
  rivales.forEach((r, k) => {
    for (let i = 0; i < players.length; i++) {
      const p = players[i];
      const dx = p.x - r.x, dy = p.y - r.y;
      const dist = Math.hypot(dx, dy) || 0.001;
      const minDistFisico = p.r + r.r;
      const minDistDisputa = minDistFisico + RIVAL_ALCANCE;
      const clave = k + "-" + i;

      if (dist < minDistFisico) {
        const nx = dx / dist, ny = dy / dist;
        const overlap = minDistFisico - dist;
        p.x += nx * overlap / 2; p.y += ny * overlap / 2;
        r.x -= nx * overlap / 2; r.y -= ny * overlap / 2;
        const empuje = 40;
        p.vx += nx * empuje; p.vy += ny * empuje;
        r.vx -= nx * empuje; r.vy -= ny * empuje;
      }

      if (dist >= minDistDisputa) { chocandoRival.delete(clave); continue; }

      if (!chocandoRival.has(clave)) {
        const probEquipo = statsComunes.control / (statsComunes.control + RIVAL_CONTROL);
        if (conPelota === i && Math.random() >= probEquipo) {
          // el rival le gana la disputa: se la queda él, y el jugador se frena en seco
          conPelota = null;
          conPelotaRivalIdx = k;
          p.vx = 0; p.vy = 0;
          ultimoPateador = null;
          direccionEnvio = null;
          baseReceptores = null;
        } else if (conPelotaRivalIdx === k && Math.random() < probEquipo) {
          // el equipo recupera la disputa: pasa a controlarla ese jugador, y el rival se frena en seco
          conPelotaRivalIdx = null;
          conPelota = i;
          activo = i;
          r.vx = 0; r.vy = 0;
          ultimoPateador = null;
          direccionEnvio = null;
          baseReceptores = null;
        }
      }
      chocandoRival.add(clave);
    }
  });
}

// Si la pelota está suelta y algún jugador la toca, la domina (y si no era el activo, pasa a serlo).
// Quien la pateó/pasó no puede recuperarla hasta que la pelota salga al menos una vez de su radio.
// Mientras la tiene el rival, esto no se aplica: solo se la pueden disputar chocando contra él
// (ver colisionRivalJugadores), no por simple cercanía a la pelota.
function actualizarPosesion(){
  if (conPelota !== null || conPelotaRivalIdx !== null || conPelotaArquero) return;
  if (ultimoPateador !== null) {
    const p = players[ultimoPateador];
    const d = Math.hypot(ball.x - p.x, ball.y - p.y);
    if (d > p.r * RADIO_RECEPCION_FACTOR) ultimoPateador = null;
  }
  for (let i = 0; i < players.length; i++) {
    if (i === ultimoPateador) continue;
    const p = players[i];
    const d = Math.hypot(ball.x - p.x, ball.y - p.y);
    if (d < p.r * RADIO_RECEPCION_FACTOR) {
      conPelota = i;
      activo = i;
      ultimoPateador = null;
      direccionEnvio = null;
      baseReceptores = null;
      break;
    }
  }
}

// ── Cámara ────────────────────────────────────────────────
function actualizarCamara(dt){
  const objetivo = players[activo];
  const suavizado = 1 - Math.pow(0.001, dt);
  camera.x += (objetivo.x - camera.x) * suavizado;
  camera.y += (objetivo.y - camera.y) * suavizado;
}

// ── Dibujo ────────────────────────────────────────────────
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let scale = 1, viewW = VIEW_W, viewH = 600;

// En pantalla táctil (celular/tablet), el zoom se calcula desde el lado más corto de la
// pantalla, para que al rotar de vertical a horizontal se mantenga el mismo nivel de zoom
// (se ve más campo a los costados, en vez de acercar la cámara).
const ES_TACTIL = window.matchMedia("(pointer: coarse)").matches;

function ajustarTamano(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const base = ES_TACTIL ? Math.min(canvas.width, canvas.height) : canvas.width;
  scale = base / (ES_TACTIL ? VIEW_W : VIEW_W_ESCRITORIO);
  viewW = canvas.width / scale;
  viewH = canvas.height / scale;
}
window.addEventListener("resize", ajustarTamano);
ajustarTamano();

function dibujarCancha(){
  const franja = 100;
  const izq = camera.x - viewW/2 - franja, der = camera.x + viewW/2 + franja;
  const arriba = camera.y - viewH/2, abajo = camera.y + viewH/2;
  const primero = Math.floor(izq / franja) * franja;
  for (let x = primero; x < der; x += franja) {
    ctx.fillStyle = (Math.round(x / franja) % 2 === 0) ? "#2E7D32" : "#33862F";
    ctx.fillRect(x, arriba, franja, abajo - arriba);
  }

  // líneas de referencia cada 200 unidades, para percibir el movimiento en el campo infinito
  ctx.strokeStyle = "rgba(255,255,255,.12)";
  ctx.lineWidth = 2;
  const paso = 200;
  const yPrimero = Math.floor(arriba / paso) * paso;
  for (let y = yPrimero; y < abajo; y += paso) {
    ctx.beginPath(); ctx.moveTo(izq, y); ctx.lineTo(der, y); ctx.stroke();
  }

}

// Líneas de la cancha: de fondo (línea de mitad de cancha), laterales, y el fondo del otro lado
// (por ahora solo referencial, ya que el límite real de ese lado lo pone la red).
function dibujarLimites(){
  ctx.strokeStyle = "rgba(255,255,255,.55)";
  ctx.lineWidth = 4;
  ctx.strokeRect(CANCHA_X_MIN, -CANCHA_Y_LIMITE, CANCHA_X_MAX - CANCHA_X_MIN, CANCHA_Y_LIMITE * 2);
}

// Marcas de cancha en proporciones reales: área grande, área chica, punto penal, la media luna
// (el arco de círculo alrededor del punto penal, recortado a la parte que queda fuera del área
// grande), el semicírculo central sobre la línea de mitad de cancha (solo se ve la mitad del
// círculo central porque el mundo del juego solo tiene esta mitad de la cancha) y los dos
// cuartos de círculo de las esquinas junto al arco (donde la línea de gol se junta con cada
// línea lateral; del otro lado, en la línea de mitad de cancha, no hay esquinas reales que
// marcar, esa línea no es un borde de cancha de verdad).
function dibujarMarcasCancha(){
  ctx.strokeStyle = "rgba(255,255,255,.55)";
  ctx.lineWidth = 3;

  // Área grande (coincide con el área del arquero, AREA_X_MIN/AREA_ANCHO)
  ctx.strokeRect(AREA_X_MIN, -AREA_ANCHO/2, ARCO_X - AREA_X_MIN, AREA_ANCHO);

  // Área chica
  const areaChicaXMin = ARCO_X - AREA_CHICA_PROFUNDIDAD;
  ctx.strokeRect(areaChicaXMin, -AREA_CHICA_ANCHO/2, ARCO_X - areaChicaXMin, AREA_CHICA_ANCHO);

  // Punto penal
  const penalX = ARCO_X - PUNTO_PENAL_DISTANCIA;
  ctx.fillStyle = "rgba(255,255,255,.55)";
  ctx.beginPath(); ctx.arc(penalX, 0, 4, 0, Math.PI*2); ctx.fill();

  // Media luna: el círculo de radio RADIO_CIRCULO_CENTRAL centrado en el punto penal, pero solo
  // la parte que queda fuera del área grande (la línea del área la recorta).
  const dx = AREA_X_MIN - penalX; // negativo: el borde del área queda más cerca del arco que el radio
  const anguloCorte = Math.acos(Math.max(-1, Math.min(1, dx / RADIO_CIRCULO_CENTRAL)));
  ctx.beginPath();
  ctx.arc(penalX, 0, RADIO_CIRCULO_CENTRAL, anguloCorte, 2*Math.PI - anguloCorte);
  ctx.stroke();

  // Semicírculo central, sobre la línea de mitad de cancha, abierto hacia este lado de la cancha.
  ctx.beginPath();
  ctx.arc(CANCHA_X_MIN, 0, RADIO_CIRCULO_CENTRAL, -Math.PI/2, Math.PI/2);
  ctx.stroke();

  // Cuartos de círculo en las dos esquinas junto al arco (línea de gol × línea lateral).
  ctx.beginPath();
  ctx.arc(ARCO_X, -CANCHA_Y_LIMITE, RADIO_CORNER, Math.PI/2, Math.PI);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(ARCO_X, CANCHA_Y_LIMITE, RADIO_CORNER, Math.PI, Math.PI*1.5);
  ctx.stroke();
}

// Dibuja la red (fondo y costados, la boca queda abierta) como una sola línea continua desde
// el poste superior hasta el inferior. Cuando hay un golpe reciente (mallaAbultamiento), la
// pared golpeada se curva hacia afuera con una curva cuadrática; el resto queda recta (el punto
// de control cae justo en la mitad del tramo, así la curva "recta" da una línea derecha).
function dibujarMalla(){
  const supY = -ARCO_ANCHO/2, infY = ARCO_ANCHO/2, fondoX = ARCO_X + ARCO_PROFUNDIDAD;
  const m = mallaAbultamiento;

  ctx.beginPath();
  ctx.moveTo(ARCO_X, supY);

  if (m && m.pared === 'sup') ctx.quadraticCurveTo(m.x, supY - m.monto, fondoX, supY);
  else ctx.lineTo(fondoX, supY);

  if (m && m.pared === 'fondo') ctx.quadraticCurveTo(fondoX + m.monto, m.y, fondoX, infY);
  else ctx.lineTo(fondoX, infY);

  if (m && m.pared === 'inf') ctx.quadraticCurveTo(m.x, infY + m.monto, ARCO_X, infY);
  else ctx.lineTo(ARCO_X, infY);

  ctx.strokeStyle = "#fff"; ctx.lineWidth = 3;
  ctx.stroke();

  ctx.lineTo(ARCO_X, supY); // cierra el contorno de vuelta hacia la boca, para poder rellenar
  ctx.closePath();
  ctx.fillStyle = "rgba(255,255,255,.15)";
  ctx.fill();
}

function dibujarArco(){
  dibujarMalla();
  // postes, más marcados
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(ARCO_X, -ARCO_ANCHO/2, POSTE_RADIO, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(ARCO_X, ARCO_ANCHO/2, POSTE_RADIO, 0, Math.PI*2); ctx.fill();
  // línea de gol
  ctx.strokeStyle = "rgba(255,255,255,.7)"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(ARCO_X, -ARCO_ANCHO/2 - 20); ctx.lineTo(ARCO_X, ARCO_ANCHO/2 + 20); ctx.stroke();
}

function dibujarJugador(p, esActivo, numero){
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
  ctx.fillStyle = p.color;
  ctx.fill();
  ctx.lineWidth = 4;
  ctx.strokeStyle = p.oscuro;
  ctx.stroke();

  // número identificador, para reconocer a cada jugador (coincide con su panel de stats)
  ctx.fillStyle = "#fff";
  ctx.font = `bold ${Math.round(p.r*0.9)}px Arial`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(numero, p.x, p.y);

  // indicador de hacia dónde mira (para entender el pateo/pase)
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
  ctx.lineTo(p.x + p.dirX * (p.r + 10), p.y + p.dirY * (p.r + 10));
  ctx.strokeStyle = "rgba(255,255,255,.9)";
  ctx.lineWidth = 3;
  ctx.stroke();

  if (esActivo) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r + 8, 0, Math.PI*2);
    ctx.strokeStyle = "rgba(255,255,255,.9)";
    ctx.lineWidth = 2.5;
    ctx.setLineDash([5,4]);
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

// Traza un pentágono regular centrado en (cx,cy), con el radio y la rotación dados.
function trazarPentagono(cx, cy, radio, rotacion){
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const ang = rotacion + i * (Math.PI*2/5) - Math.PI/2;
    const x = cx + Math.cos(ang) * radio, y = cy + Math.sin(ang) * radio;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}

function dibujarBalon(){
  ctx.save();
  ctx.translate(ball.x, ball.y);

  ctx.beginPath();
  ctx.arc(0, 0, ball.r, 0, Math.PI*2);
  ctx.fillStyle = "#F5F5F0";
  ctx.fill();
  ctx.strokeStyle = "#222"; ctx.lineWidth = 2;
  ctx.stroke();
  ctx.clip(); // recorta las pintas al contorno de la pelota

  // Pintas pentagonales proyectadas desde el patrón 3D: solo se ven las que están del lado
  // de arriba (z>0), y se achican cerca del borde para simular la curva de la pelota.
  ctx.fillStyle = "#222";
  for (const p of ball.patron) {
    if (p.z <= 0) continue;
    const tam = ball.r * p.tam * (0.45 + 0.55 * p.z);
    trazarPentagono(p.x * ball.r, p.y * ball.r, tam, 0);
    ctx.fill();
  }

  ctx.restore();
}

function dibujar(){
  ctx.fillStyle = "#0a0a0a";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.scale(scale, scale);
  ctx.translate(viewW/2 - camera.x, viewH/2 - camera.y);

  dibujarCancha();
  dibujarLimites();
  dibujarMarcasCancha();
  dibujarArco();
  rivales.forEach((r, k) => dibujarJugador(r, false, "R" + (k + 1)));
  dibujarJugador(arquero, false, "A");
  players.forEach((p, i) => dibujarJugador(p, i === activo, i + 1));
  dibujarBalon();

  ctx.restore();
}

// ── Bucle principal ─────────────────────────────────────────
let ultimo = performance.now();
function bucle(ahora){
  let dt = (ahora - ultimo) / 1000;
  ultimo = ahora;
  dt = Math.min(dt, 1/30);

  const t = direccionTeclado();
  const magJoy = Math.min(1, Math.hypot(joyVec.dx, joyVec.dy));
  let dx, dy, pctMarcha;
  if (Math.hypot(t.dx, t.dy) > 0.05) {
    dx = t.dx; dy = t.dy;
    // En PC el movimiento con flechas trota por defecto; correr requiere mantener Shift (antes
    // corría siempre, sin dar opción a las otras marchas).
    pctMarcha = teclas["shift"] ? MARCHA_CORRER : MARCHA_TROTAR;
  } else {
    dx = joyVec.dx; dy = joyVec.dy; pctMarcha = marchaDesdeMagnitud(magJoy).pct;
  }

  // Recién cambiado al receptor de un pase largo (cambioDeJugadorAsistido): durante este ratito
  // se ignora el joystick/teclado y se lo mueve directo hacia la pelota, para no depender de qué
  // se esté apretando en ese instante (que un momento antes manejaba a otro jugador).
  if (autopilotRestante > 0) {
    autopilotRestante = Math.max(0, autopilotRestante - dt);
    const p = players[activo];
    const objetivo = puntoDeLlegadaPelota();
    const dxBalon = objetivo.x - p.x, dyBalon = objetivo.y - p.y;
    const distBalon = Math.hypot(dxBalon, dyBalon) || 1;
    dx = dxBalon / distBalon; dy = dyBalon / distBalon; pctMarcha = MARCHA_CORRER;
  }

  // Posición de cada uno antes de moverse este cuadro, para la colisión continua con los postes
  // (ver colisionPostesJugador): tiene que ser de antes de CUALQUIER cosa que pueda correrlos
  // este cuadro, movimiento propio o empujones de otras colisiones.
  const prevJugadores = players.map(p => ({ x: p.x, y: p.y }));
  const prevRivales = rivales.map(r => ({ x: r.x, y: r.y }));
  const prevArquero = { x: arquero.x, y: arquero.y };

  actualizarJugador(players[activo], dx, dy, pctMarcha, dt);
  actualizarIA(dt);
  actualizarRivales(dt);
  actualizarArquero(dt);
  colisionJugadores();
  colisionRivalJugadores();
  colisionRivales();
  colisionArqueroJugadores();
  players.forEach((p, i) => { colisionPostesJugador(p, prevJugadores[i].x, prevJugadores[i].y); limitarJugadorACancha(p); });
  rivales.forEach((r, k) => { colisionPostesJugador(r, prevRivales[k].x, prevRivales[k].y); limitarJugadorACancha(r); });
  colisionPostesJugador(arquero, prevArquero.x, prevArquero.y);
  const ballXAntes = ball.x, ballYAntes = ball.y;
  actualizarPelota(dt);
  colisionPostes(ballXAntes, ballYAntes);
  colisionArquero(ballXAntes, ballYAntes);
  revisarGol();
  colisionMalla(dt);
  revisarLimites();
  colisionRival();
  actualizarPosesion();
  actualizarCamara(dt);
  if (cargandoTiro) {
    tiempoCargaTiro = Math.min(tiempoCargaTiro + dt, TIRO_CARGA_DURACION);
    barraCargaTiroCubierta.style.width = (100 - (tiempoCargaTiro / TIRO_CARGA_DURACION) * 100) + "%";
  }
  if (cargandoPase) {
    tiempoCargaPase = Math.min(tiempoCargaPase + dt, PASE_CARGA_DURACION);
    barraCargaPaseCubierta.style.width = (100 - (tiempoCargaPase / PASE_CARGA_DURACION) * 100) + "%";
  }
  actualizarBarraFatiga(); // cambia en vivo según quién tiene la pelota
  dibujar();

  requestAnimationFrame(bucle);
}

    ["Aguante @50 camin.", tasaAguante(50, RESISTENCIA_EFECTO_CAMINAR).toFixed(3) + "%/s"],
    ["Aguante @50 trote", Math.abs(tasaAguante(50, RESISTENCIA_EFECTO_TROTAR)).toFixed(3) + "%/s (recup.)"],
    ["Aguante @50 sprint", tasaAguante(50, RESISTENCIA_EFECTO_SPRINT).toFixed(3) + "%/s"]
  ];
  document.getElementById("panel-parametros").innerHTML =
    items.map(([nombre, valor]) => `<span>${nombre}: <b>${valor}</b></span>`).join("");
}

posicionInicial();
actualizarPanelStats();
actualizarBarraFatiga();
actualizarPanelParametros();
requestAnimationFrame(bucle);

})();
