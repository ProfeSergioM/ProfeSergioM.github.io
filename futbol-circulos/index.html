  if (mostrandoGol) return; // no contar de nuevo mientras se muestra el cartel
  mostrandoGol = true;
  arcoDelGolActual = lado === "propio" ? ARCOS[0] : ARCOS[1];
  if (lado === "propio") { golesPropios++; spanGolesPropios.textContent = golesPropios; }
  else { golesRivales++; spanGolesRivales.textContent = golesRivales; }
  divGol.classList.add("mostrar");
  setTimeout(() => {
    divGol.classList.remove("mostrar");
    posicionInicial();
    mostrandoGol = false;
    arcoDelGolActual = null;
  }, 1200);
}

function revisarGol(){
  if (mostrandoGol || conPelotaArquero || conPelotaArquero2 || ball.altura > 0) return;
  if (ball.x > ARCO_X && dentroDelArco(ball.y)) anotarGol("propio");
  else if (ball.x < ARCO_X2 && dentroDelArco(ball.y)) anotarGol("rival");
}

// ── Límites de la cancha ──────────────────────────────────────
// Cancha completa, reglamentaria: un arco en cada punta (ARCO_X y ARCO_X2, ver ARCOS) y las
// líneas laterales, en las proporciones reales de una cancha de 105×68m. Si la pelota sale por
// cualquiera de los cuatro lados, se reinicia igual que tras un gol (sin sumar nada, claro). Los
// jugadores no están acotados todavía, solo la pelota: es lo que hace falta para poder terminar
// una jugada.
// Las líneas de gol SON la línea de fondo: no hay un colchón extra de cancha detrás de cada arco
// (la red sí se sigue dibujando por detrás, como corresponde, pero ya es zona "afuera" a efectos
// de la cancha: si la pelota cruza una línea de gol y no es gol, ya salió).
const CANCHA_X_MAX = ARCO_X;
const CANCHA_X_MIN = ARCO_X2;
const CANCHA_Y_LIMITE = 34 * UNIDADES_POR_METRO;         // líneas laterales (68m de ancho total)

function fueraDeLaCancha(x, y){
  return x < CANCHA_X_MIN || x > CANCHA_X_MAX || Math.abs(y) > CANCHA_Y_LIMITE;
}

function revisarLimites(){
  if (mostrandoGol || conPelotaArquero || conPelotaArquero2) return;
  if (fueraDeLaCancha(ball.x, ball.y)) posicionInicial();
}

// Red de seguridad general: cubre cualquier variante de "la jugada quedó trabada" más allá de
// una causa puntual (un rival empujando contra un obstáculo sólido sin esquivarlo es una — ver
// RIVAL_ATASCADO_* — pero no necesariamente la única): la jugada nunca debería colgarse del todo,
// pase lo que pase con la física en una situación no prevista. Dos señales de "algo anda mal",
// sostenidas por más de PELOTA_QUIETA_TIEMPO_MAX segundos seguidos, reinician la jugada:
// - Suelta y casi sin velocidad (nadie la persigue ni la controla). Si el equipo la controla a
//   propósito no cuenta (eso lo decide un jugador, no es un atasco); el arquero reteniéndola a
//   propósito ya tiene su propio límite, ARQUERO_SOSTIENE_DURACION.
// - En manos de un rival (conPelotaRivalIdx) pero lejos de él: debería quedar pegada a sus pies
//   (ver actualizarPelota), así que una distancia grande sostenida significa que algo rompió ese
//   seguimiento, no que el rival simplemente esté lejos un instante.
const PELOTA_QUIETA_TIEMPO_MAX = 3;
const PELOTA_QUIETA_VEL_MIN = 15;
const PELOTA_LEJOS_DE_RIVAL_MAX = 150;
let pelotaQuietaTiempo = 0;
function revisarPelotaQuieta(dt){
  if (mostrandoGol || conPelotaArquero || conPelotaArquero2 || conPelota !== null) { pelotaQuietaTiempo = 0; return; }
  let problema;
  if (conPelotaRivalIdx !== null) {
    const r = rivales[conPelotaRivalIdx];
    problema = Math.hypot(ball.x - r.x, ball.y - r.y) > PELOTA_LEJOS_DE_RIVAL_MAX;
  } else {
    problema = Math.hypot(ball.vx, ball.vy) < PELOTA_QUIETA_VEL_MIN;
  }
  pelotaQuietaTiempo = problema ? pelotaQuietaTiempo + dt : 0;
  if (pelotaQuietaTiempo > PELOTA_QUIETA_TIEMPO_MAX) posicionInicial();
}

// Los jugadores (de cualquier equipo, salvo el arquero, que ya tiene su propia área) pueden
// salirse un poco de la cancha corriendo — no tiene sentido una pared invisible justo en la
// línea — pero no alejarse en serio: más allá de unos metros, se los frena ahí.
const CANCHA_MARGEN_JUGADOR = 5 * UNIDADES_POR_METRO; // ~5m de margen más allá de cada línea
function limitarJugadorACancha(jugador){
  const xMin = CANCHA_X_MIN - CANCHA_MARGEN_JUGADOR, xMax = CANCHA_X_MAX + CANCHA_MARGEN_JUGADOR;
  const yLimite = CANCHA_Y_LIMITE + CANCHA_MARGEN_JUGADOR;
  if (jugador.x < xMin) { jugador.x = xMin; if (jugador.vx < 0) jugador.vx = 0; }
  else if (jugador.x > xMax) { jugador.x = xMax; if (jugador.vx > 0) jugador.vx = 0; }
  if (jugador.y < -yLimite) { jugador.y = -yLimite; if (jugador.vy < 0) jugador.vy = 0; }
  else if (jugador.y > yLimite) { jugador.y = yLimite; if (jugador.vy > 0) jugador.vy = 0; }
}

// ── Arqueros (uno por arco: se mueve dentro de su área; en cuanto el ataque entra en ella, se
// ubica bajo los tres palos siguiendo el ángulo de la pelota) ───────────────────────────────
const arquero = crearJugador("#FFD54A", "#B8860B"); // amarillo, como suele vestir un arquero
const arquero2 = crearJugador("#FFD54A", "#B8860B"); // el del arco propio (ARCO_X2)
// El área donde se puede mover cada arquero es el área grande (16.5m de profundidad, 40.32m de
// ancho), en proporciones reales.
const AREA_ANCHO = 40.32 * UNIDADES_POR_METRO;
const AREA_PROFUNDIDAD = 16.5 * UNIDADES_POR_METRO;
// Cuánto le falta al rival con la pelota para considerar tirar (ver decidirAtaqueRival) y qué tan
// centrado tiene que estar respecto del arco — si no, el ángulo de tiro es demasiado cerrado.
const RIVAL_ATAQUE_DISTANCIA_TIRO = AREA_PROFUNDIDAD * 1.4;
const RIVAL_ATAQUE_ANCHO_TIRO = ARCO_ANCHO * 1.3;
const ARQUERO_INICIAL = { x: ARCO_X - 20, y: 0, dirX: -1, dirY: 0 };
const ARQUERO2_INICIAL = { x: ARCO_X2 + 20, y: 0, dirX: 1, dirY: 0 };

// Límites del área grande de cualquier arco (ver ARCOS): "hacia adentro" de la cancha
// (AREA_PROFUNDIDAD) y "hacia afuera", hasta el fondo de la red (ARCO_PROFUNDIDAD) — normalizados
// para que min<max sin importar el signo del arco.
function limitesArea(goal){
  const bordeCancha = goal.x - goal.signo * AREA_PROFUNDIDAD;
  const bordeRed = goal.x + goal.signo * ARCO_PROFUNDIDAD;
  return { min: Math.min(bordeCancha, bordeRed), max: Math.max(bordeCancha, bordeRed) };
}

// Marcas puramente visuales (no afectan al arquero ni a nada más, son solo referencia en la
// cancha): el área chica (6 yardas/5.5m), el punto penal (11m), el radio de la media
// luna/círculo central (9.15m/10 yardas, el mismo radio en las dos) y el de los cuartos de
// círculo de las esquinas junto al arco (1 yarda).
const AREA_CHICA_PROFUNDIDAD = 5.5 * UNIDADES_POR_METRO;
const AREA_CHICA_ANCHO = 18.32 * UNIDADES_POR_METRO;
const PUNTO_PENAL_DISTANCIA = 11 * UNIDADES_POR_METRO;
const RADIO_CIRCULO_CENTRAL = 9.15 * UNIDADES_POR_METRO;
const RADIO_CORNER = 0.9144 * UNIDADES_POR_METRO;
// Stats propios del arquero: no comparte los del equipo de campo (statsComunes). "Colocación"
// define qué tan de cerca sigue el ángulo de la pelota bajo los palos (100 = pegado a la pelota;
// menos, se queda más centrado y cubre peor los palos); "control" define qué tan seguido ataja
// atrapando la pelota en vez de solo darle rebote (ver colisionArquero).
// "Control" en 82 (no 100): así "atrapar limpio vs. dar rebote" (ver atajarConRebote más abajo)
// deja de ser una certeza matemática. Con control=100, `Math.random() < control/100` nunca puede
// fallar y el rebote quedaba como código prácticamente inalcanzable en una partida real.
const arqueroStats = { colocacion: 100, control: 82 };
const arqueroStats2 = { colocacion: 100, control: 82 };

function dentroDelArea(x, y, goal){
  const { min, max } = limitesArea(goal);
  return x >= min && x <= max && Math.abs(y) <= AREA_ANCHO / 2;
}

// El arquero se mueve con la misma físical que un jugador de campo (misma actualizarJugador,
// mismos stats compartidos del equipo): acelera hacia el objetivo y frena con la física normal,
// en vez de "teletransportarse" hacia él como hacía un primer intento con suavizado exponencial.
//
// Pero actualizarJugador por sí sola solo "persigue" (seek): empuja siempre a fondo hacia el
// objetivo, sin frenar antes de llegar. Eso le sirve a un jugador manejado por una persona (que
// naturalmente suelta el joystick al acercarse) o a un rival persiguiendo algo que se mueve, pero
// para el arquero — que reapunta al objetivo todos los cuadros, incluso con la pelota parada —
// eso significa pasarse de largo, girar para volver, pasarse de nuevo, y así para siempre: nunca
// se asienta. Achicar el radio de "llegada" no alcanza si con el envión ya se pasó bien afuera de
// ese radio. La solución es "llegar" de verdad (arrive, no solo seek): bajar la marcha a medida
// que se acerca, para que el frenado (fricción, al pedir dirección 0,0) tenga tiempo de actuar
// antes de volver a acelerar a fondo.
const ARQUERO_LLEGADA_QUIETO = 15;  // por debajo de esto, frena del todo
const ARQUERO_LLEGADA_CAMINAR = 60; // por debajo de esto, al paso
const ARQUERO_LLEGADA_TROTAR = 150; // por debajo de esto, al trote; más lejos, corriendo

// Arquero-líbero: si la pelota queda suelta (sin dueño de ningún lado) más allá del área pero
// todavía relativamente cerca, y ningún compañero de campo está mejor parado para llegar primero,
// sale a buscarla en vez de esperar cruzado de brazos cerca del área (lo que la pedía el usuario
// como "arquero más activo"). Rango: desde el borde del área hasta 2.2 profundidades de área más
// allá (~16.5m a ~36m de la línea de gol); ancho acotado al ancho del área, para que no salga
// corriendo hacia un lateral lejano — un barrido físico corto, no una persecución por toda la cancha.
const ARQUERO_SALIDA_DISTANCIA = AREA_PROFUNDIDAD * 2.2;
const ARQUERO_SALIDA_ANCHO = AREA_ANCHO;

function actualizarArquero(arq, arqStats, goal, equipoPropio, dt){
  let tx, ty, saliendo = false;
  if (dentroDelArea(ball.x, ball.y, goal)) {
    tx = goal.x - goal.signo * (POSTE_RADIO + arq.r);
    // Se ubica donde la pelota VA A CRUZAR sus palos, no donde está ahora (ver puntoDeCrucePelota):
    // en un tiro cruzado, la posición actual se sigue moviendo mientras reacciona, así que
    // perseguirla es siempre ir un paso atrás. Si no hay nada que anticipar (pelota parada o
    // alejándose), usa la posición actual como antes.
    const yCruce = puntoDeCrucePelota(tx);
    const yObjetivo = (yCruce !== null ? yCruce : ball.y) * (arqStats.colocacion / 100);
    ty = Math.max(-ARCO_ANCHO/2 + arq.r, Math.min(ARCO_ANCHO/2 - arq.r, yObjetivo));
  } else {
    // "Adentro de la cancha" desde este arco (ver ARCOS/limitesArea): positivo si la pelota está
    // del lado del campo de juego, sin importar el signo del arco.
    const distanciaPelota = goal.signo * (goal.x - ball.x);
    const pelotaSuelta = conPelota === null && conPelotaRivalIdx === null
      && !conPelotaArquero && !conPelotaArquero2 && ball.altura <= 0;
    if (pelotaSuelta && distanciaPelota > AREA_PROFUNDIDAD && distanciaPelota < ARQUERO_SALIDA_DISTANCIA
        && Math.abs(ball.y) < ARQUERO_SALIDA_ANCHO / 2
        && equipoPropio.every(j => Math.hypot(ball.x-j.x, ball.y-j.y) > Math.hypot(ball.x-arq.x, ball.y-arq.y))) {
      tx = ball.x; ty = ball.y; saliendo = true;
    } else {
      // Fuera de esa situación, espera cerca del centro del área, listo para reaccionar.
      tx = goal.x - goal.signo * (AREA_PROFUNDIDAD / 2);
      ty = 0;
    }
  }

  const dx = tx - arq.x, dy = ty - arq.y;
  const dist = Math.hypot(dx, dy);
  if (dist < ARQUERO_LLEGADA_QUIETO) actualizarJugador(arq, 0, 0, 0, dt);
  else {
    const pct = dist < ARQUERO_LLEGADA_CAMINAR ? MARCHA_CAMINAR
      : dist < ARQUERO_LLEGADA_TROTAR ? MARCHA_TROTAR
      : MARCHA_CORRER;
    actualizarJugador(arq, dx, dy, pct, dt);
  }

  // Mira siempre de frente a la pelota, sin importar hacia dónde se esté moviendo (actualizarJugador
  // apunta la mirada en la dirección de movimiento, no de la pelota — al llegar a destino y quedarse
  // quieto, además, ni siquiera actualiza la mirada): se pisa acá con la dirección real hacia ella.
  const dxBalon = ball.x - arq.x, dyBalon = ball.y - arq.y;
  const distBalon = Math.hypot(dxBalon, dyBalon) || 1;
  arq.dirX = dxBalon / distBalon; arq.dirY = dyBalon / distBalon;

  // Nunca se sale más allá de su rango permitido, pase lo que pase con el movimiento de arriba
  // (el área grande normalmente; el rango extendido de salida mientras esté en curso una salida).
  // Tampoco cruza su propia línea de gol: un arquero no se para detrás del arco. (min/max en vez de
  // asumir un orden fijo: para el arco izquierdo, signo negativo, la línea de gol queda del lado
  // del x más CHICO de las dos cotas, al revés que en el arco derecho.)
  const limiteProfundidad = saliendo ? ARQUERO_SALIDA_DISTANCIA : AREA_PROFUNDIDAD;
  const limiteAncho = saliendo ? ARQUERO_SALIDA_ANCHO : AREA_ANCHO;
  const bordeCancha = goal.x - goal.signo * limiteProfundidad;
  arq.x = Math.max(Math.min(goal.x, bordeCancha), Math.min(Math.max(goal.x, bordeCancha), arq.x));
  arq.y = Math.max(-limiteAncho/2, Math.min(limiteAncho/2, arq.y));
}

// ── Atajadas ──────────────────────────────────────────────────
// Si la pelota (suelta, sin dueño) toca al arquero, puede pasar una de tres cosas. Primero, con
// ARQUERO_INCERTIDUMBRE de probabilidad, se le escapa igual: sigue de largo como si no hubiera
// estado ahí (ni el mejor arquero ataja siempre lo que llega a tocar). Si no se le escapa, ahí
// recién entra su "control": lo mismo que ya decide si un jugador se queda con la pelota al
// disputarla, decide si el arquero la atrapa (la retiene un par de segundos y despeja, para que
// el juego siga) o solo le da rebote (la pelota sigue suelta y en juego para una eventual segunda
// jugada). Importante: "control" no tiene nada que ver con si el arquero LLEGA a la pelota (eso
// ya lo decide colocación, junto con la física de movimiento, al posicionarlo) — solo con qué
// tan bien resuelve una vez que la toca. La colisión es continua (contra el segmento recorrido en
// el cuadro, igual que colisionPostes): a la potencia de los tiros, comprobar solo la posición
// final dejaría pasar de largo tiros que el arquero nunca llegaría a tocar.
const ARQUERO_INCERTIDUMBRE = 0.2; // hasta con control perfecto (100), esta fracción de las veces se le escapa
const ARQUERO_SOSTIENE_DURACION = 2; // segundos que retiene la pelota atrapada antes de despejarla
const ARQUERO_DESPEJE_POTENCIA = 700; // velocidad con la que sale disparada al despejar
// Cuánto se desvía un rebote (ver atajarConRebote) del reflejo perfecto: a diferencia del
// despeje (deliberado, el arquero elige dirección), el rebote no lo controla nadie — sale para
// donde pega, no siempre cómodo para el que está más cerca. Sin este desvío, el rebote era
// perfectamente predecible (reflejo especular exacto) y casi siempre quedaba servido para el
// delantero más próximo al arco: una pelota suelta demasiado fácil de aprovechar.
const ARQUERO_REBOTE_DESVIO_MAX = Math.PI / 5; // 36°

// Atrapar limpio vs. solo dar rebote no depende nada más que del "control": un remate muy fuerte
// es más difícil de sostener incluso para un arquero con control perfecto (en la realidad, los
// rebotes pasan mucho más seguido con remates fuertes que con tiros suaves). Por debajo de
// ARQUERO_ATRAPE_VEL_SUAVE la potencia no resta nada; por encima de ARQUERO_ATRAPE_VEL_FUERTE resta
// lo máximo (ARQUERO_ATRAPE_FACTOR_MIN, ni con control 100 se garantiza atraparlo limpio).
const ARQUERO_ATRAPE_VEL_SUAVE = 400;
const ARQUERO_ATRAPE_VEL_FUERTE = 1200;
const ARQUERO_ATRAPE_FACTOR_MIN = 0.35;

function factorPotenciaAtrape(velocidad){
  if (velocidad <= ARQUERO_ATRAPE_VEL_SUAVE) return 1;
  if (velocidad >= ARQUERO_ATRAPE_VEL_FUERTE) return ARQUERO_ATRAPE_FACTOR_MIN;
  const t = (velocidad - ARQUERO_ATRAPE_VEL_SUAVE) / (ARQUERO_ATRAPE_VEL_FUERTE - ARQUERO_ATRAPE_VEL_SUAVE);
  return 1 - t * (1 - ARQUERO_ATRAPE_FACTOR_MIN);
}

let conPelotaArquero = false;  // true mientras el arquero propio (ARCO_X) retiene la pelota atrapada
let conPelotaArquero2 = false; // ídem, el arquero del arco rival (ARCO_X2)

// Junta cada arquero con su arco/stats y con getter+setter de su propio "conPelotaArqueroN": las
// funciones de atajada (atajarAtrapando en particular, por el setTimeout que la libera más tarde)
// necesitan poder LEER y ESCRIBIR ese flag sin duplicarse una vez por arquero.
function crearEstadoArquero(jugador, stats, goal, getConPelota, setConPelota){
  return { jugador, stats, goal, conPelota: getConPelota, setConPelota };
}
const ARQUEROS = [
  crearEstadoArquero(arquero, arqueroStats, ARCOS[0], () => conPelotaArquero, v => { conPelotaArquero = v; }),
  crearEstadoArquero(arquero2, arqueroStats2, ARCOS[1], () => conPelotaArquero2, v => { conPelotaArquero2 = v; }),
];

// Al despejar, en vez de tirar siempre hacia adelante con dispersión al azar, el arquero elige
// entre varias direcciones candidatas (un abanico hacia el campo) la que tiene más línea de
// vista limpia: menos jugadores, de cualquier equipo, parados en el camino. Para cada candidata
// mide, de los jugadores que quedan "adelante" de esa dirección, qué tan cerca está el primero
// que el camino rozaría (su radio más un margen); la candidata con ese primer obstáculo más
// lejos (o ninguno) gana.
const ARQUERO_DESPEJE_ABANICO = Math.PI / 2; // ±45° respecto de derecho hacia el campo (-x)
const ARQUERO_DESPEJE_CANDIDATOS = 9;
const ARQUERO_DESPEJE_MARGEN_OBSTACULO = 20; // qué tan cerca del camino ya cuenta como bloqueo

// Generalizada a cualquier origen (no solo el arquero) para poder reutilizarla también cuando un
// rival con la pelota queda atascado (ver RIVAL_ATASCADO_* más abajo) — mismo criterio de "hueco
// más libre" sirve para cualquiera que necesite despejarla sin obstáculos. Al arquero se lo suma
// como un obstáculo más (antes no hacía falta: como siempre era el propio origen, quedaba
// filtrado solo al dar "adelante=0"; ahora que el origen puede ser otro punto, si no se lo
// incluyera un rival atascado podría despejar derecho contra el propio arquero que lo atascó).
function direccionDespejeLibre(origenX, origenY){
  let mejorAngulo = Math.PI, mejorDistancia = -Infinity, mejorCercania = Infinity;
  const obstaculos = players.concat(rivales, [arquero, arquero2]);
  for (let i = 0; i < ARQUERO_DESPEJE_CANDIDATOS; i++) {
    const t = i / (ARQUERO_DESPEJE_CANDIDATOS - 1);
    const angulo = Math.PI + (t - 0.5) * ARQUERO_DESPEJE_ABANICO;
    const dirX = Math.cos(angulo), dirY = Math.sin(angulo);
    let distanciaLibre = Infinity;
    for (const o of obstaculos) {
      const relX = o.x - origenX, relY = o.y - origenY;
      const adelante = relX * dirX + relY * dirY;
      if (adelante <= 0) continue; // queda atrás, no bloquea
      const perpendicular = Math.abs(relX * dirY - relY * dirX);
      if (perpendicular < o.r + ARQUERO_DESPEJE_MARGEN_OBSTACULO) {
        distanciaLibre = Math.min(distanciaLibre, adelante);
      }
    }
    // Ante un empate en despeje (p. ej. ningún candidato tiene nada en el camino), gana el que
    // queda más derecho hacia el campo, no el primero que se evaluó.
    const cercaniaAlCentro = Math.abs(t - 0.5);
    if (distanciaLibre > mejorDistancia || (distanciaLibre === mejorDistancia && cercaniaAlCentro < mejorCercania)) {
      mejorDistancia = distanciaLibre; mejorAngulo = angulo; mejorCercania = cercaniaAlCentro;
    }
  }
  return mejorAngulo;
}

function despejarArquero(arq){
  const angulo = direccionDespejeLibre(arq.x, arq.y);
  ball.vx = Math.cos(angulo) * ARQUERO_DESPEJE_POTENCIA;
  ball.vy = Math.sin(angulo) * ARQUERO_DESPEJE_POTENCIA;
  ultimoPateador = null;
}

function atajarAtrapando(estado){
  if (mostrandoGol || estado.conPelota()) return;
  estado.setConPelota(true);
  ball.vx = 0; ball.vy = 0;
  setTimeout(() => {
    despejarArquero(estado.jugador);
    estado.setConPelota(false);
  }, ARQUERO_SOSTIENE_DURACION * 1000);
}

// Sin este tope, un rebote de un tiro a máxima potencia (hasta 1800, reflejado y luego
// amortiguado ×0.6 = hasta ~1080) salía disparado bastante más rápido que cualquier otro envío
// "a propósito" del juego (el despeje del propio arquero es 700, el pase más fuerte es 600) y,
// como la cámara solo sigue al jugador activo y nunca a la pelota, ese rebote cruzaba la pantalla
// y se perdía de vista casi de inmediato — daba la sensación de que la pelota "desaparecía".
// Se lo empareja con la potencia del despeje: ningún rebote debería salir más rápido que un
// despeje deliberado del arquero.
function atajarConRebote(nx, ny){
  const vNormal = ball.vx * nx + ball.vy * ny;
  ball.vx -= 2 * vNormal * nx; ball.vy -= 2 * vNormal * ny; // rebote
  ball.vx *= 0.6; ball.vy *= 0.6; // pierde fuerza en el rebote

  // Desvío al azar sobre el reflejo perfecto (ver ARQUERO_REBOTE_DESVIO_MAX): un rebote real no
  // sale en un ángulo prolijo, calculado.
  const desvio = (Math.random() * 2 - 1) * ARQUERO_REBOTE_DESVIO_MAX;
  const cosD = Math.cos(desvio), sinD = Math.sin(desvio);
  const vxDesviado = ball.vx * cosD - ball.vy * sinD;
  const vyDesviado = ball.vx * sinD + ball.vy * cosD;
  ball.vx = vxDesviado; ball.vy = vyDesviado;

  const vel = Math.hypot(ball.vx, ball.vy);
  if (vel > ARQUERO_DESPEJE_POTENCIA) {
    const f = ARQUERO_DESPEJE_POTENCIA / vel;
    ball.vx *= f; ball.vy *= f;
  }
}

function colisionArquero(estado, prevX, prevY){
  if (mostrandoGol || estado.conPelota() || ball.altura > 0) return;
  if (conPelota !== null || conPelotaRivalIdx !== null) return; // ya la tiene alguien, no hay nada que atajar

  const arq = estado.jugador, arqStats = estado.stats;
  const minDist = arq.r + ball.r;
  const dx = ball.x - prevX, dy = ball.y - prevY; // recorrido de la pelota en este cuadro
  const fx = prevX - arq.x, fy = prevY - arq.y;
  const a = dx*dx + dy*dy;

  let t = null; // instante [0,1] del recorrido en que toca al arquero, si lo toca
  if (a < 1e-9) {
    if (Math.hypot(ball.x - arq.x, ball.y - arq.y) < minDist) t = 1;
  } else {
    const b = 2 * (fx*dx + fy*dy);
    const c = fx*fx + fy*fy - minDist*minDist;
    const disc = b*b - 4*a*c;
    if (disc >= 0) {
      const raiz = Math.sqrt(disc);
      const t0 = (-b - raiz) / (2*a);
      if (t0 >= 0 && t0 <= 1) t = t0; // primer cruce del círculo del arquero
      else if (Math.hypot(ball.x - arq.x, ball.y - arq.y) < minDist) t = 1; // ya termina adentro
    }
  }
  if (t === null) return; // ni siquiera llegó a tocarla: nada que ver con "control"

  // Llegó a tocarla: con ARQUERO_INCERTIDUMBRE de probabilidad (aun con control=100), se le pasa
  // igual, sin afectarla en nada — sigue de largo, y si iba directo al arco, es gol.
  const probabilidadIntervenir = (arqStats.control / 100) * (1 - ARQUERO_INCERTIDUMBRE);
  if (Math.random() >= probabilidadIntervenir) return;

  const cx = prevX + dx*t, cy = prevY + dy*t; // punto de contacto sobre el arquero
  const dist = Math.hypot(cx - arq.x, cy - arq.y) || 0.001;
  const nx = (cx - arq.x) / dist, ny = (cy - arq.y) / dist;
  ball.x = arq.x + nx * minDist; ball.y = arq.y + ny * minDist;

  const velocidadImpacto = Math.hypot(ball.vx, ball.vy);
  const probabilidadAtrapar = (arqStats.control / 100) * factorPotenciaAtrape(velocidadImpacto);
  if (Math.random() < probabilidadAtrapar) atajarAtrapando(estado);
  else atajarConRebote(nx, ny);
}

// El arquero también es sólido para los jugadores (de cualquier equipo): antes se podía pasar
// "flotando" encima suyo (y, de paso, de la pelota que tuviera en brazos, que va pegada a él).
// Al arquero se lo trata como fijo en este choque (no lo empuja a él, solo aleja al jugador),
// para no desarmarle la posición mientras está reaccionando a una jugada. Mientras retiene la
// pelota atrapada (conPelotaArquero) hay que guardar un poco más de distancia — un cuerpo extra —
// para no amontonarse encima suyo en ese momento.
const ARQUERO_ESPACIO_PERSONAL = 52; // unidades extra (≈ un cuerpo) mientras retiene la pelota
function colisionArqueroJugadores(estado){
  const arq = estado.jugador;
  const jugadores = players.concat(rivales);
  for (const j of jugadores) {
    const dx = j.x - arq.x, dy = j.y - arq.y;
    const dist = Math.hypot(dx, dy) || 0.001;
    const minDist = j.r + arq.r + (estado.conPelota() ? ARQUERO_ESPACIO_PERSONAL : 0);
    if (dist >= minDist) continue;
    const nx = dx / dist, ny = dy / dist;
    j.x = arq.x + nx * minDist; j.y = arq.y + ny * minDist;
    const vNormal = j.vx * nx + j.vy * ny;
    if (vNormal < 0) { j.vx -= vNormal * nx; j.vy -= vNormal * ny; }
  }
}

// Los jugadores no pueden atravesarse: si se encuentran, chocan y se separan (revisa cada par).
// Como son compañeros, si dos chocan y uno de ellos domina la pelota, esta queda al azar entre esos dos.
let chocando = new Set(); // claves "i-j" de los pares actualmente superpuestos
function colisionJugadores(){
  for (let i = 0; i < players.length; i++) {
    for (let j = i + 1; j < players.length; j++) {
      const a = players[i], b = players[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const dist = Math.hypot(dx, dy) || 0.001;
      const minDist = a.r + b.r;
      const clave = i + "-" + j;
      if (dist >= minDist) { chocando.delete(clave); continue; }

      const nx = dx / dist, ny = dy / dist;
      const overlap = minDist - dist;
      a.x -= nx * overlap / 2; a.y -= ny * overlap / 2;
      b.x += nx * overlap / 2; b.y += ny * overlap / 2;
      const empuje = 40;
      a.vx -= nx * empuje; a.vy -= ny * empuje;
      b.vx += nx * empuje; b.vy += ny * empuje;

      if (!chocando.has(clave) && (conPelota === i || conPelota === j)) {
        conPelota = Math.random() < 0.5 ? i : j;
        activo = conPelota;
        ultimoPateador = null;
        direccionEnvio = null;
        baseReceptores = null;
      }
      chocando.add(clave);
    }
  }
}

// Los rivales también son sólidos: si chocan contra un jugador, ambos se separan igual que entre
// compañeros (eso sí, recién al tocarse los cuerpos, con el radio real de cada uno). Pero
// disputar la pelota es más generoso: alcanza con estar a RIVAL_ALCANCE de distancia además del
// contacto físico, no hace falta llegar a superponerse. Sin este margen, alcanzar el cuerpo
// entero de alguien que huye a la misma velocidad (sobre todo de espaldas o de costado, donde no
// se puede cortar camino) es prácticamente imposible: nunca se termina de cerrar el último tramo.
// Si alguno de los dos tiene la pelota dentro de ese alcance, se disputa: queda al azar, pero
// pesado según el "control" de cada lado (el del equipo, compartido, contra RIVAL_CONTROL). A
// quien se la quitan se queda quieto en seco (pierde toda su velocidad); a quien se la queda no
// se le toca la velocidad, sigue avanzando hacia donde iba (para el rival, ver actualizarRivales;
// para un jugador, lo que ya venía haciendo el humano o la IA).
const RIVAL_ALCANCE = 30; // unidades de más, sobre el contacto físico, para poder disputar la pelota
let chocandoRival = new Set(); // claves "k-i" (rival k, jugador i) actualmente dentro del alcance de disputa
function colisionRivalJugadores(){
  rivales.forEach((r, k) => {
    for (let i = 0; i < players.length; i++) {
      const p = players[i];
      const dx = p.x - r.x, dy = p.y - r.y;
      const dist = Math.hypot(dx, dy) || 0.001;
      const minDistFisico = p.r + r.r;
      const minDistDisputa = minDistFisico + RIVAL_ALCANCE;
      const clave = k + "-" + i;

      if (dist < minDistFisico) {
        const nx = dx / dist, ny = dy / dist;
        const overlap = minDistFisico - dist;
        p.x += nx * overlap / 2; p.y += ny * overlap / 2;
        r.x -= nx * overlap / 2; r.y -= ny * overlap / 2;
        const empuje = 40;
        p.vx += nx * empuje; p.vy += ny * empuje;
        r.vx -= nx * empuje; r.vy -= ny * empuje;
      }

      if (dist >= minDistDisputa) { chocandoRival.delete(clave); continue; }

      if (!chocandoRival.has(clave)) {
        const probEquipo = statsComunes.control / (statsComunes.control + RIVAL_CONTROL);
        if (conPelota === i && Math.random() >= probEquipo) {
          // el rival le gana la disputa: se la queda él, y el jugador se frena en seco
          conPelota = null;
          conPelotaRivalIdx = k;
          p.vx = 0; p.vy = 0;
          ultimoPateador = null;
          direccionEnvio = null;
          baseReceptores = null;
        } else if (conPelotaRivalIdx === k && Math.random() < probEquipo) {
          // el equipo recupera la disputa: pasa a controlarla ese jugador, y el rival se frena en seco
          conPelotaRivalIdx = null;
          conPelota = i;
          activo = i;
          r.vx = 0; r.vy = 0;
          ultimoPateador = null;
          direccionEnvio = null;
          baseReceptores = null;
        }
      }
      chocandoRival.add(clave);
    }
  });
}

// Si la pelota está suelta y algún jugador la toca, la domina (y si no era el activo, pasa a serlo).
// Quien la pateó/pasó no puede recuperarla hasta que la pelota salga al menos una vez de su radio.
// Mientras la tiene el rival, esto no se aplica: solo se la pueden disputar chocando contra él
// (ver colisionRivalJugadores), no por simple cercanía a la pelota.
function actualizarPosesion(){
  if (conPelota !== null || conPelotaRivalIdx !== null || conPelotaArquero || conPelotaArquero2 || ball.altura > 0) return;
  if (ultimoPateador !== null) {
    const p = players[ultimoPateador];
    const d = Math.hypot(ball.x - p.x, ball.y - p.y);
    if (d > p.r * RADIO_RECEPCION_FACTOR) ultimoPateador = null;
  }
  for (let i = 0; i < players.length; i++) {
    if (i === ultimoPateador) continue;
    const p = players[i];
    const d = Math.hypot(ball.x - p.x, ball.y - p.y);
    if (d < p.r * RADIO_RECEPCION_FACTOR) {
      conPelota = i;
      activo = i;
      ultimoPateador = null;
      direccionEnvio = null;
      baseReceptores = null;
      break;
    }
  }
}

// Salvo que el equipo propio ya tenga la pelota (o alguno de los dos arqueros la retenga), el
// control pasa solo al jugador propio más cercano a la pelota: tanto si está suelta (para no tener
// que cambiar manualmente ni quedarse manejando a alguien lejos mientras otro compañero está mejor
// parado para ir a buscarla) como si la tiene un rival (para poder salir a presionarlo al toque,
// sin tener que cambiar de jugador a mano primero). No aplica si ya hay un piloto automático
// dirigiendo a un receptor puntual (ver autopilotRestante — ese ya eligió a propósito a quién
// controlar) ni mientras un pase largo sigue en el aire (ball.altura): ahí ya hay una trayectoria
// clara hacia un punto de llegada, no tiene sentido saltar al que esté más cerca de la posición
// ACTUAL (todavía en vuelo) de la pelota.
function actualizarJugadorMasCercanoALaPelota(){
  if (conPelota !== null || conPelotaArquero || conPelotaArquero2) return;
  if (autopilotRestante > 0 || ball.altura > 0) return;
  let masCercano = 0, menorDist = Math.hypot(players[0].x - ball.x, players[0].y - ball.y);
  for (let i = 1; i < players.length; i++) {
    const d = Math.hypot(players[i].x - ball.x, players[i].y - ball.y);
    if (d < menorDist) { menorDist = d; masCercano = i; }
  }
  activo = masCercano;
}

// ── Cámara ────────────────────────────────────────────────
function actualizarCamara(dt){
  const objetivo = players[activo];
  const suavizado = 1 - Math.pow(0.001, dt);
  camera.x += (objetivo.x - camera.x) * suavizado;
  camera.y += (objetivo.y - camera.y) * suavizado;
}

// ── Dibujo ────────────────────────────────────────────────
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let scale = 1, viewW = VIEW_W, viewH = 600;

// En pantalla táctil (celular/tablet), el zoom se calcula desde el lado más corto de la
// pantalla, para que al rotar de vertical a horizontal se mantenga el mismo nivel de zoom
// (se ve más campo a los costados, en vez de acercar la cámara).
const ES_TACTIL = window.matchMedia("(pointer: coarse)").matches;

function ajustarTamano(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const base = ES_TACTIL ? Math.min(canvas.width, canvas.height) : canvas.width;
  scale = base / (ES_TACTIL ? VIEW_W : VIEW_W_ESCRITORIO);
  viewW = canvas.width / scale;
  viewH = canvas.height / scale;
}
window.addEventListener("resize", ajustarTamano);
ajustarTamano();

function dibujarCancha(){
  const franja = 100;
  const izq = camera.x - viewW/2 - franja, der = camera.x + viewW/2 + franja;
  const arriba = camera.y - viewH/2, abajo = camera.y + viewH/2;
  const primero = Math.floor(izq / franja) * franja;
  for (let x = primero; x < der; x += franja) {
    ctx.fillStyle = (Math.round(x / franja) % 2 === 0) ? "#2E7D32" : "#33862F";
    ctx.fillRect(x, arriba, franja, abajo - arriba);
  }

  // líneas de referencia cada 200 unidades, para percibir el movimiento en el campo infinito
  ctx.strokeStyle = "rgba(255,255,255,.12)";
  ctx.lineWidth = 2;
  const paso = 200;
  const yPrimero = Math.floor(arriba / paso) * paso;
  for (let y = yPrimero; y < abajo; y += paso) {
    ctx.beginPath(); ctx.moveTo(izq, y); ctx.lineTo(der, y); ctx.stroke();
  }

}

// Líneas de la cancha: de fondo (línea de mitad de cancha), laterales, y el fondo del otro lado
// (por ahora solo referencial, ya que el límite real de ese lado lo pone la red).
function dibujarLimites(){
  ctx.strokeStyle = "rgba(255,255,255,.55)";
  ctx.lineWidth = 4;
  ctx.strokeRect(CANCHA_X_MIN, -CANCHA_Y_LIMITE, CANCHA_X_MAX - CANCHA_X_MIN, CANCHA_Y_LIMITE * 2);
}

// Marcas de un arco: área grande, área chica, punto penal, la media luna (el arco de círculo
// alrededor del punto penal, recortado a la parte que queda fuera del área grande) y los dos
// cuartos de círculo de las esquinas (donde la línea de gol se junta con cada línea lateral).
// Se escribe una sola vez en términos del arco derecho (como si estuviera en x=0 mirando hacia
// +x) y se reusa para el izquierdo reflejando el sistema de coordenadas (scale(-1,1)): un
// stroke() no depende de la dirección de recorrido del trazo, así que reflejar el espacio da
// exactamente la marca espejada sin tener que rederivar cada ángulo a mano.
function dibujarMarcasDeArco(goal){
  ctx.save();
  ctx.translate(goal.x, 0);
  if (goal.signo < 0) ctx.scale(-1, 1);

  ctx.strokeStyle = "rgba(255,255,255,.55)";
  ctx.lineWidth = 3;

  // Área grande (coincide con el área del arquero) y área chica, "hacia adentro" de la cancha.
  ctx.strokeRect(-AREA_PROFUNDIDAD, -AREA_ANCHO/2, AREA_PROFUNDIDAD, AREA_ANCHO);
  ctx.strokeRect(-AREA_CHICA_PROFUNDIDAD, -AREA_CHICA_ANCHO/2, AREA_CHICA_PROFUNDIDAD, AREA_CHICA_ANCHO);

  // Punto penal
  const penalX = -PUNTO_PENAL_DISTANCIA;
  ctx.fillStyle = "rgba(255,255,255,.55)";
  ctx.beginPath(); ctx.arc(penalX, 0, 4, 0, Math.PI*2); ctx.fill();

  // Media luna: el círculo de radio RADIO_CIRCULO_CENTRAL centrado en el punto penal, pero solo
  // la parte que queda fuera del área grande (la línea del área la recorta).
  const dx = -AREA_PROFUNDIDAD - penalX; // negativo: el borde del área queda más cerca del arco que el radio
  const anguloCorte = Math.acos(Math.max(-1, Math.min(1, dx / RADIO_CIRCULO_CENTRAL)));
  ctx.beginPath();
  ctx.arc(penalX, 0, RADIO_CIRCULO_CENTRAL, anguloCorte, 2*Math.PI - anguloCorte);
  ctx.stroke();

  // Cuartos de círculo en las dos esquinas (línea de gol × línea lateral).
  ctx.beginPath();
  ctx.arc(0, -CANCHA_Y_LIMITE, RADIO_CORNER, Math.PI/2, Math.PI);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(0, CANCHA_Y_LIMITE, RADIO_CORNER, Math.PI, Math.PI*1.5);
  ctx.stroke();

  ctx.restore();
}

// Marcas de cancha: las de cada arco (ver dibujarMarcasDeArco) más el círculo central completo
// sobre la mitad de cancha real (con un solo arco existía nomás la mitad de este círculo, porque
// el mundo del juego terminaba justo ahí).
function dibujarMarcasCancha(){
  ARCOS.forEach(dibujarMarcasDeArco);

  ctx.strokeStyle = "rgba(255,255,255,.55)";
  ctx.lineWidth = 3;
  // Línea de medio campo, de lateral a lateral (faltaba: antes solo se dibujaba el círculo central).
  ctx.beginPath();
  ctx.moveTo(MITAD_CANCHA_X, -CANCHA_Y_LIMITE);
  ctx.lineTo(MITAD_CANCHA_X, CANCHA_Y_LIMITE);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(MITAD_CANCHA_X, 0, RADIO_CIRCULO_CENTRAL, 0, Math.PI*2);
  ctx.stroke();
}

// Dibuja la red (fondo y costados, la boca queda abierta) como una sola línea continua desde
// el poste superior hasta el inferior. Cuando hay un golpe reciente (mallaAbultamiento), la
// pared golpeada se curva hacia afuera con una curva cuadrática; el resto queda recta (el punto
// de control cae justo en la mitad del tramo, así la curva "recta" da una línea derecha).
function dibujarMalla(goal){
  const supY = -ARCO_ANCHO/2, infY = ARCO_ANCHO/2, fondoX = goal.x + goal.signo*ARCO_PROFUNDIDAD;
  const m = (mallaAbultamiento && mallaAbultamiento.arco === goal) ? mallaAbultamiento : null;

  ctx.beginPath();
  ctx.moveTo(goal.x, supY);

  if (m && m.pared === 'sup') ctx.quadraticCurveTo(m.x, supY - m.monto, fondoX, supY);
  else ctx.lineTo(fondoX, supY);

  if (m && m.pared === 'fondo') ctx.quadraticCurveTo(fondoX + goal.signo*m.monto, m.y, fondoX, infY);
  else ctx.lineTo(fondoX, infY);

  if (m && m.pared === 'inf') ctx.quadraticCurveTo(m.x, infY + m.monto, goal.x, infY);
  else ctx.lineTo(goal.x, infY);

  ctx.strokeStyle = "#fff"; ctx.lineWidth = 3;
  ctx.stroke();

  ctx.lineTo(goal.x, supY); // cierra el contorno de vuelta hacia la boca, para poder rellenar
  ctx.closePath();
  ctx.fillStyle = "rgba(255,255,255,.15)";
  ctx.fill();
}

function dibujarArco(goal){
  dibujarMalla(goal);
  // postes, más marcados
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(goal.x, -ARCO_ANCHO/2, POSTE_RADIO, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(goal.x, ARCO_ANCHO/2, POSTE_RADIO, 0, Math.PI*2); ctx.fill();
  // línea de gol
  ctx.strokeStyle = "rgba(255,255,255,.7)"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(goal.x, -ARCO_ANCHO/2 - 20); ctx.lineTo(goal.x, ARCO_ANCHO/2 + 20); ctx.stroke();
}

function dibujarJugador(p, esActivo, numero){
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
  ctx.fillStyle = p.color;
  ctx.fill();
  ctx.lineWidth = 4;
  ctx.strokeStyle = p.oscuro;
  ctx.stroke();

  // número identificador, para reconocer a cada jugador (coincide con su panel de stats)
  ctx.fillStyle = "#fff";
  ctx.font = `bold ${Math.round(p.r*0.9)}px Arial`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(numero, p.x, p.y);

  // indicador de hacia dónde mira (para entender el pateo/pase)
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
  ctx.lineTo(p.x + p.dirX * (p.r + 10), p.y + p.dirY * (p.r + 10));
  ctx.strokeStyle = "rgba(255,255,255,.9)";
  ctx.lineWidth = 3;
  ctx.stroke();

  if (esActivo) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r + 8, 0, Math.PI*2);
    ctx.strokeStyle = "rgba(255,255,255,.9)";
    ctx.lineWidth = 2.5;
    ctx.setLineDash([5,4]);
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

// Traza un pentágono regular centrado en (cx,cy), con el radio y la rotación dados.
function trazarPentagono(cx, cy, radio, rotacion){
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const ang = rotacion + i * (Math.PI*2/5) - Math.PI/2;
    const x = cx + Math.cos(ang) * radio, y = cy + Math.sin(ang) * radio;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}

function dibujarBalon(){
  ctx.save();
  ctx.translate(ball.x, ball.y);

  // Un pase largo "en el aire" (ball.altura>0) se dibuja más grande y con una sombra en su
  // posición real (más chica y tenue cuanto más alto) — como la vista es cenital pura (a
  // diferencia de un juego isométrico, "arriba" en la cancha es un eje de juego real, no se
  // puede correr el dibujo hacia allá para simular altura), el tamaño y la sombra son la única
  // forma de leerla sin romper la lectura de la posición x,y real.
  if (ball.altura > 0) {
    const t = Math.min(1, ball.altura / PASE_LARGO_ALTURA_MAX);
    ctx.beginPath();
    ctx.ellipse(0, 0, ball.r * (1 - 0.35*t), ball.r * (0.5 - 0.2*t), 0, 0, Math.PI*2);
    ctx.fillStyle = `rgba(0,0,0,${0.35 - 0.2*t})`;
    ctx.fill();
  }
  const escala = 1 + (ball.altura / PASE_LARGO_ALTURA_MAX) * 0.6;
  ctx.scale(escala, escala);

  ctx.beginPath();
  ctx.arc(0, 0, ball.r, 0, Math.PI*2);
  ctx.fillStyle = "#F5F5F0";
  ctx.fill();
  ctx.strokeStyle = "#222"; ctx.lineWidth = 2 / escala;
  ctx.stroke();
  ctx.clip(); // recorta las pintas al contorno de la pelota

  // Pintas pentagonales proyectadas desde el patrón 3D: solo se ven las que están del lado
  // de arriba (z>0), y se achican cerca del borde para simular la curva de la pelota.
  ctx.fillStyle = "#222";
  for (const p of ball.patron) {
    if (p.z <= 0) continue;
    const tam = ball.r * p.tam * (0.45 + 0.55 * p.z);
    trazarPentagono(p.x * ball.r, p.y * ball.r, tam, 0);
    ctx.fill();
  }

  ctx.restore();
}

function dibujar(){
  ctx.fillStyle = "#0a0a0a";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.scale(scale, scale);
  ctx.translate(viewW/2 - camera.x, viewH/2 - camera.y);

  dibujarCancha();
  dibujarLimites();
  dibujarMarcasCancha();
  ARCOS.forEach(dibujarArco);
  rivales.forEach((r, k) => dibujarJugador(r, false, "R" + (k + 1)));
  dibujarJugador(arquero, false, "A");
  dibujarJugador(arquero2, false, "A");
  players.forEach((p, i) => dibujarJugador(p, i === activo, i + 1));
  dibujarBalon();

  ctx.restore();
}

// ── Bucle principal ─────────────────────────────────────────
let ultimo = performance.now();
function bucle(ahora){
  let dt = (ahora - ultimo) / 1000;
  ultimo = ahora;
  dt = Math.min(dt, 1/30);

  actualizarJugadorMasCercanoALaPelota();

  const t = direccionTeclado();
  const magJoy = Math.min(1, Math.hypot(joyVec.dx, joyVec.dy));
  let dx, dy, pctMarcha;
  if (Math.hypot(t.dx, t.dy) > 0.05) {
    dx = t.dx; dy = t.dy;
    // En PC el movimiento con flechas trota por defecto; correr requiere mantener Shift (antes
    // corría siempre, sin dar opción a las otras marchas).
    pctMarcha = teclas["shift"] ? MARCHA_CORRER : MARCHA_TROTAR;
  } else {
    dx = joyVec.dx; dy = joyVec.dy; pctMarcha = marchaDesdeMagnitud(magJoy).pct;
  }

  // Recién cambiado al receptor de un pase largo (cambioDeJugadorAsistido): durante este ratito
  // se ignora el joystick/teclado y se lo mueve directo hacia la pelota, para no depender de qué
  // se esté apretando en ese instante (que un momento antes manejaba a otro jugador).
  if (autopilotRestante > 0) {
    autopilotRestante = Math.max(0, autopilotRestante - dt);
    const p = players[activo];
    const objetivo = puntoDeLlegadaPelota();
    const dxBalon = objetivo.x - p.x, dyBalon = objetivo.y - p.y;
    const distBalon = Math.hypot(dxBalon, dyBalon) || 1;
    dx = dxBalon / distBalon; dy = dyBalon / distBalon; pctMarcha = MARCHA_CORRER;
  }

  // Posición de cada uno antes de moverse este cuadro, para la colisión continua con los postes
  // (ver colisionPostesJugador): tiene que ser de antes de CUALQUIER cosa que pueda correrlos
  // este cuadro, movimiento propio o empujones de otras colisiones.
  const prevJugadores = players.map(p => ({ x: p.x, y: p.y }));
  const prevRivales = rivales.map(r => ({ x: r.x, y: r.y }));
  const prevArquero = { x: arquero.x, y: arquero.y };
  const prevArquero2 = { x: arquero2.x, y: arquero2.y };

  actualizarJugador(players[activo], dx, dy, pctMarcha, dt);
  actualizarIA(dt);
  actualizarRivales(dt);
  actualizarArquero(arquero, arqueroStats, ARCOS[0], rivales, dt);
  actualizarArquero(arquero2, arqueroStats2, ARCOS[1], players, dt);
  colisionJugadores();
  colisionRivalJugadores();
  colisionRivales();
  colisionArqueroJugadores(ARQUEROS[0]);
  colisionArqueroJugadores(ARQUEROS[1]);
  players.forEach((p, i) => { colisionPostesJugador(p, prevJugadores[i].x, prevJugadores[i].y); limitarJugadorACancha(p); });
  rivales.forEach((r, k) => { colisionPostesJugador(r, prevRivales[k].x, prevRivales[k].y); limitarJugadorACancha(r); });
  colisionPostesJugador(arquero, prevArquero.x, prevArquero.y);
  colisionPostesJugador(arquero2, prevArquero2.x, prevArquero2.y);
  const ballXAntes = ball.x, ballYAntes = ball.y;
  actualizarPelota(dt);
  colisionPostes(ballXAntes, ballYAntes);
  colisionArquero(ARQUEROS[0], ballXAntes, ballYAntes);
  colisionArquero(ARQUEROS[1], ballXAntes, ballYAntes);
  revisarGol();
  colisionMalla(dt);
  revisarLimites();
  revisarPelotaQuieta(dt);
  colisionRival();
  actualizarPosesion();
  actualizarCamara(dt);
  if (cargandoTiro) {
    tiempoCargaTiro = Math.min(tiempoCargaTiro + dt, TIRO_CARGA_DURACION);
    barraCargaTiroCubierta.style.width = (100 - (tiempoCargaTiro / TIRO_CARGA_DURACION) * 100) + "%";
  }
  if (cargandoPase) {
    tiempoCargaPase = Math.min(tiempoCargaPase + dt, PASE_CARGA_DURACION);
    barraCargaPaseCubierta.style.width = (100 - (tiempoCargaPase / PASE_CARGA_DURACION) * 100) + "%";
  }
  if (cargandoPaseLargo) {
    tiempoCargaPaseLargo = Math.min(tiempoCargaPaseLargo + dt, PASE_LARGO_CARGA_DURACION);
    barraCargaPaseLargoCubierta.style.width = (100 - (tiempoCargaPaseLargo / PASE_LARGO_CARGA_DURACION) * 100) + "%";
  }
  actualizarBarraFatiga(); // cambia en vivo según quién tiene la pelota
  dibujar();

  requestAnimationFrame(bucle);
}
