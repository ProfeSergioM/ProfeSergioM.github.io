<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Prototipo de fútbol</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
html, body {
  width:100%; height:100%; overflow:hidden; background:#0a0a0a;
  touch-action:none; font-family:Arial,Helvetica,sans-serif;
}
canvas { display:block; }

#ayuda {
  position:fixed; top:14px; left:0; right:0; text-align:center; pointer-events:none;
  color:rgba(255,255,255,.75); font-size:12px; z-index:5; padding:0 10px;
}

/* Controles en pantalla */
.control { position:fixed; z-index:8; }
#joystick {
  left:22px; bottom:22px; width:120px; height:120px; border-radius:50%;
  background:rgba(255,255,255,.10); border:2px solid rgba(255,255,255,.35);
}
#joystick-stick {
  position:absolute; left:50%; top:50%; width:52px; height:52px; border-radius:50%;
  background:rgba(255,255,255,.55); transform:translate(-50%,-50%);
}
#btn-patear {
  right:26px; bottom:34px; width:92px; height:92px; border-radius:50%;
  background:rgba(255,213,74,.85); border:2px solid rgba(0,0,0,.3);
  color:#1a1a1a; font-weight:bold; font-size:14px;
}
#btn-pasar {
  right:118px; bottom:58px; width:76px; height:76px; border-radius:50%;
  background:rgba(79,224,192,.85); border:2px solid rgba(0,0,0,.3);
  color:#0a2a22; font-weight:bold; font-size:13px;
}
#btn-reiniciar {
  top:14px; right:14px; padding:9px 14px; border-radius:8px; border:2px solid rgba(255,255,255,.4);
  background:rgba(0,0,0,.5); color:#fff; font-weight:bold; font-size:12px;
}
.control:active { filter:brightness(1.25); }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ayuda">Flechas: moverse · A: patear · S: pasar</div>
<button id="btn-reiniciar" class="control" type="button">Reiniciar</button>
<div id="joystick" class="control"><div id="joystick-stick"></div></div>
<button id="btn-pasar" class="control" type="button">Pasar</button>
<button id="btn-patear" class="control" type="button">Patear</button>

<script>
(function(){
"use strict";

// ── Cámara: cuánto del mundo se ve horizontalmente ───────────
const VIEW_W = 950;

// ── Atributos de jugador (escala 0-100: 0 nulo, 100 el máximo de diseño) ──
const VEL_DISENO_MAX = 260;    // unidades/seg cuando velocidad=100
const ACEL_DISENO_MAX = 1400;  // unidades/seg² cuando aceleración=100
const GIRO_DISENO_MAX = 16;    // rad/seg cuando agilidad=100 (qué tan rápido gira para cambiar de dirección)

// Control: qué tan pegada al jugador queda la pelota al dominarla.
const CONTROL_OFFSET_MIN = 42, CONTROL_OFFSET_MAX = 60;   // distancia pelota-jugador, en la dirección hacia la que mira
const CONTROL_FIRMEZA_MIN = 3, CONTROL_FIRMEZA_MAX = 14;  // qué tan rápido "alcanza" esa posición (más alto = más pegada)
const RADIO_CAPTURA = 16;      // margen extra (sobre el contacto físico) para tomar una pelota suelta

function crearJugador(color, oscuro, x, y){
  return {
    color, oscuro, x, y, vx:0, vy:0, dirX:1, dirY:0, r:26,
    velocidad:100, agilidad:100, aceleracion:100, control:100
  };
}

// ── Estado ──────────────────────────────────────────────────
const players = [
  crearJugador("#4FA3FF", "#1E62B0", -160, 0),
  crearJugador("#4FA3FF", "#1E62B0", 160, 0)
];
let activo = 0;
let conPelota = null; // índice del jugador que domina la pelota, o null si está suelta
let ultimoPateador = null; // evita que quien la pateó/pasó la recupere antes de que realmente se aleje
const ball = { x:-80, y:0, vx:0, vy:0, r:15*0.75, angulo:0 };
const camera = { x:players[0].x, y:players[0].y };

function posicionInicial(){
  players[0].x = -160; players[0].y = 0; players[0].vx = players[0].vy = 0; players[0].dirX = 1; players[0].dirY = 0;
  players[1].x = 160; players[1].y = 0; players[1].vx = players[1].vy = 0; players[1].dirX = -1; players[1].dirY = 0;
  ball.x = -80; ball.y = 0; ball.vx = ball.vy = 0;
  activo = 0;
  conPelota = null;
  ultimoPateador = null;
  chocando = false;
}

// ── Entradas: teclado ───────────────────────────────────────
const teclas = Object.create(null);
window.addEventListener("keydown", e => {
  teclas[e.key.toLowerCase()] = true;
  if (e.key.toLowerCase() === "a") { e.preventDefault(); patear(); }
  if (e.key.toLowerCase() === "s") { e.preventDefault(); pasar(); }
});
window.addEventListener("keyup", e => { teclas[e.key.toLowerCase()] = false; });

function direccionTeclado(){
  let dx = 0, dy = 0;
  if (teclas["arrowleft"]) dx -= 1;
  if (teclas["arrowright"]) dx += 1;
  if (teclas["arrowup"]) dy -= 1;
  if (teclas["arrowdown"]) dy += 1;
  return { dx, dy };
}

// ── Entradas: joystick táctil ────────────────────────────────
const joyBase = document.getElementById("joystick");
const joyStick = document.getElementById("joystick-stick");
let joyVec = { dx:0, dy:0 };
let joyPointerId = null;

function joyDesdeEvento(e){
  const rect = joyBase.getBoundingClientRect();
  const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
  const max = rect.width/2;
  let dx = e.clientX - cx, dy = e.clientY - cy;
  const dist = Math.hypot(dx, dy) || 1;
  const clamp = Math.min(dist, max);
  dx = dx/dist*clamp; dy = dy/dist*clamp;
  joyStick.style.transform = `translate(${dx - 26}px, ${dy - 26}px)`;
  joyVec.dx = dx/max; joyVec.dy = dy/max;
  joyStick.style.background = marchaDesdeMagnitud(dist/max).color;
}
function joySoltar(){
  joyPointerId = null; joyVec.dx = 0; joyVec.dy = 0;
  joyStick.style.transform = "translate(-50%,-50%)";
  joyStick.style.background = "";
}
joyBase.addEventListener("pointerdown", e => { joyPointerId = e.pointerId; joyBase.setPointerCapture(e.pointerId); joyDesdeEvento(e); });
joyBase.addEventListener("pointermove", e => { if (e.pointerId === joyPointerId) joyDesdeEvento(e); });
joyBase.addEventListener("pointerup", joySoltar);
joyBase.addEventListener("pointercancel", joySoltar);

// ── Botones ───────────────────────────────────────────────
document.getElementById("btn-patear").addEventListener("pointerdown", e => { e.preventDefault(); patear(); });
document.getElementById("btn-pasar").addEventListener("pointerdown", e => { e.preventDefault(); pasar(); });
document.getElementById("btn-reiniciar").addEventListener("pointerdown", e => { e.preventDefault(); posicionInicial(); });

const VELOCIDAD_TIRO = 620, VELOCIDAD_PASE = 480;

// Patear y pasar solo funcionan si el jugador activo domina la pelota en ese momento.
function patear(){
  if (conPelota !== activo) return;
  const p = players[activo];
  ball.vx += p.dirX * VELOCIDAD_TIRO;
  ball.vy += p.dirY * VELOCIDAD_TIRO;
  conPelota = null;
  ultimoPateador = activo;
}

function pasar(){
  if (conPelota !== activo) return;
  const p = players[activo];
  ball.vx += p.dirX * VELOCIDAD_PASE;
  ball.vy += p.dirY * VELOCIDAD_PASE;
  conPelota = null;
  ultimoPateador = activo;
  // El foco cambia de jugador cuando el compañero efectivamente la recibe (ver actualizarPosesion).
}

// ── Física ────────────────────────────────────────────────
const FRICCION_JUGADOR = 6;
// Coeficiente de roce entre la pelota y el piso (por ahora fijo; en el futuro podría
// variar según el terreno). Cuanto más alto, más rápido frena una pelota suelta.
const ROCE_PELOTA = 1.1;

// Marchas del joystick: caminar / trotar / correr, como % del tope de velocidad del jugador.
// El teclado (flechas) siempre corre, porque es una entrada de todo o nada.
const MARCHA_CAMINAR = 42, MARCHA_TROTAR = 71, MARCHA_CORRER = 100;
const UMBRAL_TROTAR = 0.4, UMBRAL_CORRER = 0.75;

function marchaDesdeMagnitud(m){
  if (m < UMBRAL_TROTAR) return { nombre:"caminar", pct:MARCHA_CAMINAR, color:"rgba(255,255,255,.55)" };
  if (m < UMBRAL_CORRER) return { nombre:"trotar", pct:MARCHA_TROTAR, color:"rgba(255,255,255,.85)" };
  return { nombre:"correr", pct:MARCHA_CORRER, color:"rgba(255,213,74,.9)" };
}

// Gira dirX/dirY hacia (dx,dy) sin superar giroMax radianes/seg (limita qué tan rápido cambia de dirección).
function girarHacia(p, dx, dy, giroMax, dt){
  const anguloActual = Math.atan2(p.dirY, p.dirX);
  const anguloObjetivo = Math.atan2(dy, dx);
  let diff = Math.atan2(Math.sin(anguloObjetivo - anguloActual), Math.cos(anguloObjetivo - anguloActual));
  const paso = Math.max(-giroMax * dt, Math.min(giroMax * dt, diff));
  const nuevo = anguloActual + paso;
  p.dirX = Math.cos(nuevo); p.dirY = Math.sin(nuevo);
}

function actualizarJugador(p, dx, dy, pctMarcha, dt){
  const len = Math.hypot(dx, dy);
  if (len > 0.05) {
    dx /= len; dy /= len;
    girarHacia(p, dx, dy, GIRO_DISENO_MAX * (p.agilidad / 100), dt);
    const acel = ACEL_DISENO_MAX * (p.aceleracion / 100);
    p.vx += p.dirX * acel * dt;
    p.vy += p.dirY * acel * dt;
  } else {
    const f = Math.max(0, 1 - FRICCION_JUGADOR * dt);
    p.vx *= f; p.vy *= f;
  }
  const velTope = VEL_DISENO_MAX * (p.velocidad / 100) * (pctMarcha / 100);
  const vel = Math.hypot(p.vx, p.vy);
  if (vel > velTope) { p.vx = p.vx/vel*velTope; p.vy = p.vy/vel*velTope; }
  p.x += p.vx * dt; p.y += p.vy * dt;
}

// El jugador sin la pelota (modo práctica) sigue al que la lleva, manteniéndose a unos metros.
const DISTANCIA_SEGUIMIENTO = 90;
function actualizarIA(dt){
  const seguidor = players[1 - activo];
  if (conPelota !== activo) { actualizarJugador(seguidor, 0, 0, 0, dt); return; }
  const portador = players[activo];
  const ddx = portador.x - seguidor.x, ddy = portador.y - seguidor.y;
  const dist = Math.hypot(ddx, ddy);
  if (dist <= DISTANCIA_SEGUIMIENTO) { actualizarJugador(seguidor, 0, 0, 0, dt); return; }
  const pct = dist > 300 ? MARCHA_CORRER : MARCHA_TROTAR;
  actualizarJugador(seguidor, ddx/dist, ddy/dist, pct, dt);
}

// Qué tan pegada queda la pelota al jugador que la domina, según su atributo "control".
function nivelControl(control){
  const t = control / 100;
  return {
    offset: CONTROL_OFFSET_MAX + (CONTROL_OFFSET_MIN - CONTROL_OFFSET_MAX) * t,
    firmeza: CONTROL_FIRMEZA_MIN + (CONTROL_FIRMEZA_MAX - CONTROL_FIRMEZA_MIN) * t
  };
}

function actualizarPelota(dt){
  if (conPelota !== null) {
    const p = players[conPelota];
    const n = nivelControl(p.control);
    const tx = p.x + p.dirX * n.offset, ty = p.y + p.dirY * n.offset;
    const s = Math.min(1, n.firmeza * dt);
    ball.x += (tx - ball.x) * s;
    ball.y += (ty - ball.y) * s;
    ball.vx = p.vx; ball.vy = p.vy;
  } else {
    const f = Math.max(0, 1 - ROCE_PELOTA * dt);
    ball.vx *= f; ball.vy *= f;
    ball.x += ball.vx * dt; ball.y += ball.vy * dt;
  }
  // Efecto de rodado: gira proporcional a la velocidad, como si rodara sobre el piso.
  ball.angulo = (ball.angulo + (Math.hypot(ball.vx, ball.vy) / ball.r) * dt) % (Math.PI * 2);
}

// Los jugadores no pueden atravesarse: si se encuentran, chocan y se separan.
// Como son compañeros, si chocan mientras alguno domina la pelota, esta queda al azar en uno de los dos.
let chocando = false;
function colisionJugadores(){
  const a = players[0], b = players[1];
  const dx = b.x - a.x, dy = b.y - a.y;
  const dist = Math.hypot(dx, dy) || 0.001;
  const minDist = a.r + b.r;
  if (dist >= minDist) { chocando = false; return; }

  const nx = dx / dist, ny = dy / dist;
  const overlap = minDist - dist;
  a.x -= nx * overlap / 2; a.y -= ny * overlap / 2;
  b.x += nx * overlap / 2; b.y += ny * overlap / 2;
  const empuje = 40;
  a.vx -= nx * empuje; a.vy -= ny * empuje;
  b.vx += nx * empuje; b.vy += ny * empuje;

  if (!chocando && conPelota !== null) {
    conPelota = Math.random() < 0.5 ? 0 : 1;
    activo = conPelota;
    ultimoPateador = null;
  }
  chocando = true;
}

// Si la pelota está suelta y algún jugador la toca, la domina (y si no era el activo, pasa a serlo).
// Quien la pateó/pasó no puede recuperarla hasta que la pelota salga al menos una vez de su radio.
function actualizarPosesion(){
  if (conPelota !== null) return;
  if (ultimoPateador !== null) {
    const p = players[ultimoPateador];
    const d = Math.hypot(ball.x - p.x, ball.y - p.y);
    if (d > p.r + ball.r + RADIO_CAPTURA) ultimoPateador = null;
  }
  for (let i = 0; i < players.length; i++) {
    if (i === ultimoPateador) continue;
    const p = players[i];
    const d = Math.hypot(ball.x - p.x, ball.y - p.y);
    if (d < p.r + ball.r + RADIO_CAPTURA) {
      conPelota = i;
      activo = i;
      ultimoPateador = null;
      break;
    }
  }
}

// ── Cámara ────────────────────────────────────────────────
function actualizarCamara(dt){
  const objetivo = players[activo];
  const suavizado = 1 - Math.pow(0.001, dt);
  camera.x += (objetivo.x - camera.x) * suavizado;
  camera.y += (objetivo.y - camera.y) * suavizado;
}

// ── Dibujo ────────────────────────────────────────────────
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let scale = 1, viewH = 600;

function ajustarTamano(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  scale = canvas.width / VIEW_W;
  viewH = canvas.height / scale;
}
window.addEventListener("resize", ajustarTamano);
ajustarTamano();

function dibujarCancha(){
  const franja = 100;
  const izq = camera.x - VIEW_W/2 - franja, der = camera.x + VIEW_W/2 + franja;
  const arriba = camera.y - viewH/2, abajo = camera.y + viewH/2;
  const primero = Math.floor(izq / franja) * franja;
  for (let x = primero; x < der; x += franja) {
    ctx.fillStyle = (Math.round(x / franja) % 2 === 0) ? "#2E7D32" : "#33862F";
    ctx.fillRect(x, arriba, franja, abajo - arriba);
  }

  // líneas de referencia cada 200 unidades, para percibir el movimiento en el campo infinito
  ctx.strokeStyle = "rgba(255,255,255,.12)";
  ctx.lineWidth = 2;
  const paso = 200;
  const yPrimero = Math.floor(arriba / paso) * paso;
  for (let y = yPrimero; y < abajo; y += paso) {
    ctx.beginPath(); ctx.moveTo(izq, y); ctx.lineTo(der, y); ctx.stroke();
  }

  // marca central de referencia (punto de saque)
  ctx.strokeStyle = "rgba(255,255,255,.5)";
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, 0, 60, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = "rgba(255,255,255,.5)";
  ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI*2); ctx.fill();
}

function dibujarJugador(p, esActivo){
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
  ctx.fillStyle = p.color;
  ctx.fill();
  ctx.lineWidth = 4;
  ctx.strokeStyle = p.oscuro;
  ctx.stroke();

  // indicador de hacia dónde mira (para entender el pateo/pase)
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
  ctx.lineTo(p.x + p.dirX * (p.r + 10), p.y + p.dirY * (p.r + 10));
  ctx.strokeStyle = "rgba(255,255,255,.9)";
  ctx.lineWidth = 3;
  ctx.stroke();

  if (esActivo) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r + 8, 0, Math.PI*2);
    ctx.strokeStyle = "rgba(255,255,255,.9)";
    ctx.lineWidth = 2.5;
    ctx.setLineDash([5,4]);
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

// Traza un pentágono regular centrado en (cx,cy), con el radio y la rotación dados.
function trazarPentagono(cx, cy, radio, rotacion){
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const ang = rotacion + i * (Math.PI*2/5) - Math.PI/2;
    const x = cx + Math.cos(ang) * radio, y = cy + Math.sin(ang) * radio;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}

function dibujarBalon(){
  ctx.save();
  ctx.translate(ball.x, ball.y);
  ctx.rotate(ball.angulo);

  ctx.beginPath();
  ctx.arc(0, 0, ball.r, 0, Math.PI*2);
  ctx.fillStyle = "#F5F5F0";
  ctx.fill();
  ctx.strokeStyle = "#222"; ctx.lineWidth = 2;
  ctx.stroke();
  ctx.clip(); // recorta las pintas al contorno de la pelota

  // pintas pentagonales simples, como un balón clásico, que giran con el rodado
  ctx.fillStyle = "#222";
  trazarPentagono(0, 0, ball.r*0.42, 0);
  ctx.fill();
  for (let i = 0; i < 5; i++) {
    const ang = i * (Math.PI*2/5);
    const cx = Math.cos(ang - Math.PI/2) * ball.r*0.62;
    const cy = Math.sin(ang - Math.PI/2) * ball.r*0.62;
    trazarPentagono(cx, cy, ball.r*0.34, ang);
    ctx.fill();
  }

  ctx.restore();
}

function dibujar(){
  ctx.fillStyle = "#0a0a0a";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.scale(scale, scale);
  ctx.translate(VIEW_W/2 - camera.x, viewH/2 - camera.y);

  dibujarCancha();
  players.forEach((p, i) => dibujarJugador(p, i === activo));
  dibujarBalon();

  ctx.restore();
}

// ── Bucle principal ─────────────────────────────────────────
let ultimo = performance.now();
function bucle(ahora){
  let dt = (ahora - ultimo) / 1000;
  ultimo = ahora;
  dt = Math.min(dt, 1/30);

  const t = direccionTeclado();
  const magJoy = Math.min(1, Math.hypot(joyVec.dx, joyVec.dy));
  let dx, dy, pctMarcha;
  if (Math.hypot(t.dx, t.dy) > 0.05) {
    dx = t.dx; dy = t.dy; pctMarcha = MARCHA_CORRER;
  } else {
    dx = joyVec.dx; dy = joyVec.dy; pctMarcha = marchaDesdeMagnitud(magJoy).pct;
  }

  actualizarJugador(players[activo], dx, dy, pctMarcha, dt);
  actualizarIA(dt);
  colisionJugadores();
  actualizarPelota(dt);
  actualizarPosesion();
  actualizarCamara(dt);
  dibujar();

  requestAnimationFrame(bucle);
}
posicionInicial();
requestAnimationFrame(bucle);

})();
</script>
</body>
</html>
