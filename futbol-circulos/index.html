<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Prototipo de fútbol</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
html, body {
  width:100%; height:100%; overflow:hidden; background:#0a0a0a;
  touch-action:none; font-family:Arial,Helvetica,sans-serif;
}
canvas { display:block; }

#ayuda {
  position:fixed; top:14px; left:0; right:0; text-align:center; pointer-events:none;
  color:rgba(255,255,255,.75); font-size:12px; z-index:5; padding:0 10px;
}

/* Cartel de "¡GOL!" al anotar */
#gol {
  position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
  pointer-events:none; z-index:6; opacity:0; transition:opacity .15s;
}
#gol span {
  font-size:clamp(40px,12vw,90px); font-weight:900; color:#FFD54A;
  text-shadow:0 0 14px rgba(0,0,0,.8), 0 0 30px rgba(255,213,74,.6);
  letter-spacing:.04em; transform:rotate(-6deg);
}
#gol.mostrar { opacity:1; }

/* Controles en pantalla */
.control { position:fixed; z-index:8; }
#joystick {
  left:22px; bottom:22px; width:120px; height:120px; border-radius:50%;
  background:rgba(255,255,255,.10); border:2px solid rgba(255,255,255,.35);
}
#joystick-stick {
  position:absolute; left:50%; top:50%; width:52px; height:52px; border-radius:50%;
  background:rgba(255,255,255,.55); transform:translate(-50%,-50%);
}
#btn-patear {
  right:26px; bottom:34px; width:92px; height:92px; border-radius:50%;
  background:rgba(255,213,74,.85); border:2px solid rgba(0,0,0,.3);
  color:#1a1a1a; font-weight:bold; font-size:14px;
}
#btn-pasar {
  right:118px; bottom:58px; width:76px; height:76px; border-radius:50%;
  background:rgba(79,224,192,.85); border:2px solid rgba(0,0,0,.3);
  color:#0a2a22; font-weight:bold; font-size:13px;
}
#btn-pase-largo {
  right:196px; bottom:88px; width:64px; height:64px; border-radius:50%;
  background:rgba(122,162,255,.85); border:2px solid rgba(0,0,0,.3);
  color:#0a1a3a; font-weight:bold; font-size:11px;
}
#btn-reiniciar {
  top:14px; right:14px; padding:9px 14px; border-radius:8px; border:2px solid rgba(255,255,255,.4);
  background:rgba(0,0,0,.5); color:#fff; font-weight:bold; font-size:12px;
}
#btn-parametros {
  top:14px; right:100px; padding:9px 14px; border-radius:8px; border:2px solid rgba(255,255,255,.4);
  background:rgba(0,0,0,.5); color:#fff; font-weight:bold; font-size:12px;
}
.control:active { filter:brightness(1.25); }

/* Barra de carga del tiro: se llena mientras se mantiene presionado patear.
   Dorado hasta la mitad (precisión intacta), rojo en la otra mitad (precisión cae). */
#barra-carga-tiro {
  position:fixed; right:26px; bottom:132px; width:92px; height:8px; border-radius:4px;
  overflow:hidden; z-index:8; pointer-events:none; opacity:0; transition:opacity .1s;
  background:linear-gradient(to right, #FFD54A 0%, #FFD54A 50%, #FF5C5C 100%);
  border:1px solid rgba(0,0,0,.4);
}
#barra-carga-tiro.activa { opacity:1; }
#barra-carga-tiro-cubierta { position:absolute; top:0; right:0; height:100%; width:100%; background:rgba(0,0,0,.6); }

/* Barra de carga del pase: mismo mecanismo, pero sin penalidad de precisión (un solo color). */
#barra-carga-pase {
  position:fixed; right:118px; bottom:142px; width:76px; height:8px; border-radius:4px;
  overflow:hidden; z-index:8; pointer-events:none; opacity:0; transition:opacity .1s;
  background:#4FE0C0; border:1px solid rgba(0,0,0,.4);
}
#barra-carga-pase.activa { opacity:1; }
#barra-carga-pase-cubierta { position:absolute; top:0; right:0; height:100%; width:100%; background:rgba(0,0,0,.6); }

/* Barra de carga del pase largo: mismo mecanismo, propio color para distinguirla. */
#barra-carga-pase-largo {
  position:fixed; right:196px; bottom:154px; width:64px; height:8px; border-radius:4px;
  overflow:hidden; z-index:8; pointer-events:none; opacity:0; transition:opacity .1s;
  background:#7AA2FF; border:1px solid rgba(0,0,0,.4);
}
#barra-carga-pase-largo.activa { opacity:1; }
#barra-carga-pase-largo-cubierta { position:absolute; top:0; right:0; height:100%; width:100%; background:rgba(0,0,0,.6); }

/* Una sola caja de stats, compartida por los 3 jugadores del equipo, lo más arriba posible */
#panel-stats {
  position:fixed; top:56px; left:10px;
  width:130px; background:rgba(0,0,0,.55); color:#fff; border-radius:10px;
  padding:9px 10px; font-size:11px; z-index:5; pointer-events:none;
}
#panel-stats h3 { font-size:12px; margin-bottom:7px; opacity:.9; }
/* Atributos fijos (no se gastan): solo nombre y valor, sin barra */
.stat-fila-simple { display:flex; justify-content:space-between; opacity:.85; margin-bottom:3px; }
.stat-fila-simple .stat-valor { color:#fff; font-weight:bold; }
/* Aguante y energía de sprint: del jugador que tiene la pelota (o el activo, si está suelta).
   Comparten una sola barra: el aguante es la capa de base y la energía de sprint (que nunca
   puede superarlo) se dibuja encima, de otro color. */
.stat-fila { margin-top:8px; padding-top:7px; border-top:1px solid rgba(255,255,255,.15); }
.stat-fila .stat-nombre { display:flex; justify-content:space-between; opacity:.85; margin-bottom:3px; }
.stat-fila .stat-nombre.chica { font-size:9px; opacity:.7; margin-top:4px; margin-bottom:0; }
.stat-barra { position:relative; height:7px; border-radius:3px; background:rgba(255,255,255,.18); overflow:hidden; }
.stat-relleno { position:absolute; left:0; top:0; height:100%; }
.stat-relleno.aguante { background:#FFB454; }
.stat-relleno.sprint { background:#5AD1FF; }

/* Panel con las variables/constantes del motor que estamos afinando: arranca oculto,
   el botón "Vars" lo muestra/oculta. */
#panel-parametros {
  position:fixed; top:34px; left:50%; transform:translateX(-50%);
  max-width:min(92vw, 600px); background:rgba(0,0,0,.5); color:rgba(255,255,255,.85);
  border-radius:8px; padding:6px 10px; font-size:10px; z-index:5; pointer-events:none;
  display:flex; flex-wrap:wrap; gap:3px 12px; justify-content:center;
}
#panel-parametros[hidden] { display:none; }
#panel-parametros b { color:#fff; }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ayuda">Flechas: moverse (Shift: correr) · A (mantener): cargar tiro · S (mantener): cargar pase · D (mantener): cargar pase largo · Marcador: <span id="golesPropios">0</span> - <span id="golesRivales">0</span></div>
<div id="gol"><span>¡GOL!</span></div>
<div id="panel-parametros" hidden></div>
<div id="panel-stats"><h3>Stats del equipo</h3></div>
<button id="btn-parametros" class="control" type="button">Vars</button>
<button id="btn-reiniciar" class="control" type="button">Reiniciar</button>
<div id="joystick" class="control"><div id="joystick-stick"></div></div>
<div id="barra-carga-pase"><div id="barra-carga-pase-cubierta"></div></div>
<button id="btn-pasar" class="control" type="button">Pasar</button>
<div id="barra-carga-pase-largo"><div id="barra-carga-pase-largo-cubierta"></div></div>
<button id="btn-pase-largo" class="control" type="button">Pase largo</button>
<div id="barra-carga-tiro"><div id="barra-carga-tiro-cubierta"></div></div>
<button id="btn-patear" class="control" type="button">Patear</button>

<script>
(function(){
"use strict";

// ── Cámara: cuánto del mundo se ve horizontalmente ───────────
// En PC, el ancho de la ventana suele ser mucho mayor que el de una pantalla táctil, así que con
// el mismo VIEW_W el juego se veía muy de cerca (mismo ancho en unidades repartido en muchos más
// píxeles = más zoom). Por eso en PC se usa un VIEW_W más grande (se ve más cancha a la vez).
const VIEW_W = 950;             // táctil (celular/tablet)
const VIEW_W_ESCRITORIO = 1400; // PC

// ── Atributos de jugador (escala 0-100: 0 nulo, 100 el máximo de diseño) ──
const VEL_DISENO_MAX = 260;    // unidades/seg cuando velocidad=100
const ACEL_DISENO_MAX = 1400;  // unidades/seg² cuando aceleración=100
// "Agilidad" (statsComunes.agilidad) por ahora no maneja nada: manejaba qué tan rápido giraba la
// mirada del jugador, pero eso ahora es instantáneo (ver actualizarJugador) para no dejar un
// arco incómodo en cómo la pelota sigue al jugador al dominarla. Se deja el stat en el equipo por
// si más adelante se le encuentra otro uso.

// Control: qué tan pegada al jugador queda la pelota al dominarla.
const CONTROL_OFFSET_MIN = 42, CONTROL_OFFSET_MAX = 60;   // distancia pelota-jugador, en la dirección hacia la que mira
const CONTROL_FIRMEZA_MIN = 3, CONTROL_FIRMEZA_MAX = 14;  // qué tan rápido "alcanza" esa posición (más alto = más pegada)
// Radio de recepción: no hace falta que la pelota vaya directo al jugador para que la reciba,
// alcanza con que pase a menos de esta cantidad de "radios suyos" de distancia.
const RADIO_RECEPCION_FACTOR = 2;

// Atributos del equipo (0-100 cada uno): los comparten los 3 jugadores, no son individuales.
const statsComunes = {
  velocidad:100, agilidad:100, aceleracion:100, control:100, sprint:100, resistencia:100,
  potenciaTiro:100, precisionTiro:100, precisionPase:100
};

function crearJugador(color, oscuro){
  return {
    color, oscuro, x:0, y:0, vx:0, vy:0, dirX:1, dirY:0, r:26,
    // Recursos de fatiga: estos sí son individuales, cada jugador se cansa por su cuenta.
    energiaSprint:100, aguante:100
  };
}

// ── Estado ──────────────────────────────────────────────────
const players = [
  crearJugador("#4FA3FF", "#1E62B0"),
  crearJugador("#4FA3FF", "#1E62B0"),
  crearJugador("#4FA3FF", "#1E62B0"),
  crearJugador("#4FA3FF", "#1E62B0"),
  crearJugador("#4FA3FF", "#1E62B0")
];

// ── Caja de stats, única para todo el equipo (no se gastan: se muestran como número, sin barra) ──
const STATS_MOSTRADAS = [
  ["velocidad","Velocidad"], ["agilidad","Agilidad"], ["aceleracion","Aceleración"], ["control","Control"],
  ["sprint","Sprint"], ["resistencia","Resistencia"],
  ["potenciaTiro","Potencia tiro"], ["precisionTiro","Precisión tiro"], ["precisionPase","Precisión pase"]
];
function crearFilaSimple(contenedor, etiqueta){
  const fila = document.createElement("div"); fila.className = "stat-fila-simple";
  fila.innerHTML = `<span>${etiqueta}</span><span class="stat-valor"></span>`;
  contenedor.appendChild(fila);
  return { valor: fila.querySelector(".stat-valor") };
}
const filasPanelStats = (() => {
  const contenedor = document.getElementById("panel-stats");
  const filas = {};
  STATS_MOSTRADAS.forEach(([clave, etiqueta]) => { filas[clave] = crearFilaSimple(contenedor, etiqueta); });
  return filas;
})();
function actualizarPanelStats(){
  STATS_MOSTRADAS.forEach(([clave]) => {
    filasPanelStats[clave].valor.textContent = Math.round(statsComunes[clave]);
  });
}

// Aguante y energía de sprint: a diferencia de los atributos de arriba, estos sí son
// individuales y cambian jugando, así que van con barra y se actualizan cada cuadro. Muestran
// los del jugador que tiene la pelota (o el activo, si está suelta). Comparten una sola barra:
// el aguante es la base, y la energía de sprint (que nunca la supera) se dibuja encima.
function crearFilaFatiga(contenedor){
  const fila = document.createElement("div"); fila.className = "stat-fila";
  const nombreAguante = document.createElement("div"); nombreAguante.className = "stat-nombre";
  nombreAguante.innerHTML = `<span>Aguante</span><span class="stat-valor"></span>`;
  const barra = document.createElement("div"); barra.className = "stat-barra";
  const rellenoAguante = document.createElement("div"); rellenoAguante.className = "stat-relleno aguante";
  const rellenoSprint = document.createElement("div"); rellenoSprint.className = "stat-relleno sprint";
  barra.appendChild(rellenoAguante); barra.appendChild(rellenoSprint);
  const nombreSprint = document.createElement("div"); nombreSprint.className = "stat-nombre chica";
  nombreSprint.innerHTML = `<span>Energía sprint</span><span class="stat-valor"></span>`;
  fila.appendChild(nombreAguante); fila.appendChild(barra); fila.appendChild(nombreSprint);
  contenedor.appendChild(fila);
  return {
    valorAguante: nombreAguante.querySelector(".stat-valor"), rellenoAguante,
    valorSprint: nombreSprint.querySelector(".stat-valor"), rellenoSprint
  };
}
const filaFatiga = crearFilaFatiga(document.getElementById("panel-stats"));
function actualizarBarraFatiga(){
  const jugador = players[conPelota !== null ? conPelota : activo];
  const aguante = Math.max(0, Math.min(100, jugador.aguante));
  const sprint = Math.max(0, Math.min(100, jugador.energiaSprint));
  filaFatiga.valorAguante.textContent = Math.round(aguante);
  filaFatiga.rellenoAguante.style.width = aguante + "%";
  filaFatiga.valorSprint.textContent = Math.round(sprint);
  filaFatiga.rellenoSprint.style.width = sprint + "%";
}

let activo = 0;
let conPelota = null; // índice del jugador que domina la pelota, o null si está suelta
let conPelotaRivalIdx = null; // índice (en rivales) de quién la domina, o null (ver colisionRivalJugadores)
let ultimoPateador = null; // evita que quien la pateó/pasó la recupere antes de que realmente se aleje
// Mientras la pelota va camino a un compañero, este se acomoda un poco hacia donde se movía
// quien se la envió, para ayudar a recibirla (ver actualizarIA).
let direccionEnvio = null;    // {x,y} dirección de quien pateó/pasó, al momento de soltar la pelota
let baseReceptores = null;    // posición de cada compañero al momento del envío, para no alejarlos más de la cuenta

// Pintas de la pelota: puntos fijos sobre una esfera unitaria (marco propio de la pelota).
// z>0 mira hacia la cámara (arriba); z<=0 queda del otro lado y no se dibuja.
// Se reparten con una espiral de Fibonacci: es la forma más simple de distribuir puntos
// de manera pareja sobre una esfera, así la cobertura de pintas queda regular y sin huecos.
const PINTAS_CANTIDAD = 34, PINTAS_TAM = 0.26;
const ANGULO_DORADO = Math.PI * (3 - Math.sqrt(5));
function crearPatronPelota(){
  const puntos = [];
  for (let i = 0; i < PINTAS_CANTIDAD; i++) {
    const z = 1 - (2*i + 1) / PINTAS_CANTIDAD;
    const radio = Math.sqrt(1 - z*z);
    const az = i * ANGULO_DORADO;
    puntos.push({ x: radio*Math.cos(az), y: radio*Math.sin(az), z, tam: PINTAS_TAM });
  }
  return puntos;
}

// "altura"/"vuelo*" son para el arco del pase largo (ver pasarLargo y actualizarPelota): no es una
// dimensión física real (el resto del juego es 2D puro), solo gatea qué tan "por el aire" está la
// pelota — mientras vuela no colisiona con nadie, como un pase por arriba de la cancha.
// x/y son un valor cualquiera de arranque: posicionInicial() (más abajo, usa MITAD_CANCHA_X, que
// todavía no existe a esta altura del archivo) la pisa antes de que el juego arranque de verdad.
const ball = { x:0, y:0, vx:0, vy:0, r:15*0.75, altura:0, vueloRestante:0, vueloTotal:0, patron: crearPatronPelota() };
const camera = { x:0, y:0 };

// Formación inicial de los 5 jugadores del equipo, como desplazamiento fijo respecto del punto de
// saque (ver MITAD_CANCHA_X/posicionInicial más abajo) — no en coordenadas absolutas, así funciona
// sea cual sea el punto de saque. Reglamentario: solo el equipo que saca puede tener jugadores
// DENTRO del círculo central (ver RADIO_CIRCULO_CENTRAL, más abajo, ≈275u) — el resto de la cancha
// (afuera del círculo) sí queda repartida en el propio campo, igual que antes. El equipo propio
// ataca hacia +x (ARCO_X) pero defiende del lado de ARCO_X2, o sea que su campo propio es el de x
// NEGATIVA respecto del saque. Acá siempre saca el equipo propio: el primero (pateador) queda
// pegado a la pelota (y arranca con posesión, ver posicionInicial) y el segundo (receptor del
// primer pase) también adentro del círculo pero a distancia de pase corto; los otros 3 quedan
// afuera del círculo, como en cualquier reinicio.
const FORMACION_INICIAL_OFFSET = [
  { x:-35,  y:0,   dirX:1, dirY:0 },
  { x:-170, y:120, dirX:1, dirY:0 },
  { x:-480, y:-280, dirX:1, dirY:0 },
  { x:-680, y:-480, dirX:1, dirY:0 },
  { x:-680, y:480,  dirX:1, dirY:0 }
];

// ── Rivales (5, como el equipo propio: marcan/cubren cuando el equipo propio ataca, atacan el
// arco propio por su cuenta cuando tienen la pelota — ver actualizarRivales/decidirAtaqueRival) ──
const rivales = [
  crearJugador("#E64A4A", "#B23030"),
  crearJugador("#E64A4A", "#B23030"),
  crearJugador("#E64A4A", "#B23030"),
  crearJugador("#E64A4A", "#B23030"),
  crearJugador("#E64A4A", "#B23030")
];
// A diferencia de FORMACION_INICIAL_OFFSET, esta NO es un espejo: el equipo rival nunca saca (ver
// posicionInicial), así que el reglamento exige que sus 5 jugadores queden SIEMPRE fuera del
// círculo central (a la misma distancia de su arco que antes tenía el equipo propio en su propia
// formación pre-saque-con-posesión). Todo offset de acá tiene |x|≥300, de sobra afuera del círculo
// central sin importar la y; el signo es positivo porque el campo propio del rival es el lado de
// x POSITIVA respecto del saque (defiende ARCO_X, el equipo propio ataca ese lado).
const RIVALES_FORMACION_INICIAL = [
  { x:300,  y:0,    dirX:-1, dirY:0 },
  { x:480,  y:-280, dirX:-1, dirY:0 },
  { x:480,  y:280,  dirX:-1, dirY:0 },
  { x:680,  y:-480, dirX:-1, dirY:0 },
  { x:680,  y:480,  dirX:-1, dirY:0 }
];
// "Control" de cada rival para disputar la pelota al chocar con el portador (ver colisionRivalJugadores):
// el equipo usa su stat compartido "control", los rivales usan este valor fijo. Con el default de
// ambos (100 y 50) el equipo se queda con la pelota 2 de cada 3 disputas.
const RIVAL_CONTROL = 50;

function posicionInicial(){
  // Punto de saque: el centro real de la cancha (mismo desplazamiento para ambos equipos desde
  // ahí, ver FORMACION_INICIAL_OFFSET/RIVALES_FORMACION_INICIAL) — con dos arcos, tiene que ser el
  // centro de verdad para que ningún lado arranque más cerca de su objetivo que el otro.
  players.forEach((p, i) => {
    const f = FORMACION_INICIAL_OFFSET[i];
    p.x = MITAD_CANCHA_X + f.x; p.y = f.y; p.vx = 0; p.vy = 0; p.dirX = f.dirX; p.dirY = f.dirY;
    p.energiaSprint = 100; p.aguante = 100;
  });
  camera.x = players[0].x; camera.y = players[0].y;
  ball.x = MITAD_CANCHA_X; ball.y = 0; ball.vx = ball.vy = 0;
  ball.altura = 0; ball.vueloRestante = 0; ball.vueloTotal = 0;
  ball.patron = crearPatronPelota();
  activo = 0;
  // El saque siempre lo da el equipo propio: el pateador (jugador 0, ver FORMACION_INICIAL_OFFSET)
  // arranca CON la pelota, no solo cerca — así el puntapié inicial se ve como corresponde (un
  // jugador parado sobre la pelota, no esperando a que la física se la "enganche" un cuadro más
  // tarde) y el otro jugador dentro del círculo queda claramente esperando el primer pase.
  conPelota = 0;
  conPelotaRivalIdx = null;
  conPelotaArquero = false;
  conPelotaArquero2 = false;
  autopilotRestante = 0;
  ultimoPateador = null;
  ultimoRivalDesviador = null;
  ultimoPateadorRival = null;
  rivalAtascadoTiempo = 0;
  rivalAtascadoX = 0; rivalAtascadoY = 0;
  pelotaQuietaTiempo = 0;
  direccionEnvio = null;
  baseReceptores = null;
  chocando = new Set();
  chocandoRival = new Set();
  cargandoTiro = false;
  tiempoCargaTiro = 0;
  barraCargaTiro.classList.remove("activa");
  cargandoPase = false;
  tiempoCargaPase = 0;
  barraCargaPase.classList.remove("activa");
  cargandoPaseLargo = false;
  tiempoCargaPaseLargo = 0;
  barraCargaPaseLargo.classList.remove("activa");
  mallaAbultamiento = null;
  rivales.forEach((r, i) => {
    const f = RIVALES_FORMACION_INICIAL[i];
    r.x = MITAD_CANCHA_X + f.x; r.y = f.y; r.vx = 0; r.vy = 0; r.dirX = f.dirX; r.dirY = f.dirY;
    r.energiaSprint = 100; r.aguante = 100;
  });
  arquero.x = ARQUERO_INICIAL.x; arquero.y = ARQUERO_INICIAL.y; arquero.vx = 0; arquero.vy = 0;
  arquero.dirX = ARQUERO_INICIAL.dirX; arquero.dirY = ARQUERO_INICIAL.dirY;
  arquero.energiaSprint = 100; arquero.aguante = 100;
  arquero2.x = ARQUERO2_INICIAL.x; arquero2.y = ARQUERO2_INICIAL.y; arquero2.vx = 0; arquero2.vy = 0;
  arquero2.dirX = ARQUERO2_INICIAL.dirX; arquero2.dirY = ARQUERO2_INICIAL.dirY;
  arquero2.energiaSprint = 100; arquero2.aguante = 100;
}

// ── Entradas: teclado ───────────────────────────────────────
const teclas = Object.create(null);
window.addEventListener("keydown", e => {
  teclas[e.key.toLowerCase()] = true;
  if (e.key.toLowerCase() === "a" && !e.repeat) { e.preventDefault(); iniciarCargaTiro(); }
  if (e.key.toLowerCase() === "s" && !e.repeat) { e.preventDefault(); iniciarCargaPase(); }
  if (e.key.toLowerCase() === "d" && !e.repeat) { e.preventDefault(); iniciarCargaPaseLargo(); }
});
window.addEventListener("keyup", e => {
  teclas[e.key.toLowerCase()] = false;
  if (e.key.toLowerCase() === "a") soltarTiro();
  if (e.key.toLowerCase() === "s") soltarPase();
  if (e.key.toLowerCase() === "d") soltarPaseLargo();
});

function direccionTeclado(){
  let dx = 0, dy = 0;
  if (teclas["arrowleft"]) dx -= 1;
  if (teclas["arrowright"]) dx += 1;
  if (teclas["arrowup"]) dy -= 1;
  if (teclas["arrowdown"]) dy += 1;
  return { dx, dy };
}

// ── Entradas: joystick táctil ────────────────────────────────
const joyBase = document.getElementById("joystick");
const joyStick = document.getElementById("joystick-stick");
let joyVec = { dx:0, dy:0 };
let joyPointerId = null;

function joyDesdeEvento(e){
  const rect = joyBase.getBoundingClientRect();
  const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
  const max = rect.width/2;
  let dx = e.clientX - cx, dy = e.clientY - cy;
  const dist = Math.hypot(dx, dy) || 1;
  const clamp = Math.min(dist, max);
  dx = dx/dist*clamp; dy = dy/dist*clamp;
  joyStick.style.transform = `translate(${dx - 26}px, ${dy - 26}px)`;
  joyVec.dx = dx/max; joyVec.dy = dy/max;
  joyStick.style.background = marchaDesdeMagnitud(dist/max).color;
}
function joySoltar(){
  joyPointerId = null; joyVec.dx = 0; joyVec.dy = 0;
  joyStick.style.transform = "translate(-50%,-50%)";
  joyStick.style.background = "";
}
joyBase.addEventListener("pointerdown", e => { joyPointerId = e.pointerId; joyBase.setPointerCapture(e.pointerId); joyDesdeEvento(e); });
joyBase.addEventListener("pointermove", e => { if (e.pointerId === joyPointerId) joyDesdeEvento(e); });
joyBase.addEventListener("pointerup", joySoltar);
joyBase.addEventListener("pointercancel", joySoltar);

// Potencia de tiro/pase: velocidad de la pelota cuando la carga llega al 100%.
const PASE_POTENCIA_DISENO_MAX = 600; // el pase no tiene stat de potencia: la maneja la carga
const TIRO_POTENCIA_DISENO_MAX = PASE_POTENCIA_DISENO_MAX * 3; // el tiro debe ser bastante más fuerte que el pase
// Precisión: cuánto puede desviarse (en radianes) la patada de hacia donde mira el jugador,
// cuando la precisión efectiva es 0. Con 100 no hay desvío.
const TIRO_PRECISION_ERROR_MAX = Math.PI / 6;  // 30°
const PASE_PRECISION_ERROR_MAX = Math.PI / 9;  // 20°

// Carga del tiro: mantener presionado patear llena una barra en TIRO_CARGA_DURACION segundos.
// Hasta la mitad de la carga, controla la potencia y la precisión queda intacta (100% del stat).
// Pasada la mitad, se sigue ganando potencia, pero la precisión cae del 100% al 50% del stat.
const TIRO_CARGA_DURACION = 0.5; // segundos para cargar al máximo
let cargandoTiro = false;
let tiempoCargaTiro = 0;

const barraCargaTiro = document.getElementById("barra-carga-tiro");
const barraCargaTiroCubierta = document.getElementById("barra-carga-tiro-cubierta");

function iniciarCargaTiro(){
  if (conPelota !== activo) return; // sin la pelota no hay nada que cargar
  cargandoTiro = true;
  tiempoCargaTiro = 0;
  barraCargaTiro.classList.add("activa");
  barraCargaTiroCubierta.style.width = "100%";
}

function soltarTiro(){
  if (!cargandoTiro) return;
  cargandoTiro = false;
  barraCargaTiro.classList.remove("activa");
  patear(tiempoCargaTiro / TIRO_CARGA_DURACION);
}

// Carga del pase: mismo mecanismo que el tiro, pero sin penalidad de precisión (la precisión
// siempre depende del stat "precisionPase", cargues lo que cargues). Sirve para poder dosificar
// la potencia y así habilitar pases cortos: una carga breve alcanza para un pase de cerca.
const PASE_CARGA_DURACION = 0.25; // segundos para cargar al máximo
// Aunque se suelte al instante (carga=0), el pase nunca sale con menos de este % de potencia:
// evita que un toque brevísimo deje la pelota prácticamente sin moverse.
const PASE_CARGA_MINIMA = 0.33;
let cargandoPase = false;
let tiempoCargaPase = 0;

const barraCargaPase = document.getElementById("barra-carga-pase");
const barraCargaPaseCubierta = document.getElementById("barra-carga-pase-cubierta");

function iniciarCargaPase(){
  if (conPelota !== activo) return;
  cargandoPase = true;
  tiempoCargaPase = 0;
  barraCargaPase.classList.add("activa");
  barraCargaPaseCubierta.style.width = "100%";
}

function soltarPase(){
  if (!cargandoPase) return;
  cargandoPase = false;
  barraCargaPase.classList.remove("activa");
  pasar(tiempoCargaPase / PASE_CARGA_DURACION);
}

// Pase largo: mismo mecanismo de carga que el pase corto, pero con más potencia (cruza más
// cancha, para un cambio de frente o un pase al hueco por encima de la marca), carga más lenta
// (un balón largo no sale de un toque instantáneo, hay que "levantar la cabeza" un momento) y
// más imprecisión (un balón largo es más difícil de ubicar con exactitud que uno corto).
const PASE_LARGO_POTENCIA_DISENO_MAX = 1000;
const PASE_LARGO_CARGA_DURACION = 0.6; // segundos para cargar al máximo
const PASE_LARGO_CARGA_MINIMA = 0.5;
const PASE_LARGO_PRECISION_ERROR_MAX = Math.PI / 5; // 36°, más que los 20° del pase corto
let cargandoPaseLargo = false;
let tiempoCargaPaseLargo = 0;

const barraCargaPaseLargo = document.getElementById("barra-carga-pase-largo");
const barraCargaPaseLargoCubierta = document.getElementById("barra-carga-pase-largo-cubierta");

function iniciarCargaPaseLargo(){
  if (conPelota !== activo) return;
  cargandoPaseLargo = true;
  tiempoCargaPaseLargo = 0;
  barraCargaPaseLargo.classList.add("activa");
  barraCargaPaseLargoCubierta.style.width = "100%";
}

function soltarPaseLargo(){
  if (!cargandoPaseLargo) return;
  cargandoPaseLargo = false;
  barraCargaPaseLargo.classList.remove("activa");
  pasarLargo(tiempoCargaPaseLargo / PASE_LARGO_CARGA_DURACION);
}

// Registra hacia dónde se movía quien soltó la pelota, para que los compañeros se acomoden un poco (ver actualizarIA).
function registrarEnvio(p){
  direccionEnvio = { x: p.dirX, y: p.dirY };
  baseReceptores = players.map(j => ({ x: j.x, y: j.y }));
}

// Patea con la carga [0,1] alcanzada. La potencia escala con toda la carga; la precisión se
// mantiene al 100% del stat hasta la mitad de la carga, y de ahí en más baja hasta el 50% del stat.
// Núcleo físico de cualquier patada/pase (propio o rival): dado hacia dónde apunta y con qué
// potencia/precisión, aplica el error al azar (a menos precisión efectiva, más se puede desviar
// del apuntado exacto) y el impulso resultante a la pelota. Devuelve el ángulo REAL (con error
// incluido) por si a quien llama le hace falta (p. ej. cambioDeJugadorAsistido, que busca a quién
// queda alineado el envío tal como salió, no como se apuntó).
function impulsarPelota(dirX, dirY, potencia, precisionEfectiva, errorMax){
  const error = (1 - precisionEfectiva / 100) * errorMax * (Math.random() * 2 - 1);
  const angulo = Math.atan2(dirY, dirX) + error;
  ball.vx += Math.cos(angulo) * potencia;
  ball.vy += Math.sin(angulo) * potencia;
  return angulo;
}

function patear(carga){
  if (conPelota !== activo) return;
  const p = players[activo];
  const factorPrecision = carga <= 0.5 ? 1 : (1.5 - carga);
  const potencia = TIRO_POTENCIA_DISENO_MAX * (statsComunes.potenciaTiro / 100) * carga;
  const precisionEfectiva = statsComunes.precisionTiro * factorPrecision;
  impulsarPelota(p.dirX, p.dirY, potencia, precisionEfectiva, TIRO_PRECISION_ERROR_MAX);
  conPelota = null;
  ultimoPateador = activo;
  registrarEnvio(p);
}

// Pasa con la carga [0,1] alcanzada, con la potencia/carga mínima/error de precisión que le
// pasen (pase corto o pase largo comparten toda esta lógica, solo cambian esos tres números): la
// potencia escala con la carga, entre la carga mínima (aunque se suelte al instante) y el máximo;
// la precisión no cambia con la carga, siempre depende de "precisionPase".
function pasarConConfig(carga, potenciaMax, cargaMinima, errorMax){
  if (conPelota !== activo) return false;
  const p = players[activo];
  const potencia = potenciaMax * (cargaMinima + (1 - cargaMinima) * carga);
  const angulo = impulsarPelota(p.dirX, p.dirY, potencia, statsComunes.precisionPase, errorMax);
  conPelota = null;
  registrarEnvio(p);
  ultimoPateador = activo;
  // Si nadie recibe antes (p. ej. lo intercepta el rival), el foco vuelve a cambiar cuando la
  // pelota efectivamente llegue a otro jugador (ver actualizarPosesion).
  cambioDeJugadorAsistido(p, angulo);
  return true;
}
function pasar(carga){
  pasarConConfig(carga, PASE_POTENCIA_DISENO_MAX, PASE_CARGA_MINIMA, PASE_PRECISION_ERROR_MAX);
}
// El pase largo, a diferencia del corto, va por arriba: mientras está "en el aire" (ball.altura>0)
// no colisiona con nadie (ver actualizarPelota y los guards de altura en colisionPostes,
// colisionArquero, colisionRival, revisarGol y actualizarPosesion), como un balón por encima de la
// marca. La duración del vuelo escala con la carga (un pase largo bien cargado se queda más
// tiempo arriba, como un envío más "levantado"); la altura en sí es solo lógica/visual, no una
// dimensión física real del resto del juego.
const PASE_LARGO_ALTURA_MAX = 90;
const PASE_LARGO_DURACION_VUELO_MIN = 0.5;
const PASE_LARGO_DURACION_VUELO_MAX = 1.0;
// Cuánta velocidad conserva al aterrizar (ver actualizarPelota): el roce del aire durante medio
// segundo o poco más casi no frena la pelota, así que sin esto llegaba al piso todavía a una
// velocidad que nadie puede alcanzar corriendo.
const PASE_LARGO_ATERRIZAJE_AMORTIGUACION = 0.55;
function pasarLargo(carga){
  const ok = pasarConConfig(carga, PASE_LARGO_POTENCIA_DISENO_MAX, PASE_LARGO_CARGA_MINIMA, PASE_LARGO_PRECISION_ERROR_MAX);
  if (!ok) return;
  ball.vueloTotal = PASE_LARGO_DURACION_VUELO_MIN + (PASE_LARGO_DURACION_VUELO_MAX - PASE_LARGO_DURACION_VUELO_MIN) * carga;
  ball.vueloRestante = ball.vueloTotal;
}

// "Cambio de jugador asistido": si el pase apunta a un compañero que queda más lejos que el
// doble del radio de recepción (el mismo que ya usa actualizarPosesion para detectar que alguien
// la recibió: RADIO_RECEPCION_FACTOR×r), el control salta de inmediato a ese compañero, en vez de
// esperar a que la pelota le llegue físicamente. Para pases cortos (al doble de radio o menos) no
// hace nada: seguís controlando a quien pateó.
//
// Apenas ocurre el cambio, el receptor todavía no está bajo control real: el humano puede estar
// apretando cualquier cosa (lo que le servía para manejar al pasador un instante antes, que ya no
// tiene por qué apuntar hacia la pelota). Por eso, durante CAMBIO_ASISTIDO_AUTOPILOT segundos el
// motor lo mueve solo, directo hacia la pelota, ignorando el joystick/teclado; pasado ese
// tiempo, el control vuelve a responder a lo que se esté apretando (ver bucle()).
const CAMBIO_ASISTIDO_FACTOR = RADIO_RECEPCION_FACTOR * 2; // ×r
const CAMBIO_ASISTIDO_AUTOPILOT = 0.5; // segundos que se mueve solo hacia la pelota tras el cambio
let autopilotRestante = 0;

function cambioDeJugadorAsistido(pasador, angulo){
  const dirX = Math.cos(angulo), dirY = Math.sin(angulo);
  let receptor = null, mejorAlineacion = 0; // >0: exige que quede al menos algo adelante del pase
  players.forEach((candidato, i) => {
    if (i === activo) return;
    const dx = candidato.x - pasador.x, dy = candidato.y - pasador.y;
    const dist = Math.hypot(dx, dy) || 1;
    const alineacion = (dx / dist) * dirX + (dy / dist) * dirY;
    if (alineacion > mejorAlineacion) { mejorAlineacion = alineacion; receptor = i; }
  });
  if (receptor === null) return; // ningún compañero queda claramente en la dirección del pase

  const distancia = Math.hypot(players[receptor].x - pasador.x, players[receptor].y - pasador.y);
  if (distancia > pasador.r * CAMBIO_ASISTIDO_FACTOR) {
    activo = receptor;
    autopilotRestante = CAMBIO_ASISTIDO_AUTOPILOT;
  }
}

// ── Física ────────────────────────────────────────────────
const FRICCION_JUGADOR = 6;
// Coeficiente de roce entre la pelota y el piso (por ahora fijo; en el futuro podría
// variar según el terreno). Cuanto más alto, más rápido frena una pelota suelta.
const ROCE_PELOTA = 1.1;

// Marchas del joystick: caminar / trotar / correr, como % del tope de velocidad del jugador.
// El teclado (flechas) siempre corre, porque es una entrada de todo o nada.
const MARCHA_CAMINAR = 42, MARCHA_TROTAR = 71, MARCHA_CORRER = 100;
const UMBRAL_TROTAR = 0.4, UMBRAL_CORRER = 0.75;

function marchaDesdeMagnitud(m){
  if (m < UMBRAL_TROTAR) return { nombre:"caminar", pct:MARCHA_CAMINAR, color:"rgba(255,255,255,.55)" };
  if (m < UMBRAL_CORRER) return { nombre:"trotar", pct:MARCHA_TROTAR, color:"rgba(255,255,255,.85)" };
  return { nombre:"correr", pct:MARCHA_CORRER, color:"rgba(255,213,74,.9)" };
}

// ── Fatiga ────────────────────────────────────────────────
// Energía de sprint: de corto plazo, se agota rápido corriendo a fondo. Cuánto depende del
// atributo "sprint" del jugador (100 = se agota más lento). Se recupera en cuanto deja de esprintar.
const ENERGIA_SPRINT_TASA_MAX = 40, ENERGIA_SPRINT_TASA_MIN = 12; // %/seg, según el atributo sprint
const ENERGIA_SPRINT_RECUPERACION = 25; // %/seg, mientras no esprinta

// Aguante (resistencia general): de largo plazo. Lo que gasta o recupera cada segundo depende
// del atributo "resistencia" del jugador, calibrado con la distribución real de movimiento de
// un futbolista profesional en 90 minutos: ~35min caminando, ~44min trotando, ~1.5min
// esprintando, y el resto (~9.5min) parado en pausas del juego (eso no gasta ni recupera).
// Un jugador con resistencia=50 (el "promedio") agota sus 100 puntos de aguante haciendo
// justo esa distribución en todo el partido; con resistencia=100 le rinde el doble.
const RESISTENCIA_EFECTO_CAMINAR = 1;     // unidades de esfuerzo/seg caminando (referencia)
const RESISTENCIA_EFECTO_SPRINT = 8;      // unidades de esfuerzo/seg esprintando (relativo a caminar)
const RESISTENCIA_EFECTO_TROTAR = -1/3;   // trotando se recupera, a un tercio de la tasa de caminar

const RESISTENCIA_MIN_CAMINAR = 35 * 60, RESISTENCIA_MIN_TROTAR = 44 * 60, RESISTENCIA_MIN_SPRINT = 1.5 * 60;
const RESISTENCIA_UNIDADES_REFERENCIA =
  RESISTENCIA_MIN_CAMINAR * RESISTENCIA_EFECTO_CAMINAR +
  RESISTENCIA_MIN_TROTAR * RESISTENCIA_EFECTO_TROTAR +
  RESISTENCIA_MIN_SPRINT * RESISTENCIA_EFECTO_SPRINT; // las pausas no gastan ni recuperan
const RESISTENCIA_STAT_REFERENCIA = 50; // el stat "promedio" que agota los 100 puntos justo con lo de arriba
const RESISTENCIA_CAPACIDAD_POR_STAT = RESISTENCIA_UNIDADES_REFERENCIA / RESISTENCIA_STAT_REFERENCIA;

// %/seg de aguante que gana (efecto<0) o pierde (efecto>0) un jugador con este stat de resistencia.
function tasaAguante(stat, efecto){
  const capacidad = RESISTENCIA_CAPACIDAD_POR_STAT * Math.max(stat, 1);
  return (100 / capacidad) * efecto;
}

function actualizarFatiga(p, moviendo, sprintando, marchaResultante, dt){
  if (sprintando) {
    const tasa = ENERGIA_SPRINT_TASA_MAX + (ENERGIA_SPRINT_TASA_MIN - ENERGIA_SPRINT_TASA_MAX) * (statsComunes.sprint / 100);
    p.energiaSprint = Math.max(0, p.energiaSprint - tasa * dt);
  } else {
    p.energiaSprint = Math.min(100, p.energiaSprint + ENERGIA_SPRINT_RECUPERACION * dt);
  }

  let efecto = 0; // parado (sin moverse): no gasta ni recupera aguante
  if (moviendo) {
    if (sprintando) efecto = RESISTENCIA_EFECTO_SPRINT;
    else if (marchaResultante === MARCHA_TROTAR) efecto = RESISTENCIA_EFECTO_TROTAR;
    else efecto = RESISTENCIA_EFECTO_CAMINAR;
  }
  p.aguante = Math.max(0, Math.min(100, p.aguante - tasaAguante(statsComunes.resistencia, efecto) * dt));

  // El techo de la energía de sprint es el aguante actual: con poco aguante en el tanque,
  // quedan ráfagas de sprint más cortas (y en 0 de aguante, directamente no se puede esprintar).
  p.energiaSprint = Math.min(p.energiaSprint, p.aguante);
}

function actualizarJugador(p, dx, dy, pctMarcha, dt){
  const len = Math.hypot(dx, dy);
  const moviendo = len > 0.05;

  // Si se pide correr pero no queda energía de sprint, se cae a trote hasta recuperar un poco.
  let marchaResultante = pctMarcha;
  const sprintando = moviendo && pctMarcha === MARCHA_CORRER && p.energiaSprint > 0;
  if (moviendo && pctMarcha === MARCHA_CORRER && p.energiaSprint <= 0) marchaResultante = MARCHA_TROTAR;
  actualizarFatiga(p, moviendo, sprintando, marchaResultante, dt);

  if (moviendo) {
    dx /= len; dy /= len;
    // La mirada (dirX/dirY) apunta directo hacia donde se pide ir, igual que la aceleración: si
    // girara gradualmente (como hacía antes, según la agilidad), quedaba un arco incómodo en
    // cómo la pelota "sigue" al jugador al dominarla (su posición depende de la mirada) cada vez
    // que cambiaba de dirección de golpe, por ejemplo al salir corriendo a buscarla — aunque el
    // movimiento en sí ya fuera directo desde el arreglo anterior.
    p.dirX = dx; p.dirY = dy;
    const acel = ACEL_DISENO_MAX * (statsComunes.aceleracion / 100);
    p.vx += dx * acel * dt;
    p.vy += dy * acel * dt;
  } else {
    const f = Math.max(0, 1 - FRICCION_JUGADOR * dt);
    p.vx *= f; p.vy *= f;
  }
  // El aguante agotado también resta un poco de tope de velocidad en general.
  const factorAguante = 0.5 + 0.5 * (p.aguante / 100);
  const velTope = VEL_DISENO_MAX * (statsComunes.velocidad / 100) * (marchaResultante / 100) * factorAguante;
  const vel = Math.hypot(p.vx, p.vy);
  if (vel > velTope) { p.vx = p.vx/vel*velTope; p.vy = p.vy/vel*velTope; }
  p.x += p.vx * dt; p.y += p.vy * dt;
}

// Los jugadores sin la pelota (modo práctica) tratan de mantenerse a DISTANCIA_TRIANGULO tanto
// del portador como del otro compañero, a la vez (como un resorte hacia esa distancia con cada
// uno de los otros dos): si alguno está más cerca de lo debido, tira para alejarse de ese; si
// está más lejos, tira para acercarse. Sumando el tirón de ambos quedan repartidos en una
// especie de triángulo equilátero de forma natural, sin asignarles un lado a mano y sin que
// "perseguirlos" los acerque en vez de alejarlos: si el portador se acerca de más, ese término
// del tirón apunta directamente para el otro lado. La distancia es fija por ahora; más adelante
// podría depender de los stats del equipo.
const DISTANCIA_TRIANGULO = 360; // el doble que antes (180)
const TRIANGULO_DEADZONE = 20; // magnitud del tirón combinado por debajo de la cual ya se considera "en posición"

// Tirón hacia la distancia ideal respecto de cada uno de los "otros" jugadores (positivo =
// alejarse porque está más cerca de lo debido; negativo, en la práctica, tira para acercarse).
function tironApoyo(seguidor, otros){
  let fx = 0, fy = 0;
  for (const otro of otros) {
    const dx = seguidor.x - otro.x, dy = seguidor.y - otro.y;
    const dist = Math.hypot(dx, dy) || 1;
    const error = DISTANCIA_TRIANGULO - dist;
    fx += (dx / dist) * error;
    fy += (dy / dist) * error;
  }
  return { x: fx, y: fy };
}

// Además de mantener la formación con los compañeros (tironApoyo), un jugador de apoyo sin la
// pelota busca alejarse del oponente que tenga más cerca, si lo tiene demasiado pegado: no tiene
// sentido quedarse parado en el punto "geométricamente correcto" del triángulo si con moverse un
// poco a un lado quedaría desmarcado para recibir. El tirón de formación sigue pesando más (este
// solo lo corrige hacia el lado más despejado); si no hay ningún oponente lo bastante cerca, el
// resultado es igual al de tironApoyo solo.
const APOYO_ESPACIO_DISTANCIA = 250; // si el oponente más cercano está más pegado que esto, se aleja de él
const APOYO_ESPACIO_PESO = 0.5;      // cuánto pesa esto respecto del tirón de formación (1 = mismo peso)

function apoyoConEspacio(seguidor, companeros, oponentes){
  const tiron = tironApoyo(seguidor, companeros);
  if (oponentes.length === 0) return tiron;
  let masCercano = oponentes[0], menorDist = Math.hypot(oponentes[0].x-seguidor.x, oponentes[0].y-seguidor.y);
  for (let k = 1; k < oponentes.length; k++) {
    const dk = Math.hypot(oponentes[k].x-seguidor.x, oponentes[k].y-seguidor.y);
    if (dk < menorDist) { menorDist = dk; masCercano = oponentes[k]; }
  }
  if (menorDist >= APOYO_ESPACIO_DISTANCIA) return tiron;
  const dx = seguidor.x-masCercano.x, dy = seguidor.y-masCercano.y, len = Math.hypot(dx,dy) || 1;
  const peso = APOYO_ESPACIO_PESO * (1 - menorDist/APOYO_ESPACIO_DISTANCIA);
  const magTiron = Math.hypot(tiron.x, tiron.y) || 1;
  return { x: tiron.x + (dx/len)*peso*magTiron, y: tiron.y + (dy/len)*peso*magTiron };
}

// Mientras la pelota va suelta camino a él, el receptor se acomoda un poco (como máximo dos
// radios suyos) hacia donde se movía quien se la envió, para ayudar a recibirla.
const RECEPCION_AJUSTE_MAX_FACTOR = 2;

function actualizarIA(dt){
  if (conPelotaRivalIdx !== null) {
    // El rival ataca: los compañeros que no maneja el humano arman marca+cobertura, igual que
    // hacen los rivales cuando el equipo propio ataca (ver actualizarDefensa) — el humano (activo)
    // queda libre para salir a presionar por su cuenta (ver actualizarJugadorMasCercanoALaPelota,
    // que ya lo puede llevar solo hacia el rival con la pelota).
    const defensores = players.filter((_, i) => i !== activo);
    actualizarDefensa(defensores, rivales, conPelotaRivalIdx, ARCOS[1], dt);
    return;
  }
  players.forEach((seguidor, i) => {
    if (i === activo) return; // este lo maneja el jugador (ver bucle principal)

    if (conPelota === activo) {
      const otros = players.filter((_, j) => j !== i); // el portador y los demás compañeros
      const tiron = apoyoConEspacio(seguidor, otros, rivales);
      const mag = Math.hypot(tiron.x, tiron.y);
      if (mag <= TRIANGULO_DEADZONE) { actualizarJugador(seguidor, 0, 0, 0, dt); return; }
      const pct = mag > DISTANCIA_TRIANGULO ? MARCHA_CORRER : MARCHA_TROTAR;
      actualizarJugador(seguidor, tiron.x/mag, tiron.y/mag, pct, dt);
      return;
    }

    if (direccionEnvio && baseReceptores) {
      const base = baseReceptores[i];
      const movido = Math.hypot(seguidor.x - base.x, seguidor.y - base.y);
      if (movido < seguidor.r * RECEPCION_AJUSTE_MAX_FACTOR) {
        actualizarJugador(seguidor, direccionEnvio.x, direccionEnvio.y, MARCHA_CAMINAR, dt);
        return;
      }
    }
    actualizarJugador(seguidor, 0, 0, 0, dt);
  });
}

// Marca y cobertura de quien defiende (de cualquiera de los dos lados) contra quien ataca: el
// defensor más cercano al portador SIEMPRE se le encima (marca de cerca, corriendo directo hacia
// él sin frenar antes de tiempo — la marca solo es útil si realmente llega a disputarle la pelota,
// ver colisionRivalJugadores), nunca más de uno al portador. Los demás cubren líneas de pase, no
// al portador — cada cubridor libre tapa a UN compañero del portador, más pegado al portador si la
// línea es corta (ahí casi no da tiempo de reaccionar, importa cortar la salida) o más pegado al
// receptor si es larga (ahí sí da tiempo, importa llegar antes que la pelota — ver
// DEFENSA_COBERTURA_DISTANCIA_MIN). Si hay más compañeros que cubridores libres (al equipo le falta
// gente: p. ej. el equipo propio defendiendo con el humano afuera, o un equipo grande con muchas
// bajas), se cubre a los MÁS PELIGROSOS primero (los más cerca del arco que se ataca — una amenaza
// de gol más inmediata que alguien retrasado) y el resto queda sin cubrir, no es que "se reparten
// mal" cubriendo lo mismo dos veces. A cada compañero elegido lo cubre el cubridor libre que le
// queda más cerca A ÉL (no por orden de lista), para no cruzar carreras innecesariamente. Sin nada
// de lo anterior (pelota suelta, o entre que se corta un pase y alguien la recupera) cada quien se
// queda quieto: no persiguen la pelota suelta por su cuenta esperando a que sea de alguien.
const DEFENSA_COBERTURA_FRACCION_LARGA = 0.65;  // cerca del compañero: hay tiempo, importa llegar antes que la pelota
const DEFENSA_COBERTURA_FRACCION_CORTA = 0.4;   // cerca del portador: casi no hay tiempo, importa cortar la salida
// Distancia al portador a partir de la cual la línea de un compañero cuenta como "larga" (fracción
// LARGA, cubrir cerca del receptor) en vez de "corta" (fracción CORTA, cubrir cerca del portador).
const DEFENSA_COBERTURA_DISTANCIA_MIN = 420;
// Cuántos segundos "adelanta" el marcador su objetivo según la velocidad actual del portador (ver
// actualizarDefensa): con ambos lados a la misma marcha tope, apuntar a la posición YA ACTUAL de un
// portador que corre en línea (más su evasión, que de por sí ya intenta mantener distancia) nunca
// cierra la brecha. Valor moderado a propósito: mucho más alto haría que el marcador "adivinara" de
// más ante cualquier cambio de dirección (zigzag de la evasión) y persiguiera un punto fantasma.
const DEFENSA_MARCA_ANTICIPACION = 0.4;

function actualizarDefensa(defensores, atacantes, idxConPelota, arcoAtacado, dt){
  const portador = atacantes[idxConPelota];
  let marcador = defensores[0], distMin = Math.hypot(portador.x-defensores[0].x, portador.y-defensores[0].y);
  for (let k = 1; k < defensores.length; k++) {
    const dk = Math.hypot(portador.x-defensores[k].x, portador.y-defensores[k].y);
    if (dk < distMin) { distMin = dk; marcador = defensores[k]; }
  }
  const cubridoresLibres = defensores.filter(d => d !== marcador);
  const companeros = atacantes.filter((_, j) => j !== idxConPelota);

  // A cuáles compañeros cubrir, si no alcanzan cubridores para todos: los más peligrosos primero
  // (más cerca del arco que atacan). Con cubridores de sobra, esto simplemente cubre a todos.
  const aCubrir = companeros.slice()
    .sort((a, b) => Math.hypot(arcoAtacado.x-a.x, -a.y) - Math.hypot(arcoAtacado.x-b.x, -b.y))
    .slice(0, cubridoresLibres.length);

  aCubrir.forEach(companero => {
    // De los cubridores que quedan libres, el que tiene más cerca a ESTE compañero puntual.
    let mejorIdx = 0, mejorDist = Math.hypot(cubridoresLibres[0].x-companero.x, cubridoresLibres[0].y-companero.y);
    for (let k = 1; k < cubridoresLibres.length; k++) {
      const dk = Math.hypot(cubridoresLibres[k].x-companero.x, cubridoresLibres[k].y-companero.y);
      if (dk < mejorDist) { mejorDist = dk; mejorIdx = k; }
    }
    const d = cubridoresLibres.splice(mejorIdx, 1)[0];
    const distAlPortador = Math.hypot(companero.x-portador.x, companero.y-portador.y);
    const fraccion = distAlPortador > DEFENSA_COBERTURA_DISTANCIA_MIN ? DEFENSA_COBERTURA_FRACCION_LARGA : DEFENSA_COBERTURA_FRACCION_CORTA;
    const tx = portador.x + (companero.x-portador.x)*fraccion;
    const ty = portador.y + (companero.y-portador.y)*fraccion;
    const dx = tx-d.x, dy = ty-d.y, dist = Math.hypot(dx,dy) || 1;
    actualizarJugador(d, dx/dist, dy/dist, MARCHA_CORRER, dt);
  });
  cubridoresLibres.forEach(d => actualizarJugador(d, 0, 0, 0, dt)); // sobran cubridores: nada más que cubrir

  // El marcador apunta un poco ADELANTE del portador (según su velocidad actual), no a su posición
  // ya desactualizada: con la misma marcha tope para los dos lados, perseguir la posición ACTUAL de
  // un objetivo que se mueve en línea (más la evasión de decidirAtaqueRival, que ya de por sí busca
  // mantener distancia) es una persecución que nunca cierra — es la misma "curva de persecución" ya
  // documentada para la pelota, pero aplicada a un jugador en movimiento. Medido simulando partidos
  // completos de 15 minutos: sin este anticipo, el equipo que ataca conservaba la pelota >95% del
  // tiempo y el rival casi nunca la disputaba (marcaba de cerca pero sin poder cerrar la distancia);
  // con DEFENSA_MARCA_ANTICIPACION la marca vuelve a generar disputas reales.
  const objX = portador.x + portador.vx * DEFENSA_MARCA_ANTICIPACION;
  const objY = portador.y + portador.vy * DEFENSA_MARCA_ANTICIPACION;
  const dxM = objX-marcador.x, dyM = objY-marcador.y, distM = Math.hypot(dxM,dyM) || 1;
  actualizarJugador(marcador, dxM/distM, dyM/distM, MARCHA_CORRER, dt);
}

// Si el rival (o, en la misma situación, el equipo propio: ver RIVAL_ATASCADO_* más abajo, ya
// agnóstico de quién esté atascado) con la pelota queda empujando contra un obstáculo sólido (un
// arquero, un poste) sin poder avanzar, se quedaría atascado ahí para siempre. Si en
// RIVAL_ATASCADO_TIEMPO_MAX segundos no se alejó al menos RIVAL_ATASCADO_DIST_MIN de donde estaba
// al empezar a medir, la despeja igual que el arquero (mismo criterio del hueco más libre) y la
// suelta, para que la jugada pueda seguir. Mide DESPLAZAMIENTO NETO real en vez de velocidad
// instantánea a propósito: este mismo bucle vuelve a acelerar al portador hacia la marcha máxima
// cada cuadro (actualizarJugador, sin noción del obstáculo) ANTES de que las colisiones contra
// poste/arquero (más abajo en pasoCompleto) le frenen esa velocidad — un chequeo de velocidad
// leería siempre el valor recién acelerado de este cuadro, nunca el que ya quedó frenado por la
// colisión del cuadro anterior, y el temporizador nunca llegaba a acumularse (bug real: un rival
// quedó pegado a un poste 720 cuadros seguidos sin que esto disparara).
const RIVAL_ATASCADO_DIST_MIN = 12;
const RIVAL_ATASCADO_TIEMPO_MAX = 0.4;
let rivalAtascadoTiempo = 0;
let rivalAtascadoX = 0, rivalAtascadoY = 0;

// Cuando un rival tiene la pelota, decide cada cuadro entre tirar, pasar o encarar al arco — a
// diferencia del equipo propio (donde el humano decide con los botones), esto es autónomo. Usa la
// misma física de patear/pasar (impulsarPelota) pero apuntando derecho al objetivo elegido: no
// necesita "girar a mirarlo" primero como sí necesita el humano (por eso patear/pasar leen
// p.dirX/dirY — acá se apunta a mano, siempre derecho al objetivo, sin ese paso intermedio).
// RIVAL_ATAQUE_DISTANCIA_TIRO/ANCHO_TIRO (cuánto falta y qué tan centrado para considerar tirar)
// se definen más abajo, junto a AREA_PROFUNDIDAD/ARCO_ANCHO (de los que dependen) — declararlas acá
// arriba de esos valores rompería con "no se puede leer un const antes de la línea que lo define".
const RIVAL_ATAQUE_PRECISION = 55; // 0-100, mismo espíritu que statsComunes.precisionTiro/Pase pero fijo (como RIVAL_CONTROL)
const RIVAL_ATAQUE_PROB_TIRO = 0.05; // por cuadro, una vez en rango — da variación en vez de tirar apenas entra
const RIVAL_ATAQUE_PROB_PASE = 0.02; // por cuadro, si hay un compañero mejor ubicado
// Si el jugador propio más cercano al rival con la pelota está más cerca que esto, conviene
// esquivarlo en vez de ir derecho (ver decidirAtaqueRival) — un dribleador de verdad no corre en
// línea recta directo contra su marcador.
const RIVAL_ATAQUE_EVASION_DISTANCIA = 220;

function distanciaAlMasCercano(punto, entidades){
  let menor = Infinity;
  entidades.forEach(e => { const d = Math.hypot(e.x-punto.x, e.y-punto.y); if (d < menor) menor = d; });
  return menor;
}

// Compañero más conveniente para pasarle: entre los que están MÁS ADELANTADOS que quien tiene la
// pelota (más cerca del arco rival — pasar para atrás no suma), el más LIBRE de marca (más lejos
// del jugador propio más cercano a él). Preferir a alguien desmarcado aunque esté un poco menos
// adelantado que a alguien más adelantado pero pegado a un marcador, que perdería la pelota enseguida.
function mejorCompaneroRival(r){
  const dGolPropio = Math.hypot(ARCO_X2 - r.x, -r.y);
  let mejor = null, mejorLibertad = -Infinity;
  rivales.forEach(c => {
    if (c === r) return;
    const dGol = Math.hypot(ARCO_X2 - c.x, -c.y);
    if (dGol >= dGolPropio) return; // no gana nada de terreno, no interesa como opción de pase
    const libertad = distanciaAlMasCercano(c, players);
    if (libertad > mejorLibertad) { mejorLibertad = libertad; mejor = c; }
  });
  return mejor;
}

function decidirAtaqueRival(dt){
  const r = rivales[conPelotaRivalIdx];
  const distArco = r.x - ARCO_X2; // cuánto falta para llegar (el arco rival queda del lado -x)

  if (distArco < RIVAL_ATAQUE_DISTANCIA_TIRO && Math.abs(r.y) < RIVAL_ATAQUE_ANCHO_TIRO/2
      && Math.random() < RIVAL_ATAQUE_PROB_TIRO) {
    const dx = ARCO_X2 - r.x, dy = 0 - r.y, len = Math.hypot(dx,dy) || 1;
    impulsarPelota(dx/len, dy/len, TIRO_POTENCIA_DISENO_MAX * 0.8, RIVAL_ATAQUE_PRECISION, TIRO_PRECISION_ERROR_MAX);
    ultimoPateadorRival = conPelotaRivalIdx;
    conPelotaRivalIdx = null;
    actualizarJugador(r, 0, 0, 0, dt);
    return;
  }

  const companero = mejorCompaneroRival(r);
  if (companero && Math.random() < RIVAL_ATAQUE_PROB_PASE) {
    const dx = companero.x - r.x, dy = companero.y - r.y, len = Math.hypot(dx,dy) || 1;
    impulsarPelota(dx/len, dy/len, PASE_POTENCIA_DISENO_MAX * 0.75, RIVAL_ATAQUE_PRECISION, PASE_PRECISION_ERROR_MAX);
    ultimoPateadorRival = conPelotaRivalIdx;
    conPelotaRivalIdx = null;
    actualizarJugador(r, 0, 0, 0, dt);
    return;
  }

  // Dribla: encara al arco, pero esquivando al jugador propio más cercano si lo tiene lo bastante
  // pegado como para importar (mezclando esa dirección de "alejarse de él" con la de avance,
  // pesada según qué tan cerca esté), en vez de ir siempre en línea recta directo a su marcador.
  // Esto arregla de raíz el motivo original por el que hacía falta RIVAL_ATASCADO_* — no apuntaba a
  // ningún lado en particular. Ese resguardo se mantiene igual, por si de todos modos queda contra
  // un obstáculo (un poste, el arquero) que esquivar un marcador tampoco evita.
  const dxGol = ARCO_X2 - r.x, dyGol = 0 - r.y, lenGol = Math.hypot(dxGol,dyGol) || 1;
  let dirX = dxGol/lenGol, dirY = dyGol/lenGol;
  let masCercano = null, menorDist = Infinity;
  players.forEach(p => { const d = Math.hypot(p.x-r.x, p.y-r.y); if (d < menorDist) { menorDist = d; masCercano = p; } });
  if (masCercano && menorDist < RIVAL_ATAQUE_EVASION_DISTANCIA) {
    const dxEv = r.x-masCercano.x, dyEv = r.y-masCercano.y, lenEv = Math.hypot(dxEv,dyEv) || 1;
    const peso = 1 - menorDist/RIVAL_ATAQUE_EVASION_DISTANCIA; // más cerca el marcador, más pesa esquivarlo
    dirX += (dxEv/lenEv) * peso; dirY += (dyEv/lenEv) * peso;
    const lenFinal = Math.hypot(dirX,dirY) || 1; dirX /= lenFinal; dirY /= lenFinal;
  }
  actualizarJugador(r, dirX, dirY, MARCHA_CORRER, dt);
}

function actualizarRivales(dt){
  if (conPelotaRivalIdx !== null) {
    const rConBalon = rivales[conPelotaRivalIdx];
    if (rivalAtascadoTiempo === 0) { rivalAtascadoX = rConBalon.x; rivalAtascadoY = rConBalon.y; }

    decidirAtaqueRival(dt); // puede tirar/pasar (conPelotaRivalIdx pasa a null) o driblar
    if (conPelotaRivalIdx !== null) {
      // Los demás arman apoyo alrededor del portador buscando espacio, igual que hace el equipo
      // propio al atacar (ver actualizarIA) — mismo apoyoConEspacio, sin duplicar la lógica.
      rivales.filter(r => r !== rConBalon).forEach(seguidor => {
        const companeros = rivales.filter(r => r !== seguidor);
        const tiron = apoyoConEspacio(seguidor, companeros, players);
        const mag = Math.hypot(tiron.x, tiron.y);
        if (mag <= TRIANGULO_DEADZONE) { actualizarJugador(seguidor, 0, 0, 0, dt); return; }
        const pct = mag > DISTANCIA_TRIANGULO ? MARCHA_CORRER : MARCHA_TROTAR;
        actualizarJugador(seguidor, tiron.x/mag, tiron.y/mag, pct, dt);
      });

      rivalAtascadoTiempo += dt;
      if (rivalAtascadoTiempo >= RIVAL_ATASCADO_TIEMPO_MAX) {
        const avanzo = Math.hypot(rConBalon.x - rivalAtascadoX, rConBalon.y - rivalAtascadoY) > RIVAL_ATASCADO_DIST_MIN;
        if (!avanzo) {
          const angulo = direccionDespejeLibre(rConBalon.x, rConBalon.y);
          ball.vx = Math.cos(angulo) * ARQUERO_DESPEJE_POTENCIA;
          ball.vy = Math.sin(angulo) * ARQUERO_DESPEJE_POTENCIA;
          // Igual que en colisionRival: sin marcarlo, el mismo rival —todavía parado justo ahí,
          // apuntando en la misma dirección que lo atascó— la vuelve a interceptar al toque
          // siguiente y repite el ciclo (visto en pruebas: se "libera" y recupera en el mismo
          // cuadro o el siguiente, indistinguible de seguir atascado desde afuera).
          ultimoRivalDesviador = conPelotaRivalIdx;
          conPelotaRivalIdx = null;
        }
        rivalAtascadoTiempo = 0;
      }
    } else {
      rivalAtascadoTiempo = 0;
    }
    return;
  }

  const paseEnVuelo = conPelota === null && direccionEnvio !== null;
  if (paseEnVuelo) {
    const objetivo = puntoDeLlegadaPelota();
    rivales.forEach(r => {
      const dx = objetivo.x - r.x, dy = objetivo.y - r.y;
      const dist = Math.hypot(dx, dy) || 1;
      actualizarJugador(r, dx/dist, dy/dist, MARCHA_CORRER, dt);
    });
    return;
  }

  if (conPelota !== null) {
    actualizarDefensa(rivales, players, conPelota, ARCOS[0], dt);
    return;
  }

  // Pelota suelta, sin dueño de nadie y sin ningún pase en vuelo (p. ej. tras un rebote o una
  // disputa): antes se quedaban los 5 quietos esperando a que el equipo propio se la acerque. El
  // más cercano ahora sale a buscarla — mismo criterio que actualizarJugadorMasCercanoALaPelota ya
  // usa para el equipo propio (que sí puede reaccionar porque el humano maneja al que se reasigna);
  // los demás mantienen posición en vez de ir los 5 en tropel.
  let masCercano = rivales[0], menorDist = Math.hypot(ball.x-rivales[0].x, ball.y-rivales[0].y);
  for (let k = 1; k < rivales.length; k++) {
    const dk = Math.hypot(ball.x-rivales[k].x, ball.y-rivales[k].y);
    if (dk < menorDist) { menorDist = dk; masCercano = rivales[k]; }
  }
  rivales.forEach(r => {
    if (r !== masCercano) { actualizarJugador(r, 0, 0, 0, dt); return; }
    const dx = ball.x-r.x, dy = ball.y-r.y, dist = Math.hypot(dx,dy) || 1;
    actualizarJugador(r, dx/dist, dy/dist, MARCHA_CORRER, dt);
  });
}

// Si algún rival llega a tocar la pelota mientras va suelta (un pase interceptado, o cualquier
// pelota suelta que le pasa cerca), puede pasar una de dos cosas — mismo "control" que ya usa
// para disputarla cuerpo a cuerpo (ver colisionRivalJugadores): con esa probabilidad, la
// intercepta limpio y se queda con ella; si no, solo la despeja (rebota lejos de él, sigue
// suelta). En cualquier caso se cancela el aviso de pase, así los compañeros dejan de acomodarse
// para recibir algo que ya no va a llegar. A diferencia de la disputa cuerpo a cuerpo (que exige
// RIVAL_ALCANCE de margen sobre el contacto), acá también hay un margen — más chico — porque
// interceptar una pelota en movimiento (un pase, no un rival parado) es estirar una pierna, no
// necesita el cuerpo entero encima.
//
// Igual que "ultimoPateador" evita que quien pateó recupere la pelota antes de que realmente se
// aleje, "ultimoRivalDesviador" evita que el MISMO rival que la acaba de despejar (sin quedarse
// con ella) vuelva a intentarlo cuadro tras cuadro mientras sigue cerca: sin este freno, un 50%
// por toque terminaba ganándola casi siempre solo por repetir la tirada muchas veces seguidas a
// quemarropa, exagerando la intercepción mucho más allá de lo que sugiere ese 50%.
//
// "ultimoPateadorRival" cubre un caso distinto: cuando un rival le pasa a un compañero (ver
// decidirAtaqueRival), ESE compañero no debería tener que "disputarle" la pelota a su propio
// equipo — recibe limpio, sin el roll de RIVAL_CONTROL (que es para interceptar a un adversario,
// no para recibir un pase propio). Sirve además para que el que la pateó no se la recupere sola.
const RIVAL_ALCANCE_INTERCEPCION = 12;
let ultimoRivalDesviador = null;
let ultimoPateadorRival = null;
function colisionRival(){
  // Mientras el pase largo va "por el aire" nadie la puede tocar (ver ball.altura) — ni siquiera
  // estirando la pierna: recién se disputa cuando cae, no antes.
  if (conPelota !== null || conPelotaRivalIdx !== null || conPelotaArquero || conPelotaArquero2 || ball.altura > 0) return;
  if (ultimoRivalDesviador !== null) {
    const rd = rivales[ultimoRivalDesviador];
    const dd = Math.hypot(ball.x - rd.x, ball.y - rd.y);
    if (dd > rd.r * RADIO_RECEPCION_FACTOR) ultimoRivalDesviador = null;
  }
  if (ultimoPateadorRival !== null) {
    const rp = rivales[ultimoPateadorRival];
    const dp = Math.hypot(ball.x - rp.x, ball.y - rp.y);
    if (dp > rp.r * RADIO_RECEPCION_FACTOR) ultimoPateadorRival = null;
  }
  for (let k = 0; k < rivales.length; k++) {
    if (k === ultimoRivalDesviador) continue; // ya la desvió; no puede recuperarla hasta alejarse
    if (k === ultimoPateadorRival) continue; // se la pasó a un compañero; no la recupera él mismo
    const r = rivales[k];
    const dx = ball.x - r.x, dy = ball.y - r.y;
    const dist = Math.hypot(dx, dy) || 0.001;
    const minDistFisico = r.r + ball.r;
    if (dist >= minDistFisico + RIVAL_ALCANCE_INTERCEPCION) continue;
    ultimoPateador = null;
    direccionEnvio = null;
    baseReceptores = null;
    if (ultimoPateadorRival !== null) {
      // Es un pase de un compañero: recepción limpia, sin disputa (ver comentario de arriba).
      conPelotaRivalIdx = k;
      ultimoPateadorRival = null;
    } else if (Math.random() < RIVAL_CONTROL / 100) {
      // Intercepta limpio: no hace falta tocar su posición ni velocidad, actualizarPelota ya se
      // encarga de irla pegando a sus pies sola, igual que cuando el equipo gana una pelota suelta.
      conPelotaRivalIdx = k;
    } else {
      ultimoRivalDesviador = k;
      const nx = dx/dist, ny = dy/dist;
      ball.x = r.x + nx*minDistFisico; ball.y = r.y + ny*minDistFisico;
      const vel = Math.hypot(ball.vx, ball.vy);
      ball.vx = nx * vel * 0.6; ball.vy = ny * vel * 0.6; // la despeja hacia donde venía parado
    }
    return; // ya la tocó uno; no hace falta revisar al otro en el mismo cuadro
  }
}

// Los dos rivales tampoco se atraviesan entre sí (mismo empuje de separación que entre
// compañeros, sin disputa de posesión: son del mismo equipo, no hay nada que sortear al azar).
function colisionRivales(){
  const a = rivales[0], b = rivales[1];
  const dx = b.x-a.x, dy = b.y-a.y;
  const dist = Math.hypot(dx, dy) || 0.001;
  const minDist = a.r + b.r;
  if (dist >= minDist) return;
  const nx = dx/dist, ny = dy/dist;
  const overlap = minDist - dist;
  a.x -= nx*overlap/2; a.y -= ny*overlap/2;
  b.x += nx*overlap/2; b.y += ny*overlap/2;
  const empuje = 40;
  a.vx -= nx*empuje; a.vy -= ny*empuje;
  b.vx += nx*empuje; b.vy += ny*empuje;
}

// Qué tan pegada queda la pelota al jugador que la domina, según su atributo "control".
function nivelControl(control){
  const t = control / 100;
  return {
    offset: CONTROL_OFFSET_MAX + (CONTROL_OFFSET_MIN - CONTROL_OFFSET_MAX) * t,
    firmeza: CONTROL_FIRMEZA_MIN + (CONTROL_FIRMEZA_MAX - CONTROL_FIRMEZA_MIN) * t
  };
}

// Gira el patrón de la pelota alrededor del eje (ejeX,ejeY,ejeZ) un ángulo theta (Rodrigues).
// Ese eje es horizontal y perpendicular a la velocidad: así el patrón "rueda" hacia donde se mueve
// la pelota en vez de girar plano como una moneda.
function rotarPatron(puntos, ejeX, ejeY, ejeZ, theta){
  const c = Math.cos(theta), s = Math.sin(theta);
  for (const p of puntos) {
    const dot = p.x*ejeX + p.y*ejeY + p.z*ejeZ;
    const kx = ejeY*p.z - ejeZ*p.y, ky = ejeZ*p.x - ejeX*p.z, kz = ejeX*p.y - ejeY*p.x;
    const nx = p.x*c + kx*s + ejeX*dot*(1-c);
    const ny = p.y*c + ky*s + ejeY*dot*(1-c);
    const nz = p.z*c + kz*s + ejeZ*dot*(1-c);
    p.x = nx; p.y = ny; p.z = nz;
  }
}

function actualizarPelota(dt){
  if (ball.vueloRestante > 0) {
    ball.vueloRestante = Math.max(0, ball.vueloRestante - dt);
    const t = 1 - ball.vueloRestante / ball.vueloTotal; // progreso [0,1] del vuelo
    ball.altura = PASE_LARGO_ALTURA_MAX * 4 * t * (1 - t); // parábola: 0 al patear, pico a mitad de camino, 0 al caer
    if (ball.vueloRestante === 0) {
      // Recién aterrizó este cuadro: el roce del aire durante el vuelo casi no le saca velocidad
      // (friccion exponencial en menos de un segundo), así que sin esto caía todavía disparada,
      // más rápido de lo que cualquiera puede correr — pierde fuerza al tocar el pasto, como
      // cualquier pelota real que cae.
      ball.vx *= PASE_LARGO_ATERRIZAJE_AMORTIGUACION;
      ball.vy *= PASE_LARGO_ATERRIZAJE_AMORTIGUACION;
    }
  } else {
    ball.altura = 0;
  }

  if (conPelota !== null) {
    const p = players[conPelota];
    const n = nivelControl(statsComunes.control);
    const tx = p.x + p.dirX * n.offset, ty = p.y + p.dirY * n.offset;
    const s = Math.min(1, n.firmeza * dt);
    ball.x += (tx - ball.x) * s;
    ball.y += (ty - ball.y) * s;
    ball.vx = p.vx; ball.vy = p.vy;
  } else if (conPelotaRivalIdx !== null) {
    const r = rivales[conPelotaRivalIdx];
    const n = nivelControl(RIVAL_CONTROL); // mismo "control" que usa para disputar la pelota
    const tx = r.x + r.dirX * n.offset, ty = r.y + r.dirY * n.offset;
    const s = Math.min(1, n.firmeza * dt);
    ball.x += (tx - ball.x) * s;
    ball.y += (ty - ball.y) * s;
    ball.vx = r.vx; ball.vy = r.vy;
  } else {
    const f = Math.max(0, 1 - ROCE_PELOTA * dt);
    ball.vx *= f; ball.vy *= f;
    ball.x += ball.vx * dt; ball.y += ball.vy * dt;
  }

  const vel = Math.hypot(ball.vx, ball.vy);
  if (vel > 0.5) {
    const ejeX = -ball.vy/vel, ejeY = ball.vx/vel; // horizontal, perpendicular a la velocidad
    rotarPatron(ball.patron, ejeX, ejeY, 0, (vel/ball.r) * dt);
  }
}

// Dónde va a quedar quieta la pelota si nadie la toca: con roce constante la velocidad decae
// exponencialmente (v(t) = v0 * e^(-ROCE_PELOTA*t)), así que su desplazamiento total hasta
// pararse es exactamente v0/ROCE_PELOTA (la integral de esa velocidad en el tiempo, de 0 a
// infinito). Se usa para que quien va a recibir un pase corra directo a ese punto fijo en vez
// de perseguir la posición actual (en movimiento) de la pelota cuadro a cuadro, que traza una
// curva de persecución en vez de un camino recto.
//
// Mientras un pase largo sigue "en el aire" (ball.vueloRestante>0), la fórmula de arriba
// sobreestima mucho el punto de llegada: ignora que al aterrizar la velocidad se corta de golpe
// (ver PASE_LARGO_ATERRIZAJE_AMORTIGUACION en actualizarPelota), no decae solo por roce continuo.
// Sin este caso aparte, tanto el receptor como los rivales que persiguen un pase largo corrían de
// más, se pasaban de largo del punto real y tenían que volver. Acá se proyecta la posición y
// velocidad en el instante exacto del aterrizaje (mismas fórmulas de roce, evaluadas en
// t=vueloRestante en vez de t=infinito), se les aplica el mismo recorte de aterrizaje, y recién
// desde ahí se proyecta el roce de nuevo hasta el reposo.
function puntoDeLlegadaPelota(){
  if (ball.vueloRestante > 0) {
    const decaimiento = Math.exp(-ROCE_PELOTA * ball.vueloRestante);
    const xAlAterrizar = ball.x + (ball.vx / ROCE_PELOTA) * (1 - decaimiento);
    const yAlAterrizar = ball.y + (ball.vy / ROCE_PELOTA) * (1 - decaimiento);
    const vxAlAterrizar = ball.vx * decaimiento * PASE_LARGO_ATERRIZAJE_AMORTIGUACION;
    const vyAlAterrizar = ball.vy * decaimiento * PASE_LARGO_ATERRIZAJE_AMORTIGUACION;
    return { x: xAlAterrizar + vxAlAterrizar / ROCE_PELOTA, y: yAlAterrizar + vyAlAterrizar / ROCE_PELOTA };
  }
  return { x: ball.x + ball.vx / ROCE_PELOTA, y: ball.y + ball.vy / ROCE_PELOTA };
}

// Punto (y) donde la pelota va a CRUZAR una línea vertical x=targetX, si nadie la toca antes —
// misma familia de cálculo que puntoDeLlegadaPelota (roce constante), pero evaluado en el
// instante en que cruza esa línea en vez de en el reposo final. null si no viene hacia esa línea
// (vx=0, no se mueve en x) o si el envión no le alcanza para llegar tan lejos bajo roce puro (se
// va a parar antes de cruzarla, ya no es relevante anticiparla). Funciona para cualquiera de los
// dos arcos: no asume que se acerca en +x, solo que avanza (bajo roce, sin nunca cambiar de
// sentido) en la dirección de su propia velocidad actual. Se usa para que cada arquero se ubique
// donde la pelota VA A LLEGAR a la altura de sus palos, no donde está ahora: perseguir la
// posición actual (que en un tiro cruzado se sigue moviendo mientras el arquero reacciona) es el
// mismo error de "curva de persecución" que ya se corrigió para el receptor de un pase — con la
// diferencia de que acá alcanza con anticipar la coordenada y, no la posición completa.
function puntoDeCrucePelota(targetX){
  if (ball.vx === 0) return null;
  const direccion = Math.sign(ball.vx);
  const distanciaFaltante = direccion * (targetX - ball.x); // positiva = todavía se acerca a targetX
  if (distanciaFaltante <= 0) return ball.y; // ya la cruzó o está encima: usar la posición actual
  const velAbs = Math.abs(ball.vx);
  const alcanceMax = velAbs / ROCE_PELOTA;
  if (distanciaFaltante >= alcanceMax) return null; // el roce la para antes de llegar tan lejos
  const t = -Math.log(1 - (ROCE_PELOTA * distanciaFaltante) / velAbs) / ROCE_PELOTA;
  return ball.y + (ball.vy / ROCE_PELOTA) * (1 - Math.exp(-ROCE_PELOTA * t));
}

// ── Arcos ─────────────────────────────────────────────────────
// Partido de dos arcos: cada equipo ataca uno y defiende el otro. El arco derecho (ARCO_X) es el
// original del prototipo; el izquierdo (ARCO_X2) se agrega para el partido 3vs3.
const ARCO_X = 900;          // dónde está la línea de gol derecha, sobre el eje x
const ARCO_ANCHO = 220;      // ancho de cada arco, centrado en y=0
const ARCO_PROFUNDIDAD = 60; // qué tan "profundo" se dibuja cada arco/red
const POSTE_RADIO = 8;       // grosor de cada poste, para el rebote

// El ancho del arco (ARCO_ANCHO) es, en la realidad, 7.32m: de ahí sale la escala del resto de
// las medidas de la cancha (límites, áreas, punto penal, círculo central), para que todo quede
// en proporciones reales relativas a los jugadores y al arco que ya existían en el juego.
const UNIDADES_POR_METRO = ARCO_ANCHO / 7.32;

// Cancha completa (105m de línea de gol a línea de gol, reglamentaria): el segundo arco queda a
// esa distancia del primero. La mitad de cancha (antes CANCHA_X_MIN, límite sin arco de la versión
// de un solo arco — mismo valor, sin cambios) pasa a ser el centro real de una cancha simétrica.
const MITAD_CANCHA_X = ARCO_X - 52.5 * UNIDADES_POR_METRO;
const ARCO_X2 = ARCO_X - 105 * UNIDADES_POR_METRO;
// Descriptor de cada arco: "signo" indica hacia dónde se extiende la red/área respecto de su línea
// de gol (+1: hacia +x, como el arco derecho; -1: hacia -x, el izquierdo). Con esto, cualquier
// fórmula que antes hacía "ARCO_X ± constante" generaliza a "arco.x - arco.signo*constante" (hacia
// adentro de la cancha: área, punto penal) o "arco.x + arco.signo*constante" (hacia afuera: la red).
const ARCOS = [
  { x: ARCO_X,  signo: 1 },
  { x: ARCO_X2, signo: -1 },
];
// Los 2 postes de cada arco, para colisión (ver colisionPostes/colisionPostesJugador).
const POSTES = ARCOS.flatMap(g => [{ x: g.x, y: -ARCO_ANCHO/2 }, { x: g.x, y: ARCO_ANCHO/2 }]);

function dentroDelArco(y){ return Math.abs(y) < ARCO_ANCHO / 2; }

// Los postes son sólidos: si la pelota los toca, rebota en vez de pasar de largo. La colisión es
// "continua" (contra el segmento recorrido en el cuadro, no solo la posición final): a alta
// velocidad la pelota puede avanzar más que el ancho del poste en un solo cuadro, y comprobar
// solo dónde terminó dejaba que lo saltara de largo sin nunca detectarse superpuesta.
function colisionPostes(prevX, prevY){
  if (ball.altura > 0) return; // un pase largo pasa por arriba de todo, postes incluidos
  const minDist = POSTE_RADIO + ball.r;
  for (const poste of POSTES) {
    const dx = ball.x - prevX, dy = ball.y - prevY; // recorrido de la pelota en este cuadro
    const fx = prevX - poste.x, fy = prevY - poste.y;
    const a = dx*dx + dy*dy;

    let t = null; // instante [0,1] del recorrido en que toca al poste, si lo toca
    if (a < 1e-9) {
      // casi no se movió: usar la comprobación estática simple
      if (Math.hypot(ball.x - poste.x, ball.y - poste.y) < minDist) t = 1;
    } else {
      const b = 2 * (fx*dx + fy*dy);
      const c = fx*fx + fy*fy - minDist*minDist;
      const disc = b*b - 4*a*c;
      if (disc >= 0) {
        const raiz = Math.sqrt(disc);
        const t0 = (-b - raiz) / (2*a);
        if (t0 >= 0 && t0 <= 1) t = t0; // primer cruce del círculo del poste
        else if (Math.hypot(ball.x - poste.x, ball.y - poste.y) < minDist) t = 1; // ya termina adentro
      }
    }
    if (t === null) continue;

    const cx = prevX + dx*t, cy = prevY + dy*t; // punto de contacto sobre el poste
    const dist = Math.hypot(cx - poste.x, cy - poste.y) || 0.001;
    const nx = (cx - poste.x) / dist, ny = (cy - poste.y) / dist;
    ball.x = poste.x + nx * minDist; ball.y = poste.y + ny * minDist;
    const vNormal = ball.vx * nx + ball.vy * ny;
    ball.vx -= 2 * vNormal * nx; ball.vy -= 2 * vNormal * ny; // rebote
    ball.vx *= 0.6; ball.vy *= 0.6; // pierde energía en el palo
  }
}

// Los postes también son sólidos para los jugadores (de cualquier equipo): no se puede caminar
// a través de ellos. A diferencia de la pelota, un jugador no "rebota" al tocarlos, simplemente
// no puede seguir de largo (se cancela la parte de la velocidad que apuntaba hacia el poste).
//
// La colisión es continua (contra el segmento recorrido en el cuadro, igual que colisionPostes
// para la pelota), no solo la posición final: un chequeo simple alcanza para el movimiento propio
// de un jugador (mucho más lento que la pelota), pero en el mismo cuadro un empujón de otra
// colisión (dos jugadores muy encimados, o el rival disputando la pelota) puede correr a alguien
// una buena distancia de una sola vez — lo suficiente como para saltar de un lado al otro de un
// poste (que es angosto) sin que una comprobación solo-posición-final llegue a notarlo.
function colisionPostesJugador(jugador, prevX, prevY){
  const minDist = POSTE_RADIO + jugador.r;
  for (const poste of POSTES) {
    const dx = jugador.x - prevX, dy = jugador.y - prevY; // recorrido en este cuadro (movimiento + empujones)
    const fx = prevX - poste.x, fy = prevY - poste.y;
    const a = dx*dx + dy*dy;

    let t = null; // instante [0,1] del recorrido en que toca al poste, si lo toca
    if (a < 1e-9) {
      if (Math.hypot(jugador.x - poste.x, jugador.y - poste.y) < minDist) t = 1;
    } else {
      const b = 2 * (fx*dx + fy*dy);
      const c = fx*fx + fy*fy - minDist*minDist;
      const disc = b*b - 4*a*c;
      if (disc >= 0) {
        const raiz = Math.sqrt(disc);
        const t0 = (-b - raiz) / (2*a);
        if (t0 >= 0 && t0 <= 1) t = t0; // primer cruce del círculo del poste
        else if (Math.hypot(jugador.x - poste.x, jugador.y - poste.y) < minDist) t = 1; // ya termina adentro
      }
    }
    if (t === null) continue;

    const cx = prevX + dx*t, cy = prevY + dy*t; // punto de contacto sobre el poste
    const dist = Math.hypot(cx - poste.x, cy - poste.y) || 0.001;
    const nx = (cx - poste.x) / dist, ny = (cy - poste.y) / dist;
    jugador.x = poste.x + nx * minDist; jugador.y = poste.y + ny * minDist;
    const vNormal = jugador.vx * nx + jugador.vy * ny;
    if (vNormal < 0) { jugador.vx -= vNormal * nx; jugador.vy -= vNormal * ny; }
  }
}

// La red (fondo y costados del arco, todo menos la boca) es sólida y "flexible": frena la
// pelota en vez de dejarla pasar de largo, y se abomba un poco en el punto de contacto (como
// una red real) para luego volver a su forma. Es un simple clamp de posición por pared (no
// colisión continua): como las paredes son medio-planos y no un círculo angosto como los
// postes, cualquier "salto" de la pelota en un cuadro igual queda del lado de adentro y se
// detecta sin problema, sin necesitar barrido.
//
// Solo se aplica una vez que ya es gol (mostrandoGol, ver revisarGol más abajo — el orden en el
// bucle principal llama a revisarGol() antes que a esta función): antes se activaba con solo
// mirar si la pelota estaba en el rango de x del fondo de la red, sin fijarse si además estaba
// dentro del ancho. Un tiro que iba claramente afuera pero con potencia suficiente para que su
// x cruzara igual ese rango (algo muy común: cualquier tiro fuerte cerca del palo, aunque no
// entre) quedaba con el costado "de la red" empujándolo hacia adentro del ancho aunque nunca
// hubiera entrado por la boca — y al cuadro siguiente, revisarGol() lo contaba como gol. Al
// depender de que ya se haya confirmado el gol, la red deja tranquilo a cualquier tiro que no
// entró, sea cual sea su x.
const MALLA_REBOTE = 0.15;     // qué tan elástica es: rebote mínimo, se siente que atrapa la pelota
const MALLA_FRICCION = 0.5;    // cuánto frena la velocidad paralela a la pared al tocarla
const MALLA_ABULTAMIENTO_INICIAL = 26; // profundidad visual del abombado al momento del golpe
const MALLA_ABULTAMIENTO_TASA = 6;     // 1/seg: qué tan rápido vuelve a su forma plana

let mallaAbultamiento = null; // {pared:'sup'|'fondo'|'inf', x, y, monto, arco} o null si está en reposo

function golpearMalla(pared, x, y, arco){
  mallaAbultamiento = { pared, x, y, monto: MALLA_ABULTAMIENTO_INICIAL, arco };
}

// Toda la geometría de acá se escribe en términos de "u" (profundidad dentro de la red, medida
// desde la línea de gol hacia afuera de la cancha): con eso, la misma matemática sirve para
// cualquiera de los dos arcos sin si/no por signo, multiplicando por arco.signo solo al convertir
// de vuelta a coordenadas x reales.
function colisionMalla(dt){
  if (!mostrandoGol || !arcoDelGolActual) return;
  const g = arcoDelGolActual;
  const supY = -ARCO_ANCHO/2, infY = ARCO_ANCHO/2;
  const u = g.signo * (ball.x - g.x); // profundidad actual (positiva = adentro de la red)

  // Fondo de la red: no deja que la pelota siga de largo más allá del arco.
  const limiteFondoU = ARCO_PROFUNDIDAD - ball.r;
  if (u > limiteFondoU && dentroDelArco(ball.y)) {
    ball.x = g.x + g.signo * limiteFondoU;
    const vProfundidad = g.signo * ball.vx; // componente de velocidad hacia adentro de la red
    if (vProfundidad > 0) ball.vx -= g.signo * vProfundidad * (1 + MALLA_REBOTE);
    ball.vy *= MALLA_FRICCION;
    golpearMalla('fondo', g.x + g.signo*ARCO_PROFUNDIDAD, Math.max(supY, Math.min(infY, ball.y)), g);
  }

  // Costados de la red: una vez que la pelota ya entró por la boca del arco, no puede salirse
  // por los lados (solo puede volver a salir por donde entró).
  const dentroProfundidad = u > 0 && u < ARCO_PROFUNDIDAD;
  if (dentroProfundidad) {
    const xFondoClamp = g.x + g.signo * Math.max(0, Math.min(ARCO_PROFUNDIDAD, u));
    const limiteSup = supY + ball.r, limiteInf = infY - ball.r;
    if (ball.y < limiteSup) {
      ball.y = limiteSup;
      if (ball.vy < 0) ball.vy *= -MALLA_REBOTE;
      ball.vx *= MALLA_FRICCION;
      golpearMalla('sup', xFondoClamp, supY, g);
    } else if (ball.y > limiteInf) {
      ball.y = limiteInf;
      if (ball.vy > 0) ball.vy *= -MALLA_REBOTE;
      ball.vx *= MALLA_FRICCION;
      golpearMalla('inf', xFondoClamp, infY, g);
    }
  }

  if (mallaAbultamiento) {
    mallaAbultamiento.monto *= Math.max(0, 1 - MALLA_ABULTAMIENTO_TASA * dt);
    if (mallaAbultamiento.monto < 0.5) mallaAbultamiento = null;
  }
}

let golesPropios = 0, golesRivales = 0;
let mostrandoGol = false;
// Arco donde se acaba de convertir el gol que se está festejando (ver ARCOS) — lo necesita
// colisionMalla/dibujarMalla para saber en cuál de las dos redes simular/dibujar el abultamiento.
let arcoDelGolActual = null;
const divGol = document.getElementById("gol");
const spanGolesPropios = document.getElementById("golesPropios");
const spanGolesRivales = document.getElementById("golesRivales");

function anotarGol(lado){ // 'propio' (cruzó el arco rival) o 'rival' (cruzó el arco propio)
